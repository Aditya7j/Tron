<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%237cc4ff'/%3E%3Ccircle cx='26' cy='7' r='2.5' fill='%23ffb347'/%3E%3Ccircle cx='6' cy='24' r='2' fill='%239d7cff'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#e8eefc;
    --muted:#8fa0c0;
    --line:rgba(140,170,220,.16);
    --glass:rgba(10,16,30,.72);
    --accent:#7cc4ff;
    /* The web's colour, and nothing else's. Kept in step with WEB_CYAN in the script
       below, which washes the galaxy with the same value. */
    --web:#22e0ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}

  /* ======================= THE STACK, WRITTEN DOWN ==========================
     Every z-index in this file is in this list, and nothing outside this list has
     one. Read it top to bottom and you know what covers what:

         0   #stars      \
         1   #nebula      |  THE GALAXY. Painted, never interactive.
         2   #graph       |
         5   #vignette   /
         6   .hud           #title, #legend - the corners
         7   #brainchip     which brain is answering
         8   #brainmenu     and the door to change it
         9   #brain         THE TOAST: the answer, the status line, the ask bar
        10   #panel         the note side panel
        11   #sharewash     the share's red frame - about the whole window, so over
                            the panel as well
        12   #focuscard     THE IN-PAGE CARD: the countdown
        13   #sharing #watching #eyeing   the live-organ chips
        14   #facecard      the watching face
        20   #boot          the ignition curtain, over everything
      -----   Document Picture-in-Picture: another WINDOW, above every application
              on the desktop, and therefore above this entire list by the OS rather
              than by anything CSS can say. See THE CARD'S SECOND HOME.
        9999 the instruments (?focusdebug=1, ?focusprobe=1) - deliberately above
             everything, because an overlay you have to hunt for is not an overlay.

     THE LAW THAT SHAPES IT: galaxy < toast < panel < in-page card < PiP. The toast
     sits UNDER the panel, which is the opposite of what it used to do and the reason
     a spoken report no longer buries the panel's Connected chips. The card sits over
     the panel, and THE LAYOUT GOVERNOR (in the script below) is what keeps it from
     ever needing to: no surface may cover another surface's content, so the stack is
     the last line of defence rather than the plan.

     AND WHERE THE RECTANGLES ARE: not here. Every top/right/left/bottom of the four
     governed surfaces - the panel, the in-page card, the toast, and the chip row
     that includes the brain chip - is set by layout() and by nothing else. The rules
     below carry appearance and the odd transition, and are silent about position.
     ========================================================================= */

  /* ---------- deep space ---------- */
  #stars{position:fixed;inset:0;z-index:0;display:block}
  #nebula{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(48% 42% at 22% 26%, rgba(60,90,190,.24), transparent 70%),
      radial-gradient(42% 38% at 80% 70%, rgba(150,70,190,.20), transparent 70%),
      radial-gradient(60% 50% at 55% 95%, rgba(20,120,140,.14), transparent 70%);
    filter:blur(6px)}
  #vignette{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 42%, rgba(0,0,0,.72) 100%)}
  /* No CSS filter on the WebGL canvas: it forces a separate composite layer and
     some drivers resample it, which shows up as soft, blurry nodes. */
  #graph{position:fixed;inset:0;z-index:2}

  /* ---------- chrome ---------- */
  .hud{position:fixed;z-index:6}
  /* #title is the one fixed corner nothing else competes for: top-left, its own
     column, nothing ever docks beside it. So it keeps its own two numbers. */
  #title{top:22px;left:26px;max-width:38ch}
  #title h1{margin:0;font-size:15px;letter-spacing:.34em;text-transform:uppercase;
    font-weight:600;color:#fff;text-shadow:0 0 18px rgba(124,196,255,.45)}
  #title p{margin:7px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
  #title .hint{margin-top:9px;font-size:11px;color:rgba(143,160,192,.62)}
  #density{margin-top:7px;padding:0;background:none;border:0;cursor:pointer;
    font:inherit;font-size:11px;color:var(--accent);opacity:.8;letter-spacing:.04em;
    text-align:left;transition:.2s}
  #density:hover{opacity:1;text-shadow:0 0 12px rgba(124,196,255,.5)}

  /* Which brain is answering. Small, always there, and it changes the moment a
     swap lands - a chip that lags is worse than no chip, because it is evidence
     for the wrong thing. Amber while a runtime swap is in force, so "not what
     config.json says" is visible without reading anything. */
  #brainchip{position:fixed;z-index:7;display:flex;
    align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line);background:rgba(10,14,26,.72);
    backdrop-filter:blur(7px);font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);cursor:pointer;
    transition:color .25s,border-color .25s,background .25s}
  #brainchip:hover{border-color:rgba(124,196,255,.5);color:#cfe4ff}
  #brainchip:focus-visible{outline:1px solid rgba(124,196,255,.7);outline-offset:3px}
  #brainchip i{width:6px;height:6px;border-radius:50%;background:currentColor;
    box-shadow:0 0 9px currentColor;flex:0 0 auto}
  #brainchip.swapped{color:#ffc65c;border-color:rgba(255,198,92,.55);
    background:rgba(255,198,92,.08)}
  #brainchip.nokey{color:#ff7d7d;border-color:rgba(255,125,125,.5)}
  #brainchip b{font-weight:600;letter-spacing:.16em;color:#fff}
  #brainchip.swapped b{color:#ffd88f}
  #brainchip.nokey b{color:#ffb4b4}
  /* Too little room to sit beside the toast. The width that decides this is the
     CANVAS's, not the window's - a wide window with the panel open is a narrow
     canvas - so the governor sets the class and the old media query is gone. */
  #brainchip.tight,#brainmenu.tight{display:none !important}

  /* THE BUTTON DOOR. The same list the voice can reach, because the menu is built
     from what the SERVER says it has - a hard-coded menu is a menu that offers you a
     model the allowlist will refuse. */
  #brainmenu{position:fixed;z-index:8;display:none;
    flex-direction:column;gap:1px;padding:6px;border-radius:12px;
    border:1px solid var(--line);background:rgba(8,11,20,.94);
    backdrop-filter:blur(9px);min-width:186px;
    box-shadow:0 18px 40px rgba(0,0,0,.5)}
  #brainmenu.open{display:flex}
  #brainmenu button{appearance:none;border:0;background:transparent;color:#cfe4ff;
    font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;
    transition:background .15s,color .15s}
  #brainmenu button:hover{background:rgba(124,196,255,.12);color:#fff}
  #brainmenu button.on{color:#ffd88f}
  #brainmenu button.on::after{content:' ·';opacity:.7}
  #brainmenu .hr{height:1px;margin:5px 4px;background:var(--line)}
  #brainmenu .home{color:var(--muted)}

  /* The legend shares the top-right lane with the card and the face, and it is last
     in it: the governor walks the lane downwards and hands it whatever is left. */
  #legend{text-align:right;max-width:30ch;
    transition:top .22s cubic-bezier(.22,.7,.25,1),right .22s cubic-bezier(.22,.7,.25,1)}
  #legend .lg{display:flex;align-items:center;justify-content:flex-end;gap:8px;
    font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    padding:2.5px 0;cursor:pointer;user-select:none;transition:color .2s,opacity .2s}
  #legend .lg:hover{color:#fff}
  #legend .lg.off{opacity:.32}
  #legend .lg i{width:8px;height:8px;border-radius:50%;display:inline-block;
    box-shadow:0 0 9px currentColor;background:currentColor;flex:0 0 auto}
  #legend .lg b{font-weight:500;font-variant-numeric:tabular-nums;
    color:rgba(143,160,192,.5);min-width:2ch}

  /* ---------- side panel ---------- */
  /* Its width is the governor's, because the width is what every other surface's
     rectangle is derived FROM: the canvas is the window less this. */
  #panel{position:fixed;z-index:10;
    background:linear-gradient(200deg,rgba(12,18,34,.94),rgba(6,9,18,.96));
    border-left:1px solid var(--line);backdrop-filter:blur(14px);
    transform:translateX(102%);transition:transform .45s cubic-bezier(.22,.7,.25,1);
    display:flex;flex-direction:column;padding:26px 26px 22px}
  #panel.open{transform:none}
  #panel .kicker{display:flex;align-items:center;gap:9px;font-size:10.5px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  #panel .kicker i{width:8px;height:8px;border-radius:50%;background:currentColor;
    box-shadow:0 0 10px currentColor}
  #panel h2{margin:14px 0 4px;font-size:25px;line-height:1.2;font-weight:600;color:#fff}
  #panel .meta{font-size:11px;color:rgba(143,160,192,.7);letter-spacing:.05em;
    font-variant-numeric:tabular-nums}
  #panel .body{margin-top:18px;overflow-y:auto;flex:1;font-size:13.5px;
    color:rgba(232,238,252,.86)}
  #panel .body p{margin:0 0 14px}
  #panel h3{margin:22px 0 10px;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  #close{position:absolute;top:20px;right:22px;width:28px;height:28px;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
    font-size:15px;line-height:1;transition:.2s}
  #close:hover{color:#fff;border-color:rgba(140,170,220,.5)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:rgba(124,196,255,.06);color:var(--ink);
    border-radius:999px;padding:5px 11px;font-size:11.5px;cursor:pointer;
    transition:.18s;text-align:left}
  .chip:hover{background:rgba(124,196,255,.18);border-color:rgba(124,196,255,.5);
    transform:translateY(-1px)}
  .chip i{width:6px;height:6px;border-radius:50%;background:currentColor;
    display:inline-block;margin-right:7px;box-shadow:0 0 7px currentColor}

  /* ---------- the other world: live web sources ----------
     Cyan throughout, and cyan nowhere else in this file, so the eye learns the rule in
     one glance: gold-and-folder-coloured means your own notes, cyan means the web. The
     panel keeps its shape - a source reads like a note, and clicks like a link. */
  #panel.web .kicker{color:var(--web)}
  .srclist{display:flex;flex-direction:column;gap:12px;margin-top:2px}
  a.src-item{display:block;text-decoration:none;border:1px solid rgba(34,224,255,.22);
    background:rgba(34,224,255,.05);border-radius:12px;padding:11px 13px;
    transition:.18s;color:var(--ink)}
  a.src-item:hover{background:rgba(34,224,255,.13);border-color:rgba(34,224,255,.55);
    transform:translateY(-1px)}
  a.src-item .t{display:block;font-size:13px;line-height:1.35;color:#fff}
  a.src-item .u{display:block;margin-top:5px;font-size:11px;color:var(--web);
    word-break:break-all;letter-spacing:.01em}
  .src-note{font-size:11.5px;color:rgba(143,160,192,.8);margin:0 0 16px;line-height:1.5}
  a.wchip{border:1px solid rgba(34,224,255,.3);background:rgba(34,224,255,.07);
    color:var(--web);border-radius:999px;padding:5px 11px;font-size:11.5px;
    text-decoration:none;transition:.18s;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  a.wchip:hover{background:rgba(34,224,255,.2);border-color:rgba(34,224,255,.6);
    transform:translateY(-1px)}
  #answer.web{border-color:rgba(34,224,255,.4);
    box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px rgba(34,224,255,.12) inset}

  /* ---------- brain / ask bar ----------
     THE TOAST. Its column is the canvas's, never the window's: with the panel open it
     narrows and re-centres in the space that is left, so a spoken report cannot bury
     the panel's Connected chips. Width and left are the governor's. */
  #brain{position:fixed;z-index:9;display:flex;flex-direction:column;gap:10px;
    transition:left .22s cubic-bezier(.22,.7,.25,1),
               width .22s cubic-bezier(.22,.7,.25,1)}
  #answer{display:none;background:var(--glass);border:1px solid var(--line);
    border-radius:16px;padding:16px 18px;backdrop-filter:blur(16px);
    box-shadow:0 20px 60px rgba(0,0,0,.55)}
  #answer.show{display:block;animation:rise .35s cubic-bezier(.22,.7,.25,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #answer .q{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:9px}
  #answer .a{font-size:14.5px;line-height:1.6;color:#f2f6ff;white-space:pre-wrap}
  #answer.err .a{color:#ffc9a8}
  #answer .src{margin-top:13px}
  #answer .src .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px}

  /* ---------- THE MOMENT OF TRUST ----------
     A proposal is the one thing on this screen that is about to CHANGE something, so it
     does not look like an answer. Amber, its own border, and every validated parameter
     rendered as a row: the human is being asked to approve these exact values, and a
     value they cannot see is a value they cannot approve. The server composes the
     sentence above it; this block is the evidence underneath it. */
  #answer.tool{border-color:rgba(255,196,100,.45);
    box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,196,100,.14) inset}
  #a-ask{display:none;margin-top:14px;border-top:1px solid rgba(255,196,100,.22);
    padding-top:13px}
  #a-ask.show{display:block}
  #a-ask .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:#ffc86a;margin-bottom:9px}
  #a-ask .rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;
    font-size:12.5px;line-height:1.5;margin-bottom:13px}
  #a-ask .rows b{color:var(--muted);font-weight:500;letter-spacing:.04em;
    white-space:nowrap}
  #a-ask .rows span{color:#f2f6ff;word-break:break-word;white-space:pre-wrap}
  #a-ask .rows i{color:rgba(143,160,192,.7);font-style:normal}
  #a-ask .pair{display:flex;align-items:center;gap:10px}
  #a-ask button{border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;
    padding:9px 22px;transition:.2s}
  #ask-yes{background:rgba(255,196,100,.18);color:#ffdfae;
    border:1px solid rgba(255,196,100,.45)}
  #ask-yes:hover:not(:disabled){background:rgba(255,196,100,.32)}
  #ask-no{background:transparent;color:var(--muted);border:1px solid var(--line)}
  #ask-no:hover:not(:disabled){color:#fff;border-color:rgba(140,170,220,.4)}
  #a-ask button:disabled{opacity:.45;cursor:default}
  #a-ask .clock{font-size:11px;color:var(--muted);margin-left:auto}
  #bar{display:flex;align-items:center;gap:12px;background:var(--glass);
    border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;
    backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.6);transition:.25s}
  #bar:focus-within{border-color:rgba(124,196,255,.45);
    box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 4px rgba(124,196,255,.08)}
  #bar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 12px var(--accent);flex:0 0 auto}
  #bar .dot.busy{animation:pulse 1.05s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  #q{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:14.5px;
    padding:10px 0;font-family:inherit}
  #q::placeholder{color:rgba(143,160,192,.55)}
  #send,#reset{border:0;border-radius:999px;cursor:pointer;font-family:inherit;
    transition:.2s;flex:0 0 auto}
  #send{background:rgba(124,196,255,.16);color:#dceaff;padding:10px 20px;font-size:13px;
    border:1px solid rgba(124,196,255,.3)}
  #send:hover:not(:disabled){background:rgba(124,196,255,.3)}
  #send:disabled{opacity:.5;cursor:default}
  #reset{background:transparent;color:var(--muted);padding:10px 12px;font-size:13px}
  #reset:hover{color:#fff}

  /* ---------- voice ---------- */
  #mic{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;transition:.2s}
  #mic:hover:not(:disabled){color:#fff;border-color:rgba(140,170,220,.5)}
  #mic:disabled{opacity:.3;cursor:not-allowed}
  #mic svg{width:15px;height:15px;display:block}
  #mic.on{color:#ff6b7f;border-color:rgba(255,107,127,.6);
    background:rgba(255,107,127,.14);animation:miclive 1.5s ease-in-out infinite}
  @keyframes miclive{0%,100%{box-shadow:0 0 0 0 rgba(255,107,127,.4)}
    50%{box-shadow:0 0 0 8px rgba(255,107,127,0)}}
  #status{display:flex;align-items:center;gap:9px;padding:0 20px;min-height:16px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    transition:color .3s}
  #status i{width:6px;height:6px;border-radius:50%;background:currentColor;
    box-shadow:0 0 9px currentColor;flex:0 0 auto;transition:.3s}
  #status.listening{color:#ff8b9a}
  #status.thinking{color:#ffb347}
  #status.speaking{color:#4be0b8}
  #status.looking{color:#9d7cff}
  #status.listening i,#status.thinking i,#status.looking i{
    animation:pulse 1.1s ease-in-out infinite}

  /* ---------- screen share ----------
     Deliberately loud. A tool that can see your screen and says so quietly is a
     tool you will one day forget is watching, so this is a red frame round the
     whole window plus a chip that cannot be mistaken for decoration. */
  #screen{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;transition:.2s}
  #screen:hover:not(:disabled){color:#fff;border-color:rgba(140,170,220,.5)}
  #screen:disabled{opacity:.3;cursor:not-allowed}
  #screen svg{width:16px;height:16px;display:block}
  #screen.on{color:#ff4d5e;border-color:rgba(255,77,94,.75);
    background:rgba(255,77,94,.18)}
  /* The same share, doing a second job: red for "this screen is being captured",
     amber ring for "and it is being diffed every five seconds". */
  #screen.watching{box-shadow:0 0 0 2px rgba(255,183,77,.55)}
  #sharewash{position:fixed;inset:0;z-index:11;pointer-events:none;display:none;
    box-shadow:inset 0 0 0 2px rgba(255,77,94,.85),inset 0 0 70px rgba(255,77,94,.16);
    animation:washlive 2.4s ease-in-out infinite}
  #sharewash.live{display:block}
  @keyframes washlive{0%,100%{opacity:.55}50%{opacity:1}}
  /* The three chips are one ROW, stacked by the governor in the order they are loud
     in: the share first, then the watch, then the eyes. Measured, not cascaded - a
     hardcoded 62px is wrong the moment a chip wraps to two lines. */
  #sharing{position:fixed;z-index:13;display:none;
    align-items:center;gap:10px;padding:8px 10px 8px 14px;
    transition:top .2s cubic-bezier(.22,.7,.25,1),left .22s cubic-bezier(.22,.7,.25,1);
    border-radius:999px;background:rgba(38,6,10,.86);border:1px solid rgba(255,77,94,.7);
    backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(255,0,30,.28);
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#ffd7dc}
  #sharing.live{display:flex}
  #sharing .rec{width:9px;height:9px;border-radius:50%;background:#ff4d5e;
    box-shadow:0 0 12px #ff4d5e;animation:pulse 1.15s ease-in-out infinite;
    flex:0 0 auto}
  #sharing .dim{letter-spacing:.02em;text-transform:none;color:rgba(255,215,220,.62)}
  #sharing button{border:0;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;
    background:rgba(255,77,94,.22);color:#ffe6ea;border:1px solid rgba(255,77,94,.45)}
  #sharing button:hover{background:rgba(255,77,94,.4)}

  /* ---------- the eyes ----------
     Quieter than the screen share, and on purpose. Nothing here is uploaded - three
     booleans leave this page and the pixels never do - so a red frame round the whole
     window would be crying wolf, and a tool that cries wolf about the harmless claim
     has nothing left to say about the serious one. Violet, one chip, and a lid that
     shuts on a single tap. The chip goes amber when the posture itself is the news. */
  #eye{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;transition:.2s}
  #eye:hover:not(:disabled){color:#fff;border-color:rgba(157,124,255,.55)}
  #eye:disabled{opacity:.3;cursor:not-allowed}
  #eye svg{width:17px;height:17px;display:block}
  #eye.on{color:#c3a6ff;border-color:rgba(157,124,255,.75);
    background:rgba(157,124,255,.18)}
  #eye.on.bent{color:#ffd08a;border-color:rgba(255,179,71,.8);
    background:rgba(255,179,71,.16)}
  #eyeing{position:fixed;z-index:13;display:none;
    align-items:center;gap:10px;padding:8px 10px 8px 14px;
    transition:top .2s cubic-bezier(.22,.7,.25,1),left .22s cubic-bezier(.22,.7,.25,1);
    border-radius:999px;background:rgba(20,12,38,.88);
    border:1px solid rgba(157,124,255,.6);backdrop-filter:blur(12px);
    box-shadow:0 10px 34px rgba(110,70,255,.24);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:#e4dbff}
  #eyeing.live{display:flex}
  #eyeing .lid{width:9px;height:9px;border-radius:50%;background:#9d7cff;
    box-shadow:0 0 12px #9d7cff;animation:pulse 1.6s ease-in-out infinite;
    flex:0 0 auto}
  #eyeing .dim{letter-spacing:.02em;text-transform:none;
    color:rgba(228,219,255,.62)}
  #eyeing button{border:0;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;
    background:rgba(157,124,255,.22);color:#efe9ff;
    border:1px solid rgba(157,124,255,.45)}
  #eyeing button:hover{background:rgba(157,124,255,.4)}

  /* ---------- the watch ----------
     Amber, because this one is neither the red of an upload nor the violet of a
     camera that uploads nothing: it is a share that sits there costing nothing and
     occasionally decides to spend a thought. The chip counts the stillness out loud
     in numbers, which is the only honest way to show a clock you cannot hear. */
  #watching{position:fixed;z-index:13;display:none;
    align-items:center;gap:10px;padding:8px 10px 8px 14px;
    transition:top .2s cubic-bezier(.22,.7,.25,1),left .22s cubic-bezier(.22,.7,.25,1);
    border-radius:999px;background:rgba(36,24,6,.88);
    border:1px solid rgba(255,183,77,.62);backdrop-filter:blur(12px);
    box-shadow:0 10px 34px rgba(255,150,0,.22);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:#ffe7c2}
  #watching.live{display:flex}
  #watching .eye{width:9px;height:9px;border-radius:50%;background:#ffb74d;
    box-shadow:0 0 12px #ffb74d;animation:pulse 2.6s ease-in-out infinite;
    flex:0 0 auto}
  #watching .dim{letter-spacing:.02em;text-transform:none;
    color:rgba(255,231,194,.66);font-variant-numeric:tabular-nums}
  #watching button{border:0;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;
    background:rgba(255,183,77,.2);color:#fff1dc;
    border:1px solid rgba(255,183,77,.45)}
  #watching button:hover{background:rgba(255,183,77,.38)}

  /* THE FACE. One element, two homes: the top row of the desktop card, or - when the
     browser will not give us a window - the same row pinned in the page's top-right
     lane, under the countdown. These rules serve BOTH, because the desktop card
     inherits this stylesheet whole; the second home is not a second design. */
  #facecard{position:fixed;z-index:14;display:none;
    padding:12px 13px;border-radius:16px;
    background:rgba(14,10,4,.92);border:1px solid rgba(255,183,77,.5);
    backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.6);
    color:#ffe7c2;font-size:11px;letter-spacing:.06em;
    transition:top .22s cubic-bezier(.22,.7,.25,1),right .22s cubic-bezier(.22,.7,.25,1)}
  #facecard.show{display:block}
  #facecard .row{display:flex;align-items:center;gap:10px}
  /* FACE_MARKUP's own wrapper, styled here rather than in a string that only the
     desktop window ever saw - which is why the in-page face used to stack its eye
     above its words while the pinned one sat in a row. */
  #facecard .wrap{display:flex;align-items:center;gap:11px}
  #facecard .wrap.think{border-radius:12px;
    box-shadow:inset 0 0 26px rgba(255,150,0,.22)}
  #facecard .t{text-transform:uppercase;letter-spacing:.2em;font-size:10px}
  #facecard .mark{width:38px;height:38px;flex:0 0 auto}
  #facecard .t{text-transform:uppercase;letter-spacing:.2em;font-size:10px}
  #facecard .s{color:rgba(255,231,194,.66);font-variant-numeric:tabular-nums;
    margin-top:2px;letter-spacing:.02em;text-transform:none}
  #facecard .pin{margin-top:9px;width:100%;border:1px solid rgba(255,183,77,.4);
    border-radius:999px;background:rgba(255,183,77,.16);color:#fff1dc;
    font-family:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 8px;cursor:pointer}
  #facecard .pin:hover{background:rgba(255,183,77,.34)}

  /* the exact frame that was sent, shown beside the answer it produced */
  #answer .saw{display:none;margin-top:13px;gap:11px;align-items:flex-start}
  #answer .saw.show{display:flex}
  #answer .saw img{width:132px;border-radius:8px;border:1px solid rgba(255,77,94,.4);
    display:block;background:#000}
  #answer .saw .fm{font-size:10.5px;line-height:1.7;color:var(--muted);
    letter-spacing:.02em}
  #answer .saw .fm b{display:block;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:#ff9aa6;margin-bottom:3px;font-weight:500}
  #status .said{text-transform:none;letter-spacing:.01em;font-size:12px;
    color:rgba(232,238,252,.8);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:52ch}

  /* ---------- focus sessions ----------
     The countdown card. Pinned top-right, and it TINTS rather than blinks: the
     colour is the whole message, readable out of the corner of your eye from a
     different window, which is precisely where you will be when it matters. */
  #focusbtn{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;transition:.2s}
  #focusbtn:hover:not(:disabled){color:#fff;border-color:rgba(140,170,220,.5)}
  #focusbtn svg{width:16px;height:16px;display:block}
  #focusbtn.on{color:#4be0b8;border-color:rgba(75,224,184,.65);
    background:rgba(75,224,184,.14)}
  #focusbtn.on.drift{color:#ff6b7f;border-color:rgba(255,107,127,.7);
    background:rgba(255,107,127,.16)}

  #focuscard{position:fixed;z-index:12;display:none;
    padding:12px 15px 11px;border-radius:15px;
    background:linear-gradient(200deg,rgba(12,18,34,.9),rgba(6,9,18,.94));
    border:1px solid var(--line);backdrop-filter:blur(13px);
    box-shadow:0 14px 44px rgba(0,0,0,.55);
    transition:border-color .35s,box-shadow .35s,background .35s,
      top .22s cubic-bezier(.22,.7,.25,1),right .22s cubic-bezier(.22,.7,.25,1),
      width .22s cubic-bezier(.22,.7,.25,1)}
  #focuscard.live{display:block}
  #focuscard .fh{display:flex;align-items:center;gap:7px;font-size:10px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  #focuscard .fh i{width:6px;height:6px;border-radius:50%;background:#4be0b8;
    box-shadow:0 0 9px #4be0b8;flex:0 0 auto;transition:.3s}
  #focuscard .fh b{margin-left:auto;font-weight:500;letter-spacing:.1em;
    color:rgba(143,160,192,.62);text-transform:none;font-size:9.5px}
  #focus-clock{margin:7px 0 2px;font-size:34px;line-height:1;font-weight:300;
    letter-spacing:.02em;color:#fff;font-variant-numeric:tabular-nums;
    transition:color .3s}
  #focuscard .fbar{height:3px;border-radius:2px;background:rgba(140,170,220,.14);
    overflow:hidden;margin:9px 0 8px}
  #focuscard .fbar span{display:block;height:100%;width:0;border-radius:2px;
    background:#4be0b8;box-shadow:0 0 10px rgba(75,224,184,.6);
    transition:width .6s linear,background .3s}
  #focus-intent{display:none;font-size:11px;line-height:1.45;color:#cdd9f2;
    margin:-2px 0 7px;padding-left:8px;border-left:2px solid rgba(75,224,184,.55);
    overflow-wrap:break-word}
  #focus-stats{font-size:10.5px;letter-spacing:.06em;line-height:1.65;
    color:rgba(143,160,192,.8);font-variant-numeric:tabular-nums}
  #focus-stats b{color:#dbe6ff;font-weight:500}
  #focuscard .frow{display:flex;gap:6px;margin-top:10px}
  #focuscard .frow button{flex:1;border:1px solid var(--line);border-radius:999px;
    background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:6px 0;
    transition:.2s}
  #focuscard .frow button:hover{color:#fff;border-color:rgba(140,170,220,.55)}
  /* The override, and the one control on this card that changes what is WATCHED
     rather than what the clock is doing - so it flashes its own confirmation the
     instant it is pressed, and wears the on-target colour while it does. */
  #focuscard .frow.flock{margin-top:9px}
  #focus-lock{letter-spacing:.16em}
  #focus-lock.done{color:#4be0b8;border-color:rgba(75,224,184,.7);
    background:rgba(75,224,184,.16)}
  /* Off target. Not a flash you can ignore after the third one - a colour the
     whole card wears until you come back. */
  #focuscard.drift{border-color:rgba(255,77,94,.72);
    background:linear-gradient(200deg,rgba(46,10,16,.92),rgba(20,6,10,.95));
    box-shadow:0 14px 44px rgba(255,0,30,.24),inset 0 0 40px rgba(255,77,94,.07)}
  #focuscard.drift .fh{color:#ffb4bd}
  #focuscard.drift .fh i{background:#ff4d5e;box-shadow:0 0 12px #ff4d5e;
    animation:pulse 1.15s ease-in-out infinite}
  #focuscard.drift #focus-clock{color:#ffd7dc}
  #focuscard.drift .fbar span{background:#ff4d5e;box-shadow:0 0 10px rgba(255,77,94,.6)}
  /* The 800ms grace window, shown rather than hidden: amber is the machine saying
     "I have noticed, and I am not accusing you yet". */
  /* Deferred: nothing is being watched yet, and the card should not look like a
     session quietly getting on with it. Dashed, because it is not settled. */
  #focuscard.deferred{border-style:dashed;border-color:rgba(140,170,220,.45)}
  #focuscard.deferred .fh i{background:#8fa0c0;box-shadow:none}
  #focuscard.deferred #focus-clock{color:rgba(219,230,255,.6)}
  #focuscard.deferred .fbar span{background:#8fa0c0;box-shadow:none}
  #focuscard.grace{border-color:rgba(255,179,71,.6)}
  #focuscard.grace .fh i{background:#ffb347;box-shadow:0 0 11px #ffb347}
  #focuscard.excused{border-color:rgba(124,196,255,.55)}
  #focuscard.excused .fh i{background:#7cc4ff;box-shadow:0 0 11px #7cc4ff;
    animation:none}
  #focuscard.excused #focus-clock{color:#dceaff}
  #focuscard.paused{border-color:rgba(140,170,220,.3);opacity:.72}
  #focuscard.paused .fh i{background:#8fa0c0;box-shadow:none;animation:none}
  /* Cannot see. Distinct from both on-target and drift on purpose: a watchdog
     that goes blind and looks calm is worse than one that looks worried. */
  #focuscard.blind{border-color:rgba(157,124,255,.55)}
  #focuscard.blind .fh i{background:#9d7cff;box-shadow:0 0 11px #9d7cff}
  #focuscard.ended{border-color:rgba(75,224,184,.5)}
  #focuscard.ended .fh i{animation:none}
  /* THE COMPACT PILL. When the canvas left of an open note panel is too narrow for
     both, the card gives up its words rather than its clock: time and tint, nothing
     else. It does not fight the panel for room and it does not vanish either, because
     a countdown you cannot see is a countdown you will overrun. The governor adds
     this class - never a media query, which cannot know the PANEL is what took the
     room. */
  #focuscard.pill{width:auto;padding:9px 13px 8px}
  /* Narrower than the pill itself: there is no honest rectangle left, so the card
     stands down rather than sitting on the panel. The governor's last resort. */
  #focuscard.nofit{display:none !important}

  /* THE STOPWATCH'S FRIEND. Every governed surface moves under a transition, which is
     right for the eye and useless to a measurement: a rectangle read one frame after a
     panel opens is a rectangle half way there. The probe's `lane` case turns the motion
     off, measures the geometry - which is what the no-overlap law is about - and reads
     the durations separately from computed style. Nothing else in the page sets this. */
  html.nomove *{transition:none !important;animation:none !important}
  #focuscard.pill .fh b,#focuscard.pill #focus-intent,
  #focuscard.pill #focus-stats,#focuscard.pill .frow{display:none}
  #focuscard.pill #focus-clock{margin:5px 0 0;font-size:22px}
  #focuscard.pill .fbar{margin:7px 0 0}
  /* THE RETIREMENT. An ended session's card holds its last line for CARD_RETIRE_S and
     then leaves; prime real estate is not a graveyard. Slower than a layout move on
     purpose - this one you are meant to notice going. */
  #focuscard.retired{opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .42s,transform .42s}

  /* ---------- boot / error ---------- */
  #boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:#000;transition:opacity .6s;text-align:center;padding:30px}
  #boot.gone{opacity:0;pointer-events:none;visibility:hidden}
  #boot .t{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  #boot .e{margin-top:14px;font-size:13px;color:#ffc9a8;max-width:52ch;line-height:1.7}
  .scene-tooltip{font:12.5px/1.4 inherit !important;color:#fff !important;
    background:rgba(8,12,24,.9) !important;border:1px solid rgba(140,170,220,.24);
    border-radius:9px;padding:7px 11px !important;backdrop-filter:blur(8px);
    letter-spacing:.02em}
  .scene-tooltip .tg{display:block;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:#8fa0c0;margin-top:3px}
  @media (max-width:720px){
    #legend{display:none} #title{max-width:22ch}
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="nebula"></div>
<div id="graph"></div>
<div id="vignette"></div>

<div class="hud" id="title">
  <h1>Knowledge Galaxy</h1>
  <p id="stats">mapping…</p>
  <button id="density" type="button"></button>
  <p class="hint">click a star &middot; drag to orbit &middot; scroll to zoom &middot; ask below</p>
</div>

<div class="hud" id="legend"></div>

<!-- The brain chip. Painted only from what the server reports, never from what the
     page asked for: a swap that was refused must leave this untouched. -->
<div id="brainchip" role="button" tabindex="0"
     title="the model answering right now — click to change it"><i></i><b id="brain-label">…</b></div>
<!-- Filled in from GET /brains. Empty until the server says what it has. -->
<div id="brainmenu" role="menu" aria-label="change the answering brain"></div>

<!-- The countdown, pinned top-right. Every number on it comes from the SERVER's
     session, never from a timer in this page: reload the tab and it rejoins the
     session already in progress rather than starting a new one. -->
<div id="focuscard">
  <div class="fh"><i></i><span id="focus-state">on target</span><b id="focus-mode"></b></div>
  <div id="focus-clock">--:--</div>
  <div class="fbar"><span id="focus-fill"></span></div>
  <!-- Your own answer to "what are we focusing on?", in your own words. The only
       string on this card that did not come from a template in focus.py, which is
       why it is only ever written with textContent. -->
  <div id="focus-intent"></div>
  <div id="focus-stats"></div>
  <!-- Moving the lock, by hand. The deferred lock infers, and inference is
       occasionally wrong - so the override sits on the same card that is telling you
       it is watching the wrong thing. Its own row because the label is a sentence: a
       pill reading "LOCK" would be a mystery button on a card about time. -->
  <div class="frow flock">
    <button id="focus-lock" type="button"
            title="Watch the tab you are actually working in">lock this tab</button>
  </div>
  <div class="frow">
    <button id="focus-pause" type="button" title="Pause the clock">pause</button>
    <button id="focus-extend" type="button" title="Five more minutes">+5</button>
    <button id="focus-end" type="button" title="End and hear the report">end</button>
  </div>
</div>

<div id="sharewash"></div>

<!-- Live-share indicator. Shown only while a stream is genuinely live: it is
     painted from the track's own readyState, never from a flag we set hopefully. -->
<div id="sharing">
  <span class="rec"></span>
  <span>screen share live</span>
  <span class="dim" id="share-dim"></span>
  <button id="share-stop" type="button">stop</button>
</div>

<!-- The watch. Its own chip rather than a word added to the share chip: a share you
     started to ask a question about is a different claim from a share that is being
     diffed every five seconds and may speak without being asked. The stillness is
     shown as a running number because that is the entire state of the feature. -->
<div id="watching">
  <span class="eye"></span>
  <!-- Counted, not claimed. "No frame sent" is the truth for as long as the screen
       keeps moving, and the moment that stops being true this says how many. -->
  <span id="watch-sent">watching · no frame sent</span>
  <span class="dim" id="watch-dim"></span>
  <button id="watch-stop" type="button">stop</button>
</div>

<!-- THE FACE. Filled from FACE_MARKUP, the same markup the Document
     Picture-in-Picture window gets, so there is one face with two possible homes. -->
<div id="facecard"></div>

<!-- The eyes. Painted from the camera track's own readyState, like the share chip,
     and it says the one thing worth saying about a camera that is on: what leaves.
     "posture only" is not a slogan here - see eyeReport(), whose whole payload is
     three booleans and a word about the ears. -->
<div id="eyeing">
  <span class="lid"></span>
  <span>eyes on · posture only</span>
  <span class="dim" id="eye-dim"></span>
  <button id="eye-stop" type="button">close</button>
</div>

<!-- Where a frame is grabbed. All four are display:none and none of them holds a
     frame between questions: the videos are the live streams, and each canvas is
     overwritten at the moment of asking. One pair for the screen, one for the
     camera, so neither organ can ever hand the other one's picture to the brain. -->
<video id="shot" muted playsinline autoplay style="display:none"></video>
<canvas id="frame" style="display:none"></canvas>
<!-- Where the watch does its thinking: 32x18 pixels of the screen above, which is
     576 grey numbers. Nothing is uploaded from this canvas and nothing can be - the
     diff reads it back with getImageData and the only thing that leaves the function
     is a count of how many of those numbers moved. -->
<canvas id="thumb" width="32" height="18" style="display:none"></canvas>
<video id="cam" muted playsinline autoplay style="display:none"></video>
<canvas id="camframe" style="display:none"></canvas>

<aside id="panel">
  <button id="close" title="Close (Esc)">&times;</button>
  <div class="kicker"><i></i><span id="p-group"></span></div>
  <h2 id="p-label"></h2>
  <div class="meta" id="p-meta"></div>
  <div class="body">
    <p id="p-excerpt"></p>
    <h3 id="p-nb-head" style="display:none">Connected</h3>
    <div class="chips" id="p-neighbours"></div>
  </div>
</aside>

<div id="brain">
  <div id="answer">
    <div class="q" id="a-q"></div>
    <div class="a" id="a-text"></div>
    <div class="src" id="a-src" style="display:none">
      <div class="lbl">Drawn from</div>
      <div class="chips" id="a-chips"></div>
    </div>
    <div class="saw" id="a-saw">
      <img id="a-frame" alt="the frame that was sent" />
      <div class="fm" id="a-frame-meta"></div>
    </div>
    <!-- THE CONFIRMATION, rendered in the tab that asked. The parameters come from the
         server's validated slot, so what is shown here is exactly what would be run -
         not what was typed, and not what the model said it would do. -->
    <div id="a-ask">
      <div class="lbl" id="ask-lbl">Awaiting your word</div>
      <div class="rows" id="ask-rows"></div>
      <div class="pair">
        <button id="ask-yes" type="button">Yes</button>
        <button id="ask-no" type="button">No</button>
        <span class="clock" id="ask-clock"></span>
      </div>
    </div>
  </div>
  <div id="status"><i></i><span id="status-text">ready</span><span class="said" id="status-said"></span></div>
  <form id="bar" autocomplete="off">
    <span class="dot" id="dot"></span>
    <input id="q" placeholder="Ask your notes anything…  (press / to focus)" />
    <button id="screen" type="button" title="Share a screen and ask about it">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="3.5" width="20" height="14" rx="2.5"/>
        <path d="M8 21h8M12 17.5V21"/>
      </svg>
    </button>
    <button id="eye" type="button"
            title="Open the eyes · posture only, no frame leaves this machine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1.8 12S5.6 5.4 12 5.4 22.2 12 22.2 12 18.4 18.6 12 18.6 1.8 12 1.8 12z"/>
        <circle cx="12" cy="12" r="3.1"/>
      </svg>
    </button>
    <button id="focusbtn" type="button" title="Start a focus session (or say “thirty minutes on this”)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4"/>
        <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>
      </svg>
    </button>
    <!-- THE EAR BUTTON. Named that in the tooltip because the assistant names it in a
         sentence - "tap the ear button and just talk" - and a control the voice refers
         to by a name it does not answer to is a control you hunt for. It is also the
         only thing in this page that opens the microphone: no organ may. -->
    <button id="mic" type="button" title="Your ears · tap the ear button and just talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
      </svg>
    </button>
    <button id="reset" type="button" title="Forget this conversation">&#8635;</button>
    <button id="send" type="submit">Ask</button>
  </form>
</div>

<div id="boot"><div>
  <div class="t">igniting the galaxy</div>
  <div class="e" id="boot-err"></div>
</div></div>

<script src="graph-data.js"></script>
<script>
/* ---------------------------------------------------------------------------
   Speech recognition finalises a phrase every time you pause for breath, and
   people pause in the middle of sentences. This is how long we wait after the
   last words before deciding a thought is actually over. One knob, one place:
   raise it if you think slowly, lower it if you want a snappier trigger.      */
const FINISH_MS = 900;
/* ------------------------------------------------------------------------- */

/* ============================================================ starfield ==== */
(function () {
  const cvs = document.getElementById('stars');
  const ctx = cvs.getContext('2d');
  let stars = [], w = 0, h = 0, dpr = Math.min(devicePixelRatio || 1, 2);

  function seed() {
    w = cvs.width = innerWidth * dpr;
    h = cvs.height = innerHeight * dpr;
    cvs.style.width = innerWidth + 'px';
    cvs.style.height = innerHeight + 'px';
    const count = Math.round((innerWidth * innerHeight) / 5200);
    stars = new Array(count).fill(0).map(function () {
      const layer = Math.random();
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: (layer * 1.5 + 0.25) * dpr,
        a: 0.25 + Math.random() * 0.6,
        tw: 0.4 + Math.random() * 1.9,
        ph: Math.random() * Math.PI * 2,
        vx: (0.012 + layer * 0.05) * dpr,
        hue: Math.random() < 0.14 ? 'rgba(190,215,255,' : 'rgba(255,252,244,'
      };
    });
  }

  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.x -= s.vx;
      if (s.x < -2) { s.x = w + 2; s.y = Math.random() * h; }
      const a = s.a * (0.62 + 0.38 * Math.sin(t / 1000 * s.tw + s.ph));
      ctx.beginPath();
      ctx.fillStyle = s.hue + a.toFixed(3) + ')';
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  seed();
  addEventListener('resize', seed);
  requestAnimationFrame(frame);
})();

/* ============================================================== helpers ==== */
const PALETTE = ['#7cc4ff','#ffb347','#9d7cff','#4be0b8','#ff7a9c','#d6e35b',
                 '#ff9d5c','#6ce0ff','#c0a5ff','#9ee87f'];
/* THE SECOND HOME, and the one line in this file that knows about it.
   The countdown card does not get rebuilt on the desktop - it is MOVED there, into a
   Document Picture-in-Picture window, so that every listener, every button handler and
   the live SSE paint keep working on the same element. The cost of moving it is that
   an element in another document is invisible to this one's getElementById, and the
   forty-odd $('focus-clock') calls in this file would all start returning null the
   moment the card left the page. So the lookup itself knows where the card went: the
   page first, then whichever document is currently hosting it. One null check while
   nothing has been popped out, which is most of the time. See deskAdopt(). */
let deskDoc = null;              // the document the card lives in, when not this one
const $ = function (id) {
  const el = document.getElementById(id);
  if (el) return el;
  return deskDoc ? deskDoc.getElementById(id) : null;
};

/* ==================================================== THE LAYOUT GOVERNOR ====
   ONE AUTHORITY over the rectangles of four surfaces:

     1. the note side panel      #panel
     2. the in-page card         #focuscard   (and #facecard, #legend, which share
                                               its top-right lane)
     3. the answer toast         #brain
     4. the status / chip row    #brainchip, #brainmenu, #sharing, #watching, #eyeing

   Nothing in this file sets top, right, left, bottom, width or the centring
   transform of any of those elements. They used to set their own, each of them
   correct in isolation, and the result was a report card written across a note
   title and a live chip buried under a toast. Overlap is not a styling bug you can
   fix inside one rule - it is a question about the OTHER surfaces, and only one
   place can answer it.

   The deciding measurement is the CANVAS, not the window: the panel is 420px of
   window that no longer belongs to anybody else, so every derived rectangle is
   computed against `vw - panelW` and re-derived when the panel opens, when it
   closes, and when the window resizes. Stale rectangles are never trusted.

   Elements that have left for the Document Picture-in-Picture window are skipped -
   they are laid out by DESK_CSS in a document this function does not own, and the
   in-page card cannot overlap anything while it is not in the page at all. That is
   Addendum A's one-card-two-homes law paying for itself.

   Every move is a CSS transition of MOVE_MS, declared on each element's own rule,
   so this function only ever assigns coordinates - it never animates by hand. */
const LAYOUT = {
  EDGE: 26,          // the window margin the title and legend have always used
  TOP: 22,           // first slot of the top-right lane
  CHIP_TOP: 16,      // first slot of the top-centre chip stack
  GAP: 12,           // between two surfaces in the same lane
  CARD_W: 238,       // the countdown card, full dress
  CARD_MIN: 290,     // below this much canvas it wears the compact pill
  CARD_FLOOR: 210,   // and below THIS it stands down entirely
  TOAST_MAX: 760,    // the toast's full width, panel closed
  TOAST_MIN: 220,
  CHIP_MIN: 860,     // the brain chip and its menu hide below this much canvas
  MOVE_MS: 220,      // every transition in the governed rules matches this
  PANEL_MAX: 420,    // must match nothing: this IS the panel's width
  PANEL_VW: 0.88,
};
let layoutLast = null;    // the last set of rectangles, for the probe and __galaxy

/* An element this document may position: in the page, and not adopted away. */
function layoutMine(id) {
  const el = document.getElementById(id);
  return el && el.ownerDocument === document ? el : null;
}
/* Visible enough to occupy a slot, which is how a chip that is not live gets no room
   rather than an empty gap. getClientRects() and not offsetParent: every surface here is
   position:fixed, and offsetParent is null for a fixed element whether it is displayed or
   not - a test that answers "no" for all four of them is a lane that never advances. */
function layoutShown(el) {
  return !!(el && el.getClientRects().length);
}

/* vwOverride is for the probe and for nothing else: "the canvas is too narrow for both"
   is a real branch with real consequences, and the only other way to reach it is to
   resize the harness's window and make every other case measure a viewport it did not
   ask for. Callers in the page pass nothing - which is also why the two listeners below
   are wrapped rather than passed directly, since an Event is not a width. */
function layout(vwOverride) {
  const vw = vwOverride || window.innerWidth, vh = window.innerHeight;
  const panel = layoutMine('panel');
  const panelOpen = !!(panel && panel.classList.contains('open'));
  const panelW = Math.min(LAYOUT.PANEL_MAX, Math.round(vw * LAYOUT.PANEL_VW));
  /* THE RESERVED LANE. The canvas is what is left of the window, and the panel edge
     is a wall: no governed surface is placed to the right of it while it is open. */
  const taken = panelOpen ? panelW : 0;
  const canvasW = Math.max(0, vw - taken);

  if (panel) {
    panel.style.top = '0px';
    panel.style.right = '0px';
    panel.style.height = '100%';
    panel.style.width = panelW + 'px';
  }

  /* ---- 2. the top-right lane: countdown card, face row, legend ---- */
  const laneRight = taken + LAYOUT.EDGE;
  const card = layoutMine('focuscard');
  if (card) {
    /* The card decides its DRESS before the lane measures it, because a pill is a
       different height. Full dress needs room for itself and a margin either side. */
    const fits = canvasW - LAYOUT.EDGE * 2;
    card.classList.toggle('nofit', fits < LAYOUT.CARD_FLOOR);
    card.classList.toggle('pill', fits >= LAYOUT.CARD_FLOOR && fits < LAYOUT.CARD_MIN);
    if (!card.classList.contains('pill')) card.style.width = LAYOUT.CARD_W + 'px';
    else card.style.width = '';
  }
  let laneTop = LAYOUT.TOP;
  ['focuscard', 'facecard', 'legend'].forEach(function (id) {
    const el = layoutMine(id);
    if (!el) return;
    el.style.right = laneRight + 'px';
    el.style.top = laneTop + 'px';
    if (layoutShown(el)) laneTop += el.offsetHeight + LAYOUT.GAP;
  });

  /* ---- 3. the answer toast: never wider than the canvas ---- */
  /* A spoken report is long, and the CONNECTED chips live behind its right-hand end.
     Panel open, the toast stops at the panel edge; panel closed, it goes back to its
     full width. The two are never in the same column at the same time. */
  const toast = layoutMine('brain');
  if (toast) {
    const w = Math.max(LAYOUT.TOAST_MIN,
                       Math.min(LAYOUT.TOAST_MAX, canvasW - LAYOUT.EDGE * 2));
    toast.style.width = w + 'px';
    toast.style.left = Math.max(LAYOUT.EDGE / 2, (canvasW - w) / 2) + 'px';
    toast.style.right = 'auto';
    toast.style.bottom = LAYOUT.EDGE + 'px';
    toast.style.transform = 'none';       // the old translateX(-50%) centring, retired
  }

  /* ---- 4. the status row and the live chips ---- */
  const bchip = layoutMine('brainchip'), bmenu = layoutMine('brainmenu');
  if (bchip) {
    bchip.style.left = LAYOUT.EDGE + 'px';
    bchip.style.bottom = '104px';
    bchip.classList.toggle('tight', canvasW < LAYOUT.CHIP_MIN);
  }
  if (bmenu) {
    bmenu.style.left = LAYOUT.EDGE + 'px';
    bmenu.style.bottom = '136px';
    bmenu.classList.toggle('tight', canvasW < LAYOUT.CHIP_MIN);
  }
  /* Three chips can be live at once and any one of them can be the only one. This
     stack replaces the sibling-selector cascade that used to hard-code 62px and
     108px: measured heights, in order, centred on the CANVAS rather than the window
     so an open panel does not push them under itself. */
  let chipTop = LAYOUT.CHIP_TOP;
  const chipMid = Math.round(canvasW / 2);
  ['sharing', 'watching', 'eyeing'].forEach(function (id) {
    const el = layoutMine(id);
    if (!el) return;
    el.style.left = chipMid + 'px';
    el.style.transform = 'translateX(-50%)';
    el.style.top = chipTop + 'px';
    if (layoutShown(el)) chipTop += el.offsetHeight + 8;
  });

  layoutLast = {
    vw: vw, vh: vh, panelOpen: panelOpen, panelW: taken, canvasW: canvasW,
    laneRight: laneRight, laneBottom: laneTop,
    card: card ? { pill: card.classList.contains('pill'),
                   nofit: card.classList.contains('nofit'),
                   inPage: true } : { inPage: false },
    toast: toast ? { width: parseFloat(toast.style.width),
                     left: parseFloat(toast.style.left) } : null,
    chipsBottom: chipTop, tight: canvasW < LAYOUT.CHIP_MIN,
  };
  return layoutLast;
}

/* A panel toggle and a resize both re-run it. Three places in this file add or
   remove #panel.open; watching the attribute means none of them has to remember to
   call the governor, which is the only way "none positions itself" stays true. */
window.addEventListener('resize', function () { layout(); });
(function () {
  const panel = document.getElementById('panel');
  if (panel && window.MutationObserver) {
    new MutationObserver(function () { layout(); }).observe(panel,
      { attributes: true, attributeFilter: ['class'] });
  }
})();
layout();

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) +
         ',' + alpha + ')';
}
/* Blend a group colour towards white by t (0..1) - the flare of a new note. */
function mixToWhite(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  const k = Math.max(0, Math.min(1, t));
  const up = function (v) { return Math.round(v + (255 - v) * k); };
  return 'rgb(' + up((n >> 16) & 255) + ',' + up((n >> 8) & 255) + ',' +
         up(n & 255) + ')';
}
/* Blend ANY colour this file produces - '#rrggbb' or 'rgba(r,g,b,a)' - towards a hex
   target by t, leaving the alpha exactly as it was. mixToWhite above cannot do this
   job: the web pulse washes over colours that have already been dimmed or muted, and
   re-deriving them from the group would throw away the dimming, which would make a
   hidden folder light up cyan the moment the web answered something. */
function washTo(color, hex, t) {
  const k = Math.max(0, Math.min(1, t));
  const to = parseInt(hex.slice(1), 16);
  let r = 255, g = 255, b = 255, a = 1;
  const parts = /^rgba?\(([^)]+)\)$/.exec(String(color));
  if (parts) {
    const p = parts[1].split(',').map(Number);
    r = p[0]; g = p[1]; b = p[2];
    if (p.length > 3) a = p[3];
  } else {
    const n = parseInt(String(color).slice(1), 16);
    r = (n >> 16) & 255; g = (n >> 8) & 255; b = n & 255;
  }
  const mix = function (from, toward) { return Math.round(from + (toward - from) * k); };
  return 'rgba(' + mix(r, (to >> 16) & 255) + ',' + mix(g, (to >> 8) & 255) + ',' +
         mix(b, to & 255) + ',' + a + ')';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function bootFail(msg) {
  $('boot').classList.remove('gone');
  $('boot').querySelector('.t').textContent = 'galaxy offline';
  $('boot-err').innerHTML = msg;
}

/* ============================================== load 3d-force-graph (CDN) === */
const CDNS = [
  'https://cdn.jsdelivr.net/npm/3d-force-graph@1/dist/3d-force-graph.min.js',
  'https://unpkg.com/3d-force-graph@1/dist/3d-force-graph.min.js',
  'https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js'
];
function loadScript(url) {
  return new Promise(function (res, rej) {
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = res;
    s.onerror = function () { rej(new Error(url)); };
    document.head.appendChild(s);
  });
}
async function loadLib() {
  for (let i = 0; i < CDNS.length; i++) {
    try {
      await loadScript(CDNS[i]);
      if (window.ForceGraph3D) return true;
    } catch (e) { /* try the next mirror */ }
  }
  return false;
}

/* ================================================================= boot ==== */
(async function main() {
  if (typeof GRAPH === 'undefined' || !GRAPH || !GRAPH.nodes) {
    return bootFail('<code>graph-data.js</code> is missing or empty.<br>' +
      'Run <code>python build.py</code> in the project root, then reload.');
  }
  if (!GRAPH.nodes.length) {
    return bootFail('The index contains no notes. Add .md files under ' +
      '<code>notes/</code> and run <code>python build.py</code> again.');
  }
  const ok = await loadLib();
  if (!ok) {
    return bootFail('Could not load <code>3d-force-graph</code> from any CDN.<br>' +
      'This page needs an internet connection the first time it runs.');
  }

  /* ---- groups & colours ---- */
  const groups = (GRAPH.meta && GRAPH.meta.groups && GRAPH.meta.groups.length)
    ? GRAPH.meta.groups.slice()
    : Array.from(new Set(GRAPH.nodes.map(function (n) { return n.group; }))).sort();
  const colorOf = {};
  groups.forEach(function (g, i) { colorOf[g] = PALETTE[i % PALETTE.length]; });
  const groupColor = function (n) { return colorOf[n.group] || '#9fb4d8'; };

  /* ---- copy data: the layout engine mutates what you hand it ---- */
  const nodes = GRAPH.nodes.map(function (n) { return Object.assign({}, n); });
  const links = GRAPH.links.map(function (l) { return Object.assign({}, l); });
  const byId = new Map(nodes.map(function (n) { return [n.id, n]; }));
  function idOf(v) { return (v && typeof v === 'object') ? v.id : v; }

  /* ---- density: a small corpus can be near-fully connected, which reads as a
     hairball. Default to each note's strongest few edges; the toggle in the HUD
     shows every link build.py actually found. ---- */
  const KIND_RANK = { wikilink: 0, mention: 1, shared: 2 };
  const STRONG_PER_NODE = 4;

  function strongSubset(all, k) {
    const buckets = new Map(nodes.map(function (n) { return [n.id, []]; }));
    all.forEach(function (l) {
      buckets.get(idOf(l.source)).push(l);
      buckets.get(idOf(l.target)).push(l);
    });
    const keep = new Set();
    buckets.forEach(function (arr) {
      arr.sort(function (a, b) {
        return (KIND_RANK[a.kind] - KIND_RANK[b.kind]) ||
               ((b.weight || 1) - (a.weight || 1));
      });
      arr.slice(0, k).forEach(function (l) { keep.add(l); });
    });
    return all.filter(function (l) { return keep.has(l); });
  }

  const allLinks = links;
  const strongLinks = strongSubset(allLinks, STRONG_PER_NODE);
  let activeLinks = strongLinks;
  let neighbours = new Map();

  function rebuildNeighbours() {
    neighbours = new Map(nodes.map(function (n) { return [n.id, new Set()]; }));
    activeLinks.forEach(function (l) {
      neighbours.get(idOf(l.source)).add(idOf(l.target));
      neighbours.get(idOf(l.target)).add(idOf(l.source));
    });
  }
  rebuildNeighbours();
  function degOf(id) { return (neighbours.get(id) || { size: 0 }).size; }

  const hidden = new Set();                 // groups toggled off in the legend
  const hiNodes = new Set();
  const hiLinks = new Set();
  let selected = null;

  /* ---- birth pulse: a newly captured note flares white and swells, then settles.
     Read by nodeVal and nodeColor below, so it survives every other repaint. ---- */
  const PULSE_MS = 1600;
  let pulseId = null, pulseAmt = 0;

  /* ---- web pulse: the OTHER world announcing itself. A note answer lights the one
     star it came from, in that star's own colour; a web answer came from nowhere in
     this galaxy at all, so there is nothing to light - and lighting something anyway
     would be a lie about the source. So the whole sky washes cyan for a moment
     instead: "that did not come from in here". Cyan because nothing in PALETTE is
     this colour, which makes it unmistakable and unmistakably not a folder. ---- */
  const WEB_PULSE_MS = 2200;
  const WEB_CYAN = '#22e0ff';
  let webAmt = 0;

  /* ---- the graph ---- */
  const Graph = ForceGraph3D()(document.getElementById('graph'))
    .backgroundColor('rgba(0,0,0,0)')
    .showNavInfo(false)
    .nodeId('id')
    .nodeRelSize(4.4)
    .nodeResolution(16)
    .nodeOpacity(1)
    .nodeVal(function (n) {
      const base = 1.1 + degOf(n.id) * 0.8;
      if (n.id === pulseId) return base + pulseAmt * base * 3.2;
      // The web swell is deliberately slight - a breath across the whole sky rather
      // than a flare in one place. A big swell everywhere reads as "all of these
      // matched", which is the opposite of what a web answer means.
      return webAmt > 0 ? base + webAmt * base * 0.45 : base;
    })
    .nodeLabel(function (n) {
      return '<div>' + esc(n.label) + '<span class="tg">' + esc(n.group) +
             ' &middot; ' + degOf(n.id) + ' links</span></div>';
    })
    .nodeColor(function (n) {
      const c = groupColor(n);
      // A pulsing node ignores dimming and muting: the whole point is being seen. It
      // also outranks the cyan wash - a note that was just born came from in here.
      if (n.id === pulseId && pulseAmt > 0) return mixToWhite(c, pulseAmt);
      let out;
      if (hidden.has(n.group)) out = hexToRgba(c, 0.05);
      else if (!hiNodes.size) out = c;
      else if (selected === n.id) out = '#ffffff';
      else if (hiNodes.has(n.id)) out = c;
      else out = hexToRgba(c, 0.09);
      // The wash goes on LAST, over whatever this node was already, so a hidden folder
      // stays hidden and a dimmed one stays dimmed. See washTo.
      return webAmt > 0 ? washTo(out, WEB_CYAN, webAmt * 0.85) : out;
    })
    .linkColor(function (l) {
      const s = byId.get(idOf(l.source)), t = byId.get(idOf(l.target));
      if (!s || !t || hidden.has(s.group) || hidden.has(t.group)) {
        return 'rgba(120,150,200,0.02)';
      }
      const out = hiLinks.has(l) ? hexToRgba(groupColor(s), 0.9)
                : hiLinks.size ? 'rgba(120,150,200,0.06)' : 'rgba(140,175,225,0.32)';
      return webAmt > 0 ? washTo(out, WEB_CYAN, webAmt * 0.7) : out;
    })
    .linkWidth(function (l) { return hiLinks.has(l) ? 1.2 : 0.35; })
    .linkOpacity(0.85)
    .linkDirectionalParticles(function (l) { return hiLinks.has(l) ? 3 : 0; })
    .linkDirectionalParticleWidth(1.1)
    .linkDirectionalParticleSpeed(0.006)
    .linkDirectionalParticleColor(function (l) {
      const s = byId.get(idOf(l.source));
      return s ? groupColor(s) : '#ffffff';
    })
    .onNodeClick(function (n) { focusNode(n, true); })
    .onNodeHover(function (n) {
      document.body.style.cursor = n ? 'pointer' : '';
      if (selected !== null) return;              // a selection wins over hover
      setHighlight(n ? n.id : null, false);
    })
    .onBackgroundClick(clearSelection)
    .graphData({ nodes: nodes, links: activeLinks });

  Graph.d3Force('charge').strength(-165);
  Graph.d3Force('link')
    .distance(function (l) {
      return l.kind === 'wikilink' ? 52 : l.kind === 'mention' ? 74 : 96;
    })
    .strength(function (l) { return l.kind === 'shared' ? 0.18 : 0.42; });
  Graph.d3VelocityDecay(0.28);

  function refresh() {
    Graph.nodeColor(Graph.nodeColor())
         .nodeVal(Graph.nodeVal())
         .linkColor(Graph.linkColor())
         .linkWidth(Graph.linkWidth())
         .linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  function setHighlight(id, isSelection) {
    hiNodes.clear(); hiLinks.clear();
    if (isSelection) selected = id;
    if (id !== null && id !== undefined) {
      hiNodes.add(id);
      (neighbours.get(id) || new Set()).forEach(function (x) { hiNodes.add(x); });
      activeLinks.forEach(function (l) {
        const a = idOf(l.source), b = idOf(l.target);
        if (a === id || b === id) hiLinks.add(l);
      });
    }
    refresh();
  }

  /* ---- camera: fly to a node ----
     Graph.cameraPosition(pos) with no lookAt argument silently resets the look-at
     to the origin, so the idle orbit below has to be told what to orbit around or
     it drags the view back to the centre of the galaxy a moment after every
     flight, pulling the note we just flew to out of frame. */
  let viewTarget = { x: 0, y: 0, z: 0 };
  let flying = false, flights = 0;
  function focusNode(node, select) {
    const n = (typeof node === 'number') ? byId.get(node) : node;
    if (!n) return;
    if (select) { selected = n.id; setHighlight(n.id, true); openPanel(n); }
    if (n.x === undefined) return;
    flights++;      // idle rotation never touches this, so it means "we flew"
    // Far enough back that the lit neighbours stay in frame - flying right up to
    // the sphere fills the screen with one node and loses all sense of place.
    const dist = 190;
    const len = Math.hypot(n.x, n.y, n.z) || 1;
    const k = 1 + dist / len;
    flying = true;
    viewTarget = { x: n.x, y: n.y, z: n.z };   // keep orbiting this note afterwards
    Graph.cameraPosition({ x: n.x * k, y: n.y * k, z: n.z * k }, n, 1700);
    setTimeout(function () { flying = false; }, 1850);
  }

  function clearSelection() {
    selected = null;
    hiNodes.clear(); hiLinks.clear();
    refresh();
    $('panel').classList.remove('open');
  }

  /* ---- slow idle rotation, yielding to the mouse ---- */
  let autoRotate = true, idleTimer = null, dragging = false;
  let last = performance.now();
  function nudgeInteraction() {
    autoRotate = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { autoRotate = true; }, 5200);
  }
  ['pointerdown', 'wheel', 'touchstart'].forEach(function (ev) {
    $('graph').addEventListener(ev, nudgeInteraction, { passive: true });
  });

  /* A drag may be a deliberate pan, which is the one legitimate way for the
     look-at to change - so adopt it when the drag ends. Between drags the
     look-at is ours to defend; see the orbit loop below for why it needs
     defending at all. */
  $('graph').addEventListener('pointerdown', function () { dragging = true; },
                              { passive: true });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    addEventListener(ev, function () {
      if (!dragging) return;
      dragging = false;
      if (flying) return;                    // the flight owns the look-at
      const t = Graph.controls() && Graph.controls().target;
      if (t) viewTarget = { x: t.x, y: t.y, z: t.z };
    }, { passive: true });
  });

  (function orbit(now) {
    const dt = Math.min(now - last, 60); last = now;

    /* Hold the look-at where we put it. OrbitControls quietly eases its target
       back towards the origin after a gesture, and the rotation below is the only
       thing that re-asserts it - so with rotation paused (the 5s after any mouse
       input) a note we just flew to would slide out of frame, and the idle timer
       would then adopt that drifted centre for good. Not while flying, which owns
       the look-at, and not mid-drag, where a pan is the user changing it. */
    const ctrl = Graph.controls();
    if (!flying && !dragging && ctrl && ctrl.target) {
      const t = ctrl.target;
      if (Math.hypot(t.x - viewTarget.x, t.y - viewTarget.y,
                     t.z - viewTarget.z) > 0.5) {
        t.set(viewTarget.x, viewTarget.y, viewTarget.z);
      }
    }

    if (autoRotate && !flying) {
      const cam = Graph.camera();
      const tgt = viewTarget;
      const dx = cam.position.x - tgt.x, dz = cam.position.z - tgt.z;
      const r = Math.hypot(dx, dz);
      if (r > 1) {
        const a = Math.atan2(dx, dz) + 0.000075 * dt;   // ~1 turn per 4 minutes
        // lookAt passed explicitly: without it the library snaps it to the origin.
        Graph.cameraPosition({
          x: tgt.x + r * Math.sin(a),
          y: cam.position.y,
          z: tgt.z + r * Math.cos(a)
        }, tgt);
      }
    }
    requestAnimationFrame(orbit);
  })(last);

  let fitted = false;
  Graph.onEngineStop(function () {
    if (!fitted) { fitted = true; Graph.zoomToFit(1400, 62); }
  });
  setTimeout(function () {
    if (!fitted) { fitted = true; Graph.zoomToFit(1400, 62); }
  }, 4200);

  /* ---- side panel ---- */
  function openPanel(n) {
    const c = groupColor(n);
    // Undo anything openSources() did to this same panel. A note shown in the web
    // panel's clothes would be claiming to have come from outside, which is the one
    // confusion this whole colour scheme exists to prevent.
    $('panel').classList.remove('web');
    $('p-excerpt').className = '';
    $('p-neighbours').className = 'chips';
    $('p-nb-head').textContent = 'Connected';
    $('panel').querySelector('.kicker').style.color = c;
    $('p-group').textContent = n.group;
    $('p-label').textContent = n.label;
    $('p-meta').textContent = n.file + ' · ' + (n.words || 0) + ' words · ' +
                              degOf(n.id) + ' connections';
    $('p-excerpt').textContent = n.excerpt || '(no text)';

    const nb = Array.from(neighbours.get(n.id) || [])
      .map(function (id) { return byId.get(id); })
      .filter(Boolean)
      .sort(function (a, b) { return degOf(b.id) - degOf(a.id); });
    const box = $('p-neighbours');
    box.innerHTML = '';
    $('p-nb-head').style.display = nb.length ? '' : 'none';
    nb.forEach(function (m) { box.appendChild(chip(m)); });
    $('panel').classList.add('open');
  }

  function chip(n) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.style.color = groupColor(n);
    b.innerHTML = '<i></i><span style="color:var(--ink)">' + esc(n.label) + '</span>';
    b.onclick = function () { focusNode(n, true); };
    return b;
  }

  /* ---- the same panel, the other world ----
     A web answer cites nothing in the galaxy, so the panel shows what it DOES cite:
     three links, with their real addresses visible. Never a file path - there is no
     file - and never a node, because no node had anything to do with it.

     Two rules worth stating, because both are about not lying to the reader:
     the href is checked to be http(s) HERE as well as on the server, so a malformed
     or javascript: URL becomes dead text rather than a click; and the address is shown
     in full rather than prettified, because a citation you cannot read is not one. */
  function safeUrl(url) {
    const raw = String(url == null ? '' : url).trim();
    return /^https?:\/\/[^\s]+$/i.test(raw) ? raw : '';
  }

  function sourceLink(src, small) {
    const href = safeUrl(src && src.url);
    const title = String((src && src.title) || href || 'untitled');
    const node = document.createElement(href ? 'a' : 'span');
    node.className = small ? 'wchip' : 'src-item';
    if (href) {
      node.href = href;
      node.target = '_blank';
      // noopener AND noreferrer: a page opened from here has no handle back on this
      // tab, and is not told where its reader came from.
      node.rel = 'noopener noreferrer';
      node.title = href;
    }
    if (small) {
      node.textContent = title;
    } else {
      const t = document.createElement('span');
      t.className = 't';
      t.textContent = title;
      const u = document.createElement('span');
      u.className = 'u';
      u.textContent = href || '(no usable address)';
      node.appendChild(t);
      node.appendChild(u);
    }
    return node;
  }

  function openSources(question, sources, backend) {
    const list = (sources || []).filter(function (s) { return safeUrl(s && s.url); });
    $('panel').classList.add('web');
    $('panel').querySelector('.kicker').style.color = '';   // the .web rule owns it now
    $('p-group').textContent = 'live web';
    $('p-label').textContent = question || 'From the web';
    $('p-meta').textContent = list.length + ' source' + (list.length === 1 ? '' : 's') +
      ' · fetched just now' + (backend ? ' · via ' + backend : '');

    // The excerpt slot says what this panel IS, once, plainly. Then the links.
    $('p-excerpt').className = 'src-note';
    $('p-excerpt').textContent = list.length
      ? 'Answered from these pages, not from your notes. Nothing here has been saved.'
      : 'Nothing usable came back.';
    $('p-nb-head').style.display = list.length ? '' : 'none';
    $('p-nb-head').textContent = 'Sources';
    const box = $('p-neighbours');
    box.className = 'srclist';
    box.innerHTML = '';
    list.forEach(function (s) { box.appendChild(sourceLink(s, false)); });
    $('panel').classList.add('open');
  }

  $('close').onclick = clearSelection;
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { clearSelection(); $('q').blur(); }
    if (e.key === '/' && document.activeElement !== $('q')) {
      e.preventDefault(); $('q').focus();
    }
  });

  /* ---- legend ----
     Repaintable rather than built once: a capture can create a whole new folder
     (captures/), and a cluster the galaxy contains but the legend does not is a
     cluster you cannot mute. ---- */
  const legend = $('legend');
  function paintLegend() {
    const counts = {};
    nodes.forEach(function (n) { counts[n.group] = (counts[n.group] || 0) + 1; });
    legend.innerHTML = '';
    groups.forEach(function (g) {
      const row = document.createElement('div');
      row.className = 'lg' + (hidden.has(g) ? ' off' : '');
      row.style.color = colorOf[g];
      row.innerHTML = '<b>' + (counts[g] || 0) + '</b><span style="color:inherit">' +
                      esc(g) + '</span><i></i>';
      row.onclick = function () {
        if (hidden.has(g)) { hidden.delete(g); row.classList.remove('off'); }
        else { hidden.add(g); row.classList.add('off'); }
        refresh();
      };
      legend.appendChild(row);
    });
  }
  paintLegend();
  function paintStats() {
    $('stats').textContent = nodes.length + ' notes · ' + activeLinks.length +
      ' connections · ' + groups.length + ' clusters';
    $('density').textContent = (activeLinks === strongLinks)
      ? 'showing strongest links · see all ' + allLinks.length + ' →'
      : 'showing all ' + allLinks.length + ' links · simplify →';
  }
  $('density').onclick = function () {
    activeLinks = (activeLinks === strongLinks) ? allLinks : strongLinks;
    rebuildNeighbours();
    Graph.graphData({ nodes: nodes, links: activeLinks });
    if (selected !== null) setHighlight(selected, true);
    else { hiNodes.clear(); hiLinks.clear(); refresh(); }
    paintStats();
  };
  paintStats();

  /* ================================================================ brain == */
  const SESSION = 'galaxy-' + Math.random().toString(36).slice(2, 10);
  let busy = false;

  /* Four or more sources and flying to one of them would be a lie about where the
     answer came from, so the camera stays put and the whole cluster lights up. */
  const CLUSTER_MIN = 4;

  /* The server is the real classifier (it can see the retrieval scores). This is
     only a backstop for an older or misbehaving server, so that "good morning"
     still cannot drag the camera around. */
  const SMALLTALK_RE = new RegExp('^(?:' +
    'hi|hello+|hey+|yo|hiya|howdy|greetings|good\\s*(?:morning|afternoon|evening|day|night)|' +
    'morning|afternoon|evening|thanks?(?:\\s+you)?|ty|ta|cheers|ok|okay|cool|nice|great|' +
    'lovely|awesome|brilliant|perfect|sweet|please|sorry|bye|goodbye|see\\s+you|later|cya|' +
    'lol|ha(?:ha)+|hmm+|yay|how\\s+are\\s+you(?:\\s+doing)?(?:\\s+today)?|' +
    "what(?:'s|s)?\\s+up|sup|who\\s+are\\s+you|what\\s+are\\s+you|what\\s+can\\s+you\\s+do|" +
    'tell\\s+me\\s+a\\s+joke|knock\\s+knock|are\\s+you\\s+(?:a\\s+)?(?:robot|human|real|ai|bot)' +
    ')[\\s,.!?;:]*$', 'i');
  function localKind(question) {
    return SMALLTALK_RE.test(String(question).trim()) ? 'chat' : 'notes';
  }

  /* The force trigger, and the single reason this page has to know about it at all:
     while a screen share is running, anything that is not a pleasantry is treated as a
     question about the screen (see ask()). "Jarvis, look this up" has to escape that,
     or the one phrase that explicitly asks for the web would be answered from a
     screenshot. The server owns the real matcher, the peeling and the searching; this
     copy is a veto on LOCAL routing and nothing more, so it can afford to be looser. */
  const FORCE_WEB_RE = new RegExp(
    '(?:^|\\b)(?:' +
      '(?:hey\\s+|ok(?:ay)?\\s+)?jarvis\\b[\\s,.:;!-]*(?:please\\s+)?(?:can\\s+you\\s+)?' +
        '(?:look\\s+(?:this|that|it)\\s+up|look\\s+up|search\\s+(?:the\\s+)?' +
        '(?:web|internet|online)|search\\s+for)' +
      '|look\\s+(?:this|that|it)\\s+up' +
      '|(?:search|check|ask)\\s+(?:the\\s+)?(?:web|internet|online)' +
      '|web\\s+search' +
    ')', 'i');

  /* The note is on screen to be read; the voice only ever says the short answer.
     A cap here means a long error dump or a chatty model cannot turn into a
     minute of narration. */
  const SPOKEN_MAX_CHARS = 260;
  function spokenForm(text) {
    const line = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
    if (line.length <= SPOKEN_MAX_CHARS) return line;
    const sentences = line.match(/[^.!?]+[.!?]+/g) || [];
    let out = '';
    for (let i = 0; i < sentences.length; i++) {
      if ((out + sentences[i]).length > SPOKEN_MAX_CHARS) break;
      out += sentences[i];
    }
    if (out.trim()) return out.trim();
    return line.slice(0, SPOKEN_MAX_CHARS).replace(/\s+\S*$/, '') + '…';
  }

  /* Nothing else in the file is allowed to move the camera in response to an
     answer. Whether the question was about the notes is decided FIRST, and a
     "chat" reply can never reach the 'fly' or 'cluster' branches below. */
  function decideCamera(kind, used, isError) {
    if (kind === 'chat') return 'hold';       // small talk never touches the graph
    /* A screen answer came from the screen, not from the collection. Flying to a
       note, or lighting one, would be claiming a source it does not have - so this
       is refused here rather than left to depend on the nodes array being empty. */
    if (kind === 'screen') return 'hold';
