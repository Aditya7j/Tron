    /* Changing brains is not asking one a question either, and it is checked before
       the share below: "switch to Astra" while sharing is an instruction, not a
       request to read my screen. The server checks this too. */
    if (isSwap(question)) return swapBrain(question);

    /* Neither is telling the timer what to do, and it is checked before the share
       for the same reason: "give me fifteen seconds" while sharing is a snooze, not
       a request to read the screen. The server checks this too.

       This is also the line that makes "lock on this tab" mean the TARGET rather than
       the pixels. SCREEN_RE matches "this tab" as well, and whichever of them is
       tested first wins - so the one that changes what is being watched goes first,
       and the share keeps every phrase it had outside a live session. */
    if (isFocusPhrase(question)) return fxSend({ say: question });

    /* "Look at me", "what do you think of my shirt?" - the eyes' one frame, and
       checked BEFORE the share for the same reason as everything above it: while a
       screen share is live, every plain sentence goes to the screen, and a question
       about your own shirt answered with a photograph of your desktop would be the
       wrong organ entirely. SCREEN_RE keeps "this" and "that"; this keeps "me". */
    if (LOOK_RE.test(question)) return lookAtMe(question);

    /* "Watch my screen" / "stop watching" - an instruction about the watch, and it has
       to be tested before the share branch below, which would otherwise take "watch my
       screen" while sharing as a question ABOUT the screen and photograph it. Off
       first: "stop watching my screen" contains "watching my screen". */
    if (WATCH_OFF_RE.test(question)) {
      if (!stopWatch('said')) {
        const line = 'I was not watching, sir.';
        renderAnswer(question, line, false, null);
        if (!speak(spokenForm(line))) idleStatus();
      }
      return;
    }
    if (WATCH_RE.test(question)) return startWatch();

    /* Sharing? Then anything but a pleasantry is a question about what is on the
       screen - and while the watch is running that is THE SAME SHARE, which is the
       whole of "answer from the same share": see() takes its frame from FRAME_SOURCES
       .screen, the diff loop reads the same video, and neither needs a second picker. */
    if (sharing() && localKind(question) === 'notes') return see(question);

    /* The share is over. A screen-shaped question is told so plainly: it must never
       be answered from the frame we used to have, and it should not quietly become
       a question about the notes either. */
    if (shareEndedAt && (Date.now() - shareEndedAt) < SHARE_MEMORY_MS &&
        SCREEN_RE.test(question)) {
      renderAnswer(question, SIGHT_TROUBLE.ended, true, null);
      if (!speak(spokenForm(SIGHT_TROUBLE.ended))) idleStatus();
      return;
    }

    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    setStatus('thinking', 'thinking', question);
    // The interim "Thinking…" line is shown but deliberately never spoken, and it
    // never touches the graph - the camera waits until we know what was asked.
    renderAnswer(question, 'Thinking across ' + nodes.length + ' notes…', false, null);

    /* One reply path for answers and errors alike: show it, say it, then let the
       camera prove it. Speaking starts first so the flight happens mid-sentence. */
    function respond(text, isError, ids, kind) {
      const used = renderAnswer(question, text, isError, ids);
      const plan = decideCamera(kind, used, isError);
      if (!speak(spokenForm(text))) idleStatus();
      applyCamera(plan, used);
    }

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, session: SESSION })
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      // The server classifies; localKind() only covers an older or broken server,
      // so the small-talk rule holds either way.
      const kind = (data && data.kind) || localKind(question);
      if (!data) {
        respond('The server replied with something that was not JSON (HTTP ' +
          res.status + ').', true, null, 'chat');
      } else if (data.error) {
        respond(data.error, true, data.nodes, kind);
      } else {
        respond(data.answer || '(empty answer)', false, data.nodes, kind);
      }
    } catch (e) {
      respond('Could not reach the brain. Start it with "python server.py" and open ' +
        'http://localhost:4700 (opening index.html straight from disk will not work).',
        true, null, 'chat');
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
    }
  }

  $('bar').addEventListener('submit', function (e) {
    e.preventDefault();
    const v = $('q').value;
    $('q').value = '';
    ask(v);
  });
  $('reset').onclick = async function () {
    try {
      await fetch('/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: SESSION })
      });
    } catch (e) { /* nothing to forget if the server is not there */ }
    $('answer').classList.remove('show');
    stopListening();
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e2) { /* ignore */ } }
    idleStatus();
    $('q').focus();
  };

  /* ================================================================ voice == */

  /* ?mute=1 silences this tab for good. The check lives inside speak() and
     nowhere else, so no code path can route around it. */
  const MUTED = /(^|[?&])mute=1(&|$)/.test(location.search);

  /* Barked interrupts skip the FINISH_MS buffer entirely. Only checked against
     FINAL results: an interim "stop" is often the start of "stop the roaster". */
  const INTERRUPTS = new Set(['stop', 'wait', 'cancel', 'halt', 'quiet', 'enough',
                              'hold on', 'shut up', 'never mind', 'nevermind']);

  const canSpeak = 'speechSynthesis' in window;
  const Recogniser = window.webkitSpeechRecognition || window.SpeechRecognition;

  let audioUnlocked = false, pendingLine = null, chosenVoice = null;
  let recogniser = null, listening = false;
  let phraseBuffer = '', lastInterim = '', finishTimer = null;

  function setStatus(state, text, said) {
    $('status').className = state || '';
    $('status-text').textContent = text;
    $('status-said').textContent = said || '';
  }

  function idleStatus() {
    if (MUTED) return setStatus('', 'muted tab · this page will not speak');
    if (!canSpeak) return setStatus('', 'no speech synthesis in this browser');
    if (!audioUnlocked) return setStatus('', 'click anywhere to switch the voice on');
    setStatus('', listening ? 'listening' : 'ready');
  }

  /* ---- the voice: British English if the system has one ---- */
  function pickVoice() {
    if (!canSpeak) return null;
    const voices = speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    function score(v) {
      const name = (v.name || '').toLowerCase();
      const lang = (v.lang || '').replace('_', '-').toLowerCase();
      let s = 0;
      if (lang.indexOf('en-gb') === 0) s += 100;                    // British first
      else if (lang.indexOf('en-ie') === 0 || lang.indexOf('en-au') === 0) s += 40;
      else if (lang.indexOf('en') === 0) s += 20;
      if (/uk english|british|libby|sonia|ryan|george|hazel|daniel|arthur|kate|serena|oliver|thomas/.test(name)) s += 25;
      if (/natural|neural|enhanced|premium/.test(name)) s += 8;
      if (/google/.test(name)) s += 6;
      return s;
    }
    return voices.slice().sort(function (a, b) { return score(b) - score(a); })[0] || null;
  }

  function refreshVoice() {
    chosenVoice = pickVoice();
    $('status').title = chosenVoice
      ? 'voice: ' + chosenVoice.name + ' (' + chosenVoice.lang + ')'
      : 'voice: browser default';
    return chosenVoice;
  }

  /* ---- what this page has said, for six seconds ----
     A muted tab still has to be checkable: the live harnesses load with ?mute=1 so the
     machine stays quiet, and "did the nudge arrive, and how fast" is a question about
     the LINE rather than about the sound. So every line that reaches speak() is
     recorded here with whether it actually reached the speakers.

     The window is six seconds because that is focus.py's LABEL_LINE_TTL_S, and for the
     same reason: a callout may name the place you drifted to, the server drops that
     sentence one tick after sending it, and this page must not be the thing that
     outlives the scrub. Nothing reads this to say anything - it is a record, not a
     second speaking path. */
  const SAID_TTL_MS = 6000;
  const saidLines = [];

  function saidLog() {
    const cut = Date.now() - SAID_TTL_MS;
    while (saidLines.length && saidLines[0].at < cut) saidLines.shift();
    return saidLines.slice();
  }
  function noteSaid(line, aloud) {
    saidLines.push({ at: Date.now(), text: line, aloud: !!aloud });
    saidLog();
  }
  // Pruned on a timer as well as on every read, so a line nobody asks about still goes.
  setInterval(saidLog, 1000);

  /* ---- THE one function that speaks ---- */
  function speak(text) {
    const line = String(text == null ? '' : text).trim();
    if (!line) return false;
    if (MUTED) { noteSaid(line, false); return false; }   // the mute gate, the only one
    if (!canSpeak) { noteSaid(line, false); return false; }
    if (!audioUnlocked) {
      // Autoplay policy: hold the line and let the first real click release it.
      pendingLine = line;
      setStatus('', 'click anywhere to hear this answer');
      noteSaid(line, false);
      return false;
    }
    if (!chosenVoice) refreshVoice();
    try {
      speechSynthesis.cancel();                    // never stack two answers
      const u = new SpeechSynthesisUtterance(line);
      /* A voice we cannot set must not cost the answer its voice: a browser that
         refuses this assignment still speaks perfectly well in its default. */
      u.lang = (chosenVoice && chosenVoice.lang) || 'en-GB';
      if (chosenVoice) {
        try { u.voice = chosenVoice; } catch (e) { /* default voice it is */ }
      }
      u.rate = 1; u.pitch = 1; u.volume = 1;
      u.onstart = function () { setStatus('speaking', 'speaking'); };
      u.onend = function () { idleStatus(); };
      u.onerror = function () { idleStatus(); };
      speechSynthesis.speak(u);
      noteSaid(line, true);
      return true;
    } catch (e) {
      noteSaid(line, false);
      return false;
    }
  }

  /* ---- the first gesture unlocks audio and releases any held line ---- */
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (MUTED || !canSpeak) { idleStatus(); return; }
    try {                                          // prime the engine in-gesture
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0;
      speechSynthesis.speak(warm);
    } catch (e) { /* nothing to warm up */ }
    refreshVoice();
    if (pendingLine) { const line = pendingLine; pendingLine = null; speak(line); }
    else idleStatus();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    addEventListener(ev, unlockAudio, { passive: true });
  });

  /* ---- listening: buffer phrases until the pause that ends the thought ---- */
  function armFinishTimer() {
    clearTimeout(finishTimer);
    finishTimer = setTimeout(flushThought, FINISH_MS);
  }

  function heardFinal(text) {
    const raw = String(text == null ? '' : text).trim();
    if (!raw) return;
    const bare = raw.toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();
    if (INTERRUPTS.has(bare)) return interrupt(bare);   // straight past the buffer
    lastInterim = '';
    phraseBuffer = phraseBuffer ? phraseBuffer + ' ' + raw : raw;
    armFinishTimer();
    setStatus('listening', 'listening', phraseBuffer);
  }

  function heardInterim(text) {
    // More words are arriving, so that last pause was not the end of anything.
    lastInterim = String(text == null ? '' : text).trim();
    armFinishTimer();
    setStatus('listening', 'listening', (phraseBuffer + ' ' + lastInterim).trim());
  }

  function flushThought() {
    clearTimeout(finishTimer);
    finishTimer = null;
    // heardFinal() clears lastInterim, so anything still sitting there arrived
    // after the last final and was never confirmed. Append it rather than lose
    // the tail of the sentence when the recogniser cuts out mid-phrase.
    let thought = (phraseBuffer + ' ' + lastInterim).trim().replace(/\s+/g, ' ');
    phraseBuffer = '';
    lastInterim = '';
    if (!thought) { idleStatus(); return; }
    stopListening();
    $('q').value = '';
    /* The answer window takes precedence over everything, and takes exactly one
       thought. A question the assistant just asked out loud is answered without a
       wake word; the sentence after this one is an ordinary question again. */
    if (fxAnswerArmed()) return fxAnswer(thought);
    ask(thought);                        // exactly the path a typed question takes
  }

  function interrupt(label) {
    clearTimeout(finishTimer);
    finishTimer = null;
    phraseBuffer = '';
    lastInterim = '';
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    /* "Stop" means stop, including the answer window. Leaving it armed would make
       the next unrelated sentence, whenever it came, the session's intent. */
    fxAnswerClose();
    stopListening();
    setStatus('', '“' + label + '” · stopped');
  }

  function buildRecogniser() {
    const r = new Recogniser();
    r.lang = 'en-GB';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onstart = function () {
      listening = true;
      $('mic').classList.add('on');
      paintEars();
      setStatus('listening', 'listening');
    };
    r.onresult = function (e) {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        const text = (res[0] && res[0].transcript) || '';
        if (res.isFinal) heardFinal(text); else interim += text;
      }
      if (interim.trim()) heardInterim(interim);
    };
    r.onerror = function (e) {
      listening = false;
      $('mic').classList.remove('on');
      paintEars();
      setStatus('', e.error === 'not-allowed' ? 'microphone permission denied'
              : e.error === 'no-speech' ? 'heard nothing · click the mic again'
              : 'microphone error · ' + e.error);
    };
    r.onend = function () {
      listening = false;
      $('mic').classList.remove('on');
      paintEars();
      // The service can cut out mid-thought; do not lose what was already said.
      if (phraseBuffer.trim() || lastInterim.trim()) flushThought();
      else idleStatus();
    };
    return r;
  }

  function startListening() {
    if (!Recogniser || listening) return;
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    phraseBuffer = '';
    lastInterim = '';
    if (!recogniser) recogniser = buildRecogniser();
    try { recogniser.start(); }
    catch (e) { setStatus('', 'microphone busy · click again'); }
  }

  function stopListening() {
    clearTimeout(finishTimer);
    finishTimer = null;
    if (recogniser && listening) { try { recogniser.stop(); } catch (e) { /* ignore */ } }
    listening = false;
    $('mic').classList.remove('on');
    paintEars();
  }

  const EAR_TITLE = 'Your ears · tap the ear button and just talk';

  /* THE EAR LAW, in the assistant's own words. Character-for-character focus.py's
     LINES["ears_off"], and test_eyes.py compares the two strings rather than trusting
     this comment: the server says it when the eyes open with the mic off, this page
     says it when the session asks a question it cannot hear, and one law said two
     different ways is two laws. */
  const EARS_OFF_LINE = 'My ears are off, sir - tap the ear button and just talk.';

  /* The ear button, and the ONLY caller of startListening() in this page. Grep for the
     other callers before changing that: there are none, and the eyes organ above is
     written the way it is - reporting `ears` rather than opening them - so that there
     can go on being none. An organ may open the conversation; it may never open the
     microphone. */
  $('mic').onclick = function () {
    unlockAudio();
    if (listening) { stopListening(); idleStatus(); }
    else startListening();
  };

  /* The ear button says which state it is in, and tells the EYES about it - they
     report the ear state with every posture, and the moment it changes is worth
     saying at once rather than at the next heartbeat. Called from the recogniser's
     own events rather than from the click, because the microphone opens when the
     browser says it did, not when we asked. */
  function paintEars() {
    if (!Recogniser) return;
    $('mic').title = listening ? 'Close your ears (stop listening)' : EAR_TITLE;
    if (eyesLive()) eyeReport('posture');
  }
  if (!Recogniser) {
    $('mic').disabled = true;
    $('mic').title = 'This browser has no webkitSpeechRecognition (use Chrome or Edge)';
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (listening || (canSpeak && speechSynthesis.speaking)) interrupt('escape');
  });

  if (canSpeak) {
    refreshVoice();
    speechSynthesis.addEventListener('voiceschanged', refreshVoice);
  }
  idleStatus();

  /* ---- the butler's opening line ----
     Wording comes from the persona block in server.py; the note count comes from
     the graph data and the time of day from this machine's clock, so neither is
     ever hardcoded here. It is shown at once and spoken on the first click, and
     it never touches the camera - it is a greeting, not an answer. */
  const GREETING_FALLBACK = {
    morning: 'Good morning', afternoon: 'Good afternoon', evening: 'Good evening',
    template: '{salutation}, sir. {notes} indexed, all present and accounted for.',
    one: '1 note', many: '{n} notes',
    empty: '{salutation}, sir. Not a single note indexed.'
  };
  function salutationFor(hour) {
    if (hour >= 5 && hour < 12) return 'morning';
    if (hour >= 12 && hour < 17) return 'afternoon';
    return 'evening';            // the small hours count as the tail of the evening
  }
  async function bootGreeting() {
    let g = GREETING_FALLBACK;
    try {
      const res = await fetch('/persona');
      const data = await res.json();
      if (data && data.greeting && data.greeting.template) g = data.greeting;
    } catch (e) { /* wording falls back; the count never does */ }

    const n = nodes.length;                       // straight from graph-data.js
    const salutation = g[salutationFor(new Date().getHours())] || 'Good evening';
    const template = n ? (g.template || GREETING_FALLBACK.template)
                       : (g.empty || GREETING_FALLBACK.empty);
    const count = (n === 1) ? (g.one || '1 note')
                            : String(g.many || '{n} notes').replace('{n}', n);
    const line = String(template)
      .replace('{salutation}', salutation)
      .replace('{notes}', count);

    renderAnswer('', line, false, null);          // no ids, so the graph is untouched
    if (!speak(line)) idleStatus();               // held until the first click
  }
  bootGreeting();
  refreshBrain();          // the chip shows the real brain from the first moment
  /* Read the session before opening the stream, so a tab that loads into a session
     already in progress shows the right countdown on its first frame rather than
     after the first push - and adopts the say-sequence before any of it is spoken. */
  fxFetch(document.hasFocus()).then(fxConnect);

  setTimeout(function () { $('boot').classList.add('gone'); }, 450);

  /* A small handle for the console (and for automated checks). */
  window.__galaxy = {
    Graph: Graph, nodes: nodes, allLinks: allLinks, strongLinks: strongLinks,
    focus: focusNode, ask: ask, colorOf: colorOf,
    get active() { return activeLinks; },
    get selected() { return selected; },
    capture: {
      PULSE_MS: PULSE_MS,
      isCapture: function (s) { return CAPTURE_RE.test(s); },
      send: capture,
      get groups() { return groups.slice(); },
      get lastBirth() { return lastBirth; },
      get pulsing() { return pulseId; },
      get pulseAmt() { return +pulseAmt.toFixed(3); }
    },
    brain: {
      isSwap: isSwap, send: swapBrain, refresh: refreshBrain,
      /* What the SERVER last said is answering. If this and the chip ever disagree,
         the chip is lying about which brain you are talking to. */
      get state() { return brain; },
      get chip() { return $('brain-label').textContent; },
      get swappedStyle() { return $('brainchip').classList.contains('swapped'); },
      get tip() { return $('brainchip').title; },
      /* The button door, exactly as a hand uses it: open the menu, then click a row.
         Nothing here posts anything itself - a test that bypassed the click would be
         testing a function rather than a button. */
      menu: toggleBrainMenu,
      load: loadBrains,
      get menuOpen() { return brainMenuOpen(); },
      get rows() {
        return Array.prototype.map.call($('brainmenu').querySelectorAll('button'),
                                        function (b) { return b.textContent; });
      },
      click: function (label) {
        const rows = $('brainmenu').querySelectorAll('button');
        for (let i = 0; i < rows.length; i++) {
          if (rows[i].textContent.toLowerCase().indexOf(String(label).toLowerCase())
              >= 0) { rows[i].click(); return rows[i].textContent; }
        }
        return null;
      }
    },
    sight: {
      FRAME_TYPE: FRAME_TYPE, FRAME_MAX_EDGE: FRAME_MAX_EDGE,
      SHARE_MEMORY_MS: SHARE_MEMORY_MS,
      start: startShare, stop: endShare, see: see, grab: grabFrame,
      isScreenish: function (s) { return SCREEN_RE.test(s); },
      get supported() { return canShare; },
      /* Straight off the track, like the indicator: if this and the red chip ever
         disagree, the indicator is lying about a live share. */
      get sharing() { return sharing(); },
      get indicator() { return $('sharing').classList.contains('live'); },
      get endedAt() { return shareEndedAt; },
      get lastSent() { return lastSight; },
      get proofShown() { return $('a-saw').classList.contains('show'); }
    },
    eyes: {
      EYE_READ_MS: EYE_READ_MS, EYE_BEAT_MS: EYE_BEAT_MS,
      EYE_CALIBRATE_MIN: EYE_CALIBRATE_MIN,
      /* The geometry, exported whole. It is pure - landmarks in, numbers out, no DOM,
         no clock, no camera - so it can be checked against landmarks nobody had to
         pose for. */
      POSTURE: POSTURE,
      start: startEyes,
      stop: function () { return stopEyes('off'); },
      /* The seam. feed() is how the camera's landmarks get in, and therefore how
         recorded landmarks get in too: everything downstream of it - the baseline, the
         sustain, the report, the nudge - is the same code the camera drives. */
      feed: eyeFeed, report: eyeReport, look: lookAtMe,
      isLook: function (s) { return LOOK_RE.test(s); },
      /* The server's windows, as this page last received them. If these and
         focus.EYES.tuning() ever disagree, this page is applying a stale rule. */
      get tuning() { return Object.assign({}, EYE_TUNE); },
      get supported() { return canSee; },
      /* Straight off the track, like the share chip: if this and the violet chip
         disagree, the chip is lying about an open camera. */
      get on() { return eyesLive(); },
      get indicator() { return $('eyeing').classList.contains('live'); },
      get reader() { return camReader ? camReader.from + ' · ' + camReader.delegate : null; },
      get trouble() { return eyeTrouble; },
      /* YOUR measured neutral posture, and the last reading against it. Numbers about
         a body, which is exactly why they stop here: nothing in eyeReport() sends
         them, and there is no field in POST /eyes that could carry them. */
      get base() { return eyeBase ? Object.assign({}, eyeBase) : null; },
      get raw() { return eyeRaw; },
      get stable() { return Object.assign({}, eyeStable); },
      get lastPost() { return eyeLastPost; },
      get lastLook() { return lastLook; },
      get looks() { return eyeLooks; },
      get proofShown() { return $('a-saw').classList.contains('show'); }
    },
    watch: {
      /* The diff, exported whole and pure: grey numbers in, a verdict out. No DOM, no
         clock, no share. Checkable against synthetic screens - a clock ticking in one
         corner, a window opening - that nobody had to sit in front of. */
      DIFF: WATCH_DIFF,
      start: startWatch, stop: function () { return stopWatch('said'); },
      /* The seam, as feed() is for the eyes: one tick of the loop, driven by hand.
         Everything downstream of it - the clock, the threshold, the nudge - is the
         same code the five-second timer drives. */
      tick: watchTick, feed: watchFeed, nudge: nudgeNow, thumb: watchThumbNow,
      isWatch: function (s) { return WATCH_RE.test(s); },
      isWatchOff: function (s) { return WATCH_OFF_RE.test(s); },
      /* The server's windows, as this page last received them. If these and
         server.WATCH.tuning() ever disagree, this page is applying a stale rule. */
      get tuning() { return Object.assign({}, WATCH_TUNE); },
      get on() { return watchOn; },
      get indicator() { return $('watching').classList.contains('live'); },
      /* What the TRACK says it is, not what we asked for: 'monitor' is the only
         surface this organ will watch, and the trap turns on this one string. */
      get surface() { return watchSurface; },
      get trouble() { return watchTrouble; },
      /* Whether the share is this organ's to close. A share you started yourself
         survives the watch stopping; one the watch opened does not. */
      get ownsShare() { return watchOpenedShare; },
      /* The stillness clock, in seconds. Reset by pixels alone. */
      get stillS() { return Math.round(watchStillMs() / 1000); },
      get ticks() { return watchTicks; },
      get changes() { return watchChanges; },
      get nudges() { return watchNudges; },
      get held() { return watchBusyHold; },
      get lastDiff() { return watchLastDiff; },
      get lastNudge() { return watchLastNudge; },
      /* Whether the face is off the page and on the desktop, and whether the in-page
         fallback card is showing instead. Exactly one of these should be true while
         the watch is running. */
      get facePinned() { return !!faceWin; },
      get faceCard() { return $('facecard').classList.contains('show'); },
      get canPin() { return canPin; },
      pin: openFace
    },
    /* Named `session` rather than `focus`, because __galaxy.focus is the camera's
       focusNode and renaming that would break every check written against it. */
    session: {
      FOCUS_DEFAULT_MIN: FOCUS_DEFAULT_MIN, FOCUS_PAINT_MS: FOCUS_PAINT_MS,
      FOCUS_HOME_BEAT_MS: FOCUS_HOME_BEAT_MS,
      FOCUS_ANSWER_MS: FOCUS_ANSWER_MS,
      isFocusPhrase: isFocusPhrase, send: fxSend, poll: fxFetch,
      start: function (m) { return fxSend({ cmd: 'start', minutes: m || FOCUS_DEFAULT_MIN }); },
      end: function () { return fxSend({ cmd: 'finish' }); },
      /* The answer window, for tests and for anyone wondering why the microphone
         opened. answer() is exactly the call flushThought() makes while it is armed.
         The window belongs to the MICROPHONE on purpose: it was opened by a spoken
         question, so it closes on a spoken answer. Typing during it is an ordinary
         question, because a sentence you typed at an arbitrary moment is not
         self-evidently the answer to something asked fifteen seconds ago. */
      answer: fxAnswer,
      get answerArmed() { return fxAnswerArmed(); },
      get deferred() { return !!(fx && fx.deferred); },
      get intent() { return (fx && fx.intent) || ''; },
      /* The whole of what this page knows. No key in it holds an app name or a site -
         see test_focus_privacy.py, which proves there cannot be one. A callout may
         name a place inside its sentence for the one tick before the server scrubs
         the line; that is the only place a name ever appears, here or anywhere. */
      get state() { return fx; },
      get live() { return fxLive(); },
      get card() { return $('focuscard').className; },
      get clock() { return $('focus-clock').textContent; },
      get mode() { return $('focus-mode').textContent; },
      /* Highest say-seq already out of the speakers. If this ever went backwards a
         reload would repeat a callout. */
      get spokenSeq() { return fxSpoken; },
      get streaming() { return !!fxStream && fxStream.readyState === 1; },
      get polling() { return !!fxPoll; }
    },
    camera: {
      CLUSTER_MIN: CLUSTER_MIN, SPOKEN_MAX_CHARS: SPOKEN_MAX_CHARS,
      decide: decideCamera, localKind: localKind, spokenForm: spokenForm,
      get lastPlan() { return lastPlan; },
      get lit() { return Array.from(hiNodes); },
      get flights() { return flights; },
      /* what the idle orbit circles around. If this and target() disagree, the
         orbit is about to drag the view off whatever we just flew to. */
      get viewTarget() { return viewTarget; },
      get autoRotate() { return autoRotate; },
      /* the look-at point: idle rotation orbits around it and never changes it,
         so if this moved, the camera was genuinely dragged to a node */
      get target() {
        const t = (Graph.controls() && Graph.controls().target) || { x: 0, y: 0, z: 0 };
        return { x: +t.x.toFixed(2), y: +t.y.toFixed(2), z: +t.z.toFixed(2) };
      }
    },
    speech: {
      FINISH_MS: FINISH_MS,
      interrupts: Array.from(INTERRUPTS),
      speak: speak, refreshVoice: refreshVoice, unlock: unlockAudio,
      start: startListening, stop: stopListening,
      feedFinal: heardFinal, feedInterim: heardInterim,
      /* The last six seconds of lines, and whether each reached the speakers. A muted
         tab records and does not speak, which is what makes a ?mute=1 tab checkable
         without making it audible. Older than that and it is gone - see noteSaid. */
      get said() { return saidLog(); },
      get muted() { return MUTED; },
      get unlocked() { return audioUnlocked; },
      get listening() { return listening; },
      get buffer() { return phraseBuffer; },
      get pending() { return pendingLine; },
      get voice() {
        return chosenVoice ? chosenVoice.name + ' (' + chosenVoice.lang + ')' : null;
      }
    }
  };
})();
</script>
</body>
</html>
