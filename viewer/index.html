    // heardFinal() clears lastInterim, so anything still sitting there arrived
    // after the last final and was never confirmed. Append it rather than lose
    // the tail of the sentence when the recogniser cuts out mid-phrase.
    let thought = (phraseBuffer + ' ' + lastInterim).trim().replace(/\s+/g, ' ');
    phraseBuffer = '';
    lastInterim = '';
    if (!thought) { idleStatus(); return; }
    stopListening();
    $('q').value = '';
    /* The answer window takes precedence over everything, and takes exactly one
       thought. A question the assistant just asked out loud is answered without a
       wake word; the sentence after this one is an ordinary question again. */
    if (fxAnswerArmed()) return fxAnswer(thought);
    ask(thought);                        // exactly the path a typed question takes
  }

  function interrupt(label) {
    clearTimeout(finishTimer);
    finishTimer = null;
    phraseBuffer = '';
    lastInterim = '';
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    /* "Stop" means stop, including the answer window. Leaving it armed would make
       the next unrelated sentence, whenever it came, the session's intent. */
    fxAnswerClose();
    /* And including a proposal. "stop", "cancel" and "never mind" are barked interrupts,
       so they never reach ask() - which would make them the three refusals that did not
       work. Here they refuse, properly, through the server. */
    if (proposal) refuseProposal('voice');
    stopListening();
    setStatus('', '“' + label + '” · stopped');
  }

  function buildRecogniser() {
    const r = new Recogniser();
    r.lang = 'en-GB';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onstart = function () {
      listening = true;
      $('mic').classList.add('on');
      paintEars();
      setStatus('listening', 'listening');
    };
    r.onresult = function (e) {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        const text = (res[0] && res[0].transcript) || '';
        if (res.isFinal) heardFinal(text); else interim += text;
      }
      if (interim.trim()) heardInterim(interim);
    };
    r.onerror = function (e) {
      listening = false;
      $('mic').classList.remove('on');
      paintEars();
      setStatus('', e.error === 'not-allowed' ? 'microphone permission denied'
              : e.error === 'no-speech' ? 'heard nothing · click the mic again'
              : 'microphone error · ' + e.error);
    };
    r.onend = function () {
      listening = false;
      $('mic').classList.remove('on');
      paintEars();
      // The service can cut out mid-thought; do not lose what was already said.
      if (phraseBuffer.trim() || lastInterim.trim()) flushThought();
      else idleStatus();
    };
    return r;
  }

  function startListening() {
    if (!Recogniser || listening) return;
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    phraseBuffer = '';
    lastInterim = '';
    if (!recogniser) recogniser = buildRecogniser();
    try { recogniser.start(); }
    catch (e) { setStatus('', 'microphone busy · click again'); }
  }

  function stopListening() {
    clearTimeout(finishTimer);
    finishTimer = null;
    if (recogniser && listening) { try { recogniser.stop(); } catch (e) { /* ignore */ } }
    listening = false;
    $('mic').classList.remove('on');
    paintEars();
  }

  const EAR_TITLE = 'Your ears · tap the ear button and just talk';

  /* THE EAR LAW, in the assistant's own words. Character-for-character focus.py's
     LINES["ears_off"], and test_eyes.py compares the two strings rather than trusting
     this comment: the server says it when the eyes open with the mic off, this page
     says it when the session asks a question it cannot hear, and one law said two
     different ways is two laws. */
  const EARS_OFF_LINE = 'My ears are off, sir - tap the ear button and just talk.';

  /* The ear button, and the ONLY caller of startListening() in this page. Grep for the
     other callers before changing that: there are none, and the eyes organ above is
     written the way it is - reporting `ears` rather than opening them - so that there
     can go on being none. An organ may open the conversation; it may never open the
     microphone. */
  $('mic').onclick = function () {
    unlockAudio();
    if (listening) { stopListening(); idleStatus(); }
    else startListening();
  };

  /* The ear button says which state it is in, and tells the EYES about it - they
     report the ear state with every posture, and the moment it changes is worth
     saying at once rather than at the next heartbeat. Called from the recogniser's
     own events rather than from the click, because the microphone opens when the
     browser says it did, not when we asked. */
  function paintEars() {
    if (!Recogniser) return;
    $('mic').title = listening ? 'Close your ears (stop listening)' : EAR_TITLE;
    if (eyesLive()) eyeReport('posture');
  }
  if (!Recogniser) {
    $('mic').disabled = true;
    $('mic').title = 'This browser has no webkitSpeechRecognition (use Chrome or Edge)';
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (listening || (canSpeak && speechSynthesis.speaking)) interrupt('escape');
  });

  if (canSpeak) {
    refreshVoice();
    speechSynthesis.addEventListener('voiceschanged', refreshVoice);
  }
  idleStatus();

  /* ---- the butler's opening line ----
     Wording comes from the persona block in server.py; the note count comes from
     the graph data and the time of day from this machine's clock, so neither is
     ever hardcoded here. It is shown at once and spoken on the first click, and
     it never touches the camera - it is a greeting, not an answer. */
  const GREETING_FALLBACK = {
    morning: 'Good morning', afternoon: 'Good afternoon', evening: 'Good evening',
    template: '{salutation}, sir. {notes} indexed, all present and accounted for.',
    one: '1 note', many: '{n} notes',
    empty: '{salutation}, sir. Not a single note indexed.'
  };
  function salutationFor(hour) {
    if (hour >= 5 && hour < 12) return 'morning';
    if (hour >= 12 && hour < 17) return 'afternoon';
    return 'evening';            // the small hours count as the tail of the evening
  }
  async function bootGreeting() {
    let g = GREETING_FALLBACK;
    try {
      const res = await fetch('/persona');
      const data = await res.json();
      if (data && data.greeting && data.greeting.template) g = data.greeting;
    } catch (e) { /* wording falls back; the count never does */ }

    const n = nodes.length;                       // straight from graph-data.js
    const salutation = g[salutationFor(new Date().getHours())] || 'Good evening';
    const template = n ? (g.template || GREETING_FALLBACK.template)
                       : (g.empty || GREETING_FALLBACK.empty);
    const count = (n === 1) ? (g.one || '1 note')
                            : String(g.many || '{n} notes').replace('{n}', n);
    const line = String(template)
      .replace('{salutation}', salutation)
      .replace('{notes}', count);

    renderAnswer('', line, false, null);          // no ids, so the graph is untouched
    if (!speak(line)) idleStatus();               // held until the first click
  }
  /* ==================================================================
     ?focusdebug=1  ·  THE OVERLAY
     ==================================================================
     Everything you would otherwise learn by adding a console.log, on the glass, once
     a second, while the thing you are debugging is happening. Two sources and it says
     which is which: the session flags are the SERVER's own state as this tab last
     received it, and the lock, the lanes and the foreground come from /focus/diag,
     read from the running process rather than worked out again here. A debug panel
     that recomputes what it is meant to be checking can only ever agree with itself.

     Off unless asked for. It reads and prints; it decides nothing, speaks nothing and
     sends nothing, so leaving it on costs a request a second and changes no
     behaviour. pointer-events are off so it cannot swallow a click either. */
  const DEBUG_ON = /(^|[?&])focusdebug=1(&|$)/.test(location.search);
  const PROBE_ON = /(^|[?&])focusprobe=1(&|$)/.test(location.search);
  const DEBUG_POLL_MS = 1000;
  const DEBUG_STALE_MS = 3500;   // older than this and the panel says so, in red
  let dbgBox = null, dbgDiag = null, dbgAt = 0, dbgTrouble = '';

  function dbgPanel(id, corner) {
    const box = document.createElement('div');
    box.id = id;
    box.style.cssText =
      'position:fixed;' + corner + ';z-index:9999;pointer-events:none;' +
      'font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;' +
      'background:rgba(6,10,16,.88);color:#cfe3ff;border:1px solid #23405f;' +
      'border-radius:6px;padding:8px 10px;max-width:390px;white-space:pre-wrap;' +
      'box-shadow:0 6px 24px rgba(0,0,0,.45)';
    document.body.appendChild(box);
    return box;
  }

  /* Only the flags that are TRUE, in a fixed order. A flag being absent is itself
     information, and a line of "false false false" is unreadable at a glance. */
  function dbgOn(pairs) {
    const on = pairs.filter(function (p) { return !!p[1]; })
                    .map(function (p) { return p[0]; });
    return on.length ? on.join(' · ') : '—';
  }

  function dbgRow(label, value, bad) {
    return '<span style="color:#6d8fb5">' + esc(label.padEnd(9)) + '</span>' +
           '<span style="color:' + (bad ? '#ff8e7a' : '#cfe3ff') + '">' +
           esc(value) + '</span>\n';
  }

  function dbgSpan(s) {
    return Math.floor(s / 60) + 'm' + String(Math.round(s % 60)).padStart(2, '0') + 's';
  }

  function fxDebugPaint() {
    if (!dbgBox) return;
    const d = dbgDiag;
    const age = dbgAt ? (performance.now() - dbgAt) : 0;
    const stale = !d || age > DEBUG_STALE_MS;
    let html = '<b style="color:#8fd0ff">focus debug</b>  ' +
               '<span style="color:#6d8fb5">?focusdebug=1</span>\n';
    if (!d) {
      html += dbgRow('diag', dbgTrouble || 'no answer yet', true);
    } else {
      /* THE PROCESS FIRST, and for the reason the route exists: a fresh interpreter
         passes every check while the long-lived one is frozen. If tickAgeS is not
         about one second, stop reading the rest - nothing below it is current. */
      html += dbgRow('process', 'pid ' + d.pid + ' · up ' + dbgSpan(d.uptimeS) +
                                ' · ticks ' + d.ticks + ' · v' + d.version);
      /* "not started" is not "DEAD". The thread is started by the first session and
         then lives for the process, so a fresh server with no session has never
         ticked and is perfectly healthy - and an instrument that shouts about that
         teaches you to ignore it on the day it means something. */
      const born = !d.tickAlive && d.ticks === 0 && !d.sessionOn;
      html += dbgRow('tick', born ? 'not started · no session yet, which is correct'
                                  : (d.tickAlive ? 'alive' : 'DEAD') +
                                    ' · last ' + d.tickAgeS + 's ago',
                     !born && (!d.tickAlive || d.tickAgeS > 5));
      html += dbgRow('lanes', 'app ' + d.appLane + ' · tab ' + d.tabLane +
                              ' · posture ' + d.postureLane,
                     d.appLane === 'off' || d.tabLane === 'off');
      html += dbgRow('lock', dbgOn([['session', d.sessionOn], ['locked', d.locked],
                                    ['app hash', d.appTarget],
                                    ['tab hash', d.tabTarget]]));
      html += dbgRow('deferred', (d.deferred ? 'YES' : 'no') +
                                 ' · settle ' + d.settleTicks + '/' + d.settleNeeded +
                                 (d.candidate ? ' · candidate' : '') +
                                 (d.deferred ? ' · arming ' + d.armingS + 's' : ''),
                     d.deferred);
      html += dbgRow('front', (d.appReadable ? 'readable' : 'UNREADABLE') +
                              ' · ' + (d.frontIsBrowser ? 'browser' : 'native app') +
                              ' · tab ' + d.tabRead +
                              ' · jarvis tab ' + (d.frontIsHome ? 'YES' : 'no'),
                     !d.appReadable);
      /* DISAGREE is the stale-tick alarm, and it is only meaningful while a session is
         LIVE: once sessionOn goes false the diag zeroes its whole session block on
         purpose, so a fresh read that still sees your work would shout about a
         disagreement with a session that has already ended. */
      const cmp = d.sessionOn && d.readerOnTarget !== d.sessionOnTarget;
      html += dbgRow('reader', 'on target ' + (d.readerOnTarget ? 'yes' : 'no') +
                               (d.sessionOn
                                  ? ' · session says ' +
                                    (d.sessionOnTarget ? 'yes' : 'no') +
                                    (cmp ? ' · DISAGREE' : '')
                                  : ' · no session to compare with'),
                     cmp);
      html += dbgRow('cdp', (d.cdpAlive ? 'reachable' : 'no endpoint · app-only lock') +
                            ' · ' + d.backend, !d.cdpAlive);
      if (stale) html += dbgRow('diag', 'STALE ' + Math.round(age / 1000) + 's' +
                                        (dbgTrouble ? ' · ' + dbgTrouble : ''), true);
    }
    /* The session flags, straight off the last push. Never recomputed here. */
    if (!fx) {
      html += dbgRow('session', 'nothing pushed yet');
    } else {
      html += dbgRow('session', fx.state + ' · seq ' + fx.seq +
                                ' · clean ' + fx.cleanPct + '%');
      html += dbgRow('flags', dbgOn([
        ['onTarget', fx.onTarget], ['drifting', fx.drifting], ['grace', fx.inGrace],
        ['home', fx.atHome], ['posture', fx.postureDrift], ['excused', fx.excused],
        ['snoozed', fx.snoozed], ['blind', !fx.readable], ['deferred', fx.deferred],
        ['tab', fx.tabWatched], ['drill', fx.drill], ['eyes', fx.eyesOn],
        ['hushed', fx.hushed]]));
      html += dbgRow('drift', 'drifts ' + fx.drifts + ' · adrift ' +
                              fxSecs(fx.driftS) + ' · tier ' + fx.tier +
                              ' · excused ' + fxSecs(fx.excusedS) +
                              ' · unseen ' + fxSecs(fx.unknownS));
      html += dbgRow('intent', (fx.awaitingIntent ? 'WINDOW OPEN' : 'window closed') +
                               ' · ' + (fx.intent ? 'answered' : 'not answered'));
    }
    /* THE PIXELS. The last verdict the watch reached and the two thresholds it was
       judged against, because "the nudge never fires" and "the nudge fires all the
       time" are the same bug seen from either side of this number. */
    const v = watchLastDiff;
    html += dbgRow('pixels', !v
      ? (watchOn ? 'watching · no frame compared yet' : 'watch off')
      : v.fraction + ' vs gate ' + WATCH_TUNE.changedFraction +
        ' → ' + (v.changed ? 'CHANGED' : 'still') +
        ' · cells ' + v.cells + '/' + v.total + ' · worst ' + v.worst +
        ' (delta ' + WATCH_TUNE.cellDelta + ')');
    if (watchOn) {
      html += dbgRow('still', Math.round(watchStillMs() / 1000) +
                              's of ' + WATCH_TUNE.stillS +
                              's · ticks ' + watchTicks + ' · nudges ' + watchNudges +
                              (watchTrouble ? ' · ' + watchTrouble : ''));
    }
    dbgBox.innerHTML = html;
  }

  async function fxDebugPoll() {
    try {
      const res = await fetch('/focus/diag');
      const data = await res.json();
      if (data && data.diag) { dbgDiag = data.diag; dbgAt = performance.now(); }
      dbgTrouble = (data && data.diag) ? '' : 'no diag in the reply';
    } catch (e) {
      dbgTrouble = 'unreachable: ' + (e && e.message ? e.message : e);
    }
    fxDebugPaint();
  }

  function fxDebugStart() {
    dbgBox = dbgPanel('focusdebug', 'left:12px;bottom:12px');
    fxDebugPaint();
    fxDebugPoll();
    setInterval(fxDebugPoll, DEBUG_POLL_MS);
    /* Repainted between polls as well, so the numbers that move locally - the
       stillness clock, the interpolated countdown - are not a second stale. */
    setInterval(fxDebugPaint, 250);
  }

  /* ==================================================================
     ?focusprobe=1  ·  THE PROBE PAGE
     ==================================================================
     The hermetic battery, run in a real browser, with the verdict written into
     document.title so a script can read it without a debugger attached.

     HERMETIC means it talks to nothing: no server, no model, no camera, no share.
     Every case below is this page's own logic fed inputs chosen here - the card's
     tone mapping, the clock formatter, the pixel gate, the phrase matchers - so a
     failure is this page being wrong and nothing else. The page is detached from the
     server before the first case runs, because a push landing mid-battery would
     repaint the card under an assertion about it, and the fetch counter proves the
     detachment held: case `hermetic` fails if anything went out on the wire.

     Two of the cases exist to catch the environment lying rather than the code:
     `viewport` asserts 1440 by 900, and `timers` asserts that a 250 ms timeout
     actually took about 250 ms. A hidden or minimised tab is throttled hard, which
     makes every time-based check quietly pass or quietly fail for reasons that have
     nothing to do with the feature - so the probe says so in the title instead. */
  const PROBE_W = 1440, PROBE_H = 900;
  const probeCases = [];
  let probeDone = false, probeFetches = 0, probeBox = null;
  let probeChain = Promise.resolve();    // runs queue rather than interleave; see fxProbeRun

  function probeState(over) {
    /* A whole server state, shaped exactly like focus.public_state() - and with an
       empty say queue, so applying it speaks nothing and the battery is silent. */
    return Object.assign({
      state: 'running', plannedS: 1800, elapsedS: 300, remainingS: 1500,
      onTargetS: 280, driftS: 20, homeS: 0, excusedS: 0, unknownS: 0,
      drifts: 1, tier: 1, onTarget: true, drifting: false, inGrace: false,
      atHome: false, excused: false, snoozed: false, snoozeLeftS: 0, nagS: 45,
      drill: false, appWatched: true, tabWatched: true, readable: true,
      locked: true, deferred: false, awaitingIntent: false, intent: '',
      cleanPct: 93, streak: 2, bestStreak: 5, sessions: 9, endedReason: '',
      report: '', seq: 0, say: [], eyesOn: false, present: false, headDown: false,
      slouched: false, postureDrift: false, hushed: false, hushLeftS: 0, nudges: 0
    }, over || {});
  }

  function probeCard(over) {
    fxApply(probeState(over));
    return { card: $('focuscard').className,
             state: $('focus-state').textContent,
             mode: $('focus-mode').textContent };
  }

  /* One synthetic screen: a grey field, with `cells` of it moved by `delta`. Two
     numbers in, a verdict out - which is the whole of what the watch decides on. */
  function probeThumb(base, cells, delta) {
    const n = WATCH_TUNE.thumbW * WATCH_TUNE.thumbH;
    const out = new Uint8ClampedArray(n);
    for (let i = 0; i < n; i++) out[i] = base + (i < cells ? delta : 0);
    return out;
  }

  async function probeRun(name, fn) {
    let ok = false, detail = '';
    try {
      const got = await fn();
      if (got && typeof got === 'object') { ok = !!got.ok; detail = got.detail || ''; }
      else { ok = !!got; }
    } catch (e) {
      ok = false;
      detail = 'threw: ' + (e && e.message ? e.message : e);
    }
    probeCases.push({ name: name, ok: ok, detail: String(detail) });
    probePaint();
  }

  function probeVerdict() {
    const pass = probeCases.filter(function (c) { return c.ok; }).length;
    return { pass: pass, total: probeCases.length,
             failed: probeCases.filter(function (c) { return !c.ok; })
                               .map(function (c) { return c.name; }) };
  }

  function probePaint() {
    const v = probeVerdict();
    /* THE TITLE, and the contract a script reads: the word after the count is the
       whole verdict, and every case is named with its own PASS or FAIL after it.
       PENDING while the battery is still running, so a script that reads too early
       cannot mistake a partial pass for a finished one. */
    document.title = 'PROBE ' + v.pass + '/' + v.total + ' ' +
      (!probeDone ? 'PENDING' : v.failed.length ? 'FAIL' : 'PASS') + ' · ' +
      probeCases.map(function (c) {
        return c.name + ':' + (c.ok ? 'PASS' : 'FAIL');
      }).join(' ');
    if (!probeBox) probeBox = dbgPanel('focusprobe', 'left:12px;top:12px');
    probeBox.innerHTML =
      '<b style="color:#8fd0ff">focus probe</b>  ' +
      '<span style="color:#6d8fb5">?focusprobe=1 · hermetic · detached</span>\n' +
      dbgRow('verdict', v.pass + '/' + v.total + ' ' +
                        (!probeDone ? 'running' : v.failed.length ? 'FAIL' : 'PASS'),
             probeDone && v.failed.length > 0) +
      '\n' + probeCases.map(function (c) {
        return '<span style="color:' + (c.ok ? '#7fd39b' : '#ff8e7a') + '">' +
               (c.ok ? 'PASS ' : 'FAIL ') + '</span>' + esc(c.name.padEnd(10)) +
               '<span style="color:#6d8fb5">' + esc(c.detail) + '</span>';
      }).join('\n');
  }

  async function fxProbeOnce() {
    probeCases.length = 0;
    probeDone = false;
    probeRunning = true;
    const realFetch = window.fetch;
    window.fetch = function () {
      probeFetches++;                       // counted, then allowed: the case that
      return realFetch.apply(window, arguments);   // reports it must not also hide it
    };
    const startedFetches = probeFetches;

    await probeRun('viewport', function () {
      return { ok: innerWidth === PROBE_W && innerHeight === PROBE_H,
               detail: innerWidth + 'x' + innerHeight + ' (want ' + PROBE_W + 'x' +
                       PROBE_H + ')' };
    });
    await probeRun('visible', function () {
      /* A hidden tab throttles every timer on this page, so this is not a nicety:
         without it the two timing cases below are measuring the browser's power
         saving rather than anything in this file. */
      return { ok: document.visibilityState === 'visible',
               detail: document.visibilityState +
                       (document.hasFocus() ? ' · focused' : ' · not focused') };
    });
    await probeRun('timers', async function () {
      const t0 = performance.now();
      await new Promise(function (r) { setTimeout(r, 250); });
      const dt = Math.round(performance.now() - t0);
      return { ok: dt >= 240 && dt < 600, detail: dt + 'ms for a 250ms timeout' };
    });
    await probeRun('frames', async function () {
      const t0 = performance.now();
      const dt = await new Promise(function (r) {
        const bail = setTimeout(function () { r(9999); }, 900);
        requestAnimationFrame(function () {
          clearTimeout(bail);
          r(Math.round(performance.now() - t0));
        });
      });
      return { ok: dt < 200, detail: dt + 'ms to the next frame' };
    });
    await probeRun('clock', function () {
      const got = [fxSecs(0), fxSecs(9), fxSecs(61), fxSecs(599.6), fxSecs(3600)];
      return { ok: got.join(' ') === '0:00 0:09 1:01 10:00 60:00',
               detail: got.join(' ') };
    });
    await probeRun('phrases', function () {
      const yes = isFocusPhrase('start a focus session for twenty five minutes');
      const no = isFocusPhrase('what did I write about focus in my notes');
      return { ok: yes && !no, detail: 'start=' + yes + ' question=' + no };
    });
    await probeRun('card-on', function () {
      const c = probeCard({});
      return { ok: c.card === 'live' && c.state === 'on target' &&
                   c.mode === 'app + site',
               detail: c.card + ' / ' + c.state + ' / ' + c.mode };
    });
    await probeRun('card-drift', function () {
      const c = probeCard({ onTarget: false, drifting: true, drifts: 3 });
      return { ok: /\bdrift\b/.test(c.card) && c.state === 'off target',
               detail: c.card + ' / ' + c.state };
    });
    await probeRun('card-defer', function () {
      const c = probeCard({ state: 'arming', deferred: true, locked: false,
                            appWatched: false, tabWatched: false,
                            awaitingIntent: true });
      return { ok: /\bdeferred\b/.test(c.card) && c.state === 'not locked on yet' &&
                   c.mode === 'go to your work · listening',
               detail: c.card + ' / ' + c.state + ' / ' + c.mode };
    });
    await probeRun('card-blind', function () {
      const c = probeCard({ onTarget: false, readable: false });
      return { ok: /\bblind\b/.test(c.card) && c.state === 'cannot see',
               detail: c.card + ' / ' + c.state };
    });
    await probeRun('card-phone', function () {
      /* The eyes' verdict outranks a blind window reader: a head-down drift is
         something the server DID see, just not on the glass. */
      const c = probeCard({ onTarget: false, drifting: true, postureDrift: true,
                            readable: false, eyesOn: true, headDown: true });
      return { ok: c.state === 'head down', detail: c.card + ' / ' + c.state };
    });
    await probeRun('gate', function () {
      const base = probeThumb(90, 0, 0);
      const same = WATCH_DIFF.diff(base, probeThumb(90, 0, 0), WATCH_TUNE);
      const noise = WATCH_DIFF.diff(base, probeThumb(90, 400, 4), WATCH_TUNE);
      const clockCorner = WATCH_DIFF.diff(base, probeThumb(90, 4, 90), WATCH_TUNE);
      const window_ = WATCH_DIFF.diff(base, probeThumb(90, 300, 90), WATCH_TUNE);
      const odd = WATCH_DIFF.diff(base, new Uint8ClampedArray(4), WATCH_TUNE);
      return { ok: !same.changed && !noise.changed && !clockCorner.changed &&
                   window_.changed && !odd.comparable && odd.changed,
               detail: 'same=' + same.changed + ' noise=' + noise.changed +
                       ' clock=' + clockCorner.fraction + ' window=' +
                       window_.fraction + ' gate=' + WATCH_TUNE.changedFraction };
    });
    await probeRun('luma', function () {
      const grey = WATCH_DIFF.luma(new Uint8ClampedArray(
        [255, 255, 255, 255, 0, 0, 0, 255, 255, 0, 0, 255]));
      return { ok: grey.length === 3 && grey[0] === 255 && grey[1] === 0 &&
                   grey[2] === 76,
               detail: Array.from(grey).join(',') };
    });
    await probeRun('seq', function () {
      /* A server that restarted counts from a lower seq. Re-basing on it is what
         stops a rejoin from replaying the last five minutes of being told off. */
      const before = fxSpoken;
      /* Adopted, not replayed, both times - which is what a rejoining tab does and
         is also what keeps this case silent: fxAbsorb returns before the voice. */
      fxAdopted = false;
      fxApply(probeState({ seq: 400, say: [{ seq: 400, kind: 'note', text: 'x' }] }));
      const high = fxSpoken;
      fxAdopted = false;
      fxApply(probeState({ seq: 2, say: [{ seq: 2, kind: 'note', text: 'y' }] }));
      return { ok: high === 400 && fxSpoken === 2,
               detail: before + ' → ' + high + ' → ' + fxSpoken };
    });
    await probeRun('no-names', function () {
      /* The browser's half of the privacy promise: there is no key in the state a
         name could be in, and nothing on the card looks like a host or a binary. */
      const state = probeState({});
      const keys = Object.keys(state).filter(function (k) {
        return /^(app|host|site|url|title|label|window|process)$/i.test(k);
      });
      const text = $('focus-state').textContent + ' ' + $('focus-mode').textContent +
                   ' ' + $('focus-clock').textContent;
      const looksLikeOne = /\.(com|net|org|io|exe|app)\b/i.test(text);
      return { ok: !keys.length && !looksLikeOne,
               detail: 'keys=' + JSON.stringify(keys) + ' card="' + text + '"' };
    });
    await probeRun('web-cue', function () {
      /* THE OTHER WORLD, proved without a network: hand the renderer a web answer and
         check that the page says web everywhere it should and note nowhere at all.
         The camera must hold, the card must say "According to" rather than "Drawn
         from", the chips and the panel must be real anchors to the real addresses, and
         nothing in the panel may look like a file on this disk. */
      const sources = [
        { title: 'Tokyo Population 2026', url: 'https://worldpopulationreview.com/cities/japan/tokyo' },
        { title: 'Demographics of Tokyo - Wikipedia', url: 'https://en.wikipedia.org/wiki/Demographics_of_Tokyo' }
      ];
      renderAnswer('probe: population of tokyo', 'According to current web sources, x.',
                   false, [], sources);
      openSources('probe: population of tokyo', sources, 'ddg-lite');
      const label = $('a-src').querySelector('.lbl').textContent;
      const chips = Array.from($('a-chips').children);
      const links = Array.from($('p-neighbours').children);
      const hrefs = links.map(function (a) { return a.getAttribute('href'); });
      const shown = $('p-neighbours').textContent;
      const meta = $('p-meta').textContent;
      const held = decideCamera('web', [], false) === 'hold';
      const anchors = chips.every(function (a) { return a.tagName === 'A'; }) &&
                      links.every(function (a) { return a.tagName === 'A'; });
      const blank = links.every(function (a) {
        return a.target === '_blank' && /noopener/.test(a.rel) && /noreferrer/.test(a.rel);
      });
      /* No .md, no notes/ folder, no drive letter: a web answer must not be able to
         show a local path anywhere, and the panel is where one would leak from. The
         patterns are anchored to a word start on purpose - "https://" ends in a colon
         and a slash, and an unanchored drive-letter test matches every URL on earth,
         which is a check that fails for a reason that has nothing to do with paths. */
      const localPath = /\.md\b|(?:^|\s)notes[\\/]|(?:^|\s)[A-Za-z]:[\\/]/
        .test(shown + ' ' + meta);
      const ok = held && label === 'According to' && chips.length === 2 &&
                 links.length === 2 && anchors && blank && !localPath &&
                 hrefs[0] === sources[0].url && hrefs[1] === sources[1].url &&
                 shown.indexOf(sources[0].url) !== -1 &&
                 $('panel').classList.contains('web') &&
                 $('answer').classList.contains('web');
      return { ok: ok, detail: 'label="' + label + '" chips=' + chips.length +
                              ' links=' + links.length + ' anchors=' + anchors +
                              ' blank=' + blank + ' hold=' + held +
                              ' localPath=' + localPath };
    });
    await probeRun('web-safe', function () {
      /* A URL that is not http(s) is not a source. It becomes dead text rather than a
         click, here as well as on the server, because two cheap checks are worth less
         than one leaked javascript: link. The pulse is also checked to have a colour of
         its own: gold-and-folder means the notes, cyan means the web, and if WEB_CYAN
         ever drifted into PALETTE the whole cue would stop meaning anything. */
      const bad = [{ title: 'nope', url: 'javascript:alert(1)' },
                   { title: 'also nope', url: 'notes/pricing.md' },
                   { title: 'fine', url: 'https://example.org/real' }];
      openSources('probe: dodgy sources', bad, 'ddg-lite');
      const links = Array.from($('p-neighbours').children);
      const clean = links.length === 1 && links[0].tagName === 'A' &&
                    links[0].getAttribute('href') === 'https://example.org/real';
      const rejects = !safeUrl('javascript:alert(1)') && !safeUrl('notes/pricing.md') &&
                      !safeUrl('') && !safeUrl(null) && !!safeUrl('https://a.example/b');
      const unique = PALETTE.indexOf(WEB_CYAN) === -1;
      const washed = washTo('#000000', WEB_CYAN, 1) === 'rgba(34,224,255,1)' &&
                     washTo('rgba(10,20,30,0.5)', WEB_CYAN, 0) === 'rgba(10,20,30,0.5)';
      return { ok: clean && rejects && unique && washed,
               detail: 'kept=' + links.length + ' rejects=' + rejects +
                       ' unique=' + unique + ' wash=' + washed };
    });
    await probeRun('desk-move', function () {
      /* THE SECOND HOME, proved without a Document PiP window - because a PiP window
         needs a user gesture, and a battery that needs somebody to click something is
         not a battery. An iframe's document is a different document in exactly the way
         that matters here: the page's getElementById cannot see into it, and adopting a
         node into it is the same DOM operation against the same deskAdopt().
         What is being proved is that the card MOVES rather than being rebuilt - same
         element, same button handler object - because everything the feature promises
         rests on that: the SSE paint, the three clock buttons and the lock pill keep
         working precisely because they were never re-created. */
      const card0 = $('focuscard');
      const home = { parent: card0.parentNode, next: card0.nextSibling };
      const pill = $('focus-lock'), handler = pill.onclick;
      const frame = document.createElement('iframe');
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + DESK_W +
                            'px;height:' + DESK_H + 'px;border:0';
      document.body.appendChild(frame);
      const doc = frame.contentDocument;
      const adopted = deskAdopt(doc);
      /* One card, two homes, never both: the page must no longer hold one, and the
         lookup must find the one that left. */
      const gone = !document.getElementById('focuscard');
      const moved = $('focuscard') === card0 && card0.ownerDocument === doc;
      const same = $('focus-lock') === pill && $('focus-lock').onclick === handler;
      /* The live paint, landing in the other document. A drifting state, so the tone
         class that tints the whole desktop window is what gets checked. */
      const painted = probeCard({ remainingS: 754, drifting: true, onTarget: false });
      const clock = $('focus-clock').textContent;
      const tinted = /\blive\b/.test(painted.card) && /\bdrift\b/.test(painted.card);
      /* The lane closed up behind it: deskAdopt() ends by calling the governor, and with
         no card in the page the legend goes back to the first slot rather than ducking a
         measurement taken in another window. */
      const legend = $('legend').style.top === LAYOUT.TOP + 'px';
      const back = deskRestore();
      const returned = $('focuscard') === card0 && deskDoc === null &&
                       card0.parentNode === home.parent &&
                       card0.nextSibling === home.next &&
                       document.getElementById('focuscard') === card0;
      frame.remove();
      return { ok: adopted && gone && moved && same && back && returned && legend &&
                   tinted && clock === '12:34',
               detail: 'moved=' + moved + ' page-empty=' + gone + ' handler=' + same +
                       ' painted=' + clock + ' tone="' + painted.card + '"' +
                       ' home=' + returned };
    });
    await probeRun('desk-skin', function () {
      /* THE NAKED CARD and THE INVISIBLE CARD, the two ways this feature fails while
         appearing to work. A card appended to a fresh document without the page's
         stylesheets is unstyled text on white; and every rule that hides #focuscard -
         DESK_CSS's own display:none for an organ that is not live, and the governor's
         `nofit` class, which the page may have left on it - hides it just as
         effectively out here, where there is nothing else in the window to notice is
         missing. Both are asserted through real computed style in a real 320px-wide
         document rather than by reading the CSS strings, because what is in DESK_CSS is
         not the question - what the cascade does with it is. */
      const frame = document.createElement('iframe');
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + DESK_W +
                            'px;height:' + DESK_H + 'px;border:0';
      document.body.appendChild(frame);
      const doc = frame.contentDocument;
      deskAdopt(doc);
      const view = frame.contentWindow;
      const card = doc.getElementById('focuscard');
      /* Live, said explicitly rather than inherited from whatever the previous case left
         on the element: the shell shows only live organs, so a card without the class is
         correctly invisible and this case would be measuring the wrong thing. */
      card.classList.add('live');
      /* SNAPSHOT, not the live object. getComputedStyle hands back a view that keeps
         answering about wherever the element is NOW, so reading it after deskRestore()
         below describes the card sitting back in the page - which is how this case
         first shipped a PASS whose own detail line quoted the page's numbers. Copy the
         five strings out while the card is still where the question is about. */
      const got = function (el, prop) { return String(view.getComputedStyle(el)[prop]); };
      const seen = {
        display: got(card, 'display'),           // beat the 720px rule
        position: got(card, 'position'),         // not pinned 22px from an edge
        bar: got(card, 'borderTopWidth'),        // the tone's colour, as a top bar
        size: got(doc.getElementById('focus-clock'), 'fontSize'),   // DESK_CSS won
        weight: got(doc.getElementById('focus-clock'), 'fontWeight'),
        /* --line is declared on :root in the page's one stylesheet and the card's border
           is drawn with it. Present here means the sheets were genuinely copied over,
           not approximated. */
        line: view.getComputedStyle(doc.documentElement)
                  .getPropertyValue('--line').trim()
      };
      deskRestore();
      frame.remove();
      return { ok: seen.display === 'flex' && seen.position === 'static' &&
                   seen.bar === '3px' && seen.size === '40px' &&
                   seen.weight === '300' && !!seen.line,
               detail: 'display=' + seen.display + ' position=' + seen.position +
                       ' bar=' + seen.bar + ' clock=' + seen.size + '/' + seen.weight +
                       ' --line="' + seen.line + '"' };
    });
    await probeRun('merge', function () {
      /* ONE CARD, EVERY ORGAN, and the part of it that can be proved without a window:
         all four organs move into one shell, in reading order, and every one of them
         comes home to its own slot. The shell is asserted to be their common parent -
         four elements each positioned fixed in its own corner would look identical from
         the outside right up until you opened the window and found them stacked. */
      const before = DESK_ORGANS.map(function (id) {
        const el = document.getElementById(id);
        return { id: id, el: el, parent: el && el.parentNode, next: el && el.nextSibling };
      });
      /* Both of the governor's narrow-page verdicts, put on deliberately: `nofit` carries
         a display:none, so a card that took it into the window would be invisible there. */
      $('focuscard').classList.add('pill', 'nofit');
      const frame = document.createElement('iframe');
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + DESK_W +
                            'px;height:' + DESK_H + 'px;border:0';
      document.body.appendChild(frame);
      const doc = frame.contentDocument;
      deskAdopt(doc);

      get verdict() { return probeVerdict(); },
      get title() { return document.title; },
      get fetches() { return probeFetches; },
      /* The viewport the battery insists on, and what it actually got. A harness that
         sizes the window wrongly is told here rather than in a lying result. */
      get viewport() { return { w: innerWidth, h: innerHeight,
                                visible: document.visibilityState === 'visible' }; }
    },
    debug: {
      paint: fxDebugPaint, poll: fxDebugPoll, start: fxDebugStart,
      get on() { return DEBUG_ON; },
      /* The last /focus/diag payload and its age. If this is stale the overlay says
         so in red, and so does this. */
      get diag() { return dbgDiag; },
      get ageMs() { return dbgAt ? Math.round(performance.now() - dbgAt) : null; },
      get trouble() { return dbgTrouble; },
      get shown() { return !!dbgBox; },
      get text() { return dbgBox ? dbgBox.textContent : ''; }
    },
    camera: {
      CLUSTER_MIN: CLUSTER_MIN, SPOKEN_MAX_CHARS: SPOKEN_MAX_CHARS,
      decide: decideCamera, localKind: localKind, spokenForm: spokenForm,
      get lastPlan() { return lastPlan; },
      get lit() { return Array.from(hiNodes); },
      get flights() { return flights; },
      /* what the idle orbit circles around. If this and target() disagree, the
         orbit is about to drag the view off whatever we just flew to. */
      get viewTarget() { return viewTarget; },
      get autoRotate() { return autoRotate; },
      /* the look-at point: idle rotation orbits around it and never changes it,
         so if this moved, the camera was genuinely dragged to a node */
      get target() {
        const t = (Graph.controls() && Graph.controls().target) || { x: 0, y: 0, z: 0 };
        return { x: +t.x.toFixed(2), y: +t.y.toFixed(2), z: +t.z.toFixed(2) };
      }
    },
    speech: {
      FINISH_MS: FINISH_MS,
      interrupts: Array.from(INTERRUPTS),
      speak: speak, refreshVoice: refreshVoice, unlock: unlockAudio,
      start: startListening, stop: stopListening,
      feedFinal: heardFinal, feedInterim: heardInterim,
      /* The last six seconds of lines, and whether each reached the speakers. A muted
         tab records and does not speak, which is what makes a ?mute=1 tab checkable
         without making it audible. Older than that and it is gone - see noteSaid. */
      get said() { return saidLog(); },
      get muted() { return MUTED; },
      get unlocked() { return audioUnlocked; },
      get listening() { return listening; },
      get buffer() { return phraseBuffer; },
      get pending() { return pendingLine; },
      get voice() {
        return chosenVoice ? chosenVoice.name + ' (' + chosenVoice.lang + ')' : null;
      }
    }
  };
})();
</script>
</body>
</html>
