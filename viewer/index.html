         readyState rather than a flag we set hopefully, and every path that finds
         it dead says so out loud instead of falling back.
       - send bytes that disagree with their label. FRAME_TYPE is the single string
         used to encode the frame, to check what came back, and to declare it on the
         wire; the server checks the bytes against the same claim from its side. */

  const FRAME_TYPE = 'image/jpeg';
  /* Past roughly this edge the models downsample anyway, so a larger frame costs
     upload time and buys no legibility - and legibility is the entire point when
     the screen is dense with small text. */
  const FRAME_MAX_EDGE = 1568;
  const FRAME_QUALITY = 0.82;
  /* How long after a share ends a screen-shaped question still gets told the share
     has ended, rather than being quietly answered from the notes instead. */
  const SHARE_MEMORY_MS = 60000;
  /* Note the second alternative: this claims "this tab", and so does the re-target.
     That collision is settled by ORDER, in ask() - focus phrases are checked first -
     because mid-session "lock on this tab" is an instruction about what is being
     watched, and answering it with a photograph would be the wrong half of the
     feature entirely. Outside a session there is no target to move and this wins. */
  const SCREEN_RE = new RegExp(
    'on\\s+(?:my|the|this)\\s+screen' +
    '|this\\s+(?:screen|window|tab|page|error|code|design|chart|graph|dashboard)\\b' +
    '|what\\s+(?:am\\s+i|are\\s+we)\\s+(?:looking\\s+at|seeing)' +
    '|what\\s+do\\s+you\\s+(?:think|make)\\s+of\\s+(?:this|that)\\b' +
    '|look\\s+at\\s+(?:this|my\\s+screen)', 'i');

  const canShare = !!(navigator.mediaDevices &&
                      navigator.mediaDevices.getDisplayMedia);

  let shareStream = null, shareEndedAt = 0;
  /* Display only, and named for what it is: the object URL behind the thumbnail of
     the frame already sent. Nothing reads this to answer a question - see() takes
     its bytes from grabFrame() and from nowhere else. */
  let shownFrame = null;

  /* Spoken, not silent. Every one of these is a case where there is no honest
     picture to judge, and the answer to that is to say so, never to answer anyway. */
  const SIGHT_TROUBLE = {
    ended: 'Your screen share has ended, sir, so there is nothing for me to look ' +
           'at. Start it again and ask me then.',
    notready: 'The share has not produced a picture yet. Give it a moment and ask ' +
              'me again.',
    encode: 'This browser would not encode a frame of that share, so I have sent ' +
            'nothing and judged nothing.',
    wrongtype: 'This browser encoded that frame as {got} rather than ' + FRAME_TYPE +
               ', so I have not sent it: the bytes and the label must agree or ' +
               'neither can be trusted.'
  };

  function sharing() {
    if (!shareStream) return false;
    const track = shareStream.getVideoTracks()[0];
    return !!track && track.readyState === 'live' && shareStream.active;
  }

  function paintShare() {
    const live = sharing();
    $('screen').classList.toggle('on', live);
    $('sharing').classList.toggle('live', live);
    $('sharewash').classList.toggle('live', live);
    $('screen').title = live ? 'Stop sharing this screen'
                             : 'Share a screen and ask about it';
    const v = $('shot');
    $('share-dim').textContent = (live && v.videoWidth)
      ? v.videoWidth + '×' + v.videoHeight : '';
  }

  /* hints: the extra getDisplayMedia options the WATCH wants - chiefly
     displaySurface:'monitor', which opens the picker ON ENTIRE SCREEN. They are
     hints in the specification's own sense and the man may still pick whatever he
     likes, so nothing downstream may treat them as a guarantee; the watch asks the
     track what it actually got. Returns whether there is now a live share, because
     the watch has to know before it starts a clock. */
  async function startShare(hints) {
    if (!canShare) return false;
    setStatus('', 'choose what to share…');
    let stream = null;
    try {
      const opts = Object.assign({}, hints || {});
      const surface = opts.displaySurface;
      delete opts.displaySurface;        // that one belongs inside video, not beside it
      opts.video = Object.assign({ frameRate: { ideal: 8, max: 15 } },  // stills, not cinema
                                 surface ? { displaySurface: surface } : {});
      opts.audio = false;
      stream = await navigator.mediaDevices.getDisplayMedia(opts);
    } catch (e) {
      // Dismissing the picker is a decision, not a fault: no scolding, no speech.
      setStatus('', (e && e.name === 'NotAllowedError')
        ? 'screen share cancelled'
        : 'screen share unavailable · ' + ((e && e.name) || 'unknown'));
      setTimeout(function () { if (!busy) idleStatus(); }, 2600);
      return false;
    }
    shareStream = stream;
    const video = $('shot');
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* muted video needs no gesture */ }
    stream.getVideoTracks().forEach(function (t) {
      /* The browser's own "Stop sharing" bar ends the track and tells this page
         nothing else, so this is the signal that must never be missed. */
      t.addEventListener('ended', function () { endShare(); });
    });
    ['loadedmetadata', 'resize'].forEach(function (ev) {
      video.addEventListener(ev, paintShare);
    });
    paintShare();
    setStatus('', 'sharing your screen · ask about it');
    setTimeout(function () { if (!busy) idleStatus(); }, 2600);
    return sharing();
  }

  function endShare() {
    const was = !!shareStream;
    if (shareStream) {
      shareStream.getTracks().forEach(function (t) {
        try { t.stop(); } catch (e) { /* already gone */ }
      });
    }
    shareStream = null;
    try { $('shot').srcObject = null; } catch (e) { /* ignore */ }
    if (was) shareEndedAt = Date.now();
    /* The watch has no camera of its own: no share, no watch. Said out loud rather
       than left as a chip quietly claiming to be watching a screen that is gone. */
    if (was && watchOn) stopWatch('ended');
    paintShare();
    if (was) {
      setStatus('', 'screen share ended');
      setTimeout(function () { if (!busy) idleStatus(); }, 2200);
    }
  }

  /* Repainted from the track once a second, so the indicator cannot be left
     claiming a share that has quietly died without firing anything. */
  setInterval(function () {
    if (shareStream && !sharing()) endShare();
    else if (shareStream) paintShare();
  }, 1000);

  /* The two things a frame can be grabbed FROM. Written as a table rather than as
     two grabbers, because one grabber is one place where a frame comes into
     existence, one encoding check, and no second path that could quietly send an
     older picture or one of some other type - and now that there are two cameras in
     this page, "which one" has to be a written-down answer rather than a default. */
  const FRAME_SOURCES = {
    screen: { video: 'shot', canvas: 'frame',
              alive: function () { return sharing(); } },
    cam:    { video: 'cam', canvas: 'camframe',
              alive: function () { return eyesLive(); } }
  };

  /* The ONLY producer of a frame. Called from see() and from lookAtMe(), one line
     before the request, and from nowhere else in either case. */
  function grabFrame(which) {
    const src = FRAME_SOURCES[which || 'screen'];
    return new Promise(function (resolve) {
      if (!src.alive()) return resolve({ error: 'ended' });
      const video = $(src.video);
      if (!video.videoWidth || !video.videoHeight) {
        return resolve({ error: 'notready' });
      }
      const scale = Math.min(1, FRAME_MAX_EDGE /
                                Math.max(video.videoWidth, video.videoHeight));
      const w = Math.max(1, Math.round(video.videoWidth * scale));
      const h = Math.max(1, Math.round(video.videoHeight * scale));
      const cvs = $(src.canvas);
      cvs.width = w; cvs.height = h;
      cvs.getContext('2d').drawImage(video, 0, 0, w, h);
      const at = performance.now();      // when this frame actually existed
      cvs.toBlob(function (blob) {
        if (!blob || !blob.size) return resolve({ error: 'encode' });
        /* toBlob() falls back to image/png without a word of complaint when it
           cannot encode the type it was asked for. Left unchecked, that is a
           request whose header and body disagree - which fails at the far end
           looking like the whole feature is broken. Check it here too. */
        if (blob.type !== FRAME_TYPE) {
          return resolve({ error: 'wrongtype', got: blob.type || 'nothing' });
        }
        resolve({ blob: blob, w: w, h: h, at: at });
      }, FRAME_TYPE, FRAME_QUALITY);
    });
  }

  function hideProof() {
    $('a-saw').classList.remove('show');
    if (shownFrame) { URL.revokeObjectURL(shownFrame); shownFrame = null; }
    $('a-frame').removeAttribute('src');
  }

  /* Show the exact frame that produced the answer beside it. Cheap, and it means
     the claim "this is what I looked at" is checkable by eye rather than trusted. */
  function showProof(shot, ageMs, title, note) {
    if (shownFrame) URL.revokeObjectURL(shownFrame);
    shownFrame = URL.createObjectURL(shot.blob);
    $('a-frame').src = shownFrame;
    /* esc() on both, because the note carries a label that came off the wire - a
       brain's name - and a label is not markup however harmless it looks. */
    $('a-frame-meta').innerHTML = '<b>' + esc(title || 'the frame it saw') + '</b>' +
      shot.w + '×' + shot.h + ' · ' + Math.round(shot.blob.size / 1024) + ' KB · ' +
      FRAME_TYPE + '<br>grabbed as you asked, sent ' + ageMs + ' ms later' +
      (note ? '<br>' + esc(note) : '');
    $('a-saw').classList.add('show');
  }

  let lastSight = null;      // what was actually sent, for the console and the tests

  async function see(question) {
    if (busy || !question.trim()) return;
    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    setStatus('looking', 'looking at your screen', question);
    renderAnswer(question, 'Looking at your screen…', false, null);

    function fail(message) {
      renderAnswer(question, message, true, null);
      if (!speak(spokenForm(message))) idleStatus();
    }

    try {
      // Grabbed HERE: after the question exists, before anything is sent.
      const shot = await grabFrame();
      if (shot.error) {
        if (shot.error === 'ended') endShare();
        return fail(SIGHT_TROUBLE[shot.error]
          .replace('{got}', shot.got || 'something else'));
      }
      const age = Math.round(performance.now() - shot.at);
      lastSight = { w: shot.w, h: shot.h, bytes: shot.blob.size,
                    type: shot.blob.type, ageMs: age, at: Date.now() };

      const res = await fetch('/see?q=' + encodeURIComponent(question), {
        method: 'POST',
        headers: {
          // The same constant the blob was encoded with. One string, three uses.
          'Content-Type': FRAME_TYPE,
          'X-Frame-Width': String(shot.w),
          'X-Frame-Height': String(shot.h),
          // Measured by this page against its own clock, so no two clocks are ever
          // compared - it only has to catch a frame that is older than the question.
          'X-Frame-Age-Ms': String(age)
        },
        body: shot.blob
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }

      const isError = !data || !!data.error || !data.answer;
      const text = !data
        ? 'The brain replied with something that was not JSON (HTTP ' +
          res.status + ').'
        : (data.error || data.answer || '(empty answer)');
      renderAnswer(question, text, isError, null);
      showProof(shot, age);
      if (!speak(spokenForm(text))) idleStatus();
      // Always 'hold': see decideCamera. A screen answer proves nothing about a note.
      applyCamera(decideCamera('screen', [], isError), []);
    } catch (e) {
      fail('I could not reach the brain to look at that. Start it with "python ' +
           'server.py" and try again - nothing was judged.');
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
    }
  }

  $('screen').onclick = function () {
    unlockAudio();                     // a real gesture: the voice may as well wake
    if (sharing()) return endShare();
    startShare();
  };
  $('share-stop').onclick = function () { endShare(); };
  if (!canShare) {
    $('screen').disabled = true;
    $('screen').title = 'This browser cannot share a screen (needs getDisplayMedia)';
  }

  /* ================================================================= eyes ==
     A WEBCAM ORGAN THAT DOES NOT UPLOAD A FRAME.

     Everything here obeys one rule, and the rule is structural rather than a promise:
     the pixels are read by this page and by this page only. The face and pose
     landmarkers run in this tab, on wasm this tab downloaded; the geometry below turns
     landmarks into THREE BOOLEANS - present, head down, slouched - and those three
     booleans, plus a word about whether the ears are open, are the entire payload of
     POST /eyes. There is no field in that request for an image, a landmark, a
     coordinate or a measurement of your face, so there is nothing to forget to strip.

     The ONE exception is asked for out loud, every time: "look at me" sends a single
     frame to the brain, grabbed after the question exists, shown beside the answer it
     produced, and never kept. A nudge never sends a frame. A heartbeat never sends a
     frame. Only a sentence of yours does.

     Two more rules worth stating where the code is:

       - THE EAR LAW. This organ never calls startListening(). It reports whether the
         ears happen to be open so the server can SAY the eyes are on while the mic is
         off, which is the moment that rule is felt as a fault rather than a promise.
         An organ may open the conversation; it may never open the microphone.

       - ONE NUDGER. The decision about who speaks a nudge is the SERVER'S - see
         note_eyes() in focus.py. With a session running the line goes into the say
         queue and reaches every open tab once through the stream it already has; with
         no session it comes back in the reply and the tab that posted says it. This
         page speaks the reply only when the server says viaSession is false.

     The thresholds are relative to YOUR OWN neutral posture, measured in the first two
     seconds after the lid opens, because a laptop camera pointing up your nose and a
     monitor camera looking down at you disagree about every absolute number anyone
     could write here. Until that baseline exists the organ says it is measuring and
     claims nothing. */

  /* The landmarkers, from the same CDN pattern as the graph library, with a fallback
     host for when one of them is having a day. Nothing here is bundled: if both are
     unreachable the eyes say they cannot see rather than inventing a posture. */
  const EYE_LIBS = [
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
    'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
  ];
  const FACE_TASK = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/' +
                    'face_landmarker/float16/1/face_landmarker.task';
  const POSE_TASK = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/' +
                    'pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

  const EYE_READ_MS = 140;         // ~7 readings a second: plenty for a 700 ms hold
  const EYE_BEAT_MS = 2000;        // a heartbeat, so the server's staleness never trips
  const EYE_CALIBRATE_MIN = 8;     // readings, not milliseconds, decide it is enough

  /* The server's windows, adopted from its own reply and never hardcoded twice. These
     are the defaults for the one moment before the first reply lands. */
  let EYE_TUNE = { sustainMs: 700, absenceMs: 12000, cooldownS: 30, staleS: 6,
                   reliefS: 180, countsAsDrift: true };

  /* How far from YOUR neutral counts. Ratios, so they mean the same thing on a laptop
     lid and on a monitor above eye level. */
  const EYE_PITCH_DOWN = 1.30;     // chin foreshortened this much more than neutral
  const EYE_DROP_DOWN  = 0.72;     // nose fallen this far toward the shoulder line
  const EYE_SIT_SLUMP  = 0.93;     // eyes sitting this much lower in frame
  const EYE_DROP_SLUMP = 0.86;     // head sunk this far into the shoulders

  const canSee = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  let camStream = null;            // the live camera, or null
  let camReader = null;            // { face, pose, from } once the landmarkers exist
  let camLoading = false, camTimer = null, camStamp = 0, camBeat = 0;
  let eyeBase = null;              // YOUR neutral posture, measured
  let eyeSamples = [];             // calibration readings, dropped the moment it is done
  let eyeRaw = null;               // the last reading, for the console and the checks
  let eyeStable = { present: false, headDown: false, slouched: false };
  let eyeSince = { absent: 0, headDown: 0, slouched: 0 };
  let eyeLastPost = null, eyeTrouble = '', eyeLooks = 0, lastLook = null;

  /* ---- the geometry: the one piece worth testing, so the one piece with no state ----
     Landmarks in, numbers out. No DOM, no clock, no camera, no fetch. MediaPipe's
     indices: face 10 forehead, 152 chin, 33/263 outer eye corners; pose 0 nose,
     11/12 shoulders. Everything is normalised 0..1 with y growing downward. */
  const POSTURE = {
    seen: function (p) {
      // An injected landmark carries no visibility; a real one does. Absent means
      // "the detector did not say", which is not the same as "not there".
      return !!p && (p.visibility === undefined || p.visibility === null ||
                     p.visibility >= 0.5);
    },

    metrics: function (face, pose) {
      const f = (face && face.length > 263) ? face : null;
      const p = (pose && pose.length > 12) ? pose : null;
      const m = { pitch: null, drop: null, sit: null, span: null, from: [] };
      if (f) {
        const fore = f[10], chin = f[152], eL = f[33], eR = f[263];
        if (fore && chin && eL && eR) {
          const eyeY = (eL.y + eR.y) / 2;
          const upper = eyeY - fore.y;      // grows as the head tips down
          const lower = chin.y - eyeY;      // shrinks as the head tips down
          if (upper > 0 && lower > 0.004) m.pitch = upper / lower;
          m.sit = 1 - eyeY;                 // how high you are sitting, in frame
          m.span = Math.abs(eR.x - eL.x);   // a scale proxy: how close you are
          m.from.push('face');
        }
      }
      if (p) {
        const nose = p[0], sL = p[11], sR = p[12];
        if (POSTURE.seen(nose) && POSTURE.seen(sL) && POSTURE.seen(sR)) {
          const shoulderY = (sL.y + sR.y) / 2;
          const width = Math.abs(sL.x - sR.x);
          if (width > 0.02) m.drop = (shoulderY - nose.y) / width;
          if (m.sit === null) m.sit = 1 - nose.y;
          m.from.push('pose');
        }
      }
      return m.from.length ? m : null;      // nobody there is null, not a guess
    },

    /* The mean of your neutral readings. Each field needs its own quorum, because the
       pose landmarker can find your shoulders in frames where the face detector lost
       you and the average must not be built from whichever half happened to arrive. */
    baseline: function (samples, need) {
      const want = Math.max(2, need || EYE_CALIBRATE_MIN);
      const base = {};
      ['pitch', 'drop', 'sit'].forEach(function (key) {
        const got = (samples || []).filter(function (s) {
          return s && typeof s[key] === 'number' && isFinite(s[key]);
        }).map(function (s) { return s[key]; });
        base[key] = got.length >= want
          ? got.reduce(function (a, b) { return a + b; }, 0) / got.length
          : null;
      });
      // Pitch or drop: one of the two head measures must be real, or there is nothing
      // to compare a bent neck against and no baseline worth having.
      return (base.pitch !== null || base.drop !== null) ? base : null;
    },

    /* metrics + your own baseline -> the three booleans, and nothing else. */
    judge: function (m, base) {
      const out = { present: !!m, headDown: false, slouched: false };
      if (!m || !base) return out;
      const downFace = m.pitch !== null && base.pitch !== null &&
                       m.pitch > base.pitch * EYE_PITCH_DOWN;
      const downPose = m.drop !== null && base.drop !== null &&
                       m.drop < base.drop * EYE_DROP_DOWN;
      out.headDown = !!(downFace || downPose);
      if (!out.headDown) {
        // A slouch is what is left when the head is not bent: you have sunk, not
        // looked away. Reported second, and never at the same time as the phone.
        const sank = m.sit !== null && base.sit !== null &&
                     m.sit < base.sit * EYE_SIT_SLUMP;
        const sunk = m.drop !== null && base.drop !== null &&
                     m.drop < base.drop * EYE_DROP_SLUMP;
        out.slouched = !!(sank || sunk);
      }
      return out;
    }
  };

  function eyesLive() {
    if (!camStream) return false;
    const track = camStream.getVideoTracks()[0];
    return !!track && track.readyState === 'live' && camStream.active;
  }

  function paintEyes() {
    const live = eyesLive();
    const bent = live && (eyeStable.headDown || eyeStable.slouched);
    $('eye').classList.toggle('on', live);
    $('eye').classList.toggle('bent', !!bent);
    $('eyeing').classList.toggle('live', live);
    $('eye').title = live
      ? 'Close the eyes (no frame of you was ever uploaded)'
      : 'Open the eyes · posture only, no frame leaves this machine';
    $('eye-dim').textContent = !live ? ''
      : eyeTrouble ? eyeTrouble
      : !camReader ? 'waking the landmarkers'
      : !eyeBase ? 'measuring your neutral posture'
      : !eyeStable.present ? 'chair empty'
      : eyeStable.headDown ? 'head down'
      : eyeStable.slouched ? 'slouched'
      : 'upright';
    /* The eyes never ARM the desktop card - a window you did not ask for because a
       camera came on is a window in the way - but while the card is out they are a row
       in it, and closing them can be the thing that empties it. */
    deskTend();
    layout();
  }

  /* ---- the report: three booleans and a word about the ears ---- */
  const EYE_UNREACHABLE = 'the server is not answering';

  async function eyeReport(cmd) {
    camBeat = Date.now();
    /* THE WHOLE PAYLOAD. Read these four names and you have read everything this organ
       has ever sent about your body. `ears` is the ear law: false is what earns the
       sentence about the mic being off, and this page has no line of code that would
       turn it on. */
    const body = {
      cmd: cmd || 'posture',
      present: !!eyeStable.present,
      headDown: !!eyeStable.headDown,
      slouched: !!eyeStable.slouched,
      ears: !!listening
    };
    let data = null;
    try {
      const res = await fetch('/eyes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      data = await res.json();
    } catch (e) {
      eyeTrouble = EYE_UNREACHABLE;
      paintEyes();
      return null;
    }
    if (eyeTrouble === EYE_UNREACHABLE) eyeTrouble = '';   // it answered after all
    eyeLastPost ={ at: Date.now(), sent: body, via: !!(data && data.viaSession),
                    spoke: !!(data && data.answer) };
    // One source of truth for the windows: the server's own numbers, every time.
    if (data && data.tuning) EYE_TUNE = Object.assign({}, EYE_TUNE, data.tuning);
    if (data && data.focus) fxApply(data.focus);
    /* ONE NUDGER. An answer here means there was no session to carry it - fxApply
       above has already spoken anything that went into the say queue - so this is the
       only tab that can say this, and it says it exactly once. */
    if (data && data.answer) {
      renderAnswer('', data.answer, false, null);
      if (!speak(spokenForm(data.answer))) idleStatus();
    }
    paintEyes();
    return data;
  }

  /* ---- the pipeline: reading -> sustained posture -> at most one report ---- */
  function eyeObserve(m, now) {
    // No camera, no report. A posture published by a page whose lid is shut would be
    // a claim about a room nobody is looking at.
    if (!camStream) return null;
    now = now || Date.now();

    if (!eyeBase) {
      if (m) eyeSamples.push(m);
      if (eyeSamples.length > 60) eyeSamples.shift();
      eyeBase = POSTURE.baseline(eyeSamples, EYE_CALIBRATE_MIN);
      if (!eyeBase) { paintEyes(); return null; }
      eyeSamples = [];              // measured, and the readings are not kept
      paintEyes();
    }

    const raw = POSTURE.judge(m, eyeBase);
    eyeRaw = { at: now, present: raw.present, headDown: raw.headDown,
               slouched: raw.slouched, metrics: m };

    /* THE SUSTAIN. When each condition began, or 0 while it is not true. A posture has
       to hold before it is worth a word: the whole difference between noticing and
       nagging is that a glance down at a notification never starts a sentence. */
    eyeSince.headDown = raw.headDown ? (eyeSince.headDown || now) : 0;
    eyeSince.slouched = raw.slouched ? (eyeSince.slouched || now) : 0;
    eyeSince.absent   = raw.present ? 0 : (eyeSince.absent || now);
    const held = function (since, ms) { return !!since && (now - since) >= ms; };

    const next = {
      // Absence gets the long grace, and it is the only one that counts DOWN from
      // true: you are present until you have been gone for twelve seconds.
      present: !held(eyeSince.absent, EYE_TUNE.absenceMs),
      headDown: held(eyeSince.headDown, EYE_TUNE.sustainMs),
      slouched: held(eyeSince.slouched, EYE_TUNE.sustainMs)
    };
    if (next.headDown) next.slouched = false;      // one posture at a time
    if (!next.present) { next.headDown = false; next.slouched = false; }

    const changed = next.present !== eyeStable.present ||
                    next.headDown !== eyeStable.headDown ||
                    next.slouched !== eyeStable.slouched;
    eyeStable = next;
    paintEyes();
    /* Posted on a CHANGE, so the nudge arrives inside a second of the posture being
       real, and on a heartbeat otherwise, so the server never has to guess whether a
       quiet page is upright or closed. */
    if (changed || (now - camBeat) >= EYE_BEAT_MS) return eyeReport('posture');
    return null;
  }

  /* The seam between the camera and the judgement, and the only way in. The reader
     below hands landmarks to this; so does a check, which is the point - the geometry
     and the timing can be driven from recorded landmarks with no camera in the room,
     and the camera has no path that goes round it. */
  function eyeFeed(face, pose) {
    return eyeObserve(POSTURE.metrics(face, pose), Date.now());
  }

  function eyeTick() {
    if (!eyesLive()) { stopEyes('blind'); return; }
    const video = $('cam');
    if (!camReader || !video.videoWidth) return;
    let face = null, pose = null;
    try {
      // Strictly increasing, or the video-mode detectors refuse the frame.
      const at = Math.max(camStamp + 1, Math.round(performance.now()));
      camStamp = at;
      const f = camReader.face.detectForVideo(video, at);
      const p = camReader.pose.detectForVideo(video, at);
      face = (f && f.faceLandmarks && f.faceLandmarks[0]) || null;
      pose = (p && p.landmarks && p.landmarks[0]) || null;
    } catch (e) {
      eyeTrouble = 'the landmarker stumbled · ' + ((e && e.name) || 'error');
      paintEyes();
      return;
    }
    eyeFeed(face, pose);
  }

  async function loadLandmarkers() {
    if (camReader || camLoading) return camReader;
    camLoading = true;
    paintEyes();
    let last = null;
    for (let i = 0; i < EYE_LIBS.length && !camReader; i++) {
      const lib = EYE_LIBS[i];
      try {
        const V = await import(lib);
        const files = await V.FilesetResolver.forVisionTasks(
          lib.replace(/\/vision_bundle\.mjs$/, '/wasm'));
        // GPU where it exists, CPU where it does not. A machine without a working
        // GPU delegate gets slower eyes, not blind ones.
        for (let d = 0; d < 2 && !camReader; d++) {
          const delegate = d === 0 ? 'GPU' : 'CPU';
          try {
            const face = await V.FaceLandmarker.createFromOptions(files, {
              baseOptions: { modelAssetPath: FACE_TASK, delegate: delegate },
              runningMode: 'VIDEO', numFaces: 1
            });
            const pose = await V.PoseLandmarker.createFromOptions(files, {
              baseOptions: { modelAssetPath: POSE_TASK, delegate: delegate },
              runningMode: 'VIDEO', numPoses: 1
            });
            camReader = { face: face, pose: pose, from: lib, delegate: delegate };
          } catch (e) { last = e; }
        }
      } catch (e) { last = e; }
    }
    camLoading = false;
    /* HONEST FAILURE. No landmarker means no posture, and no posture means this organ
       publishes nothing and says so on the chip. The alternative - a cheerful
       "upright" from a page that cannot see - is the one outcome worth refusing. */
    eyeTrouble = camReader ? '' : 'cannot read this camera · ' +
                                  ((last && last.name) || 'offline?');
    paintEyes();
    return camReader;
  }

  async function startEyes() {
    if (!canSee || camStream) return false;
    setStatus('', 'opening the camera…');
    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        /* audio:false is not a tidy default here, it is THE EAR LAW in code: this
           organ asks for pixels and has nowhere to ask for sound. */
        audio: false,
        video: { width: { ideal: 640 }, height: { ideal: 480 },
                 frameRate: { ideal: 10, max: 15 }, facingMode: 'user' }
      });
    } catch (e) {
      // Refusing a camera is a decision, not a fault: no scolding, no speech.
      setStatus('', (e && e.name === 'NotAllowedError')
        ? 'camera refused · the eyes stay shut'
        : 'no camera available · ' + ((e && e.name) || 'unknown'));
      setTimeout(function () { if (!busy) idleStatus(); }, 2600);
      return false;
    }
    camStream = stream;
    const video = $('cam');
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* a muted video needs no gesture */ }
    stream.getVideoTracks().forEach(function (t) {
      // Unplugged, or taken by another app: the lid has shut whatever this page thinks.
      t.addEventListener('ended', function () { stopEyes('blind'); });
    });
    eyeBase = null;
    eyeSamples = [];
    eyeSince = { absent: 0, headDown: 0, slouched: 0 };
    // Present until told otherwise, so opening the lid cannot fire an empty-chair
    // nudge at the man who just pressed the button.
    eyeStable = { present: true, headDown: false, slouched: false };
    eyeRaw = null;
    eyeTrouble = '';
    paintEyes();
    /* The ear law is SAID here, by the server, because `ears` goes with this report.
       This page never turns the microphone on - not here, not anywhere below. */
    await eyeReport('on');
    loadLandmarkers();
    clearInterval(camTimer);
    camTimer = setInterval(eyeTick, EYE_READ_MS);
    return true;
  }

  function stopEyes(why) {
    const was = !!camStream;
    clearInterval(camTimer);
    camTimer = null;
    if (camStream) {
      camStream.getTracks().forEach(function (t) {
        try { t.stop(); } catch (e) { /* already gone */ }
      });
    }
    camStream = null;
    try { $('cam').srcObject = null; } catch (e) { /* ignore */ }
    eyeStable = { present: false, headDown: false, slouched: false };
    eyeSince = { absent: 0, headDown: 0, slouched: 0 };
    eyeRaw = null;
    eyeBase = null;
    eyeSamples = [];
    eyeTrouble = '';
    paintEyes();
    // The landmarkers are kept: they cost a download, they hold no frame, and the
    // next open should not have to fetch them again.
    if (was) eyeReport(why === 'blind' ? 'blind' : 'off');
    return was;
  }

  $('eye').onclick = function () {
    unlockAudio();                     // a real gesture: the confirmation is spoken
    if (eyesLive()) return stopEyes('off');
    startEyes();
  };
  $('eye-stop').onclick = function () { stopEyes('off'); };
  if (!canSee) {
    $('eye').disabled = true;
    $('eye').title = 'This browser will not give this page a camera (needs getUserMedia)';
  }
  /* Repainted once a second like the share chip, so the indicator cannot be left
     claiming eyes that have quietly died without firing anything. */
  setInterval(function () {
    if (camStream && !eyesLive()) stopEyes('blind');
    else if (camStream) paintEyes();
  }, 1000);

  /* ---- LOOK AT ME: the one frame, asked for out loud ----
     Disjoint from SCREEN_RE by construction and by test. That one is about THIS and
     THAT - the thing on the glass - and this one is about ME and MY things, so "what
     do you think of this screen" stays with the screen organ where it belongs. The
     nouns that belong to the glass are excluded from the possessive branch as well,
     so "what do you think of my screen" cannot be dragged over here either. */
  const LOOK_NOT_MINE = '(?:screen|monitor|display|desktop|tab|page|window|code|' +
                        'error|chart|graph|dashboard|design|notes|galaxy|terminal|' +
                        'browser|editor|diagram)';
  const LOOK_MINE = 'my\\s+(?!' + LOOK_NOT_MINE + '\\b)\\w+';
  const LOOK_RE = new RegExp(
    'look\\s+at\\s+me\\b' +
    '|(?:how|what)\\s+do\\s+i\\s+look\\b' +
    '|\\bdo\\s+i\\s+look\\b' +
    '|check\\s+me\\s+out\\b' +
    '|what\\s+am\\s+i\\s+wearing\\b' +
    '|what\\s+do\\s+you\\s+(?:think|make)\\s+of\\s+' + LOOK_MINE +
    '|(?:do\\s+you\\s+like|what\\s+about|how\\s+about)\\s+' + LOOK_MINE +
    '|(?:see|look\\s+at|rate|judge)\\s+' + LOOK_MINE +
    '|how\\s+(?:is|does)\\s+' + LOOK_MINE, 'i');

  /* Spoken, never silent, and never answered anyway. Each of these is a moment when
     there is no honest photograph to judge. */
  const LOOK_TROUBLE = {
    shut: 'My eyes are shut, sir. Tap the eye button and ask me again - I will not ' +
          'open a camera on you because of a sentence.',
    unsupported: 'This browser will not give me a camera, so there is nothing of you ' +
                 'for me to look at.',
    ended: 'The camera has stopped, sir, so my eyes are shut again. Open them and ask ' +
           'me then.',
    notready: 'The camera has not produced a picture yet. Give it a moment, sir, and ' +
              'ask me again.',
    encode: 'This browser would not encode a frame of that camera, so I have sent ' +
            'nothing and judged nothing.',
    wrongtype: 'This browser encoded that frame as {got} rather than ' + FRAME_TYPE +
               ', so I have not sent it: the bytes and the label must agree or ' +
               'neither can be trusted.'
  };

  async function lookAtMe(question) {
    if (busy || !question.trim()) return;

    function fail(message) {
      renderAnswer(question, message, true, null);
      if (!speak(spokenForm(message))) idleStatus();
    }

    if (!canSee) return fail(LOOK_TROUBLE.unsupported);
    if (camStream && !eyesLive()) { stopEyes('blind'); return fail(LOOK_TROUBLE.ended); }
    /* The eyes do not open themselves for this. A sentence is not consent to a
       camera, and a camera that opens on a phrase is a camera you stop trusting. */
    if (!eyesLive()) return fail(LOOK_TROUBLE.shut);

    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    setStatus('looking', 'having a look at you', question);
    renderAnswer(question, 'Having a look…', false, null);

    try {
      // Grabbed HERE: after the question exists, before anything is sent. ONE frame.
      const shot = await grabFrame('cam');
      if (shot.error) {
        if (shot.error === 'ended') stopEyes('blind');
        return fail(LOOK_TROUBLE[shot.error]
          .replace('{got}', shot.got || 'something else'));
      }
      const age = Math.round(performance.now() - shot.at);
      lastLook = { w: shot.w, h: shot.h, bytes: shot.blob.size, type: shot.blob.type,
                   ageMs: age, at: Date.now(), brain: null, asAsked: null };

      const res = await fetch('/look?q=' + encodeURIComponent(question), {
        method: 'POST',
        headers: {
          'Content-Type': FRAME_TYPE,
          'X-Frame-Width': String(shot.w),
          'X-Frame-Height': String(shot.h),
          'X-Frame-Age-Ms': String(age)
        },
        body: shot.blob
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }

      const isError = !data || !!data.error || !data.answer;
      const text = !data
        ? 'The brain replied with something that was not JSON (HTTP ' +
          res.status + ').'
        : (data.error || data.answer || '(empty answer)');
      if (data && data.brain) {
        lastLook.brain = data.brain;
        lastLook.asAsked = !!data.asAsked;
      }
      eyeLooks++;
      renderAnswer(question, text, isError, null);
      /* WHICH BRAIN ANSWERED, under the frame it answered about. The look asks for
         Astra by name; when that key is missing the server routes to the configured
         brain instead and says so, and a fallback you cannot see is a lie. */
      showProof(shot, age, 'the one frame sent',
                data && data.brain ? 'answered by ' + data.brain +
                  (data.asAsked === false ? ' (Astra was not reachable)' : '') : null);
      if (!speak(spokenForm(text))) idleStatus();
      // 'screen' is the honest kind here: a photograph of you cites no note, so the
      // graph holds still rather than flying somewhere to make a point about a shirt.
      applyCamera(decideCamera('screen', [], isError), []);
    } catch (e) {
      fail('I could not reach the brain to look at you. Start it with "python ' +
           'server.py" and try again - nothing was sent.');
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
    }
  }

  /* ================================================================ watch ==
     A SCREEN WATCH THAT COSTS NOTHING UNTIL IT NEEDS TO THINK.

     "Watch my screen." Then, every five seconds, one frame of the share is drawn into
     a 32x18 canvas - 576 grey numbers - and compared with the last 576. That is the
     entire running cost: no upload, no model, no network, no disk. A screen that keeps
     changing is a man at work and is left alone. A screen that has not changed for a
     minute earns ONE frame sent to the brain and one dry nudge about what he is stuck
     on, and then three minutes of quiet.

     Four things this must never do, and what stops each:

       - upload anything while it is merely watching. The diff runs on the canvas and
         returns a count. There is exactly one fetch in this organ and it is inside
         nudgeNow(), guarded by the stillness threshold; a tick that is not a nudge has
         no code path to a network call at all.
       - police tabs with a tab. See THE TAB-SHARE TRAP below: a captured tab keeps
         painting itself while you wander off to another one, and its own scrolling
         reads as change, so it is the one surface on which this feature would quietly
         lie in both directions. It is refused out loud, never worked around.
       - touch the camera. This organ reads FRAME_SOURCES.screen and nothing else, and
         the two sources have separate videos and separate canvases precisely so that
         neither organ can reach the other's pixels. Want posture too? Open the eyes.
       - nudge while the man has asked for silence. The relief valve belongs to the
         eyes and covers every organ: POST /stuck refuses while it is open, on the
         server, where the valve actually lives.

     The windows are the server's (GET /stuck) for the same reason the eyes' are: the
     page owns the clock, the server owns the purse. */

  /* Defaults only. Every one of these is replaced by the server's own numbers the
     moment the watch starts, and the chip would rather say so than apply a stale
     rule - see watchTune(). */
  let WATCH_TUNE = { stillS: 60, cooldownS: 180, tickMs: 5000,
                     thumbW: 32, thumbH: 18, cellDelta: 10, changedFraction: 0.015 };

  /* "Watch my screen", and the off switch. Note what is NOT in here: "look at this",
     "what do you think of this screen". Those are questions about a picture and they
     belong to sight; this is an instruction to sit and watch, and the two must not
     collide - ask() checks this one first and a live check proves they are disjoint. */
  const WATCH_RE = new RegExp(
    '\\b(?:watch|keep\\s+an\\s+eye\\s+on|monitor)\\s+' +
    '(?:my|the|this)\\s+(?:screen|desktop|display|monitor)\\b' +
    '|\\bwatch\\s+(?:me|what\\s+i(?:\'m|\\s+am)\\s+doing)\\b' +
    '|\\bwatch\\s+my\\s+work\\b', 'i');
  const WATCH_OFF_RE = new RegExp(
    '\\b(?:stop|quit|end|cease)\\s+watching\\b' +
    '|\\bstop\\s+(?:the\\s+)?(?:screen\\s+)?watch\\b' +
    '|\\b(?:don\'?t|do\\s+not)\\s+watch\\s+(?:my|the|this)\\s+screen\\b', 'i');

  /* Spoken, every one of them. A watch that failed to start silently is a watch you
     will believe is running. */
  const WATCH_TROUBLE = {
    unsupported: 'This browser cannot share a screen at all, sir, so there is ' +
                 'nothing for me to watch.',
    cancelled: 'You thought better of it, sir. Nothing is being watched.',
    /* THE TAB-SHARE TRAP, said in full. It names what it got, why that surface
       cannot do this job, and the one thing to do about it - a refusal that leaves
       you guessing which of the three options to pick is barely a refusal. */
    tab: 'That is a single browser tab, sir, and a tab cannot watch a desk: it ' +
         'carries on painting itself while you wander off to another one, and its ' +
         'own scrolling would read as work. Say "watch my screen" again and choose ' +
         'Entire Screen in the picker.',
    window: 'That is one application window, sir, which I would go on watching ' +
            'contentedly while you worked somewhere else entirely. Say "watch my ' +
            'screen" again and choose Entire Screen.',
    ended: 'The share has ended, sir, so I have stopped watching.',
    blind: 'The share is not producing a picture, so I have stopped watching rather ' +
           'than pretend to: {detail}'
  };
  const WATCH_LINES = {
    on: 'Watching your screen, sir. Nothing leaves this machine unless you have sat ' +
        'still for a minute, and then only one frame.',
    off: 'No longer watching, sir.',
    /* Said when the desktop card could not be pinned. Honest about which half
       worked: the watch is running, the face simply has nowhere to sit yet. */
    nopin: 'I am watching, sir, though this browser will not let my face off the ' +
           'page. Click anywhere and I shall pin it to the desktop.'
    /* There is no longer a line about the countdown having the desktop, because there is
       no longer anything to queue for: the face and the countdown share one card. If the
       window is already open, the face joins it; if it is not, the face asks for it. */
  };

  const canPin = !!(window.documentPictureInPicture &&
                    window.documentPictureInPicture.requestWindow);

  let watchOn = false, watchTimer = null, watchThumb = null;
  let watchStillFrom = 0;        // when the screen last changed (Date.now())
  let watchSurface = '';         // what the track says it is: monitor / window / browser
  let watchTicks = 0, watchChanges = 0, watchNudges = 0;
  let watchLastDiff = null, watchLastNudge = null, watchTrouble = '';
  let watchBusyHold = 0;         // ticks deferred because a question was in flight
  /* Whose share is it. A share the watch opened is the watch's to close when it stops;
     one that was already running belongs to the man who started it, and ending it
     under him because the watch happened to finish would be a liberty. */
  let watchOpenedShare = false;

  function watchStillMs() {
    return watchStillFrom ? Date.now() - watchStillFrom : 0;
  }

  /* ---- the diff: the one piece worth testing, so the one piece with no state ----
     Grey numbers in, a verdict out. No DOM, no clock, no share, no fetch. Exported
     whole on __galaxy.watch.DIFF so it can be checked against synthetic screens
     nobody had to sit in front of. */
  const WATCH_DIFF = {
    /* One 8-bit luma value per cell, from the RGBA that getImageData returns. Grey
       because colour buys nothing here: the question is "did this region change",
       and a thumbnail that big has no hue worth keeping. */
    luma: function (rgba) {
      const out = new Uint8ClampedArray(rgba.length / 4);
      for (let i = 0, j = 0; j < out.length; i += 4, j++) {
        out[j] = (rgba[i] * 0.299 + rgba[i + 1] * 0.587 + rgba[i + 2] * 0.114) | 0;
      }
      return out;
    },
    /* Two thumbnails -> did the screen change? TWO thresholds, and the second one is
       the feature rather than a tolerance: a cell must move by cellDelta to count at
       all (JPEG-ish noise and a blinking caret do not), and enough cells must move to
       clear changedFraction (a clock ticking in the corner does not). Without the
       fraction, any desktop with a clock on it would reset the stillness timer for
       ever and the nudge would never once fire. */
    diff: function (a, b, tune) {
      const t = tune || WATCH_TUNE;
      if (!a || !b || a.length !== b.length || !a.length) {
        return { cells: 0, total: (a && a.length) || 0, fraction: 0,
                 changed: true, comparable: false };
      }
      let cells = 0, worst = 0;
      for (let i = 0; i < a.length; i++) {
        const d = Math.abs(a[i] - b[i]);
        if (d > worst) worst = d;
        if (d > t.cellDelta) cells++;
      }
      const fraction = cells / a.length;
      return { cells: cells, total: a.length, worst: worst,
               fraction: +fraction.toFixed(4),
               changed: fraction > t.changedFraction, comparable: true };
    }
  };

  /* The current screen as those grey numbers, or null if there is no picture yet.
     Reads the SAME video element the share's frame grabber reads, which is the whole
     of "answer from the same share": one stream, one video, two consumers. */
  function watchThumbNow() {
    const video = $('shot');
    if (!sharing() || !video.videoWidth || !video.videoHeight) return null;
    const cvs = $('thumb');
    cvs.width = WATCH_TUNE.thumbW; cvs.height = WATCH_TUNE.thumbH;
    const ctx = cvs.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, cvs.width, cvs.height);
    return WATCH_DIFF.luma(ctx.getImageData(0, 0, cvs.width, cvs.height).data);
  }

  /* ---- THE FACE ----
     ONE element, and its home is wherever the card is. It used to open a Document PiP
     window of its own and therefore had a stylesheet of its own, which is the part that
     went: #facecard is now the top row of the shared desktop card, or - when the browser
     will not give up a window at all - the same row in the page's top-right lane, under
     the countdown. The rules that used to be in a string here are in the page's own
     stylesheet next to #facecard, which the desktop window inherits whole. */

  /* A face rather than a dot, because the request was for a face: a ring, two eyes
     and a mouth that is a single dry line. It breathes at the diff cadence, so what
     you are looking at is the feature's own pulse. */
  const FACE_MARKUP =
    '<div class="wrap" id="wrap">' +
    '<svg class="mark" viewBox="0 0 48 48" fill="none" stroke="#ffb74d"' +
    ' stroke-width="2" stroke-linecap="round">' +
    '<circle cx="24" cy="24" r="21" stroke="rgba(255,183,77,.45)"/>' +
    '<circle cx="24" cy="24" r="15.5" stroke="rgba(255,183,77,.22)">' +
    '<animate attributeName="r" values="15.5;17;15.5" dur="5s"' +
    ' repeatCount="indefinite"/></circle>' +
    '<circle cx="17.5" cy="21" r="2.6" fill="#ffb74d" stroke="none"/>' +
    '<circle cx="30.5" cy="21" r="2.6" fill="#ffb74d" stroke="none"/>' +
    '<path d="M17 31.5h14"/></svg>' +
    '<div><div class="t">watching</div><div class="s" id="face-s">still 0:00</div></div>' +
    '</div>';

  /* The face row, in whichever document it currently sits. It is built once - the markup
     is the same in both homes, so there is nothing to rebuild when it moves - and shown
     or hidden by one class, which is the whole of "render only what is live" for this
     organ. The pin button is only useful in the page, and DESK_CSS hides it out there. */
  function paintFace() {
    const secs = Math.floor(watchStillMs() / 1000);
    const text = watchOn
      ? 'still ' + Math.floor(secs / 60) + ':' + ('0' + (secs % 60)).slice(-2)
      : 'not watching';
    const s = $('face-s');
    if (s) s.textContent = text;
    const card = $('facecard');
    if (!card) return;
    if (!card.dataset.built) {
      card.innerHTML = '<div class="row">' + FACE_MARKUP + '</div>' +
        (canPin ? '<button class="pin" id="face-pin" type="button">' +
                  'pin me to the desktop</button>' : '');
      card.dataset.built = '1';
      const pin = $('face-pin');
      /* The same window every other organ asks for. A refusal is DESK_REFUSED_LINE, said
         once per page by deskRefuse() - not once per organ, which is what three separate
         windows used to cost you. */
      if (pin) pin.onclick = function () { return deskOpen('click'); };
    }
    card.classList.toggle('show', watchOn);
  }

  function paintWatch() {
    $('watching').classList.toggle('live', watchOn);
    $('screen').classList.toggle('watching', watchOn);
    if (watchOn) {
      const secs = Math.floor(watchStillMs() / 1000);
      $('watch-dim').textContent = 'still ' + secs + 's / ' + WATCH_TUNE.stillS + 's' +
        (watchSurface ? ' · ' + watchSurface : '');
      $('watch-sent').textContent = 'watching · ' + (watchNudges
        ? watchNudges + (watchNudges === 1 ? ' frame sent' : ' frames sent')
        : 'no frame sent');
    }
    paintFace();
    /* Two organs' worth of consequence, in the two functions that own them: whether
       there is still a card to be out there at all, and where everything sits. */
    deskTend();
    layout();
  }

  /* The server's windows, applied rather than assumed. A watch that is about to spend
     money on a threshold should be using the threshold the purse agrees with. */
  async function watchTune() {
    try {
      const res = await fetch('/stuck');
      const data = await res.json();
      if (data && data.tuning) WATCH_TUNE = Object.assign({}, WATCH_TUNE, data.tuning);
    } catch (e) { /* the defaults above are the same numbers; carry on */ }
    return WATCH_TUNE;
  }

  /* What surface did we actually get? The one question the whole trap turns on, and
     it is asked of the TRACK rather than of what we requested: asking for a monitor
     and being handed a tab is precisely the case that must be caught. */
  function surfaceOf() {
    if (!shareStream) return '';
    const track = shareStream.getVideoTracks()[0];
    if (!track || !track.getSettings) return '';
    return String(track.getSettings().displaySurface || '');
  }

  function refuseSurface(surface) {
    const key = surface === 'browser' ? 'tab' : 'window';
    watchTrouble = key;
    renderAnswer('watch my screen', WATCH_TROUBLE[key], true, null);
    if (!speak(spokenForm(WATCH_TROUBLE[key]))) idleStatus();
  }

  async function startWatch() {
    if (watchOn) return true;
    if (!canShare) {
      watchTrouble = 'unsupported';
      renderAnswer('watch my screen', WATCH_TROUBLE.unsupported, true, null);
      if (!speak(spokenForm(WATCH_TROUBLE.unsupported))) idleStatus();
      return false;
    }
    watchTrouble = '';
    await watchTune();

    /* ANSWER FROM THE SAME SHARE, and this is where that is decided: if a share is
       already live it is used as it is. Two shares of one desktop is two pickers, two
       streams and two chips for one screen, and the second one buys nothing. */
    const had = sharing();
    if (!had) {
      /* THE PICKER OPENS ON ENTIRE SCREEN. displaySurface is a hint and the user may
         still pick a tab, which is what the refusal below is for; selfBrowserSurface
         keeps this very tab out of the list, since watching the watcher is the one
         choice that is never right. */
      const got = await startShare({
        displaySurface: 'monitor',
        selfBrowserSurface: 'exclude',
        surfaceSwitching: 'include',
        monitorTypeSurfaces: 'include'
      });
      if (!got) {
        watchTrouble = 'cancelled';
        return false;
      }
    }

    watchSurface = surfaceOf();
    /* The trap. A tab is refused outright; so is a single window, for the first of
       the same two reasons. If this call opened the share, it closes it again -
       leaving a capture running that nothing is allowed to use would be rude. */
    if (watchSurface === 'browser' || watchSurface === 'window') {
      refuseSurface(watchSurface);
      if (!had) endShare();
      return false;
    }

    watchOn = true;
    watchOpenedShare = !had;
    watchThumb = watchThumbNow();
    watchStillFrom = Date.now();
    watchTicks = 0; watchChanges = 0; watchLastDiff = null;
    watchTimer = setInterval(watchTick, WATCH_TUNE.tickMs);
    /* A surface swapped mid-share through Chrome's own bar is the same question
       again, so it is asked again rather than answered from the first reading. */
    const track = shareStream && shareStream.getVideoTracks()[0];
    if (track && track.addEventListener) {
      track.addEventListener('configurationchange', function () {
        if (!watchOn) return;
        watchSurface = surfaceOf();
        if (watchSurface === 'browser' || watchSurface === 'window') {
          stopWatch('surface');
          refuseSurface(watchSurface);
        } else {
          watchThumb = null;            // a new surface is not a still old one
          watchStillFrom = Date.now();
          paintWatch();
        }
      });
    }
    paintWatch();
    /* THE CARD, asked for by the press that started this watch. If the countdown already
       has the window open, this joins it - paintWatch() above has already put the face
       row and the chip in it, and deskOpen returns the window it did not need to open. */
    const pinned = await deskOpen('press');
    /* Two endings now rather than three: pinned says nothing extra, and a browser that
       could have pinned and did not gets the "click anywhere" promise - which is the one
       of them that is a promise this page can actually keep. */
    const line = WATCH_LINES.on + (pinned || !canPin ? '' : ' ' + WATCH_LINES.nopin);
    renderAnswer('watch my screen', line, false, null);
    if (!speak(spokenForm(line))) idleStatus();
    return true;
  }

  /* reason: 'said' | 'chip' | 'face' | 'ended' | 'surface' | 'blind'. Only the first
     two are the man changing his mind, and only they are worth a pleasantry. */
  function stopWatch(reason) {
    const was = watchOn;
    watchOn = false;
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    watchTimer = null;
    watchThumb = null;
    watchStillFrom = 0;
    watchSurface = '';
    /* No window to close here any more. paintWatch() drops .live off the chip and .show
       off the face row, and deskTend() - which it calls - closes the desktop card if the
       watch was the last organ in it. An organ leaving is a row closing, not a window
       being taken from whoever else is still using it. */
    paintWatch();
    if (!was) return false;
    /* A capture nobody is using is a red light on the taskbar for no reason, so a
       share this organ opened goes out with it. 'ended' is the share dying of its own
       accord, and there is nothing left to close. */
    const mine = watchOpenedShare;
    watchOpenedShare = false;
    if (mine && reason !== 'ended' && sharing()) endShare();
    if (reason === 'said' || reason === 'chip' || reason === 'face') {
      renderAnswer('stop watching', WATCH_LINES.off, false, null);
      if (!speak(spokenForm(WATCH_LINES.off))) idleStatus();
    } else if (reason === 'ended') {
      if (!speak(spokenForm(WATCH_TROUBLE.ended))) idleStatus();
    }
    return true;
  }

  /* THE TICK. Five seconds apart, and this is the whole of what it costs: one
     drawImage into a 32x18 canvas, one getImageData, 576 subtractions. */
  function watchTick() {
    if (!watchOn) return;
    if (!sharing()) return stopWatch('ended');
    const now = watchThumbNow();
    if (!now) {
      /* No picture from a live track: worth saying once, and worth stopping for.
         A watch that cannot see is not watching, whatever the chip says. */
      watchTrouble = 'blind';
      const line = WATCH_TROUBLE.blind.replace('{detail}',
        'the share is live but has produced no frame to compare.');
      stopWatch('blind');
      renderAnswer('watch my screen', line, true, null);
      if (!speak(spokenForm(line))) idleStatus();
      return;
    }
    return watchFeed(now);
  }

  /* THE SEAM, and it is the same seam the eyes have in their own feed: watchTick() reads
     the screen and hands the 576 numbers to this, so a test can hand it numbers of
     its own without a camera, a monitor or a picker. Everything downstream - the
     diff, the stillness clock, the threshold, the nudge - is the code the
     five-second timer drives, which is the only reason driving it by hand proves
     anything. */
  function watchFeed(now) {
    if (!watchOn || !now) return null;
    watchTicks++;
    const verdict = WATCH_DIFF.diff(watchThumb, now, WATCH_TUNE);
    watchThumb = now;
    watchLastDiff = verdict;
    if (verdict.changed) {
      watchChanges++;
      watchStillFrom = Date.now();     // THE STILLNESS CLOCK, reset by pixels alone
      paintWatch();
      return verdict;
    }
    paintWatch();
    if (watchStillMs() < WATCH_TUNE.stillS * 1000) return verdict;
    /* A question in flight owns the answer card and the voice. The nudge waits for
       the next tick rather than talking over it; the stillness clock keeps running,
       so nothing is lost but five seconds. */
    if (busy) { watchBusyHold++; return verdict; }
    nudgeNow();
    return verdict;
  }

  /* THE ONE PLACE IN THIS ORGAN THAT SENDS ANYTHING. */
  async function nudgeNow() {
    if (!watchOn || busy) return null;
    const stillS = Math.round(watchStillMs() / 1000);
    // Grabbed HERE, after the decision to speak and before anything is sent - the
    // same rule as every other frame in this page, for the same reason.
    const shot = await grabFrame('screen');
    if (shot.error) {
      if (shot.error === 'ended') { stopWatch('ended'); return null; }
      return null;                     // notready/encode: try again in five seconds
    }
    const age = Math.round(performance.now() - shot.at);
    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    const wrap = $('wrap');
    if (wrap) wrap.classList.add('think');
    try {
      const res = await fetch('/stuck?stillS=' + encodeURIComponent(stillS), {
        method: 'POST',
        headers: {
          'Content-Type': FRAME_TYPE,
          'X-Frame-Width': String(shot.w),
          'X-Frame-Height': String(shot.h),
          'X-Frame-Age-Ms': String(age)
        },
        body: shot.blob
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      if (data && data.tuning) WATCH_TUNE = Object.assign({}, WATCH_TUNE, data.tuning);
      watchLastNudge = {
        at: Date.now(), stillS: stillS, status: res.status,
        bytes: shot.blob.size, w: shot.w, h: shot.h, ageMs: age,
        spent: !!(data && data.spent), quiet: !!(data && data.quiet),
        why: (data && data.why) || null,
        spoke: false,
        text: (data && (data.answer || data.error)) || ''
      };
      /* A SUPPRESSED NUDGE SAYS NOTHING. The relief valve and the cooldown both come
         back as quiet refusals, and a silence that explains itself out loud is not a
         silence - it is the interruption wearing a different hat. */
      if (data && data.quiet) {
        watchStillFrom = Date.now();   // do not re-ask every five seconds
        return watchLastNudge;
      }
      const text = !data
        ? 'The brain replied with something that was not JSON (HTTP ' +
          res.status + ').'
        : (data.error || data.answer || '');
      if (!text) return watchLastNudge;
      const isError = !data || !!data.error;
      if (data && data.spent) watchNudges++;
      /* Rendered with the question it answers, which is nobody's: this is the one
         line in the page that arrives unasked, and the card says so. */
      renderAnswer('· unasked · your screen has not moved in ' + stillS + ' seconds',
                   text, isError, null);
      showProof(shot, age, 'the one frame sent',
                'sent unasked, after ' + stillS + ' seconds of a still screen');
      watchLastNudge.spoke = speak(spokenForm(text));
      if (!watchLastNudge.spoke) idleStatus();
      // A nudge about a screen cites no note, so the graph holds still.
      applyCamera(decideCamera('screen', [], isError), []);
      /* The cooldown is the server's, and the stillness clock restarts here so the
         next nudge is measured from this one rather than from the last movement. */
      watchStillFrom = Date.now();
      return watchLastNudge;
    } catch (e) {
      return null;                     // unreachable brain: silence, and try later
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
      const w2 = $('wrap');
      if (w2) w2.classList.remove('think');
    }
  }

  /* The chip's stop, and a repaint that keeps the stillness number honest between
     ticks: the diff runs every five seconds, the clock is read every second. */
  $('watch-stop').onclick = function () { stopWatch('chip'); };
  setInterval(function () { if (watchOn) paintWatch(); }, 1000);

  /* The spoken door, and it is deliberately narrow: the WHOLE message, or it is not an
     answer to the question that was asked. "yes" is consent; "yes, and what is the
     population of Tokyo" is a change of subject, which withdraws the proposal instead.
     The server holds the same two patterns and has the last word on both - these exist
     so a confirmation does not have to travel through the organ routing below. */
  /* The same two patterns as hands.py YES_RE / NO_RE, in the same shape: a word of one
     kind, possibly repeated with a comma or an "and" - because "yes, go ahead" is what a
     microphone actually hears - and nothing else in the message. A message mixing the two
     kinds matches neither and is a withdrawal, since an ambiguous answer is not consent.
     The server decides regardless; these exist so the page does not show a Yes/No pair
     for a fifth of a second after the word that settled it. */
  const YES_WORDS = "yes|yes\\s+please|yep|yeah|yup|aye|ok|okay|okey\\s*dokey|sure|go\\s+ahead|go\\s+on|do\\s+it|send\\s+it|please\\s+do|do\\s+so|proceed|confirm(?:ed)?|affirmative|very\\s+well|if\\s+you\\s+would|that'?s\\s+right|correct|please";
  const NO_WORDS = "no|no\\s+thanks|no\\s+thank\\s+you|nope|nah|negative|cancel|cancel\\s+(?:it|that)|stop|don'?t|do\\s+not|never\\s*mind|forget\\s+it|leave\\s+it|hold\\s+off|not\\s+now|not\\s+yet|scrap\\s+(?:it|that)|on\\s+second\\s+thought(?:s)?|thank\\s+you";
  const wholeWord = w => new RegExp("^[\\s\"'(]*(?:" + w + ")(?:[\\s,]+(?:and\\s+|but\\s+)?(?:" + w + "))*[\\s.!,\"')]*$", "i");
  const SAID_YES_RE = wholeWord(YES_WORDS);
  const SAID_NO_RE = wholeWord(NO_WORDS);

  async function ask(question) {
    if (busy || !question.trim()) return;

    /* THE GATE FIRST, above every organ below it. While something is awaiting a word,
       that word decides what happens - and a sentence that is neither yes nor no is a
       withdrawal, which is settled before the sentence is answered as an ordinary
       question. */
    if (proposal) {
      if (SAID_YES_RE.test(question)) return confirmProposal('voice');
      if (SAID_NO_RE.test(question)) return refuseProposal('voice');
      /* Anything else: /chat withdraws it server-side and says so in front of the
         answer. For the page's own organs - the share, the eyes, the watch, a capture -
         nothing would reach /chat at all, so the withdrawal is sent explicitly. */
      if (CAPTURE_RE.test(question) || isSwap(question) || isFocusPhrase(question) ||
          LOOK_RE.test(question) || WATCH_OFF_RE.test(question) ||
          WATCH_RE.test(question) || sharing()) await withdrawProposal();
      else hideProposal();
    }

    // Growing the brain is not asking it a question. The server checks this too,
    // so a stale tab cannot answer a capture instead of performing it.
    if (CAPTURE_RE.test(question)) return capture(question);

    /* Changing brains is not asking one a question either, and it is checked before
       the share below: "switch to Astra" while sharing is an instruction, not a
       request to read my screen. The server checks this too. */
    if (isSwap(question)) return swapBrain(question);

    /* Neither is telling the timer what to do, and it is checked before the share
       for the same reason: "give me fifteen seconds" while sharing is a snooze, not
       a request to read the screen. The server checks this too.

       This is also the line that makes "lock on this tab" mean the TARGET rather than
       the pixels. SCREEN_RE matches "this tab" as well, and whichever of them is
       tested first wins - so the one that changes what is being watched goes first,
       and the share keeps every phrase it had outside a live session. */
    if (isFocusPhrase(question)) return fxSend({ say: question });

    /* "Look at me", "what do you think of my shirt?" - the eyes' one frame, and
       checked BEFORE the share for the same reason as everything above it: while a
       screen share is live, every plain sentence goes to the screen, and a question
       about your own shirt answered with a photograph of your desktop would be the
       wrong organ entirely. SCREEN_RE keeps "this" and "that"; this keeps "me". */
    if (LOOK_RE.test(question)) return lookAtMe(question);

    /* "Watch my screen" / "stop watching" - an instruction about the watch, and it has
       to be tested before the share branch below, which would otherwise take "watch my
       screen" while sharing as a question ABOUT the screen and photograph it. Off
       first: "stop watching my screen" contains "watching my screen". */
    if (WATCH_OFF_RE.test(question)) {
      if (!stopWatch('said')) {
        const line = 'I was not watching, sir.';
        renderAnswer(question, line, false, null);
        if (!speak(spokenForm(line))) idleStatus();
      }
      return;
    }
    if (WATCH_RE.test(question)) return startWatch();

    /* Sharing? Then anything but a pleasantry is a question about what is on the
       screen - and while the watch is running that is THE SAME SHARE, which is the
       whole of "answer from the same share": see() takes its frame from FRAME_SOURCES
       .screen, the diff loop reads the same video, and neither needs a second picker. */
    if (sharing() && localKind(question) === 'notes' &&
        !FORCE_WEB_RE.test(question)) return see(question);

    /* The share is over. A screen-shaped question is told so plainly: it must never
       be answered from the frame we used to have, and it should not quietly become
       a question about the notes either. */
    if (shareEndedAt && (Date.now() - shareEndedAt) < SHARE_MEMORY_MS &&
        SCREEN_RE.test(question)) {
      renderAnswer(question, SIGHT_TROUBLE.ended, true, null);
      if (!speak(spokenForm(SIGHT_TROUBLE.ended))) idleStatus();
      return;
    }

    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    setStatus('thinking', 'thinking', question);
    // The interim "Thinking…" line is shown but deliberately never spoken, and it
    // never touches the graph - the camera waits until we know what was asked.
    renderAnswer(question, 'Thinking across ' + nodes.length + ' notes…', false, null);

    /* One reply path for answers and errors alike: show it, say it, then let the
       camera prove it. Speaking starts first so the flight happens mid-sentence. */
    function respond(text, isError, ids, kind, sources, backend, pending) {
      const used = renderAnswer(question, text, isError, ids, sources);
      const plan = decideCamera(kind, used, isError);
      if (!speak(spokenForm(text))) idleStatus();
      /* THE PROPOSAL. The server has asked them something and is waiting; the pair of
         buttons and the exact parameters go under the sentence it composed. Nothing has
         happened yet, and nothing will until one of them is pressed. */
      if (pending) showProposal(pending);
      /* THE VISUAL CUE. A note answer lights its star; a web answer has no star, so
         the whole sky breathes cyan once and the panel shows the addresses instead.
         The panel opens before applyCamera, which for kind 'web' is a no-op anyway -
         see decideCamera - so there is nothing to fight over. */
      if (kind === 'web') {
        pulseWeb();
        openSources(question, sources, backend);
      }
      applyCamera(plan, used);
    }

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, session: SESSION })
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      // The server classifies; localKind() only covers an older or broken server,
      // so the small-talk rule holds either way.
      const kind = (data && data.kind) || localKind(question);
      // Sources come from the SERVER or not at all. This page never composes a URL,
      // never repairs one, and never reads one out of the answer text: a link that has
      // been through a language model is not a citation, it is a guess with an anchor
      // tag. safeUrl() then has the last word on every one of them.
      const sources = (data && Array.isArray(data.sources)) ? data.sources : null;
      const backend = (data && typeof data.backend === 'string') ? data.backend : '';
      if (!data) {
        respond('The server replied with something that was not JSON (HTTP ' +
          res.status + ').', true, null, 'chat');
      } else if (data.error) {
        respond(data.error, true, data.nodes, kind, sources, backend, data.pending);
      } else {
        respond(data.answer || '(empty answer)', false, data.nodes, kind, sources,
                backend, data.pending);
      }
    } catch (e) {
      respond('Could not reach the brain. Start it with "python server.py" and open ' +
        'http://localhost:4700 (opening index.html straight from disk will not work).',
        true, null, 'chat');
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
    }
  }

  $('bar').addEventListener('submit', function (e) {
    e.preventDefault();
    const v = $('q').value;
    $('q').value = '';
    ask(v);
  });
  $('reset').onclick = async function () {
    try {
      await fetch('/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: SESSION })
      });
    } catch (e) { /* nothing to forget if the server is not there */ }
    $('answer').classList.remove('show');
    /* The ↻ button clears a pending proposal with everything else - the server drops it
       too, inside /reset, so this is the UI catching up rather than the decision. */
    hideProposal();
    stopListening();
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e2) { /* ignore */ } }
    idleStatus();
    $('q').focus();
  };

  /* ================================================================ voice == */

  /* ?mute=1 silences this tab for good. The check lives inside speak() and
     nowhere else, so no code path can route around it. */
  const MUTED = /(^|[?&])mute=1(&|$)/.test(location.search);

  /* Barked interrupts skip the FINISH_MS buffer entirely. Only checked against
     FINAL results: an interim "stop" is often the start of "stop the roaster". */
  const INTERRUPTS = new Set(['stop', 'wait', 'cancel', 'halt', 'quiet', 'enough',
                              'hold on', 'shut up', 'never mind', 'nevermind']);

  const canSpeak = 'speechSynthesis' in window;
  const Recogniser = window.webkitSpeechRecognition || window.SpeechRecognition;

  let audioUnlocked = false, pendingLine = null, chosenVoice = null;
  let recogniser = null, listening = false;
  let phraseBuffer = '', lastInterim = '', finishTimer = null;

  function setStatus(state, text, said) {
    $('status').className = state || '';
    $('status-text').textContent = text;
    $('status-said').textContent = said || '';
  }

  function idleStatus() {
    if (MUTED) return setStatus('', 'muted tab · this page will not speak');
    if (!canSpeak) return setStatus('', 'no speech synthesis in this browser');
    if (!audioUnlocked) return setStatus('', 'click anywhere to switch the voice on');
    setStatus('', listening ? 'listening' : 'ready');
  }

  /* ---- the voice: British English if the system has one ---- */
  function pickVoice() {
    if (!canSpeak) return null;
    const voices = speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    function score(v) {
      const name = (v.name || '').toLowerCase();
      const lang = (v.lang || '').replace('_', '-').toLowerCase();
      let s = 0;
      if (lang.indexOf('en-gb') === 0) s += 100;                    // British first
      else if (lang.indexOf('en-ie') === 0 || lang.indexOf('en-au') === 0) s += 40;
      else if (lang.indexOf('en') === 0) s += 20;
      if (/uk english|british|libby|sonia|ryan|george|hazel|daniel|arthur|kate|serena|oliver|thomas/.test(name)) s += 25;
      if (/natural|neural|enhanced|premium/.test(name)) s += 8;
      if (/google/.test(name)) s += 6;
      return s;
    }
    return voices.slice().sort(function (a, b) { return score(b) - score(a); })[0] || null;
  }

  function refreshVoice() {
    chosenVoice = pickVoice();
    $('status').title = chosenVoice
      ? 'voice: ' + chosenVoice.name + ' (' + chosenVoice.lang + ')'
      : 'voice: browser default';
    return chosenVoice;
  }

  /* ---- what this page has said, for six seconds ----
     A muted tab still has to be checkable: the live harnesses load with ?mute=1 so the
     machine stays quiet, and "did the nudge arrive, and how fast" is a question about
     the LINE rather than about the sound. So every line that reaches speak() is
     recorded here with whether it actually reached the speakers.

     The window is six seconds because that is focus.py's LABEL_LINE_TTL_S, and for the
     same reason: a callout may name the place you drifted to, the server drops that
     sentence one tick after sending it, and this page must not be the thing that
     outlives the scrub. Nothing reads this to say anything - it is a record, not a
     second speaking path. */
  const SAID_TTL_MS = 6000;
  const saidLines = [];

  function saidLog() {
    const cut = Date.now() - SAID_TTL_MS;
    while (saidLines.length && saidLines[0].at < cut) saidLines.shift();
    return saidLines.slice();
  }
  function noteSaid(line, aloud) {
    saidLines.push({ at: Date.now(), text: line, aloud: !!aloud });
    saidLog();
  }
  // Pruned on a timer as well as on every read, so a line nobody asks about still goes.
  setInterval(saidLog, 1000);

  /* ---- THE one function that speaks ---- */
  function speak(text) {
    const line = String(text == null ? '' : text).trim();
    if (!line) return false;
    if (MUTED) { noteSaid(line, false); return false; }   // the mute gate, the only one
    if (!canSpeak) { noteSaid(line, false); return false; }
    if (!audioUnlocked) {
      // Autoplay policy: hold the line and let the first real click release it.
      pendingLine = line;
      setStatus('', 'click anywhere to hear this answer');
      noteSaid(line, false);
      return false;
    }
    if (!chosenVoice) refreshVoice();
    try {
      speechSynthesis.cancel();                    // never stack two answers
      const u = new SpeechSynthesisUtterance(line);
      /* A voice we cannot set must not cost the answer its voice: a browser that
         refuses this assignment still speaks perfectly well in its default. */
      u.lang = (chosenVoice && chosenVoice.lang) || 'en-GB';
      if (chosenVoice) {
        try { u.voice = chosenVoice; } catch (e) { /* default voice it is */ }
      }
      u.rate = 1; u.pitch = 1; u.volume = 1;
      u.onstart = function () { setStatus('speaking', 'speaking'); };
      u.onend = function () { idleStatus(); };
      u.onerror = function () { idleStatus(); };
      speechSynthesis.speak(u);
      noteSaid(line, true);
      return true;
    } catch (e) {
      noteSaid(line, false);
      return false;
    }
  }

  /* ---- the first gesture unlocks audio and releases any held line ---- */
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (MUTED || !canSpeak) { idleStatus(); return; }
    try {                                          // prime the engine in-gesture
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0;
      speechSynthesis.speak(warm);
    } catch (e) { /* nothing to warm up */ }
    refreshVoice();
    if (pendingLine) { const line = pendingLine; pendingLine = null; speak(line); }
    else idleStatus();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    addEventListener(ev, unlockAudio, { passive: true });
  });

  /* ---- listening: buffer phrases until the pause that ends the thought ---- */
  function armFinishTimer() {
    clearTimeout(finishTimer);
    finishTimer = setTimeout(flushThought, FINISH_MS);
  }

  function heardFinal(text) {
    const raw = String(text == null ? '' : text).trim();
    if (!raw) return;
    const bare = raw.toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();
    if (INTERRUPTS.has(bare)) return interrupt(bare);   // straight past the buffer
    lastInterim = '';
    phraseBuffer = phraseBuffer ? phraseBuffer + ' ' + raw : raw;
    armFinishTimer();
    setStatus('listening', 'listening', phraseBuffer);
  }

  function heardInterim(text) {
    // More words are arriving, so that last pause was not the end of anything.
    lastInterim = String(text == null ? '' : text).trim();
    armFinishTimer();
    setStatus('listening', 'listening', (phraseBuffer + ' ' + lastInterim).trim());
  }

  function flushThought() {
    clearTimeout(finishTimer);
    finishTimer = null;
