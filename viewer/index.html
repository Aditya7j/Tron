     card plus its two margins, because a 460px card on a 300px canvas is not a card
     that is tight, it is a card half of which is off the screen. */
  CARD_MIN: 512,
  CARD_FLOOR: 210,   // and below THIS it stands down entirely
  TOAST_MAX: 760,    // the toast's full width, panel closed
  TOAST_MIN: 220,
  CHIP_MIN: 860,     // the brain chip and its menu hide below this much canvas
  MOVE_MS: 220,      // every transition in the governed rules matches this
  PANEL_MAX: 420,    // must match nothing: this IS the panel's width
  PANEL_VW: 0.88,
};
let layoutLast = null;    // the last set of rectangles, for the probe and __galaxy

/* An element this document may position: in the page, and not adopted away. */
function layoutMine(id) {
  const el = document.getElementById(id);
  return el && el.ownerDocument === document ? el : null;
}
/* Visible enough to occupy a slot, which is how a chip that is not live gets no room
   rather than an empty gap. getClientRects() and not offsetParent: every surface here is
   position:fixed, and offsetParent is null for a fixed element whether it is displayed or
   not - a test that answers "no" for all four of them is a lane that never advances. */
function layoutShown(el) {
  return !!(el && el.getClientRects().length);
}

/* vwOverride is for the probe and for nothing else: "the canvas is too narrow for both"
   is a real branch with real consequences, and the only other way to reach it is to
   resize the harness's window and make every other case measure a viewport it did not
   ask for. Callers in the page pass nothing - which is also why the two listeners below
   are wrapped rather than passed directly, since an Event is not a width. */
function layout(vwOverride) {
  const vw = vwOverride || window.innerWidth, vh = window.innerHeight;
  const panel = layoutMine('panel');
  const panelOpen = !!(panel && panel.classList.contains('open'));
  const panelW = Math.min(LAYOUT.PANEL_MAX, Math.round(vw * LAYOUT.PANEL_VW));
  /* THE RESERVED LANE. The canvas is what is left of the window, and the panel edge
     is a wall: no governed surface is placed to the right of it while it is open. */
  const taken = panelOpen ? panelW : 0;
  const canvasW = Math.max(0, vw - taken);

  if (panel) {
    panel.style.top = '0px';
    panel.style.right = '0px';
    panel.style.height = '100%';
    panel.style.width = panelW + 'px';
  }

  /* ---- 2. the top-right lane: countdown card, face row, legend ---- */
  const laneRight = taken + LAYOUT.EDGE;
  const card = layoutMine('focuscard');
  if (card) {
    /* The card decides its DRESS before the lane measures it, because a pill is a
       different height. Full dress needs room for itself and a margin either side. */
    const fits = canvasW - LAYOUT.EDGE * 2;
    card.classList.toggle('nofit', fits < LAYOUT.CARD_FLOOR);
    card.classList.toggle('pill', fits >= LAYOUT.CARD_FLOOR && fits < LAYOUT.CARD_MIN);
    if (!card.classList.contains('pill')) card.style.width = LAYOUT.CARD_W + 'px';
    else card.style.width = '';
  }
  let laneTop = LAYOUT.TOP;
  ['focuscard', 'facecard', 'legend'].forEach(function (id) {
    const el = layoutMine(id);
    if (!el) return;
    el.style.right = laneRight + 'px';
    el.style.top = laneTop + 'px';
    if (layoutShown(el)) laneTop += el.offsetHeight + LAYOUT.GAP;
  });

  /* ---- 3. the answer toast: never wider than the canvas ---- */
  /* A spoken report is long, and the CONNECTED chips live behind its right-hand end.
     Panel open, the toast stops at the panel edge; panel closed, it goes back to its
     full width. The two are never in the same column at the same time. */
  const toast = layoutMine('brain');
  let toastBox = null, cardBox = null, cleared = false;
  if (toast) {
    let w = Math.max(LAYOUT.TOAST_MIN,
                     Math.min(LAYOUT.TOAST_MAX, canvasW - LAYOUT.EDGE * 2));
    const left = Math.max(LAYOUT.EDGE / 2, (canvasW - w) / 2);

    /* ---- 3b. THE MEASURED CLEARANCE: the toast and the card may never overlap ----
       This is the one pair in the lane system that is not kept apart by construction. The
       card is top-right and the toast is bottom-centre, so on a roomy window they are
       nowhere near each other - and every instinct says leave it at that. But the card's
       HEIGHT is content: a dictated intent of three lines, a stats block, two button rows
       and a visage, and on a short window its bottom edge comes down to meet a toast whose
       own height is however long the answer was. The old arrangement was not a rule, it was
       a coincidence about the viewport, and it failed silently in the one direction nobody
       resizes towards.

       So the boxes are worked out and TESTED, not hoped about. The horizontal geometry is
       the geometry this function has just assigned - exact, and not read back out of a
       transition that is 3ms into its 220ms - while the heights are measured, because a
       height is content and nothing here assigns it. If the two rectangles intersect, the
       toast gives up width until its right edge clears the card's left edge by one GAP.
       Width, and not position: the toast is the wider, more forgiving surface and a
       countdown that jumped sideways whenever an answer arrived would be the cure being
       worse than the disease. One pass is enough and provably so - once the two are
       disjoint on the x axis, no height either of them later takes can bring them back
       together. */
    const cardShown = card && layoutShown(card) && !card.classList.contains('nofit');
    if (cardShown) {
      const cw = card.classList.contains('pill') ? card.offsetWidth : LAYOUT.CARD_W;
      cardBox = { left: vw - laneRight - cw, right: vw - laneRight,
                  top: LAYOUT.TOP, bottom: LAYOUT.TOP + card.offsetHeight };
    }
    const toastH = toast.offsetHeight;
    const hit = function (l, wide) {
      if (!cardBox) return false;
      const box = { left: l, right: l + wide,
                    top: vh - LAYOUT.EDGE - toastH, bottom: vh - LAYOUT.EDGE };
      return box.right > cardBox.left && box.left < cardBox.right &&
             box.bottom > cardBox.top && box.top < cardBox.bottom;
    };
    if (hit(left, w)) {
      w = Math.max(LAYOUT.TOAST_MIN, cardBox.left - LAYOUT.GAP - left);
      cleared = true;
    }
    toast.style.width = w + 'px';
    toast.style.left = left + 'px';
    toast.style.right = 'auto';
    toast.style.bottom = LAYOUT.EDGE + 'px';
    toast.style.transform = 'none';       // the old translateX(-50%) centring, retired
    toastBox = { left: left, right: left + w, width: w,
                 top: vh - LAYOUT.EDGE - toastH, bottom: vh - LAYOUT.EDGE,
                 cleared: cleared, overlaps: hit(left, w) };
  }

  /* ---- 4. the status row and the live chips ---- */
  const bchip = layoutMine('brainchip'), bmenu = layoutMine('brainmenu');
  if (bchip) {
    bchip.style.left = LAYOUT.EDGE + 'px';
    bchip.style.bottom = '104px';
    bchip.classList.toggle('tight', canvasW < LAYOUT.CHIP_MIN);
  }
  if (bmenu) {
    bmenu.style.left = LAYOUT.EDGE + 'px';
    bmenu.style.bottom = '136px';
    bmenu.classList.toggle('tight', canvasW < LAYOUT.CHIP_MIN);
  }
  /* Three chips can be live at once and any one of them can be the only one. This
     stack replaces the sibling-selector cascade that used to hard-code 62px and
     108px: measured heights, in order, centred on the CANVAS rather than the window
     so an open panel does not push them under itself. */
  let chipTop = LAYOUT.CHIP_TOP;
  const chipMid = Math.round(canvasW / 2);
  ['sharing', 'watching', 'eyeing'].forEach(function (id) {
    const el = layoutMine(id);
    if (!el) return;
    el.style.left = chipMid + 'px';
    el.style.transform = 'translateX(-50%)';
    el.style.top = chipTop + 'px';
    if (layoutShown(el)) chipTop += el.offsetHeight + 8;
  });

  layoutLast = {
    vw: vw, vh: vh, panelOpen: panelOpen, panelW: taken, canvasW: canvasW,
    laneRight: laneRight, laneBottom: laneTop,
    card: card ? { pill: card.classList.contains('pill'),
                   nofit: card.classList.contains('nofit'),
                   inPage: true } : { inPage: false },
    toast: toast ? { width: parseFloat(toast.style.width),
                     left: parseFloat(toast.style.left) } : null,
    /* THE TWO RECTANGLES, AS THE GOVERNOR DECIDED THEM, and its own verdict on whether they
       touch. `overlaps` is re-tested against the width it actually assigned rather than the
       one it started from, so this is a report and not a restatement of the intention -
       layout_proof reads it and then measures the same two boxes off the page to check that
       the governor and the browser agree. */
    cardBox: cardBox, toastBox: toastBox,
    clearedToast: cleared,
    overlap: !!(toastBox && toastBox.overlaps),
    chipsBottom: chipTop, tight: canvasW < LAYOUT.CHIP_MIN,
  };
  return layoutLast;
}

/* A panel toggle and a resize both re-run it. Three places in this file add or
   remove #panel.open; watching the attribute means none of them has to remember to
   call the governor, which is the only way "none positions itself" stays true. */
window.addEventListener('resize', function () { layout(); });
(function () {
  const panel = document.getElementById('panel');
  if (panel && window.MutationObserver) {
    new MutationObserver(function () { layout(); }).observe(panel,
      { attributes: true, attributeFilter: ['class'] });
  }
})();
layout();

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) +
         ',' + alpha + ')';
}
/* Blend a group colour towards white by t (0..1) - the flare of a new note. */
function mixToWhite(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  const k = Math.max(0, Math.min(1, t));
  const up = function (v) { return Math.round(v + (255 - v) * k); };
  return 'rgb(' + up((n >> 16) & 255) + ',' + up((n >> 8) & 255) + ',' +
         up(n & 255) + ')';
}
/* Blend ANY colour this file produces - '#rrggbb' or 'rgba(r,g,b,a)' - towards a hex
   target by t, leaving the alpha exactly as it was. mixToWhite above cannot do this
   job: the web pulse washes over colours that have already been dimmed or muted, and
   re-deriving them from the group would throw away the dimming, which would make a
   hidden folder light up cyan the moment the web answered something. */
function washTo(color, hex, t) {
  const k = Math.max(0, Math.min(1, t));
  const to = parseInt(hex.slice(1), 16);
  let r = 255, g = 255, b = 255, a = 1;
  const parts = /^rgba?\(([^)]+)\)$/.exec(String(color));
  if (parts) {
    const p = parts[1].split(',').map(Number);
    r = p[0]; g = p[1]; b = p[2];
    if (p.length > 3) a = p[3];
  } else {
    const n = parseInt(String(color).slice(1), 16);
    r = (n >> 16) & 255; g = (n >> 8) & 255; b = n & 255;
  }
  const mix = function (from, toward) { return Math.round(from + (toward - from) * k); };
  return 'rgba(' + mix(r, (to >> 16) & 255) + ',' + mix(g, (to >> 8) & 255) + ',' +
         mix(b, to & 255) + ',' + a + ')';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function bootFail(msg) {
  $('boot').classList.remove('gone');
  $('boot').querySelector('.t').textContent = 'galaxy offline';
  $('boot-err').innerHTML = msg;
}

/* ============================================== load 3d-force-graph (CDN) === */
const CDNS = [
  'https://cdn.jsdelivr.net/npm/3d-force-graph@1/dist/3d-force-graph.min.js',
  'https://unpkg.com/3d-force-graph@1/dist/3d-force-graph.min.js',
  'https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js'
];
function loadScript(url) {
  return new Promise(function (res, rej) {
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = res;
    s.onerror = function () { rej(new Error(url)); };
    document.head.appendChild(s);
  });
}
async function loadLib() {
  for (let i = 0; i < CDNS.length; i++) {
    try {
      await loadScript(CDNS[i]);
      if (window.ForceGraph3D) return true;
    } catch (e) { /* try the next mirror */ }
  }
  return false;
}

/* ================================================================= boot ==== */
(async function main() {
  if (typeof GRAPH === 'undefined' || !GRAPH || !GRAPH.nodes) {
    return bootFail('<code>graph-data.js</code> is missing or empty.<br>' +
      'Run <code>python build.py</code> in the project root, then reload.');
  }
  if (!GRAPH.nodes.length) {
    return bootFail('The index contains no notes. Add .md files under ' +
      '<code>notes/</code> and run <code>python build.py</code> again.');
  }
  const ok = await loadLib();
  if (!ok) {
    return bootFail('Could not load <code>3d-force-graph</code> from any CDN.<br>' +
      'This page needs an internet connection the first time it runs.');
  }

  /* ---- groups & colours ---- */
  const groups = (GRAPH.meta && GRAPH.meta.groups && GRAPH.meta.groups.length)
    ? GRAPH.meta.groups.slice()
    : Array.from(new Set(GRAPH.nodes.map(function (n) { return n.group; }))).sort();
  const colorOf = {};
  groups.forEach(function (g, i) { colorOf[g] = PALETTE[i % PALETTE.length]; });
  const groupColor = function (n) { return colorOf[n.group] || '#9fb4d8'; };

  /* ---- copy data: the layout engine mutates what you hand it ---- */
  const nodes = GRAPH.nodes.map(function (n) { return Object.assign({}, n); });
  const links = GRAPH.links.map(function (l) { return Object.assign({}, l); });
  const byId = new Map(nodes.map(function (n) { return [n.id, n]; }));
  function idOf(v) { return (v && typeof v === 'object') ? v.id : v; }

  /* ---- density: a small corpus can be near-fully connected, which reads as a
     hairball. Default to each note's strongest few edges; the toggle in the HUD
     shows every link build.py actually found. ---- */
  const KIND_RANK = { wikilink: 0, mention: 1, shared: 2 };
  const STRONG_PER_NODE = 4;

  function strongSubset(all, k) {
    const buckets = new Map(nodes.map(function (n) { return [n.id, []]; }));
    all.forEach(function (l) {
      buckets.get(idOf(l.source)).push(l);
      buckets.get(idOf(l.target)).push(l);
    });
    const keep = new Set();
    buckets.forEach(function (arr) {
      arr.sort(function (a, b) {
        return (KIND_RANK[a.kind] - KIND_RANK[b.kind]) ||
               ((b.weight || 1) - (a.weight || 1));
      });
      arr.slice(0, k).forEach(function (l) { keep.add(l); });
    });
    return all.filter(function (l) { return keep.has(l); });
  }

  const allLinks = links;
  const strongLinks = strongSubset(allLinks, STRONG_PER_NODE);
  let activeLinks = strongLinks;
  let neighbours = new Map();

  function rebuildNeighbours() {
    neighbours = new Map(nodes.map(function (n) { return [n.id, new Set()]; }));
    activeLinks.forEach(function (l) {
      neighbours.get(idOf(l.source)).add(idOf(l.target));
      neighbours.get(idOf(l.target)).add(idOf(l.source));
    });
  }
  rebuildNeighbours();
  function degOf(id) { return (neighbours.get(id) || { size: 0 }).size; }

  const hidden = new Set();                 // groups toggled off in the legend
  const hiNodes = new Set();
  const hiLinks = new Set();
  let selected = null;

  /* ---- birth pulse: a newly captured note flares white and swells, then settles.
     Read by nodeVal and nodeColor below, so it survives every other repaint. ---- */
  const PULSE_MS = 1600;
  let pulseId = null, pulseAmt = 0;

  /* ---- web pulse: the OTHER world announcing itself. A note answer lights the one
     star it came from, in that star's own colour; a web answer came from nowhere in
     this galaxy at all, so there is nothing to light - and lighting something anyway
     would be a lie about the source. So the whole sky washes cyan for a moment
     instead: "that did not come from in here". Cyan because nothing in PALETTE is
     this colour, which makes it unmistakable and unmistakably not a folder. ---- */
  const WEB_PULSE_MS = 2200;
  const WEB_CYAN = '#22e0ff';
  let webAmt = 0;

  /* ---- the graph ---- */
  const Graph = ForceGraph3D()(document.getElementById('graph'))
    .backgroundColor('rgba(0,0,0,0)')
    .showNavInfo(false)
    .nodeId('id')
    .nodeRelSize(4.4)
    .nodeResolution(16)
    .nodeOpacity(1)
    .nodeVal(function (n) {
      const base = 1.1 + degOf(n.id) * 0.8;
      if (n.id === pulseId) return base + pulseAmt * base * 3.2;
      // The web swell is deliberately slight - a breath across the whole sky rather
      // than a flare in one place. A big swell everywhere reads as "all of these
      // matched", which is the opposite of what a web answer means.
      return webAmt > 0 ? base + webAmt * base * 0.45 : base;
    })
    .nodeLabel(function (n) {
      return '<div>' + esc(n.label) + '<span class="tg">' + esc(n.group) +
             ' &middot; ' + degOf(n.id) + ' links</span></div>';
    })
    .nodeColor(function (n) {
      const c = groupColor(n);
      // A pulsing node ignores dimming and muting: the whole point is being seen. It
      // also outranks the cyan wash - a note that was just born came from in here.
      if (n.id === pulseId && pulseAmt > 0) return mixToWhite(c, pulseAmt);
      let out;
      if (hidden.has(n.group)) out = hexToRgba(c, 0.05);
      else if (!hiNodes.size) out = c;
      else if (selected === n.id) out = '#ffffff';
      else if (hiNodes.has(n.id)) out = c;
      else out = hexToRgba(c, 0.09);
      // The wash goes on LAST, over whatever this node was already, so a hidden folder
      // stays hidden and a dimmed one stays dimmed. See washTo.
      return webAmt > 0 ? washTo(out, WEB_CYAN, webAmt * 0.85) : out;
    })
    /* ---- THE SILENT WIRES ----
       THERE IS NO LINE. Not a faint one, not a hairline, not a tenth of an opacity - none,
       at any density, in any view. The hairline was the last survivor of a long retreat:
       236 lines at a third of a pixel were a grey cobweb, so they went to a tenth opacity,
       and at a tenth opacity they were still a haze over every world behind them while
       being far too faint for any single relation to be FOLLOWED. A mark that can neither
       be read individually nor ignored collectively is not carrying information; it is
       carrying dirt. So it is deleted, and the relation is carried entirely by the dot
       travelling along where the line used to be. See flowFrame() at the planetarium.

       linkVisibility(false) rather than a transparent colour, because the two are not the
       same thing: a transparent line is still a line the renderer builds, sorts, and draws
       236 times a frame for no pixels. This retires the objects. It is also the single
       largest thing paying for the dots. */
    .linkVisibility(false)
    .onNodeClick(function (n) { focusNode(n, true); })
    .onNodeHover(onNodeHover)
    .onBackgroundClick(clearSelection)
    .graphData({ nodes: nodes, links: activeLinks });

  /* ---- THE BREATHING SKY ----
     The old numbers packed thirty worlds into the volume of a bunch of grapes: at charge
     -165 and a link distance of 52 the spheres OVERLAPPED, so a cluster read as one lumpy
     mass and the space between two notes - the thing this whole view is for - was not
     visible at all. Three changes, and they work as one: a much stronger repulsion, links
     roughly three times longer, and a collision force that makes contact impossible rather
     than merely unlikely. What comes out reads as space. */
  Graph.d3Force('charge').strength(-260);
  Graph.d3Force('link')
    /* Still three lengths, because a wikilink IS a closer relation than a shared folder and
       the geometry is how that gets said; they are simply scaled up around 160 now. */
    .distance(function (l) {
      return l.kind === 'wikilink' ? 130 : l.kind === 'mention' ? 160 : 195;
    })
    .strength(function (l) { return l.kind === 'shared' ? 0.18 : 0.42; });
  Graph.d3VelocityDecay(0.28);

  /* COLLIDE, written out by hand for one reason: 3d-force-graph's UMD bundle keeps its copy
     of d3-force-3d to itself, so there is no forceCollide to reach for. A force is just a
     function the layout calls every tick with an alpha, plus an initialize() that hands it
     the nodes - so this is the whole contract, and thirty nodes make 435 pairs, which is
     nothing next to the render.

     RADIUS + 18. The radius is the world's ACTUAL radius, read from the same planetRadius()
     the planetarium scales by, so a hub with sixteen links claims the room a hub with
     sixteen links takes up; the 18 on top is the gap that keeps two surfaces from kissing
     even while the layout is still settling. Overlap is resolved by moving BOTH worlds half
     of it, which keeps the cluster's centre where the springs put it. */
  const COLLIDE_PAD = 18;
  Graph.d3Force('collide', (function () {
    let list = [];
    const force = function (alpha) {
      const n = list.length;
      if (n < 2) return;
      const strength = 0.7 + 0.3 * (1 - Math.min(1, alpha * 4));
      for (let i = 0; i < n; i++) {
        const a = list[i];
        const ra = planetRadius(a) + COLLIDE_PAD;
        for (let j = i + 1; j < n; j++) {
          const b = list[j];
          let dx = (b.x || 0) - (a.x || 0);
          let dy = (b.y || 0) - (a.y || 0);
          let dz = (b.z || 0) - (a.z || 0);
          let d2 = dx * dx + dy * dy + dz * dz;
          const want = ra + planetRadius(b) + COLLIDE_PAD;
          if (d2 >= want * want) continue;
          // Two worlds at exactly the same point have no direction to separate along, so
          // one is invented. Without this they stay welded together for the whole session.
          if (d2 === 0) { dx = 0.5 - Math.random(); dy = 0.5 - Math.random(); dz = 0.5 - Math.random(); d2 = dx * dx + dy * dy + dz * dz; }
          const d = Math.sqrt(d2) || 0.0001;
          const push = (want - d) / d * strength * 0.5;
          const px = dx * push, py = dy * push, pz = dz * push;
          a.vx = (a.vx || 0) - px; a.vy = (a.vy || 0) - py; a.vz = (a.vz || 0) - pz;
          b.vx = (b.vx || 0) + px; b.vy = (b.vy || 0) + py; b.vz = (b.vz || 0) + pz;
        }
      }
    };
    force.initialize = function (nodes) { list = nodes || []; };
    return force;
  })());

  function refresh() {
    Graph.nodeColor(Graph.nodeColor())
         .nodeVal(Graph.nodeVal());
    /* THE DOTS ARE THE LINKS - there is nothing else. The two linkColor/linkWidth
       re-assertions that used to stand here went with the lines themselves; repainting an
       invisible line is work with no pixels at the end of it. So a highlight reaches the
       relations HERE and only here, on the same call that repaints everything else rather
       than on a timer of its own. A no-op until the flow has booted, exactly like
       paintPlanets() below. */
    flowPaint();
    /* The nodes are THREE.Groups now, and the library leaves a custom object's materials
       alone - correctly, since it has no idea which of four materials is the surface. So
       the two lines above still drive the LINKS, and paintPlanets() carries the same
       decision to the worlds. Declared 4500 lines down and hoisted; a no-op until
       planetBoot() has run, which is what makes it safe to call from the first refresh. */
    paintPlanets();
  }

  /* THE HOVER, given a name so it can be reached. With the wires retired, hovering is the
     one gesture that decides which relations are visible at all - the synapses you are
     touching brighten and the rest go down to a texture - and that is now a claim worth
     testing. It cannot be tested through the canvas: the pointer would have to land on a
     sphere whose screen position only the library knows, so a harness would be proving the
     projection maths rather than the rule. This is the same function the library calls, by
     the same door, and __galaxy.hover() is the handle; nothing else may hold it. */
  function onNodeHover(n) {
    document.body.style.cursor = n ? 'pointer' : '';
    if (selected !== null) return;                // a selection wins over hover
    setHighlight(n ? n.id : null, false);
  }

  function setHighlight(id, isSelection) {
    hiNodes.clear(); hiLinks.clear();
    if (isSelection) selected = id;
    if (id !== null && id !== undefined) {
      hiNodes.add(id);
      (neighbours.get(id) || new Set()).forEach(function (x) { hiNodes.add(x); });
      activeLinks.forEach(function (l) {
        const a = idOf(l.source), b = idOf(l.target);
        if (a === id || b === id) hiLinks.add(l);
      });
    }
    refresh();
  }

  /* ---- camera: fly to a node ----
     Graph.cameraPosition(pos) with no lookAt argument silently resets the look-at
     to the origin, so the idle orbit below has to be told what to orbit around or
     it drags the view back to the centre of the galaxy a moment after every
     flight, pulling the note we just flew to out of frame. */
  let viewTarget = { x: 0, y: 0, z: 0 };
  let flying = false, flights = 0;
  const flightLog = [];
  function focusNode(node, select) {
    const n = (typeof node === 'number') ? byId.get(node) : node;
    if (!n) return;
    if (select) {
      selected = n.id;
      setHighlight(n.id, true);
      openPanel(n);
      // The acknowledgement. Here rather than in setHighlight, because a hover also
      // highlights and a world is not opened by looking at it.
      planetSweep(n.id);
    }
    if (n.x === undefined) return;
    flights++;      // nothing but a flight touches this, so it means "we flew"
    /* And who asked. A flight the viewer did not ask for is the one bug SCOPE A
       cannot tolerate, and "the camera moved" is a symptom with a dozen possible
       causes; the caller's name is the diagnosis. Kept to the last eight so it
       cannot grow without bound during a long session. */
    flightLog.push({ at: Math.round(performance.now()), id: n.id, select: !!select,
                     by: (new Error().stack || '').split('\n').slice(2, 5).join(' <- ') });
    if (flightLog.length > 8) flightLog.shift();
    // Far enough back that the lit neighbours stay in frame - flying right up to
    // the sphere fills the screen with one node and loses all sense of place.
    const dist = 190;
    const len = Math.hypot(n.x, n.y, n.z) || 1;
    const k = 1 + dist / len;
    flying = true;
    viewTarget = { x: n.x, y: n.y, z: n.z };   // and the look-at stays on it afterwards
    Graph.cameraPosition({ x: n.x * k, y: n.y * k, z: n.z * k }, n, 1700);
    setTimeout(function () { flying = false; }, 1850);
  }

  function clearSelection() {
    selected = null;
    hiNodes.clear(); hiLinks.clear();
    refresh();
    $('panel').classList.remove('open');
  }

  /* ======================== THE CALM SKY ========================
     THE ROTATION IS GONE, and its absence is the feature. A galaxy that turned by itself
     - one revolution every four minutes, resuming five seconds after you last touched
     anything - meant the camera was always moving under the reader's hands. The world you
     had just flown to slid out from under you while you read its excerpt; the cluster you
     were tracing rotated behind another one; and every screenshot of this page was of a
     different sky. Worse, it made stillness impossible: there was no state in which you
     could simply LOOK at the thing.

     STILLNESS IS NOT DEATH. The page is still alive - the dots travel their links, the
     ring breathes, the visage blinks and speaks, the fog and the starfield sit behind all
     of it. Every one of those is motion INSIDE the frame. None of them moves the frame.
     That is the whole distinction this section exists to hold: the picture may move, the
     viewer's head may not.

     WHAT REPLACES IT IS PARALLAX, which is not rotation. The camera eases toward an offset
     derived from where the pointer is - a couple of degrees, no more - so the sky has the
     give of a thing you are standing in front of rather than a photograph. It is bounded
     (±PARALLAX_MAX), it is driven entirely by your hand, and the instant the hand stops
     the camera stops: with the pointer still, the applied offset converges on the wanted
     offset and this code stops calling cameraPosition() at all. That last property is what
     makes "the quaternion is unchanged over thirty idle seconds" a fact rather than a hope,
     and deck_proof measures exactly that.

     AND A DOOR FOR THOSE WHO WANT THE ORBIT: galaxy_spin in config.json, read off /health,
     default false. Nobody gets it without asking. */
  let dragging = false;
  let last = performance.now();

  /* THE ORBIT, NOW OPT-IN. False until /health says otherwise; see refreshSky(). There is
     no idle timer any more because there is nothing to resume - the spin, when it is on at
     all, is on continuously and yields only to a flight. */
  let spinOn = false;

  const PARALLAX_MAX = 2.5 * Math.PI / 180;   // radians, and the spec's own number
  /* How fast the camera catches up with the pointer. Time-constant rather than per-frame,
     so a 144Hz screen and a 60Hz screen ease at the same RATE instead of the faster one
     arriving 2.4x sooner. 180ms reads as "the sky has weight" rather than as lag. */
  const PARALLAX_TAU = 180;
  /* Below this the difference is not worth a matrix: a tenth of a degree of yaw is
     invisible, and writing it every frame would mean the camera never holds still, which
     is the one thing this whole section is for. 0.0002 rad ~ 0.011 degrees. */
  const PARALLAX_EPS = 0.0002;
  /* WANTED is where the pointer says to be; NOW is where the camera has got to. Only their
     DIFFERENCE is ever applied, which is what keeps the offset bounded: a drag or a zoom
     changes the camera as it likes and the parallax simply keeps its own ±2.5° around
     wherever the hand left it, rather than fighting for an absolute position. */
  let parWantYaw = 0, parWantPitch = 0, parYaw = 0, parPitch = 0;
  const parallax = { on: true, why: '', moves: 0, holds: 0, suspended: false };
  /* Reduced motion opts out of the parallax and not of the page: the dots, the ring and
     the visage have their own answers to this query in the stylesheet. A camera that
     drifts when you move the mouse is exactly the kind of motion this setting is asking
     us not to do. */
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      parallax.on = false; parallax.why = 'prefers-reduced-motion';
    }
  } catch (e) { /* no matchMedia is no objection */ }

  /* THE POINTER, as a fraction of the canvas from its centre. Read off the window rather
     than the graph element because the graph fills it and a pointermove that started over
     the toast is still a hand telling us where it is. Listener is passive and does no work
     beyond two divisions - the easing happens on the frame, where it belongs. */
  addEventListener('pointermove', function (e) {
    if (!parallax.on) return;
    const w = window.innerWidth || 1, h = window.innerHeight || 1;
    const nx = Math.max(-1, Math.min(1, (e.clientX - w / 2) / (w / 2)));
    const ny = Math.max(-1, Math.min(1, (e.clientY - h / 2) / (h / 2)));
    /* Signs chosen so the sky leans TOWARDS the cursor: move right and the galaxy swings
       to show you its right-hand side, as though you had stepped that way. The inverse
       reads as the picture running away from you. */
    parWantYaw = -nx * PARALLAX_MAX;
    parWantPitch = -ny * PARALLAX_MAX;
  }, { passive: true });

  /* SUSPENDED means the pointer is busy doing something else, and a couple of degrees of
     drift underneath a deliberate gesture is the parallax arguing with the user. A drag is
     a pan or an orbit; an open panel means the pointer is over prose and reading, not
     looking. Both freeze NOW where it stands rather than springing back to zero, so
     resuming is a continuation and never a lurch. */
  function parallaxSuspended() {
    if (!parallax.on) return true;
    if (dragging || flying) return true;
    const panel = document.getElementById('panel');
    return !!(panel && panel.classList.contains('open'));
  }

  /* The camera, moved by a small yaw/pitch DELTA about the look-at point, radius preserved.
     Spherical rather than quaternion because the two numbers being clamped are spherical:
     a yaw and a pitch are what the spec bounds, and reading them back out of a quaternion
     to check the bound would be doing the same arithmetic twice. */
  function cameraNudge(dYaw, dPitch) {
    const cam = Graph.camera();
    if (!cam) return false;
    const tgt = viewTarget;
    const vx = cam.position.x - tgt.x, vy = cam.position.y - tgt.y, vz = cam.position.z - tgt.z;
    const r = Math.hypot(vx, vy, vz);
    if (r < 1) return false;                   // sitting on the target: no arc to swing along
    const yaw = Math.atan2(vx, vz) + dYaw;
    // 80 degrees, so the parallax can never tip the camera over its own pole and flip the sky.
    const cap = 80 * Math.PI / 180;
    const pitch = Math.max(-cap, Math.min(cap, Math.asin(vy / r) + dPitch));
    const cp = Math.cos(pitch);
    // lookAt passed explicitly: without it the library snaps the target back to the origin.
    Graph.cameraPosition({
      x: tgt.x + r * Math.sin(yaw) * cp,
      y: tgt.y + r * Math.sin(pitch),
      z: tgt.z + r * Math.cos(yaw) * cp
    }, tgt);
    return true;
  }

  /* /health decides whether the orbit exists. Called once at boot beside the other
     /health readers; a server that cannot be asked leaves the sky at rest, which is the
     answer that costs nothing if it is wrong. */
  function skySpin(on) {
    spinOn = !!on;
    /* The orbit and the parallax are alternatives, not layers: two things easing the same
       camera at once is a sky that wobbles. So turning the spin on retires the parallax and
       says which of the two is driving, in one readable string. */
    if (spinOn && !parallax.why) parallax.why = 'galaxy_spin owns the camera';
    return spinOn;
  }

  /* A drag may be a deliberate pan, which is the one legitimate way for the
     look-at to change - so adopt it when the drag ends. Between drags the
     look-at is ours to defend; see the orbit loop below for why it needs
     defending at all. */
  $('graph').addEventListener('pointerdown', function () { dragging = true; },
                              { passive: true });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    addEventListener(ev, function () {
      if (!dragging) return;
      dragging = false;
      if (flying) return;                    // the flight owns the look-at
      const t = Graph.controls() && Graph.controls().target;
      if (t) viewTarget = { x: t.x, y: t.y, z: t.z };
    }, { passive: true });
  });

  /* THE DECK'S ONE FRAME HOOK. The deck does not start a second animation loop - it
     borrows this one, which already runs every frame the graph does. Two rAF loops
     asking the same clock the same question is how a 60fps page becomes a 55fps page
     for no visible reason. Null until deckBoot() succeeds, and never again after it
     fails, so the cost of an absent deck is one null check per frame. */
  let deckFrame = null;
  // And the planetarium's, set by planetBoot(). See the orbit loop just below.
  let planetTick = null;
  /* And the travelling dots', set by flowBoot(). Separate from the planets' hook because
     the dots are the LINKS: ?planets=0 is a page of dots and spheres, and the traffic
     between two notes is not a thing that should stop because the worlds did. */
  let flowTick = null;

  (function orbit(now) {
    const dt = Math.min(now - last, 60); last = now;
    /* First, before the camera work: the deck measures the frame it is IN, and it has to
       see a stall whether or not the camera is moving - which, now that the sky rests, is
       most of the time. Guarded because a throw in here would take the whole loop down,
       and the loop is what the planets and the dots ride on. */
    if (deckFrame) { try { deckFrame(now); } catch (e) { deckFrame = null; } }
    /* The planets turn on their own hook rather than inside the deck's, for two reasons
       worth the extra null check. The deck's hook returns early on a hidden tab, which
       would make the planetarium's own visibility guard unreachable and therefore
       untestable; and the deck's hook does not exist at all under ?deck=0, which would
       leave a page full of worlds that never rotated. A note is a world whether or not
       there is a glow over it. Same discipline as above: a throw takes the spin down and
       nothing else. */
    if (planetTick) { try { planetTick(now); } catch (e) { planetTick = null; } }
    // dt rather than now: a dot advances by DISTANCE, and distance needs an interval.
    if (flowTick) { try { flowTick(dt); } catch (e) { flowTick = null; } }

    /* Hold the look-at where we put it. OrbitControls quietly eases its target back
       towards the origin after a gesture, and with the rotation retired this is now the
       ONLY thing that re-asserts it - which makes it load-bearing rather than a companion
       to the spin: a note we have just flown to would otherwise drift out of frame on its
       own, with nothing moving and nobody touching anything. Not while flying, which owns
       the look-at, and not mid-drag, where a pan is the user changing it. */
    const ctrl = Graph.controls();
    if (!flying && !dragging && ctrl && ctrl.target) {
      const t = ctrl.target;
      if (Math.hypot(t.x - viewTarget.x, t.y - viewTarget.y,
                     t.z - viewTarget.z) > 0.5) {
        t.set(viewTarget.x, viewTarget.y, viewTarget.z);
      }
    }

    /* THE OPT-IN ORBIT, for the one reader in a hundred who asked for it in config.json.
       Same arithmetic the old constant rotation used, behind a flag that is false unless
       /health says galaxy_spin. It yields to a flight and to nothing else - there is no
       idle timer any more, because a spin you have deliberately turned on should not keep
       stopping and starting every time you touch the mouse. */
    if (spinOn && !flying) cameraNudge(0.000075 * dt, 0);

    /* THE PARALLAX. Ease NOW toward WANTED, then apply only the difference - and if the
       difference is below a hundredth of a degree, do not touch the camera at all. That
       early return is the law of this section written as code: WITH THE POINTER STILL,
       NOTHING HERE MOVES THE CAMERA. Thirty seconds of an untouched mouse and the
       quaternion is the same quaternion, because after the first few frames of easing this
       branch stops calling cameraNudge() and starts counting holds instead. */
    if (!spinOn) {
      if (parallaxSuspended()) {
        parallax.suspended = true;
        /* Frozen, not zeroed. WANTED is dragged up to NOW so that releasing a drag does
           not immediately swing the camera back through the offset the drag started from. */
        parWantYaw = parYaw; parWantPitch = parPitch;
      } else {
        parallax.suspended = false;
        // 1 - e^(-dt/tau): the same fraction of the remaining distance per millisecond at
        // any frame rate, which is what makes this feel identical on a 144Hz screen.
        const k = 1 - Math.exp(-dt / PARALLAX_TAU);
        const nextYaw = parYaw + (parWantYaw - parYaw) * k;
        const nextPitch = parPitch + (parWantPitch - parPitch) * k;
        const dYaw = nextYaw - parYaw, dPitch = nextPitch - parPitch;
        if (Math.abs(dYaw) > PARALLAX_EPS || Math.abs(dPitch) > PARALLAX_EPS) {
          if (cameraNudge(dYaw, dPitch)) {
            parYaw = nextYaw; parPitch = nextPitch;
            parallax.moves++;
          }
        } else {
          /* Snap the residue onto NOW without moving the camera, so the two do not sit a
             hundredth of a degree apart for ever and re-test the same difference every
             frame for the rest of the session. */
          parYaw = nextYaw; parPitch = nextPitch;
          parallax.holds++;
        }
      }
    }
    requestAnimationFrame(orbit);
  })(last);

  let fitted = false;
  Graph.onEngineStop(function () {
    if (!fitted) { fitted = true; Graph.zoomToFit(1400, 62); }
  });
  setTimeout(function () {
    if (!fitted) { fitted = true; Graph.zoomToFit(1400, 62); }
  }, 4200);

  /* ---- side panel ---- */
  function openPanel(n) {
    const c = groupColor(n);
    // Undo anything openSources() did to this same panel. A note shown in the web
    // panel's clothes would be claiming to have come from outside, which is the one
    // confusion this whole colour scheme exists to prevent.
    $('panel').classList.remove('web');
    $('p-excerpt').className = '';
    $('p-neighbours').className = 'chips';
    $('p-nb-head').textContent = 'Connected';
    $('panel').querySelector('.kicker').style.color = c;
    $('p-group').textContent = n.group;
    $('p-label').textContent = n.label;
    $('p-meta').textContent = n.file + ' · ' + (n.words || 0) + ' words · ' +
                              degOf(n.id) + ' connections';
    $('p-excerpt').textContent = n.excerpt || '(no text)';

    const nb = Array.from(neighbours.get(n.id) || [])
      .map(function (id) { return byId.get(id); })
      .filter(Boolean)
      .sort(function (a, b) { return degOf(b.id) - degOf(a.id); });
    const box = $('p-neighbours');
    box.innerHTML = '';
    $('p-nb-head').style.display = nb.length ? '' : 'none';
    nb.forEach(function (m) { box.appendChild(chip(m)); });
    $('panel').classList.add('open');
  }

  function chip(n) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.style.color = groupColor(n);
    b.innerHTML = '<i></i><span style="color:var(--ink)">' + esc(n.label) + '</span>';
    b.onclick = function () { focusNode(n, true); };
    return b;
  }

  /* ---- the same panel, the other world ----
     A web answer cites nothing in the galaxy, so the panel shows what it DOES cite:
     three links, with their real addresses visible. Never a file path - there is no
     file - and never a node, because no node had anything to do with it.

     Two rules worth stating, because both are about not lying to the reader:
     the href is checked to be http(s) HERE as well as on the server, so a malformed
     or javascript: URL becomes dead text rather than a click; and the address is shown
     in full rather than prettified, because a citation you cannot read is not one. */
  function safeUrl(url) {
    const raw = String(url == null ? '' : url).trim();
    return /^https?:\/\/[^\s]+$/i.test(raw) ? raw : '';
  }

  function sourceLink(src, small) {
    const href = safeUrl(src && src.url);
    const title = String((src && src.title) || href || 'untitled');
    const node = document.createElement(href ? 'a' : 'span');
    node.className = small ? 'wchip' : 'src-item';
    if (href) {
      node.href = href;
      node.target = '_blank';
      // noopener AND noreferrer: a page opened from here has no handle back on this
      // tab, and is not told where its reader came from.
      node.rel = 'noopener noreferrer';
      node.title = href;
    }
    if (small) {
      node.textContent = title;
    } else {
      const t = document.createElement('span');
      t.className = 't';
      t.textContent = title;
      const u = document.createElement('span');
      u.className = 'u';
      u.textContent = href || '(no usable address)';
      node.appendChild(t);
      node.appendChild(u);
    }
    return node;
  }

  function openSources(question, sources, backend) {
    const list = (sources || []).filter(function (s) { return safeUrl(s && s.url); });
    $('panel').classList.add('web');
    $('panel').querySelector('.kicker').style.color = '';   // the .web rule owns it now
    $('p-group').textContent = 'live web';
    $('p-label').textContent = question || 'From the web';
    $('p-meta').textContent = list.length + ' source' + (list.length === 1 ? '' : 's') +
      ' · fetched just now' + (backend ? ' · via ' + backend : '');

    // The excerpt slot says what this panel IS, once, plainly. Then the links.
    $('p-excerpt').className = 'src-note';
    $('p-excerpt').textContent = list.length
      ? 'Answered from these pages, not from your notes. Nothing here has been saved.'
      : 'Nothing usable came back.';
    $('p-nb-head').style.display = list.length ? '' : 'none';
    $('p-nb-head').textContent = 'Sources';
    const box = $('p-neighbours');
    box.className = 'srclist';
    box.innerHTML = '';
    list.forEach(function (s) { box.appendChild(sourceLink(s, false)); });
    $('panel').classList.add('open');
  }

  $('close').onclick = clearSelection;
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { clearSelection(); $('q').blur(); }
    if (e.key === '/' && document.activeElement !== $('q')) {
      e.preventDefault(); $('q').focus();
    }
  });

  /* ---- legend ----
     Repaintable rather than built once: a capture can create a whole new folder
     (captures/), and a cluster the galaxy contains but the legend does not is a
     cluster you cannot mute. ---- */
  const legend = $('legend');
  function paintLegend() {
    const counts = {};
    nodes.forEach(function (n) { counts[n.group] = (counts[n.group] || 0) + 1; });
    legend.innerHTML = '';
    groups.forEach(function (g) {
      const row = document.createElement('div');
      row.className = 'lg' + (hidden.has(g) ? ' off' : '');
      row.style.color = colorOf[g];
      row.innerHTML = '<b>' + (counts[g] || 0) + '</b><span style="color:inherit">' +
                      esc(g) + '</span><i></i>';
      row.onclick = function () {
        if (hidden.has(g)) { hidden.delete(g); row.classList.remove('off'); }
        else { hidden.add(g); row.classList.add('off'); }
        refresh();
      };
      legend.appendChild(row);
    });
  }
  paintLegend();
  function paintStats() {
    $('stats').textContent = nodes.length + ' notes · ' + activeLinks.length +
      ' connections · ' + groups.length + ' clusters';
    $('density').textContent = (activeLinks === strongLinks)
      ? 'showing strongest links · see all ' + allLinks.length + ' →'
      : 'showing all ' + allLinks.length + ' links · simplify →';
  }
  $('density').onclick = function () {
    activeLinks = (activeLinks === strongLinks) ? allLinks : strongLinks;
    rebuildNeighbours();
    Graph.graphData({ nodes: nodes, links: activeLinks });
    flowSync();                       // the dots follow the links they are travelling on
    if (selected !== null) setHighlight(selected, true);
    else { hiNodes.clear(); hiLinks.clear(); refresh(); }
    paintStats();
  };
  paintStats();

  /* ================================================================ brain == */
  const SESSION = 'galaxy-' + Math.random().toString(36).slice(2, 10);
  let busy = false;

  /* Four or more sources and flying to one of them would be a lie about where the
     answer came from, so the camera stays put and the whole cluster lights up. */
  const CLUSTER_MIN = 4;

  /* The server is the real classifier (it can see the retrieval scores). This is
     only a backstop for an older or misbehaving server, so that "good morning"
     still cannot drag the camera around. */
  const SMALLTALK_RE = new RegExp('^(?:' +
    'hi|hello+|hey+|yo|hiya|howdy|greetings|good\\s*(?:morning|afternoon|evening|day|night)|' +
    'morning|afternoon|evening|thanks?(?:\\s+you)?|ty|ta|cheers|ok|okay|cool|nice|great|' +
    'lovely|awesome|brilliant|perfect|sweet|please|sorry|bye|goodbye|see\\s+you|later|cya|' +
    'lol|ha(?:ha)+|hmm+|yay|how\\s+are\\s+you(?:\\s+doing)?(?:\\s+today)?|' +
    "what(?:'s|s)?\\s+up|sup|who\\s+are\\s+you|what\\s+are\\s+you|what\\s+can\\s+you\\s+do|" +
    'tell\\s+me\\s+a\\s+joke|knock\\s+knock|are\\s+you\\s+(?:a\\s+)?(?:robot|human|real|ai|bot)' +
    ')[\\s,.!?;:]*$', 'i');
  function localKind(question) {
    return SMALLTALK_RE.test(String(question).trim()) ? 'chat' : 'notes';
  }

  /* The force trigger, and the single reason this page has to know about it at all:
     while a screen share is running, anything that is not a pleasantry is treated as a
     question about the screen (see ask()). "Jarvis, look this up" has to escape that,
     or the one phrase that explicitly asks for the web would be answered from a
     screenshot. The server owns the real matcher, the peeling and the searching; this
     copy is a veto on LOCAL routing and nothing more, so it can afford to be looser. */
  const FORCE_WEB_RE = new RegExp(
    '(?:^|\\b)(?:' +
      '(?:hey\\s+|ok(?:ay)?\\s+)?jarvis\\b[\\s,.:;!-]*(?:please\\s+)?(?:can\\s+you\\s+)?' +
        '(?:look\\s+(?:this|that|it)\\s+up|look\\s+up|search\\s+(?:the\\s+)?' +
        '(?:web|internet|online)|search\\s+for)' +
      '|look\\s+(?:this|that|it)\\s+up' +
      '|(?:search|check|ask)\\s+(?:the\\s+)?(?:web|internet|online)' +
      '|web\\s+search' +
    ')', 'i');

  /* The note is on screen to be read; the voice only ever says the short answer.
     A cap here means a long error dump or a chatty model cannot turn into a
     minute of narration. */
  const SPOKEN_MAX_CHARS = 260;
  function spokenForm(text) {
    const line = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
    if (line.length <= SPOKEN_MAX_CHARS) return line;
    const sentences = line.match(/[^.!?]+[.!?]+/g) || [];
    let out = '';
    for (let i = 0; i < sentences.length; i++) {
      if ((out + sentences[i]).length > SPOKEN_MAX_CHARS) break;
      out += sentences[i];
    }
    if (out.trim()) return out.trim();
    return line.slice(0, SPOKEN_MAX_CHARS).replace(/\s+\S*$/, '') + '…';
  }

  /* Nothing else in the file is allowed to move the camera in response to an
     answer. Whether the question was about the notes is decided FIRST, and a
     "chat" reply can never reach the 'fly' or 'cluster' branches below. */
  function decideCamera(kind, used, isError) {
    if (kind === 'chat') return 'hold';       // small talk never touches the graph
    /* A screen answer came from the screen, not from the collection. Flying to a
       note, or lighting one, would be claiming a source it does not have - so this
       is refused here rather than left to depend on the nodes array being empty. */
    if (kind === 'screen') return 'hold';
    /* Changing brains is not an answer about the notes at all - it cites nothing,
       so it moves nothing. Refused swaps included. */
    if (kind === 'model') return 'hold';
    /* And a callout from the focus timer cites nothing either. It has an opinion
       about where you ARE, which is not a claim about any note - so the graph does
       not move to illustrate it. */
    if (kind === 'focus') return 'hold';
    /* A proposal, a refusal, a lapse or a script's own output. None of them is a claim
       about a note, so the galaxy does not move to illustrate one - and a camera flight
       under a pair of buttons would pull the eye away from the thing being approved. */
    if (kind === 'tool') return 'hold';
    /* A web answer came from outside the galaxy entirely. Flying to a note would be
       the most dishonest thing this page could do: it would point at a star and say
       "there", about a fact that arrived over the wire thirty seconds ago. So the
       camera holds, nothing lights, and the cyan pulse says where it came from
       instead - see respond(). */
    if (kind === 'web') return 'hold';
    /* A composed answer - a draft, a translation, a summary, a plan - is the
       assistant's own work. It cites no note and no page, so there is nothing for the
       camera to point at and nothing to light. Refused here rather than left to the
       empty-nodes test below, for the same reason as 'screen': the honesty of this
       page should not depend on an array happening to be empty. */
    if (kind === 'compose') return 'hold';
    if (!used.length) return 'hold';          // nothing was cited, nothing to prove
    if (isError) return 'cluster';            // no answer yet: show matches, do not fly
    return used.length >= CLUSTER_MIN ? 'cluster' : 'fly';
  }

  function renderAnswer(question, text, isError, ids, sources) {
    /* Every answer starts by clearing the frame thumbnail. A picture left sitting
       beside the next answer would read as the evidence for it, which it is not. */
    hideProof();
    /* And the Yes/No pair, for the same reason: a pair of buttons left sitting beside the
       next answer would read as a question about THAT, which it is not. The UI only -
       whether anything is still pending is the server's to say, not this line's. */
    clearAskUI();
    $('a-q').textContent = question ? '“' + question + '”' : '';
    /* The answer arrives COMPLETE and is then revealed - see typeOut(). Every character
       is in the DOM before this line returns, so #a-text.textContent is the whole answer
       from the first frame and nothing that reads this page has to wait for a show. */
    typeOut($('a-text'), text);
    $('answer').classList.toggle('err', !!isError);
    const src = $('a-src'), box = $('a-chips');
    box.innerHTML = '';
    const used = (ids || []).map(function (i) { return byId.get(i); }).filter(Boolean);
    /* WHERE IT CAME FROM, in the card's own footer, and the two cases are mutually
       exclusive by construction: a web answer arrives with no ids and a note answer
       arrives with no sources, so the label can never read "Drawn from" above a list
       of web links. The label changes too - "Drawn from" is a claim about the
       collection and would be false here. */
    const web = (sources || []).filter(function (s) { return safeUrl(s && s.url); });
    src.querySelector('.lbl').textContent = web.length ? 'According to' : 'Drawn from';
    src.style.display = (used.length || web.length) ? '' : 'none';
    $('answer').classList.toggle('web', !!web.length);
    if (web.length) web.forEach(function (s) { box.appendChild(sourceLink(s, true)); });
    else used.forEach(function (n) { box.appendChild(chip(n)); });
    $('answer').classList.add('show');
    /* AND RE-MEASURE, because an answer is the one thing that changes the TOAST's height
       and the no-overlap law is a statement about two heights. A long answer with a source
       row is several times the height of a short one, and the governor's clearance test read
       the old height until this line existed. fxPaint() already ends this way for the other
       half of the same law - the card's height - so both surfaces now report their growth to
       the one place that can act on it. */
    layout();
    return used;
  }

  /* ================================================================ hands ==
     THE MOMENT OF TRUST, and it is the only thing on this page that can start
     something outside the browser.

     What this code is NOT allowed to do is the interesting half:

       it never composes the sentence. The proposal line arrives from the server,
         built from the registry template, because a page that paraphrased an action
         could understate it just as easily as a model could.
       it never composes the parameters either. What is rendered below the sentence is
         the server's own validated slot, and it is what will actually run - so reading
         it is worth something. /execute carries consent and nothing else: no value
         shown here is sent back, so nothing can be edited between the asking and
         the doing.
       it never opens the microphone. A proposal in flight does not make the ear
         listen; the Ear Law sits above the Hands, exactly as it sits above the eyes.

     The spoken door is the words themselves - "yes", "go ahead", "no", "never mind" -
     and they are judged by the SERVER, from ask() below, so a stale tab cannot decide
     what a yes meant. */
  let proposal = null;              // the pending proposal, as the server described it
  let proposalTimer = null, proposalTicker = null;

  function clearAskUI() {
    $('a-ask').classList.remove('show');
    $('answer').classList.remove('tool');
    /* The room comes back up. This lives with the rest of the card's undoing rather
       than in hideProposal(), because the vignette is part of the UI of being asked and
       every path that takes the buttons away must take the dimming with them - including
       renderAnswer(), which calls this before painting anything at all. */
    $('handswash').classList.remove('live');
    $('ask-rows').innerHTML = '';
    $('ask-clock').textContent = '';
  }

  function hideProposal() {
    clearTimeout(proposalTimer); proposalTimer = null;
    clearInterval(proposalTicker); proposalTicker = null;
    proposal = null;
    clearAskUI();
  }

  /* Every validated parameter, on its own row, in the schema's order - so a field the
     server dropped is visibly absent rather than quietly missing. textContent
     throughout: a subject line is text, never markup. */
  function showProposal(pending) {
    clearTimeout(proposalTimer); clearInterval(proposalTicker);
    proposal = pending;
    const rows = $('ask-rows');
    rows.innerHTML = '';
    (pending.fields || []).forEach(function (f) {
      const name = document.createElement('b');
      name.textContent = f.name;
      const val = document.createElement('span');
      const has = Object.prototype.hasOwnProperty.call(pending.params || {}, f.name);
      if (has) val.textContent = String(pending.params[f.name]);
      else { val.innerHTML = ''; const i = document.createElement('i');
             i.textContent = '(not given)'; val.appendChild(i); }
      rows.appendChild(name); rows.appendChild(val);
    });
    $('ask-lbl').textContent = (pending.name || 'Awaiting your word') + ' · your word?';
    $('ask-yes').disabled = false;
    $('ask-no').disabled = false;
    $('answer').classList.add('tool');
    $('a-ask').classList.add('show');
    /* THE ROOM DIMS. An opacity on a fixed overlay that cannot be clicked: no layout, no
       repaint of anything under it, and no chance of standing between a hand - or a
       headless one - and the two buttons it came for. See #handswash. */
    $('handswash').classList.add('live');
    /* And it says so out loud, quietly. The chime is the same four notes as the open
       microphone for one reason: both mean "I am waiting for you". */
    chime('wake');

    /* The clock is the TTL, counted down where it can be seen, and the sweep at the end
       of it is a real request: the server is the one that lets the proposal go, and it
       says so once. A closed tab changes nothing - the slot still expires. */
    let left = Math.max(1, pending.expiresInS || pending.ttlS || 120);
    const paint = function () {
      $('ask-clock').textContent = left > 0 ? left + 's to answer' : 'lapsed';
    };
    paint();
    proposalTicker = setInterval(function () { left--; paint(); if (left <= 0) clearInterval(proposalTicker); }, 1000);
    proposalTimer = setTimeout(function () { sweepProposal(); }, (left * 1000) + 600);
  }

  async function toolPost(path, body) {
    const res = await fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return data;
  }

  /* One way out for every outcome - done, refused, failed, lapsed - so the card and the
     voice can never disagree about what happened. The script's stdout IS the answer. */
  function settleProposal(data, question) {
    hideProposal();
    const line = (data && (data.answer || data.error)) ||
      'The server said nothing about that, sir, so I cannot tell you whether it ran.';
    renderAnswer(question, line, !!(data && (data.error || data.ok === false)), null);
    if (!speak(spokenForm(line))) idleStatus();
    if (data && data.pending) showProposal(data.pending);   // busy: it is still pending
  }

  async function confirmProposal(door) {
    if (!proposal) return;
    const asked = proposal, said = door === 'button' ? 'Yes' : 'yes';
    /* The two tones for the two answers, and they are played HERE rather than on the
       click, so the spoken door sounds exactly like the pressed one - the word "yes" and
       the Yes button are the same consent and should not have different voices. */
    chime('yes');
    $('ask-yes').disabled = true; $('ask-no').disabled = true;
    $('ask-clock').textContent = 'running…';
    clearTimeout(proposalTimer); clearInterval(proposalTicker);
    setStatus('thinking', 'running ' + asked.tool);
    const data = await toolPost('/execute', { id: asked.id, door: door || 'button' });
    settleProposal(data, said);
  }

  async function refuseProposal(door) {
    if (!proposal) return;
    const asked = proposal;
    chime('no');
    const data = await toolPost('/tools',
      { cmd: 'cancel', id: asked.id, door: door || 'button' });
    settleProposal(data, door === 'button' ? 'No' : 'no');
  }

  /* The countdown reached zero. The server decides whether it really lapsed - two tabs
     asking at once produce exactly one lapse - and speaks the line once. */
  async function sweepProposal() {
    if (!proposal) return;
    const data = await toolPost('/tools', { cmd: 'lapse' });
    if (data && data.lapsed) return settleProposal(data, '');
    hideProposal();
    if (data && data.pending) showProposal(data.pending);
  }

  /* A CHANGED SUBJECT IS A WITHDRAWAL, from the doors that are not /chat: the share, the
     eyes, the watch, a capture, the timer. /chat withdraws server-side and speaks the
     line in front of the answer; here the organ is about to speak, so the line goes to
     the status strip instead of over the top of it. */
  async function withdrawProposal() {
    if (!proposal) return;
    hideProposal();
    const data = await toolPost('/tools', { cmd: 'withdraw' });
    if (data && data.answer) setStatus('', data.answer);
  }

  $('ask-yes').onclick = function () { confirmProposal('button'); };
  $('ask-no').onclick = function () { refuseProposal('button'); };

  let lastPlan = 'hold';
  function applyCamera(plan, used) {
    lastPlan = plan;
    if (plan === 'hold') return;              // graph untouched: no light, no flight

    if (plan === 'fly') {
      // One clear source: light it AND its direct neighbours, fly to it, open it.
      const top = used[0];
      setHighlight(top.id, true);              // also lights every direct neighbour
      used.forEach(function (n) { hiNodes.add(n.id); });
      refresh();
      openPanel(top);
      focusNode(top, false);
      return;
    }

    // cluster: light exactly the notes that were used, and the links between them.
    hiNodes.clear(); hiLinks.clear();
    used.forEach(function (n) { hiNodes.add(n.id); });
    activeLinks.forEach(function (l) {
      if (hiNodes.has(idOf(l.source)) && hiNodes.has(idOf(l.target))) hiLinks.add(l);
    });
    selected = used[0].id;
    refresh();
    openPanel(used[0]);                        // the panel opens; the camera does not move
  }

  /* ================================================================ brain ==
     "switch to Astra", "try on Claude Fable 5.1", "go back to your normal brain".

     Nothing here decides WHICH model is real - the server owns the allowlist and
     the refusals, and this page only ever paints what the server reports back. A
     chip painted from what we asked for would show the wrong brain for exactly the
     case the whole feature exists to prevent. */
  const RESTORE_RE = /\b(?:normal|usual|default|original|config(?:ured)?|own|proper|old)\s+(?:brain|model|self|mind|brains)\b|\bback\s+to\s+(?:normal|yourself|your\s+(?:normal|usual|own|old)\b)/i;
  const SWAP_RE = /^\s*["'“‘(\[]*(?:please\s+)?(?:switch|swap|change|flip|turn|put|try|use|load|run|become|be|revert|go\s+back|come\s+back|return|restore)\b(?:\s+[\w.]+){0,4}?\s+(?:sonnet|astra|brains|fable|haiku|opus|brain|mind|self|gpt)\b/i;
  function isSwap(text) {
    return SWAP_RE.test(String(text)) || RESTORE_RE.test(String(text));
  }

  let brain = null;                 // last state the SERVER reported, or null
  function paintBrain(state) {
    if (!state || !state.label) return;
    brain = state;
    const chip = $('brainchip');
    $('brain-label').textContent = state.label;
    chip.classList.toggle('swapped', !!state.swapped);
    chip.classList.toggle('nokey', state.keyConfigured === false);
    chip.title = state.model +
      (state.provider ? '  ·  via ' + state.provider : '') +
      (state.swapped ? '  ·  swapped at runtime; a restart returns to ' +
        (state.configLabel || state.configModel) : '  ·  from config.json') +
      (state.keyConfigured === false ? '  ·  NO KEY: it cannot answer yet' : '');
  }

  async function refreshBrain() {
    try {
      const res = await fetch('/health');
      const data = await res.json();
      if (data && data.brain) paintBrain(data.brain);
      /* The voice pin arrives on the same trip as the brain, because it is the same
         question - "what does config.json say" - and one round trip is enough. A pin
         that changed since the last poll re-decides the voice immediately; one that
         did not is left alone, so this cannot fight voiceschanged for the choice. */
      if (data && typeof data.voice === 'string' && data.voice !== voicePin) {
        voicePin = data.voice;
        refreshVoice();
      }
      /* AND WHICH ENGINE, on the same trip and for the same reason. The server knows
         whether it can synthesise locally; the page is the only thing that can act on
         the answer. Re-read every poll so that finishing a half-downloaded model is
         noticed without a reload - speakEngineFrom() only reacts when the answer
         changes, and it always names what it chose. */
      if (data && data.say) speakEngineFrom(data.say);
      /* AND WHETHER THE SKY TURNS, on the same trip and for the same reason: config.json
         is the question and the page is the only thing that can act on the answer. An
         absent key, an old server or a failed fetch all leave the sky at rest, because
         rest is the default and the answer that costs nothing if it is wrong. */
      skySpin(!!(data && data.sky && data.sky.spin));
    } catch (e) { /* the chip keeps whatever it last knew to be true */ }
  }

  /* ONE PATH OUT OF THIS PAGE. The ask bar and the chip's menu both end up here,
     with a different body and the same everything else - the same status, the same
     rendering, the same speaking, and above all the same sentence, because the
     sentence is the server's. A button that composed its own line would be a second
     voice, and two voices is what this whole arrangement exists to prevent. */
  async function swapBrain(text, body) {
    if (busy || !String(text).trim()) return;
    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    setStatus('thinking', 'changing brains', text);
    renderAnswer(text, 'Changing brains…', false, null);

    function done(message, isError, state) {
      /* The chip moves only on the server's word. A refusal reports the state it
         did NOT change, so painting it is still correct - and still honest. */
      if (state) paintBrain(state);
      renderAnswer(text, message, isError, null);
      if (!speak(spokenForm(message))) idleStatus();
      // A brain swap cites no note, so the camera holds. Same rule as a screen
      // answer: flying somewhere would claim a source this answer does not have.
      applyCamera(decideCamera('model', [], isError), []);
    }

    try {
      const res = await fetch('/model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || { say: text, door: 'voice' })
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      if (!data) {
        done('I could not change brains: the server replied with something that was ' +
             'not JSON (HTTP ' + res.status + ').', true, null);
      } else {
        // ok:false is a refusal, already phrased in character by the server. It is
        // shown as an error precisely because it must not read like a success.
        done(data.answer || data.error || 'Something went wrong changing brains.',
             !data.ok, data.label ? data : null);
      }
    } catch (e) {
      done('Could not reach the brain to change it (' + e.message + ').', true, null);
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
    }
  }

  /* THE BUTTON DOOR. The chip is the button: it already says which brain is in play,
     so making it the way to change one saves inventing a second control that says the
     same thing. What it offers comes from GET /brains - the server's own allowlist -
     so the menu cannot offer a model the voice would be refused. */
  let brainList = null;             // [{say,id,label,pretty,current}], or null

  async function loadBrains() {
    try {
      const res = await fetch('/brains');
      const data = await res.json();
      if (data && Array.isArray(data.models)) brainList = data.models;
      if (data && data.brain) paintBrain(data.brain);
    } catch (e) { brainList = null; }
    return brainList;
  }

  function brainMenuOpen() { return $('brainmenu').classList.contains('open'); }

  function closeBrainMenu() { $('brainmenu').classList.remove('open'); }

  function paintBrainMenu() {
    const menu = $('brainmenu');
    menu.textContent = '';
    if (!brainList || !brainList.length) {
      const dead = document.createElement('button');
      dead.type = 'button';
      dead.className = 'home';
      dead.textContent = 'the server has not said what it has';
      menu.appendChild(dead);
      return;
    }
    const here = brain && brain.model;
    brainList.forEach(function (m) {
      const row = document.createElement('button');
      row.type = 'button';
      row.setAttribute('role', 'menuitem');
      row.dataset.id = m.id;
      row.textContent = m.pretty || m.label;
      if (m.id === here) row.classList.add('on');
      /* The id, not the spoken name: the button knows exactly which model it means,
         and the server checks it against the same allowlist either way. */
      row.onclick = function () {
        closeBrainMenu();
        swapBrain('switch to ' + (m.pretty || m.label),
                  { model: m.id, door: 'button' });
      };
      menu.appendChild(row);
    });
    const rule = document.createElement('div');
    rule.className = 'hr';
    menu.appendChild(rule);
    const home = document.createElement('button');
    home.type = 'button';
    home.className = 'home';
    home.setAttribute('role', 'menuitem');
    home.textContent = 'back to ' +
      ((brain && (brain.configLabel || brain.configModel)) || 'the configured brain');
    home.onclick = function () {
      closeBrainMenu();
      swapBrain('go back to your normal brain',
                { say: 'go back to your normal brain', door: 'button' });
    };
    menu.appendChild(home);
  }

  async function toggleBrainMenu() {
    if (brainMenuOpen()) return closeBrainMenu();
    if (!brainList) await loadBrains();
    paintBrainMenu();
    $('brainmenu').classList.add('open');
  }

  $('brainchip').onclick = toggleBrainMenu;
  $('brainchip').onkeydown = function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleBrainMenu(); }
  };
  // Anywhere else, and Escape, closes it. A menu that stays open over a galaxy you
  // are trying to drag is a menu you will resent.
  document.addEventListener('pointerdown', function (e) {
    if (!brainMenuOpen()) return;
    if ($('brainmenu').contains(e.target) || $('brainchip').contains(e.target)) return;
    closeBrainMenu();
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && brainMenuOpen()) closeBrainMenu();
  });

  /* ================================================================ focus ==
     The accountability timer. Read one thing before changing anything here: this
     page owns NO part of the session. The countdown, the drift, the callouts and
     the report all live on the server's one-second tick, and everything below is
     a display and a set of buttons. That is what makes a reload rejoin a session
     in progress instead of quietly starting a fresh one, and it is why the numbers
     survive closing the tab entirely.

     The state that arrives is a whitelist of booleans and counters - there is no
     app name and no site in it, by construction, and focus.py has a test that
     proves it. So this file cannot display where you went even if it wanted to,
     which is why the card shows a colour and a count rather than a name.

     One exception, and it is deliberate: a callout may NAME the site or application
     you drifted into - "Sir, Instagram can wait" - so the name arrives here inside
     the sentence, is spoken by speak(), and is gone from the next /focus response
     entirely. The server scrubs the line one tick after sending it. Nothing on this
     page may hold on to it: no variable, no dataset, no DOM node of its own. Speak
     it and let it go, which is all this page does with any say-line. */

  const FOCUS_DEFAULT_MIN = 30;    // what the button starts; the voice can say any
  const FOCUS_EXTEND_MIN = 5;      // what the +5 button adds
  const FOCUS_PAINT_MS = 250;      // local repaint between server pushes
  const FOCUS_HOME_BEAT_MS = 1500; // "this tab has focus" while it does
  const FOCUS_POLL_MS = 2500;      // fallback only, used when the stream is down
  const FOCUS_ANSWER_MS = 20000;   // the answer window: one reply, no wake word
  const FOCUS_ANSWER_WAIT_MS = 900;// let the question finish being spoken first
  const FOCUS_LOCK_FLASH_MS = 1000;// how long the lock pill reads LOCKED after a press

  let fx = null;                   // the last state the SERVER sent, or null
  let fxAt = 0;                    // when it arrived, so the clock can tick between
  let fxSpoken = 0;                // highest say-seq already out of the speakers
  let fxStream = null, fxPoll = null, fxAdopted = false;
  /* True only while ?focusprobe=1 is running its battery. The probe feeds the card
     synthetic states, so for those few hundred milliseconds this page must not talk
     to the server at all - a push landing mid-case would repaint the card under the
     assertion, and a beat going out would tell the server this tab is at home base
     when nobody is looking at it. See fxProbeRun(). */
  let probeRunning = false;
  let fxAnswerUntil = 0;           // while > now, the next thought heard is the intent
  let fxAnswerTimer = null;
  /* THE RETIREMENT. An ended session's card is a corpse occupying prime real estate:
     "SESSION OVER · 0:00", top-right, over your note title, until something else
     happens to move it. So the report gets eight seconds - long enough to read four
     numbers off it, short enough that the desk is clear before you have finished
     thinking about the next thing - and then the card leaves: the desktop window
     closes, the in-page card fades.
     Eight and not thirty because of how this card is actually used. It is glanced at,
     not studied; the numbers it carries are on the answer card as well, in words, and
     that one stays. A report you wanted to keep looking at is a report you can scroll
     back to. A card that holds until the next session starts sounds tidier and is
     worse - it means the ONE state this card spends most of its life in is "describing
     something that finished a while ago". */
  const CARD_RETIRE_S = 8;
  let fxRetireTimer = null;
  let fxRetired = false;           // this report has had its eight seconds
  /* The tail of focus.py's "arming" line. Matched against what this tab just spoke,
     so the microphone opens for a question this tab genuinely asked. */
  const FOCUS_ASKED_RE = /what are we focusing on\s*\?/i;

  function fxLive() {
    return !!fx && (fx.state === 'arming' || fx.state === 'running' ||
                    fx.state === 'paused');
  }

  /* SHOWING is not the same as LIVE, and the difference is the report. A finished
     session's card holds its last line for CARD_RETIRE_S seconds before it retires, and
     for those eight seconds the card is on screen while no session is running - so the
     desktop window must not close under it and the layout lane must still leave it room.
     Everything that asks "is there a card" asks this; only the clock asks fxLive(). */
  function fxShowing() {
    if (fxLive()) return true;
    return !!(fx && fx.state === 'ended' && fx.report && !fxRetired);
  }

  function fxSecs(n) {
    const s = Math.max(0, Math.round(n));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  /* Every focus line reaches the voice through here and through nowhere else.
     Lines are spoken in seq order and each seq exactly once, which is the whole
     defence against a reload or a second tab shouting the same callout twice. */
  function fxAbsorb(lines) {
    const fresh = (lines || []).filter(function (l) {
      return l && l.seq && l.seq > fxSpoken;
    });
    if (!fresh.length) return '';
    fxSpoken = fresh[fresh.length - 1].seq;
    if (!fxAdopted) return '';     /* see fxApply: a rejoin adopts, it does not replay */

    /* More than one line can land in a single push - "twenty five minutes, go to
       the thing" and "locked on" arrive together when you were never at home base.
       They are spoken as ONE utterance, because speak() cancels whatever is already
       talking: firing them separately would leave only the last one audible, and the
       one it would silence is the instruction you were waiting to hear confirmed. */
    let text = fresh.map(function (l) { return l.text; }).join(' ');
    while (fresh.length > 1 && text.length > SPOKEN_MAX_CHARS) {
      fresh.shift();               // the oldest goes; the newest must always be heard
      text = fresh.map(function (l) { return l.text; }).join(' ');
    }
    renderAnswer('', text, false, null);
    /* No ids, so decideCamera holds the graph still: a callout cites no note and
       must not drag the camera anywhere to make its point. */
    applyCamera(decideCamera('focus', [], false), []);
    /* The return value is what was actually SPOKEN, and it is only used to decide
       whether this tab heard the question it is about to open a microphone for. A
       tab that is muted, or whose audio is still locked, heard nothing. */
    if (!speak(spokenForm(text))) { idleStatus(); return ''; }
    return text;
  }

  function fxApply(state) {
    if (!state || typeof state !== 'object') return;
    fx = state;
    fxAt = performance.now();
    /* A sequence that went BACKWARDS means the server process restarted under us
       and started counting again. Re-base on it rather than treating the new lines
       as already spoken, which would run the next session in total silence. */
    const top = (state.say || []).reduce(function (m, l) {
      return Math.max(m, (l && l.seq) || 0);
    }, 0);
    if (top < fxSpoken) { fxSpoken = top; fxAdopted = false; }
    /* The first state of the tab's life is ADOPTED, not replayed: a tab that opens
       into a session already running takes the sequence number as read and speaks
       from the next line on. Otherwise a reload mid-session would deliver the last
