    /* THE VISAGE, TOLD WHAT IS COMING. One call per chunk and it may only set a
       period and an amplitude - the face is downstream of the queue and can never be
       upstream of it, which is the cancel law seen from the other end. */
    faceChunk(item.text);
    if (speakEngine === 'piper' && !speakPiperDown) speakPiper(item);
    else speakWeb(item);
  }

  /* One way out of a chunk, whichever of the four things happened to it: it ended, it
     errored, it would not play, or it was declared dead. The run check is what makes a
     cancel final - a callback that arrives after speakCancel() belongs to an answer
     nobody is listening to any more. */
  function speakAdvance(item) {
    if (speakNow !== item) return;
    if (!item.end) item.end = Date.now();
    speakNow = null;
    speakAudio = null;
    speakDeadlineDown();
    speakPump();
  }

  /* ---- THE COMPLETION CONTRACT ----
     The queue is empty AND the last chunk's end fired. Only then does the SPEAKING
     indicator go out, and only then does speakDone go up - so anything waiting for the
     answer to be finished is waiting for the right thing rather than for the engine to
     look idle for a moment between two sentences. */
  function speakFinish() {
    const spoken = speakChunkLog.filter(function (c) { return c.end && !c.skipped; });
    const skipped = speakChunkLog.filter(function (c) { return c.skipped; });
    speakDraining = false;
    speakNow = null;
    speakAudio = null;
    speakKeepAliveDown();
    speakWatchDown();
    speakDeadlineDown();
    speakBufRelease();
    speakDoneCount++;
    speakDoneLast = {
      at: Date.now(), engine: speakEngine, chunks: speakChunkLog.length,
      spoken: spoken.length, skipped: skipped.length, stalls: speakStalls,
      gapMax: speakGapMax(), text: speakChunkLog.map(function (c) { return c.text; }).join(' ')
    };
    idleStatus();
    try {
      dispatchEvent(new CustomEvent('speakDone', { detail: speakDoneLast }));
    } catch (e) { /* an event nobody can dispatch is still a queue that finished */ }
  }

  /* ---- THE CANCEL LAW ----
     THREE THINGS IN THIS PAGE MAY EMPTY THE QUEUE, and every one of them is a person
     saying stop: the stop control (interrupt(), the barked "stop"/"cancel"/"never mind"),
     a new user question (ask(), and the mic opening, which is a question beginning), and
     the reset button ↻. That is the entire list.

     NOTHING ELSE MAY TOUCH IT. Not an SSE heartbeat, not a panel render, not a camera
     move, not a focus tick, not a proposal card arriving, not a watch callout, not a
     desk card being adopted. Those are things the PAGE decided to do, and an answer the
     user asked for does not stop because the page had an idea. Every one of them could
     once reach speechSynthesis.cancel() through speak(), which cancelled on entry; that
     is why long answers lost their endings. They cannot reach the queue at all now,
     because the queue is private to this section and this function is its only door.

     If you are about to add a fourth caller, you are almost certainly wrong, and what
     you actually want is speakLine(), which APPENDS. */
  function speakCancel(reason) {
    speakRun++;                              // every callback in flight is now stale
    speakQueue.length = 0;
    speakNow = null;
    speakDeadlineDown();
    speakKeepAliveDown();
    speakWatchDown();
    if (speakAudio) {
      try { speakAudio.pause(); } catch (e) { /* it was already done */ }
      speakAudio = null;
    }
    speakBufRelease();
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    if (speakDraining) {
      speakDraining = false;
      speakNote('queue emptied by ' + reason + ' (one of the three)');
    }
    return true;
  }

  /* ---- the web path: one utterance per chunk, chained both ways ----
     onend AND onerror both advance, and that is the whole point: a dropped utterance
     reports itself as an error on a good day and says nothing at all on a bad one, and
     neither may be allowed to strand the tail. The third case - silence - is the
     deadline below. */
  function speakWeb(item) {
    let u = null;
    try { u = new SpeechSynthesisUtterance(item.text); }
    catch (e) { u = null; }
    if (!u) {
      item.error = 'utterance refused';
      item.skipped = true;
      speakNote('chunk ' + item.i + ' could not be made into an utterance; skipped');
      return speakAdvance(item);
    }
    /* A voice we cannot set must not cost the answer its voice: a browser that refuses
       this assignment still speaks perfectly well in its default. */
    u.lang = (chosenVoice && chosenVoice.lang) || 'en-GB';
    if (chosenVoice) {
      try { u.voice = chosenVoice; } catch (e) { /* default voice it is */ }
    }
    /* pitch 0.9 is the only setting here that is taste rather than correctness: it drops
       the voice a little to give it weight. rate and volume are 1.0 because anything else
       is a way of making a machine sound like it is performing. */
    u.rate = 1; u.pitch = 0.9; u.volume = 1;
    u.onstart = function () {
      item.start = Date.now();
      item.source = 'web';
      speakProgressAt = Date.now();
      speakKeepAliveUp();
      setStatus('speaking', 'speaking');
    };
    // Real evidence of progress, straight from the engine, which is what the watchdog
    // needs in order to tell "still reading" from "stopped without saying so".
    u.onboundary = function () { speakProgressAt = Date.now(); };
    u.onend = function () { item.end = Date.now(); speakAdvance(item); };
    u.onerror = function (ev) {
      item.end = Date.now();
      item.error = (ev && ev.error) || 'error';
      speakNote('chunk ' + item.i + ' errored (' + item.error + '); the queue goes on');
      speakAdvance(item);
    };
    speakDeadlineUp(item, speakEstimateMs(item.text));
    try { speechSynthesis.speak(u); speakKeepAliveUp(); }
    catch (e) {
      item.error = 'speak() threw';
      item.skipped = true;
      speakNote('chunk ' + item.i + ' was refused by the engine; skipped');
      speakAdvance(item);
    }
  }

  /* ---- the piper path: WAV bytes from /say, played in order ----
     ONE CHUNK AHEAD, always. The first chunk of an answer costs the server about two
     seconds - a 120 MB model has to be loaded - and every chunk after it is fetched
     while the previous one is still being heard, so the gap between two sentences is
     the gap between two Audio elements and nothing more.

     A FAILED CHUNK IS SKIPPED, LOUDLY, AND THE QUEUE CONTINUES. One stumble is one
     missing sentence; it is not the end of the answer. Two in a row is not a stumble
     but a pattern - the server is gone, or the model was deleted mid-session - and at
     that point the rest of the queue moves to the browser's own voice and says so. */
  function sayFetch(item) {
    if (speakBuf.has(item.id)) return speakBuf.get(item.id);
    const p = fetch('/say', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: item.text })
    }).then(function (r) {
      if (r.ok) return r.blob();
      return r.json().then(
        function (j) { throw new Error((j && j.error) || ('/say answered ' + r.status)); },
        function () { throw new Error('/say answered ' + r.status); });
    }).then(function (b) {
      if (!b || !b.size) throw new Error('/say answered with no bytes');
      return URL.createObjectURL(b);
    }).catch(function (e) {
      item.error = String((e && e.message) || e);
      return '';
    });
    speakBuf.set(item.id, p);
    return p;
  }

  function speakBufRelease() {
    speakBuf.forEach(function (p) {
      p.then(function (url) { if (url) { try { URL.revokeObjectURL(url); } catch (e) {} } });
    });
    speakBuf.clear();
  }

  function speakPiper(item) {
    const run = speakRun;
    /* THIS chunk first, the next one immediately after: both are in flight within a tick
       of each other, and the one the ear is waiting for is the one that was asked for
       first. Requesting the lookahead ahead of the current chunk would make the server
       spend its first two seconds on audio nobody needs yet. */
    const mine = sayFetch(item);
    if (speakQueue.length) sayFetch(speakQueue[0]);      // one ahead: no silence between
    // The deadline is armed BEFORE the fetch resolves, not after: a /say that never
    // answers is exactly as fatal to the tail as an utterance that never ends.
    speakDeadlineUp(item, speakEstimateMs(item.text));
    mine.then(function (url) {
      if (run !== speakRun || speakNow !== item) return;
      if (!url) {
        speakPiperMisses++;
        item.skipped = true;
        speakNote('chunk ' + item.i + ' had no audio (' + (item.error || 'unknown') +
                  '); skipped, the queue goes on');
        if (speakPiperMisses >= 2 && !speakPiperDown) {
          speakPiperDown = item.error || 'the local voice stopped answering';
          speakNote('falling back to ' + (chosenVoice ? chosenVoice.name :
                    'the browser\'s own voice') + ' because ' + speakPiperDown);
          refreshVoice();
          speakProbeUp();               // and start asking whether it has come back
          item.skipped = false;         // this chunk gets read after all, out loud
          item.error = '';
          return speakWeb(item);
        }
        return speakAdvance(item);
      }
      speakPiperMisses = 0;
      let a = null;
      try { a = new Audio(url); } catch (e) { a = null; }
      if (!a) {
        item.skipped = true;
        item.error = 'no Audio element';
        speakNote('chunk ' + item.i + ' could not be played; skipped');
        return speakAdvance(item);
      }
      speakAudio = a;
      item.source = 'piper';
      a.preload = 'auto';
      a.volume = 1;
      a.onloadedmetadata = function () {
        // A real duration beats an estimate, and the deadline should be generous in
        // proportion to how long the chunk actually is.
        if (run === speakRun && speakNow === item && isFinite(a.duration) && a.duration > 0) {
          speakDeadlineUp(item, Math.round(a.duration * 1000));
        }
      };
      a.onplaying = function () {
        if (!item.start) item.start = Date.now();
        speakProgressAt = Date.now();
        setStatus('speaking', 'speaking');
      };
      a.ontimeupdate = function () { speakProgressAt = Date.now(); };
      a.onended = function () { item.end = Date.now(); speakAdvance(item); };
      a.onerror = function () {
        item.error = item.error || 'audio error';
        item.skipped = true;
        speakNote('chunk ' + item.i + ' would not play; skipped, the queue goes on');
        speakAdvance(item);
      };
      a.play().catch(function (e) {
        if (run !== speakRun || speakNow !== item) return;
        item.error = String((e && e.message) || e);
        item.skipped = true;
        speakNote('chunk ' + item.i + ' was not allowed to play (' + item.error +
                  '); skipped, the queue goes on');
        speakAdvance(item);
      });
    });
  }

  /* ---- the three timers ----
     KEEP-ALIVE: Chrome pauses its own queue on long runs for no stated reason. resume()
     on a queue that was never paused is a no-op, so this is safe to call blind - and it
     clears itself the moment nothing is speaking, which is how a cancel from anywhere
     else stops the interval without having to know it exists. */
  function speakKeepAliveUp() {
    if (speakKeepAlive) return;
    speakKeepAlive = setInterval(function () {
      try {
        if (!speechSynthesis.speaking && !speechSynthesis.pending) {
          clearInterval(speakKeepAlive); speakKeepAlive = null; return;
        }
        speechSynthesis.resume();
      } catch (e) { clearInterval(speakKeepAlive); speakKeepAlive = null; }
    }, SPEAK_KEEPALIVE_MS);
  }
  /* And down again the moment the queue empties, rather than up to a tick later. The
     self-clearing check above is the backstop for a cancel that happens anywhere else;
     this is the ordinary ending, and an interval still alive after the final word is a
     timer nobody asked for. */
  function speakKeepAliveDown() {
    if (!speakKeepAlive) return;
    clearInterval(speakKeepAlive);
    speakKeepAlive = null;
  }

  /* WATCHDOG: three seconds with no boundary event, no timeupdate and no chunk change is
     not a pause, it is a stall, and the one thing that has ever cured it is resume().
     Free to call, counted so the harness can see it happened. */
  function speakWatchUp() {
    if (speakWatch) return;
    speakWatch = setInterval(function () {
      if (!speakDraining) { speakWatchDown(); return; }
      /* WAITING IS NOT STALLING. The first chunk of an answer costs the server a couple of
         seconds of model load, and a chunk that has not started yet has no engine to push:
         resume() would be a no-op and the log line would be a lie. A /say that never
         answers at all is the deadline's business, not the watchdog's. */
      if (speakNow && !speakNow.start && speakEngine === 'piper' && !speakPiperDown) return;
      if (Date.now() - speakProgressAt < SPEAK_STALL_MS) return;
      speakStalls++;
      speakProgressAt = Date.now();      // one push per stall window, not one per tick
      speakNote('no progress for ' + SPEAK_STALL_MS + 'ms; forcing resume()');
      if (canSpeak) { try { speechSynthesis.resume(); } catch (e) { /* ignore */ } }
      if (speakAudio && speakAudio.paused) {
        try { speakAudio.play(); } catch (e) { /* the deadline will have it */ }
      }
    }, SPEAK_WATCH_MS);
  }
  function speakWatchDown() {
    if (!speakWatch) return;
    clearInterval(speakWatch);
    speakWatch = null;
  }

  /* DEADLINE: an utterance that neither ends nor errors within its own estimated length
     plus five seconds is dead, whatever the engine still claims. Declared, logged once,
     and advanced past. The cancel() here clears the ENGINE of one abandoned utterance so
     the next one can start - it is not a queue cancellation, and the law above is about
     the queue. */
  function speakEstimateMs(text) {
    return Math.max(1500, Math.round(String(text).length / SPEAK_CPS * 1000));
  }
  function speakDeadlineUp(item, ms) {
    const run = speakRun;
    speakDeadlineDown();
    speakDeadline = setTimeout(function () {
      speakDeadline = null;
      if (run !== speakRun || speakNow !== item) return;
      item.error = item.error || 'never ended';
      item.skipped = true;
      speakNote('chunk ' + item.i + ' neither ended nor errored within ' +
                (ms + SPEAK_DEAD_PAD_MS) + 'ms; declared dead, moving on');
      if (speakAudio) { try { speakAudio.pause(); } catch (e) { /* ignore */ } }
      if (canSpeak && item.source !== 'piper') {
        try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
      }
      speakAdvance(item);
    }, ms + SPEAK_DEAD_PAD_MS);
  }
  function speakDeadlineDown() {
    if (speakDeadline === null) return;
    clearTimeout(speakDeadline);
    speakDeadline = null;
  }

  /* The largest silence between one chunk ending and the next beginning. This is the
     number the spec cares about, so it is computed here rather than in the harness -
     a measurement the page cannot make about itself is a measurement nobody can trust. */
  function speakGapMax() {
    let worst = 0;
    for (let i = 1; i < speakChunkLog.length; i++) {
      const prev = speakChunkLog[i - 1], now = speakChunkLog[i];
      if (prev.end && now.start && now.start > prev.end) worst = Math.max(worst, now.start - prev.end);
    }
    return worst;
  }

  /* ---- the first gesture unlocks audio and releases any held line ---- */
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    /* The tone engine is built in the same gesture, and before the speech gate below:
       an AudioContext created outside a user gesture is born suspended, and a chime
       that needs a second click to work is worse than no chime. A muted tab builds
       nothing at all - ?mute=1 means silence, and a second kind of sound would be a
       second way to route around that. */
    if (!MUTED) tonesUp();
    /* speakPossible() rather than canSpeak: a machine whose browser has no speech engine
       at all can still be read to by piper, and a held line must not be dropped because
       of a capability the local voice does not need. */
    if (MUTED || !speakPossible()) { idleStatus(); return; }
    if (canSpeak) {
      try {                                        // prime the engine in-gesture
        const warm = new SpeechSynthesisUtterance(' ');
        warm.volume = 0;
        speechSynthesis.speak(warm);
      } catch (e) { /* nothing to warm up */ }
      refreshVoice();
    }
    if (pendingLine) { const line = pendingLine; pendingLine = null; speakLine(line); }
    else idleStatus();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    addEventListener(ev, unlockAudio, { passive: true });
  });

  /* ---- listening: buffer phrases until the pause that ends the thought ---- */
  function armFinishTimer() {
    clearTimeout(finishTimer);
    finishTimer = setTimeout(flushThought, FINISH_MS);
  }

  function heardFinal(text) {
    const raw = String(text == null ? '' : text).trim();
    if (!raw) return;
    const bare = raw.toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();
    if (INTERRUPTS.has(bare)) return interrupt(bare);   // straight past the buffer
    lastInterim = '';
    phraseBuffer = phraseBuffer ? phraseBuffer + ' ' + raw : raw;
    armFinishTimer();
    setStatus('listening', 'listening', phraseBuffer);
    faceHeard(phraseBuffer);
  }

  function heardInterim(text) {
    // More words are arriving, so that last pause was not the end of anything.
    lastInterim = String(text == null ? '' : text).trim();
    armFinishTimer();
    setStatus('listening', 'listening', (phraseBuffer + ' ' + lastInterim).trim());
    /* And the mouth opens on the words as they land - the only loudness this page
       is given. See faceHeard() at the visage. */
    faceHeard(phraseBuffer + ' ' + lastInterim);
  }

  function flushThought() {
    clearTimeout(finishTimer);
    finishTimer = null;
    // heardFinal() clears lastInterim, so anything still sitting there arrived
    // after the last final and was never confirmed. Append it rather than lose
    // the tail of the sentence when the recogniser cuts out mid-phrase.
    let thought = (phraseBuffer + ' ' + lastInterim).trim().replace(/\s+/g, ' ');
    phraseBuffer = '';
    lastInterim = '';
    if (!thought) { idleStatus(); return; }
    stopListening();
    $('q').value = '';
    /* The answer window takes precedence over everything, and takes exactly one
       thought. A question the assistant just asked out loud is answered without a
       wake word; the sentence after this one is an ordinary question again. */
    if (fxAnswerArmed()) return fxAnswer(thought);
    ask(thought);                        // exactly the path a typed question takes
  }

  function interrupt(label) {
    clearTimeout(finishTimer);
    finishTimer = null;
    phraseBuffer = '';
    lastInterim = '';
    speakCancel('the stop control');     // one of the three - see THE CANCEL LAW
    /* "Stop" means stop, including the answer window. Leaving it armed would make
       the next unrelated sentence, whenever it came, the session's intent. */
    fxAnswerClose();
    /* And including a proposal. "stop", "cancel" and "never mind" are barked interrupts,
       so they never reach ask() - which would make them the three refusals that did not
       work. Here they refuse, properly, through the server. */
    if (proposal) refuseProposal('voice');
    stopListening();
    setStatus('', '“' + label + '” · stopped');
  }

  function buildRecogniser() {
    const r = new Recogniser();
    r.lang = 'en-GB';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onstart = function () {
      listening = true;
      $('mic').classList.add('on');
      paintEars();
      setStatus('listening', 'listening');
      /* The wake chime, on the browser's own event and not on the click: it means "the
         microphone is OPEN", and the only thing that knows when that happened is this
         callback. A chime on the click would sometimes be a lie about permission. */
      chime('wake');
    };
    r.onresult = function (e) {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        const text = (res[0] && res[0].transcript) || '';
        if (res.isFinal) heardFinal(text); else interim += text;
      }
      if (interim.trim()) heardInterim(interim);
    };
    r.onerror = function (e) {
      listening = false;
      $('mic').classList.remove('on');
      paintEars();
      setStatus('', e.error === 'not-allowed' ? 'microphone permission denied'
              : e.error === 'no-speech' ? 'heard nothing · click the mic again'
              : 'microphone error · ' + e.error);
    };
    r.onend = function () {
      listening = false;
      $('mic').classList.remove('on');
      paintEars();
      // The service can cut out mid-thought; do not lose what was already said.
      if (phraseBuffer.trim() || lastInterim.trim()) flushThought();
      else idleStatus();
    };
    return r;
  }

  function startListening() {
    if (!Recogniser || listening) return;
    /* One of the three, and the one that needs saying: opening the ear IS a new question
       beginning, and it carries the same permission ask() does. It is also the one place
       where NOT cancelling would be a bug you can hear - the assistant reading an answer
       into its own microphone. See THE CANCEL LAW. */
    speakCancel('the microphone opening');
    phraseBuffer = '';
    lastInterim = '';
    if (!recogniser) recogniser = buildRecogniser();
    try { recogniser.start(); }
    catch (e) { setStatus('', 'microphone busy · click again'); }
  }

  function stopListening() {
    clearTimeout(finishTimer);
    finishTimer = null;
    if (recogniser && listening) { try { recogniser.stop(); } catch (e) { /* ignore */ } }
    listening = false;
    $('mic').classList.remove('on');
    paintEars();
  }

  const EAR_TITLE = 'Your ears · tap the ear button and just talk';

  /* THE EAR LAW, in the assistant's own words. Character-for-character focus.py's
     LINES["ears_off"], and test_eyes.py compares the two strings rather than trusting
     this comment: the server says it when the eyes open with the mic off, this page
     says it when the session asks a question it cannot hear, and one law said two
     different ways is two laws. */
  const EARS_OFF_LINE = 'My ears are off, sir - tap the ear button and just talk.';

  /* The ear button, and the ONLY caller of startListening() in this page. Grep for the
     other callers before changing that: there are none, and the eyes organ above is
     written the way it is - reporting `ears` rather than opening them - so that there
     can go on being none. An organ may open the conversation; it may never open the
     microphone. */
  $('mic').onclick = function () {
    unlockAudio();
    if (listening) { stopListening(); idleStatus(); }
    else startListening();
  };

  /* The ear button says which state it is in, and tells the EYES about it - they
     report the ear state with every posture, and the moment it changes is worth
     saying at once rather than at the next heartbeat. Called from the recogniser's
     own events rather than from the click, because the microphone opens when the
     browser says it did, not when we asked. */
  function paintEars() {
    if (!Recogniser) return;
    $('mic').title = listening ? 'Close your ears (stop listening)' : EAR_TITLE;
    if (eyesLive()) eyeReport('posture');
  }
  if (!Recogniser) {
    $('mic').disabled = true;
    $('mic').title = 'This browser has no webkitSpeechRecognition (use Chrome or Edge)';
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (listening || (canSpeak && speechSynthesis.speaking)) interrupt('escape');
  });

  if (canSpeak) {
    refreshVoice();
    speechSynthesis.addEventListener('voiceschanged', refreshVoice);
  }
  idleStatus();

  /* ---- the butler's opening line ----
     Wording comes from the persona block in server.py; the note count comes from
     the graph data and the time of day from this machine's clock, so neither is
     ever hardcoded here. It is shown at once and spoken on the first click, and
     it never touches the camera - it is a greeting, not an answer. */
  const GREETING_FALLBACK = {
    morning: 'Good morning', afternoon: 'Good afternoon', evening: 'Good evening',
    template: '{salutation}, sir. {notes} indexed, all present and accounted for.',
    one: '1 note', many: '{n} notes',
    empty: '{salutation}, sir. Not a single note indexed.'
  };
  function salutationFor(hour) {
    if (hour >= 5 && hour < 12) return 'morning';
    if (hour >= 12 && hour < 17) return 'afternoon';
    return 'evening';            // the small hours count as the tail of the evening
  }
  async function bootGreeting() {
    let g = GREETING_FALLBACK;
    try {
      const res = await fetch('/persona');
      const data = await res.json();
      if (data && data.greeting && data.greeting.template) g = data.greeting;
    } catch (e) { /* wording falls back; the count never does */ }

    const n = nodes.length;                       // straight from graph-data.js
    const salutation = g[salutationFor(new Date().getHours())] || 'Good evening';
    const template = n ? (g.template || GREETING_FALLBACK.template)
                       : (g.empty || GREETING_FALLBACK.empty);
    const count = (n === 1) ? (g.one || '1 note')
                            : String(g.many || '{n} notes').replace('{n}', n);
    const line = String(template)
      .replace('{salutation}', salutation)
      .replace('{notes}', count);

    renderAnswer('', line, false, null);          // no ids, so the graph is untouched
    if (!speak(line)) idleStatus();               // held until the first click
  }

  /* ==================================================================
     THE TYPEWRITER
     ==================================================================
     A long answer arriving all at once is a wall; the same answer arriving at reading
     speed is someone talking to you. But every trick for doing that is a trap, and this
     one avoids all three of them:

       it does not append text. Appending reflows the paragraph on every character, which
         is layout work eighty times a second, and it makes the card grow under the mouse.
         Every character is written ONCE, up front, and then lit - so the paragraph is
         its final size from the first frame and nothing below it ever moves.
       it does not hide the ANSWER, only the ink. The spans are all in the DOM before
         renderAnswer returns, so #a-text.textContent is the complete answer immediately.
         Every harness that reads this page - tools_live, followup_proof, salutation_proof
         - sees the whole sentence whether or not the reveal has finished. A typewriter
         that made the answer arrive late would make this page untestable.
       it does not block. One rAF walk that lights however many characters the clock has
         earned since the last frame, so a dropped frame costs nothing and a backgrounded
         tab simply resumes.

     Loosely synced to the voice, and "loosely" is the honest word: the reveal waits for
     speechSynthesis to actually start, or 200ms, whichever comes first. So the text and
     the mouth begin together instead of the text finishing before a word is out - and a
     muted tab (every harness) just takes the 200ms and runs.

     Short lines are not typed at all. "Thinking across 40 notes…" is a status, and a
     status that types itself out is a status you read twice. */
  const TYPE_MS_PER_CHAR = 10;
  const TYPE_MIN_CHARS = 80;        // below this: it simply appears
  const TYPE_MAX_CHARS = 2400;      // above this: too many spans to be worth it
  const TYPE_LEAD_MS = 200;         // how long to wait for the voice before starting
  let typeRun = 0;                  // bumped per answer; an older reveal sees it and stops
  let typeLit = 0, typeTotal = 0;

  function typeWanted(s) {
    if (s.length < TYPE_MIN_CHARS || s.length > TYPE_MAX_CHARS) return false;
    /* Both of the ways this page is told to hold still: the person who asked their
       browser for less motion, and the probe, which measures a page that is not moving. */
    if (document.documentElement.classList.contains('nomove')) return false;
    try {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    } catch (e) { /* no matchMedia: type away */ }
    return true;
  }

  function typeOut(el, text) {
    const s = String(text == null ? '' : text);
    typeRun++;
    const run = typeRun;
    el.classList.remove('typed');
    if (!typeWanted(s)) {
      el.textContent = s;
      typeLit = typeTotal = s.length;
      return;
    }
    /* One fragment, one insertion. Characters rather than words because a word-level
       reveal reflows every time a word appears - see above. */
    const frag = document.createDocumentFragment();
    const chars = new Array(s.length);
    for (let i = 0; i < s.length; i++) {
      const sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = s.charAt(i);
      chars[i] = sp;
      frag.appendChild(sp);
    }
    el.textContent = '';
    el.appendChild(frag);
    el.classList.add('typed');
    typeLit = 0; typeTotal = s.length;

    const bornAt = performance.now();
    let from = 0;
    (function step(now) {
      if (run !== typeRun) return;                // a newer answer owns this element now
      if (!from) {
        const voiceUp = canSpeak && !MUTED && speechSynthesis.speaking;
        if (!voiceUp && (now - bornAt) < TYPE_LEAD_MS) return requestAnimationFrame(step);
        from = now;
      }
      const want = Math.min(chars.length,
                            Math.floor((now - from) / TYPE_MS_PER_CHAR) + 1);
      for (; typeLit < want; typeLit++) chars[typeLit].classList.add('lit');
      if (typeLit < chars.length) requestAnimationFrame(step);
    })(bornAt);
  }

  /* ==================================================================
     THE TONE ENGINE
     ==================================================================
     Three sounds, synthesised here, because three mp3s would be three requests, three
     things to cache and three files that can go missing - and an oscillator is smaller
     than the <audio> tag that would play one.

     The laws, in order of how much they matter:

       the ceiling is absolute. One gain node between every voice and the speakers, set
         once to 0.15 and never written again - so no tone anywhere in this file can be
         louder than that, including one added later by someone who did not read this.
       ?mute=1 covers this too. A muted tab does not build the engine at all; see
         unlockAudio(). Silence means silence, not "silence except for the nice bits".
       it starts on a gesture. An AudioContext built any other way is born suspended.
       nothing runs on a timer. Every envelope is scheduled on the audio clock ahead of
         time and the nodes stop themselves, so a tone costs zero main-thread frames -
         which is the whole reason this is allowed to exist next to a 60fps galaxy.

     The palette is the vocabulary of the room: the same four notes mean "I am waiting for
     you" whether it was the microphone or the Hands; a rising pair means "doing it"; a
     falling filtered breath means "not doing it". */
  const TONE_CEILING = 0.15;                  // the absolute cap, on the master bus
  const CMAJ7 = [261.63, 329.63, 392.00, 493.88];     // C4 E4 G4 B4
  let actx = null, toneBus = null, toneTrouble = '';
  const tonesPlayed = [];

  function tonesUp() {
    if (toneBus) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { toneTrouble = 'no AudioContext in this browser'; return false; }
    try {
      actx = new AC();
      toneBus = actx.createGain();
      toneBus.gain.value = TONE_CEILING;        // written once, on purpose
      toneBus.connect(actx.destination);
    } catch (e) {
      actx = null; toneBus = null;
      toneTrouble = 'audio: ' + ((e && e.message) || 'refused');
      return false;
    }
    return true;
  }

  /* One gate, and it is not a second mute: MUTED never built the bus in the first place,
     so this is only asking whether there is anything to play through. */
  function chimesAllowed() { return !!toneBus && audioUnlocked; }

  function toneNote(kind, freq, at, len, peak, type) {
    const osc = actx.createOscillator();
    const env = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, at);
    /* Ramps, not steps: a gain that jumps from 0 to anything is a click, and a click is
       the one sound in a synthesiser that always sounds like a bug. */
    env.gain.setValueAtTime(0.0001, at);
    env.gain.exponentialRampToValueAtTime(peak, at + Math.min(0.03, len * 0.3));
    env.gain.exponentialRampToValueAtTime(0.0001, at + len);
    osc.connect(env); env.connect(toneBus);
    osc.start(at); osc.stop(at + len + 0.02);
    osc.onended = function () {
      try { osc.disconnect(); env.disconnect(); } catch (e) { /* already gone */ }
    };
    return osc;
  }

  function chime(kind) {
    if (!chimesAllowed()) return false;
    try {
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + 0.01;
      if (kind === 'wake') {
        /* Cmaj7, spread over 130ms so it arrives as a chord rather than a stab. Four
           voices at 0.22 sum to 0.88 of the bus, which is under it by design. */
        CMAJ7.forEach(function (f, i) {
          toneNote(kind, f, t + i * 0.042, 0.9 - i * 0.05, 0.22, 'sine');
        });
      } else if (kind === 'yes') {
        // Crisp and rising: two short notes a fifth apart. "Done" has an upward shape.
        toneNote(kind, 784.00, t, 0.075, 0.5, 'triangle');          // G5
        toneNote(kind, 1174.66, t + 0.075, 0.13, 0.42, 'triangle'); // D6
      } else if (kind === 'no') {
        /* A breath through a closing filter. Nothing punitive about it - a refusal is a
           perfectly good answer, so this falls away rather than buzzing. */
        const osc = actx.createOscillator();
        const lp = actx.createBiquadFilter();
        const env = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(150, t + 0.34);
        lp.type = 'lowpass';
        lp.Q.value = 6;
        lp.frequency.setValueAtTime(1500, t);
        lp.frequency.exponentialRampToValueAtTime(180, t + 0.34);
        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        env.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
        osc.connect(lp); lp.connect(env); env.connect(toneBus);
        osc.start(t); osc.stop(t + 0.38);
        osc.onended = function () {
          try { osc.disconnect(); lp.disconnect(); env.disconnect(); } catch (e) { }
        };
      } else return false;
    } catch (e) {
      toneTrouble = 'tone: ' + ((e && e.message) || 'failed');
      return false;
    }
    tonesPlayed.push({ at: Date.now(), kind: kind });
    while (tonesPlayed.length > 12) tonesPlayed.shift();
    return true;
  }

  /* ==================================================================
     THE DECK  ·  the galaxy, with the lights on
     ==================================================================
     Everything in this section is a LUXURY, and it is written as one: if any part of it
     is unavailable, refuses, throws, or costs frames, the page it is decorating must be
     exactly as good as it was before. So there are four separate safety nets, and each
     one is here because of a different way this could go wrong:

       the import is guarded. No three.js on the mirror, no deck. The page already works.
       the starfield is PROVED before it is trusted. The canvas field is only retired once
         the renderer reports that it actually drew points this frame - see
         renderer.info.render.points. "I added an object to a scene" is not evidence that
         anything appeared, especially across two copies of a library.
       the bloom's own render call is wrapped. A post-processing pass that throws mid-frame
         would take the whole galaxy black, so if it ever throws it removes itself.
       and the frame rate is the final judge. Below 45fps for three seconds and the bloom
         goes, whatever the reason - because the spec for this page is sixty frames, and a
         glow is not worth one of them.

     The two copies of three: 3d-force-graph bundles its own, and the import map at the
     top of this file pins the one we import. Mixing them is the risk the proofs below
     exist to measure rather than assume - a Points object is duck-typed by the renderer
     (isPoints, geometry, material) so it works in practice, and info.render.points is how
     we find out whether "in practice" included today. window.THREE first, always, in case
     the library ever starts sharing its own. */
  const DECK = {
    STARS: 1500,
    STAR_NEAR: 1400, STAR_FAR: 3600,   // well outside the graph, well inside the far plane
    BLOOM_SCALE: 0.5,                  // half-resolution passes: the fill-rate is the cost
    BLOOM_STRENGTH: 0.7, BLOOM_RADIUS: 0.55, BLOOM_THRESHOLD: 0.5,
    FPS_FLOOR: 45, FPS_GRACE_MS: 3000,
    /* THE AUDITION. The floor above is the emergency brake - 45fps for three seconds and
       the glow is gone. These two are the gentler question asked first: what does this
       machine do WITHOUT the bloom, and what does it do with it? A glow that costs a
       sixth of the frames on the machine in front of you is not a glow this page wants,
       even at 51fps, because the first line of the specification for it is sixty. Both
       windows are short enough that the whole audition is over before anyone has read the
       greeting. ?bloom=1 skips it and keeps the glow regardless - the 45fps brake still
       applies - and ?bloom=0 never asks at all. */
    PROBE_MS: 2200, KEEP_FPS: 55, KEEP_RATIO: 0.9,
    PULSE_MIN: 0.8, PULSE_S: 5.5       // the links breathe by a fifth, once every 5.5s
  };
  const DECK_OFF = /(^|[?&])deck=0(&|$)/.test(location.search);
  const BLOOM_OFF = /(^|[?&])bloom=0(&|$)/.test(location.search);
  const BLOOM_FORCED = /(^|[?&])bloom=1(&|$)/.test(location.search);

  const deck = {
    on: false, stars: 'canvas', bloom: false, why: '', trouble: '',
    fps: 0, worst: 0, frames: 0, points: 0, lines: 0, revision: '',
    probation: 'off', baseline: 0, trial: 0
  };
  let bloomPass = null, deckStars = null;

  function deckDropBloom(why) {
    if (!bloomPass) return;
    const composer = Graph.postProcessingComposer && Graph.postProcessingComposer();
    try { bloomPass.enabled = false; } catch (e) { /* it is going anyway */ }
    try {
      if (composer && composer.removePass) composer.removePass(bloomPass);
    } catch (e) { /* enabled=false is enough */ }
    try { if (bloomPass.dispose) bloomPass.dispose(); } catch (e) { /* ignore */ }
    bloomPass = null;
    deck.bloom = false;
    deck.why = why || 'dropped';
  }

  async function deckBoot() {
    if (DECK_OFF) { deck.why = '?deck=0'; return; }
    let THREE = window.THREE || null;
    if (!THREE) {
      try { THREE = await import('three'); }
      catch (e) {
        deck.trouble = 'three: ' + ((e && e.message) || 'no module');
        return;                                   // the canvas sky stays. Nothing is lost.
      }
    }
    deck.revision = String(THREE.REVISION || '?');
    const scene = Graph.scene && Graph.scene();
    const renderer = Graph.renderer && Graph.renderer();
    if (!scene || !renderer) { deck.trouble = 'no scene'; return; }
    deck.on = true;

    deckStarfield(THREE, scene, renderer);
    deckLinkPulse(scene);
    deckWatchFrames();                 // the judge is seated before the glow walks in
    if (BLOOM_OFF) { deck.why = '?bloom=0'; return; }
    await deckAudition(THREE, renderer);
  }

  /* ---- THE AUDITION ----
     Two short windows of real frames: one without the bloom to learn what this machine
     is capable of, one with it to learn what the bloom costs here. The glow is kept only
     if it clears an absolute floor AND stays within a tenth of what the same machine was
     doing a moment earlier - because 55fps means one thing on a laptop that was doing 60
     and quite another on a laptop that was doing 144.
     This measures its OWN rAF deltas rather than reading deck.fps, so the two numbers
     are independent and can be compared afterwards; a self-check that reads the value it
     is checking proves nothing. */
  function deckSampleFps(ms) {
    return new Promise(function (done) {
      const t0 = performance.now();
      let last = t0, n = 0;
      (function tick(now) {
        const dt = now - last; last = now;
        if (dt > 0 && dt < 2000 && document.visibilityState === 'visible') n++;
        if (now - t0 < ms) requestAnimationFrame(tick);
        else {
          const secs = (now - t0) / 1000;
          done(secs > 0 && n > 1 ? Math.round((n / secs) * 10) / 10 : 0);
        }
      })(t0);
    });
  }

  async function deckAudition(THREE, renderer) {
    if (BLOOM_FORCED) {                // asked for by hand: no audition, brake still on
      deck.probation = 'forced';
      await deckBloom(THREE, renderer);
      return;
    }
    deck.probation = 'running';
    deck.baseline = await deckSampleFps(DECK.PROBE_MS);
    await deckBloom(THREE, renderer);
    if (!bloomPass) { deck.probation = 'dropped'; return; }   // deck.why is already set
    deck.trial = await deckSampleFps(DECK.PROBE_MS);
    const enough = deck.trial >= DECK.KEEP_FPS;
    const cheap = !deck.baseline || deck.trial >= deck.baseline * DECK.KEEP_RATIO;
    if (enough && cheap) { deck.probation = 'kept'; return; }
    /* If the 45fps brake already fired during the trial, deckDropBloom is a no-op and
       its reason survives - the harsher verdict is the more useful one to read. */
    deckDropBloom('audition: ' + deck.trial + 'fps with the glow against ' +
                  deck.baseline + 'fps without it (floor ' + DECK.KEEP_FPS + ', keep ' +
                  Math.round(DECK.KEEP_RATIO * 100) + '% of baseline)');
    deck.probation = 'dropped';
  }

  /* ---- the real sky: one draw call, no per-frame work at all ----
     A shell rather than a cube, so there is no direction you can turn and find the
     corner of the universe. Additive blending and no depth write: stars behind a node
     never punch a hole in it. */
  function deckStarfield(THREE, scene, renderer) {
    let points = null;
    try {
      const n = DECK.STARS;
      const pos = new Float32Array(n * 3);
      const col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
        const r = DECK.STAR_NEAR + Math.random() * (DECK.STAR_FAR - DECK.STAR_NEAR);
        const s = Math.sqrt(1 - u * u);
        pos[i * 3] = r * s * Math.cos(th);
        pos[i * 3 + 1] = r * s * Math.sin(th) * 0.72;   // flattened: a galaxy, not a ball
        pos[i * 3 + 2] = r * u;
        // Mostly the warm white of the canvas field, one in seven the cold blue of it.
        const cold = Math.random() < 0.14;
        const k = 0.45 + Math.random() * 0.55;
        col[i * 3] = (cold ? 0.74 : 1) * k;
        col[i * 3 + 1] = (cold ? 0.84 : 0.99) * k;
        col[i * 3 + 2] = k;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 7, sizeAttenuation: true, vertexColors: true,
        // The same fifth off as the canvas field it replaces - see STAR_DIM - and NO FOG.
        // The scene's fog is a depth cue for the galaxy; applied to a backdrop 1400 units
        // out it is not haze, it is an off switch, and the sky would simply go black.
        transparent: true, opacity: 0.95 * STAR_DIM, depthWrite: false, fog: false
      });
      try { mat.blending = THREE.AdditiveBlending; } catch (e) { /* normal will do */ }
      points = new THREE.Points(geo, mat);
      points.frustumCulled = false;      // it surrounds the camera; culling it is a bug
      points.renderOrder = -1;           // behind everything, including the links
      points.name = 'deck-stars';
      scene.add(points);
      deckStars = points;
    } catch (e) {
      deck.trouble = 'stars: ' + ((e && e.message) || 'failed');
      return;
    }

    /* THE PROOF, and then the handover. Two copies of three.js is exactly the situation
       where "it did not throw" means nothing, so we wait for the renderer's own count of
       points drawn. Six frames of grace because the first one or two can precede the
       graph's own render entirely. */
    let tries = 0;
    (function check() {
      const drawn = (renderer.info && renderer.info.render &&
                     renderer.info.render.points) || 0;
      if (drawn > 0) {
        deck.points = drawn;
        deck.stars = 'webgl';
        if (stars2d) stars2d.retire();       // and only now
        return;
      }
      if (++tries > 12) {
        // It never appeared. Take it back out and keep the sky we know works.
        try { if (deckStars) deckStars.parent && deckStars.parent.remove(deckStars); }
        catch (e) { /* ignore */ }
        deckStars = null;
        deck.stars = 'canvas';
        deck.trouble = 'stars: nothing drawn (two copies of three?)';
        return;
      }
      requestAnimationFrame(check);
    })();
  }

  /* ---- the links breathe ----
     No custom shader and no new material: the opacity already on the library's own link
     materials, modulated by a fifth. The base is remembered per material in a WeakMap, so
     a rebuild (a highlight, a density toggle) brings new materials with their own bases
     and the old ones are collected rather than tracked. Rescanned every two seconds,
     which is cheap, instead of every frame, which is not.

     A LINK IS NOT ALWAYS A LINE. linkWidth() above is 0.35, and any width at all makes
     3d-force-graph draw the link as a cylinder MESH rather than a one-pixel Line - so a
     scan for isLine found precisely nothing on the first run of the proof, which is
     exactly what the proof is for. The library tags everything it owns with
     __graphObjType, and that is what is asked here: its own word for what an object is,
     rather than a guess about which class it chose. */
  const lineBase = new WeakMap();
  let lineMats = [];
  function deckScanLines(scene) {
    /* Deduplicated, and that is not a micro-optimisation: the library shares one material
       between every link of the same colour, so a thousand links are four materials. A
       list with the duplicates in it would write the same opacity a thousand times a
       frame to achieve exactly what four writes achieve. */
    const seen = new Set();
    scene.traverse(function (o) {
      if (!o || !o.material) return;
      if (o.__graphObjType !== 'link' && !o.isLine && !o.isLineSegments) return;
      const m = o.material;
      if (Array.isArray(m) || seen.has(m)) return;
      seen.add(m);
      if (!lineBase.has(m)) lineBase.set(m, typeof m.opacity === 'number' ? m.opacity : 1);
    });
    lineMats = Array.from(seen);
    deck.lines = lineMats.length;
  }
  let lineScanAt = 0;
  function deckLinkPulse(scene) {
    deckScanLines(scene);
    lineScanAt = performance.now();
  }
  function deckPulseFrame(now) {
    if (now - lineScanAt > 2000) { deckScanLines(Graph.scene()); lineScanAt = now; }
    if (!lineMats.length) return;
    const k = DECK.PULSE_MIN + (1 - DECK.PULSE_MIN) *
              (0.5 + 0.5 * Math.sin(now / (DECK.PULSE_S * 1000) * Math.PI * 2));
    for (let i = 0; i < lineMats.length; i++) {
      const m = lineMats[i];
      const base = lineBase.get(m);
      if (base === undefined) continue;
      m.transparent = true;
      m.opacity = base * k;
    }
  }

  /* ---- the bloom, on a short leash ---- */
  async function deckBloom(THREE, renderer) {
    const composer = Graph.postProcessingComposer && Graph.postProcessingComposer();
    if (!composer || !composer.addPass) { deck.why = 'no composer'; return; }
    let Bloom = null;
    try {
      const mod = await import('three/addons/postprocessing/UnrealBloomPass.js');
      Bloom = mod.UnrealBloomPass;
    } catch (e) {
      deck.why = 'bloom module: ' + ((e && e.message) || 'failed');
      return;
    }
    try {
      const w = Math.max(1, Math.round(innerWidth * DECK.BLOOM_SCALE));
      const h = Math.max(1, Math.round(innerHeight * DECK.BLOOM_SCALE));
      const pass = new Bloom(new THREE.Vector2(w, h), DECK.BLOOM_STRENGTH,
                             DECK.BLOOM_RADIUS, DECK.BLOOM_THRESHOLD);
      /* HALF RESOLUTION, PERMANENTLY. The composer calls setSize with the real viewport
         on every resize, which would quietly undo the one decision that makes this
         affordable - so the halving lives in the pass itself rather than in a number we
         passed once. Bloom is the most fill-rate-hungry thing on this page and its blur
         is wide enough that nobody can see the missing pixels. */
      const rawSetSize = pass.setSize.bind(pass);
      pass.setSize = function (pw, ph) {
        rawSetSize(Math.max(1, Math.round(pw * DECK.BLOOM_SCALE)),
                   Math.max(1, Math.round(ph * DECK.BLOOM_SCALE)));
      };
      /* And the pass's own render call, wrapped: it runs inside the library's animation
         loop, where a throw does not just lose the glow, it loses the galaxy. */
      const rawRender = pass.render.bind(pass);
      let bad = 0;
      pass.render = function (r, write, read, delta, mask) {
        try { rawRender(r, write, read, delta, mask); }
        catch (e) {
          if (++bad > 2) deckDropBloom('render threw: ' + ((e && e.message) || 'x'));
        }
      };
      composer.addPass(pass);
      bloomPass = pass;
      deck.bloom = true;
      deck.why = '';
    } catch (e) {
      bloomPass = null;
      deck.bloom = false;
      deck.why = 'bloom: ' + ((e && e.message) || 'refused');
    }
  }

  /* ---- THE FRAME RATE IS THE FINAL JUDGE ----
     A rolling mean over the last second, sampled from the orbit loop - so it is the
     frame rate of the page as a whole, not of some private loop that measures itself.
     Three seconds continuously under the floor and the bloom goes; the clock resets the
     moment a frame comes in over it, because one bad second (a flight, a rebuild, the
     browser deciding to do something else) is not a verdict about the glow.
     A hidden tab is not measured at all: rAF barely runs and every reading would be a
     lie about performance. The 2000ms ceiling on a single delta is deliberately high and
     an earlier version of this had it at 400ms, which was a bug worth naming: a machine
     struggling badly enough to take half a second per frame is EXACTLY the machine this
     guard exists for, and throwing those deltas away as "not a measurement" meant the
     brake could never fire on the only hardware that needed it. Only a gap long enough
     to be the browser suspending us entirely is ignored now. */
  const fpsWin = [];
  let fpsLast = 0, sagSince = 0;
  function deckWatchFrames() {
    fpsLast = performance.now();
    deckFrame = function (now) {
      const dt = now - fpsLast;
      fpsLast = now;
      if (document.visibilityState !== 'visible' || dt <= 0 || dt > 2000) {
        sagSince = 0;                       // not a measurement, so not a verdict either
        return;
      }
      deck.frames++;
      fpsWin.push(dt);
      let sum = 0;
      for (let i = 0; i < fpsWin.length; i++) sum += fpsWin[i];
      while (fpsWin.length > 1 && sum > 1000) sum -= fpsWin.shift();
      const fps = fpsWin.length / (sum / 1000);
      deck.fps = Math.round(fps * 10) / 10;
      if (deck.frames > 40) {
        deck.worst = deck.worst ? Math.min(deck.worst, deck.fps) : deck.fps;
      }
      if (bloomPass) {
        if (fps < DECK.FPS_FLOOR) {
          if (!sagSince) sagSince = now;
          else if (now - sagSince >= DECK.FPS_GRACE_MS) {
            deckDropBloom('held ' + deck.fps + 'fps for ' +
                          Math.round(DECK.FPS_GRACE_MS / 1000) + 's, floor is ' +
                          DECK.FPS_FLOOR);
            sagSince = 0;
          }
        } else sagSince = 0;
      }
      deckPulseFrame(now);
    };
  }

  /* ==================================================================
     THE PLANETARIUM  ·  a note is a world, not a dot
     ==================================================================
     A sphere in a folder colour tells you one thing: which folder. A PLANET tells you
     which folder, how connected it is, and - this is the part worth the code - what is
     actually written in the file, because the surface is a 512x256 canvas of the note's
     own text wrapped around it. Fly close and you can see there are words there. The
     document is not represented by the world; it IS the world's surface.

     WHAT EACH PLANET IS MADE OF, and why it is in four pieces rather than one:
       core   a lit sphere in the cluster colour. MeshStandardMaterial, because the graph's
              own scene already carries an ambient and a directional light, so a shaded
              sphere costs nothing extra and a flat one throws away a free horizon.
       shell  the same sphere 1.4% larger, carrying the text canvas, additive and with
              depthWrite off. Separate from the core on purpose: additive text over a lit
              surface reads at any camera distance, where an emissiveMap on the core would
              be swallowed by its own shading on the dark side.
       glow   one additive sprite, the atmosphere. A sprite rather than a shader because
              this has to survive on a laptop.
       ring   a thin tilted band for the hubs. Built for every planet and SHOWN only for
              the ones with enough links, so the density toggle can change who is a hub
              without rebuilding anything.

     THE PERFORMANCE LAW. Every canvas, every geometry and every material is built exactly
     once, before the bloom's audition starts - so the audition measures the real page, and
     so nothing here can ever appear in a frame budget. Per frame this section does one
     thing: it adds a number to a rotation. The three shared geometries are shared, not
     copied: thirty planets, three geometries.

     WHAT THE FRAME LOOP MUST NOT DO is recompute colour. Dimming, highlighting, the birth
     flare and the web wash all still come from Graph.nodeColor() and Graph.nodeVal() - the
     SAME accessors the old spheres read, called from paintPlanets() rather than
     reimplemented here, because two copies of that decision tree would drift apart within
     a week and the drift would be invisible. What paint does is translate one CSS string
     into a colour and an opacity, and it skips the work entirely when the string has not
     changed since last time - which, during a five-second birth pulse at sixty frames a
     second, is most of the time. */
  const PLANET = {
    TEX_W: 512, TEX_H: 256,
    FONT_PX: 8, LINE_PX: 10,
    TEXT_RGBA: 'rgba(255,255,255,0.16)',
    /* The text is confined to a band around the equator. A sphere's UV map crushes the
       top and bottom rows of the texture into the poles, so anything drawn up there is
       not small, it is a smear - and a smear is how a page like this starts looking
       cheap. 0.2 to 0.8 is the part of the map that reads as writing. */
    BAND_TOP: 0.2, BAND_BOTTOM: 0.8,
    SEG_W: 20, SEG_H: 14,             // 560 triangles a planet; round enough at any range
    SHELL: 1.014,
    /* BODY darkens the sphere so 0.16-alpha white text has something to read against; the
       cluster colour survives at full strength in the emissive, the atmosphere and the
       ring, which is where the identity actually lives. EMISSIVE_HOT and GLOW_HOT are the
       selected world lighting up from inside - the planetary replacement for turning white,
       which under a bloom is not a highlight, it is an erasure. */
    BODY: 0.52,
    EMISSIVE: 0.11, EMISSIVE_HOT: 0.4,
    GLOW: 2.4, GLOW_ALPHA: 0.3, GLOW_HOT: 0.45,
    /* A RING IS FOR A REAL HUB, and six links was not one: thirteen of thirty worlds wore
       one, which made the ring a decoration that meant "this note has friends" - true of
       almost every note. At eight it marks the handful of notes the vault actually pivots
       on. Half the opacity and half the width for the same reason: the ring should be
       noticed when it is looked for, not compete with the world it is around. */
    RING_DEG: 8, RING_IN: 1.38, RING_OUT: 1.715, RING_SEG: 48, RING_ALPHA: 0.125,
    SPIN: 0.0015,                     // radians per frame, as specified
    SCAN_MS: 600, SCAN_IN: 0.8, SCAN_OUT: 1.0, SCAN_ALPHA: 0.85, SCAN_LIFT: 1.06
  };
  const PLANETS_OFF = /(^|[?&])planets=0(&|$)/.test(location.search);

  const planetBuilt = new Map();      // node id -> the parts of its world
  const planet = {
    on: false, why: '', builds: 0, textures: 0, textChars: 0,
    spins: 0, paints: 0, scans: 0, skipped: 0
  };
  let planetGeo = null, planetShellGeo = null, planetRingGeo = null, planetGlowTex = null;
  let planetScanRig = null;
  const planetScan = { on: false, at: 0, id: null, of: null };

  /* Same planet, same ring tilt, every load. A ring angled at random would be a detail
     that changes when nothing changed, which is the kind of thing that makes a page feel
     like it is guessing. Plain integer arithmetic on the node id: no seeded PRNG, nothing
     to get subtly wrong. */
  function planetJitter(id, salt) {
    const n = (Number(id) || 0) * 9301 + salt * 49297 + 233280;
    return ((n % 233280) + 233280) % 233280 / 233280;
  }

  /* ---- the surface: the note's own words, drawn once, at 8px ----
     Transparent everywhere it is not text, so the cluster colour underneath is the
     planet and this is only what is written on it. */
  function planetTexture(THREE, n) {
    const cv = document.createElement('canvas');
    cv.width = PLANET.TEX_W; cv.height = PLANET.TEX_H;
    const g = cv.getContext('2d');
    if (!g) return null;
    g.clearRect(0, 0, cv.width, cv.height);
    g.font = PLANET.FONT_PX + 'px ui-monospace, Consolas, "DejaVu Sans Mono", monospace';
    g.fillStyle = PLANET.TEXT_RGBA;
    g.textBaseline = 'top';
    /* A margin on both edges because u=0 and u=1 are the SAME meridian: without it the
       last word of every line runs into the first word of that line at the seam. */
    const pad = 7;
    const wide = cv.width - pad * 2;
    const top = Math.round(cv.height * PLANET.BAND_TOP);
    const rows = Math.floor((cv.height * (PLANET.BAND_BOTTOM - PLANET.BAND_TOP)) / PLANET.LINE_PX);
    const body = String((n.file || n.label || '') + '  ' + (n.excerpt || ''))
      .replace(/\s+/g, ' ').trim();
    let drawn = 0, y = top, line = '';
    const words = body.split(' ');
    for (let i = 0; i < words.length && (y - top) / PLANET.LINE_PX < rows; i++) {
      const next = line ? line + ' ' + words[i] : words[i];
      if (g.measureText(next).width <= wide) { line = next; continue; }
      g.fillText(line, pad, y); drawn += line.length;
      y += PLANET.LINE_PX;
      line = words[i];
    }
    if (line && (y - top) / PLANET.LINE_PX < rows) { g.fillText(line, pad, y); drawn += line.length; }
    const tex = new THREE.CanvasTexture(cv);
    /* Wrapping in u only: the seam is horizontal and there is nothing above or below the
       band to repeat. colorSpace matters because faint text at 0.16 alpha is exactly where
       a wrong transfer function stops being invisible. */
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 2;
    planet.textures++;
    planet.textChars += drawn;
    return tex;
  }

  /* One radial gradient, shared by every atmosphere. The colour comes from the sprite
     material, so thirty clusters need one texture between them. */
  function planetGlow(THREE) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    const g = cv.getContext('2d');
    if (!g) return null;
    /* A RIM, NOT A BLOB. The sprite is GLOW× the planet's radius, so the disc itself covers
       the inner 1/GLOW of this texture - and an additive gradient that is brightest in the
       middle lands all of that light on the surface, which at close range washes the note's
       own words off its own world. (It did: the first deck-planet.png was a pale blue
       balloon you could barely read.) So the centre is empty, the peak sits just outside
       where the limb falls, and the atmosphere is seen AROUND the planet rather than over
       it. At galaxy distance a node is a handful of pixels and the ring reads as a glow
       anyway, which is the one place the cheap version would have been fine. */
    const limb = 1 / PLANET.GLOW;                    // where the planet's edge falls, 0..1
    const grad = g.createRadialGradient(64, 64, 4, 64, 64, 64);
    grad.addColorStop(0.00, 'rgba(255,255,255,0)');
    grad.addColorStop(limb * 0.72, 'rgba(255,255,255,0)');
    grad.addColorStop(limb * 0.95, 'rgba(255,255,255,0.45)');
    grad.addColorStop(limb * 1.06, 'rgba(255,255,255,1)');
    grad.addColorStop(limb + (1 - limb) * 0.30, 'rgba(255,255,255,0.34)');
    grad.addColorStop(limb + (1 - limb) * 0.62, 'rgba(255,255,255,0.09)');
    grad.addColorStop(1.00, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(cv);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  /* ---- one world ---- */
  function planetMake(THREE, n) {
    const col = groupColor(n);
    const group = new THREE.Group();
    /* An inner group for the rotation, so the SURFACE turns and the atmosphere and the
       ring do not. A ring that spun with its planet would be a ring with a visible seam,
       and a glow sprite always faces the camera anyway - rotating it is work with no
       pixels to show for it. */
    const spin = new THREE.Group();
    group.add(spin);

    const core = new THREE.Mesh(planetGeo, new THREE.MeshStandardMaterial({
      color: col, emissive: col, emissiveIntensity: PLANET.EMISSIVE,
      roughness: 0.82, metalness: 0.06
    }));
    spin.add(core);

    const tex = planetTexture(THREE, n);
    const shell = tex ? new THREE.Mesh(planetShellGeo, new THREE.MeshBasicMaterial({
      map: tex, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    })) : null;
    if (shell) spin.add(shell);

    const glow = planetGlowTex ? new THREE.Sprite(new THREE.SpriteMaterial({
      map: planetGlowTex, color: col, transparent: true, opacity: PLANET.GLOW_ALPHA,
      blending: THREE.AdditiveBlending, depthWrite: false
    })) : null;
    if (glow) { glow.scale.setScalar(PLANET.GLOW); group.add(glow); }

    const ring = new THREE.Mesh(planetRingGeo, new THREE.MeshBasicMaterial({
      color: col, transparent: true, opacity: PLANET.RING_ALPHA,
      side: THREE.DoubleSide, depthWrite: false
    }));
    // Flat in the orbital plane, then tilted - a ring exactly on the equator looks drawn
    // on rather than orbiting.
    ring.rotation.x = Math.PI / 2 + (planetJitter(n.id, 1) - 0.5) * 0.9;
    ring.rotation.z = (planetJitter(n.id, 2) - 0.5) * 0.7;
    group.add(ring);

    /* THE GLOW AND THE RING DO NOT TAKE CLICKS. The atmosphere is nearly three times the
       planet's radius, so leaving it raycastable would silently triple every node's hit
       area - notes would select themselves from a finger's width away and the background
       click that closes the panel would stop working near a hub. The core and its shell
       are the same size the old spheres were, so the pointer behaves exactly as before
       and onBackgroundClick still means background. */
    const deaf = function () {};
    if (glow) glow.raycast = deaf;
    ring.raycast = deaf;

    const p = { node: n, group: group, spin: spin, core: core, shell: shell,
                glow: glow, ring: ring, tex: tex, tone: '', rest: PLANET.EMISSIVE };
    planet.builds++;
    return p;
  }

  /* The accessor the library calls. Cached by node id, so a graphData() rebuild - a new
     note, a density toggle - hands back the SAME world rather than a new one: that is the
     whole of "built once", and __galaxy.planets.builds is how it is checked. */
  function planetFor(n) {
    if (!n) return null;
    let p = planetBuilt.get(n.id);
    if (!p) {
      p = planetMake(window.__planetTHREE, n);
      planetBuilt.set(n.id, p);
    }
    return p.group;
  }

  /* ---- colour, size and dimming: read from the accessors, not re-decided ----
     THE ONE PLACE A WORLD DISAGREES WITH A DOT. nodeColor() answers '#ffffff' for the
     selected note, which was exactly right for a 9-pixel sphere and is exactly wrong for a
     planet: white, plus an emissive, plus an additive atmosphere, plus a bloom pass, is a
     featureless white blob with the note's own text bleached off its surface. The first
     close-up screenshot of this feature was precisely that, and it is the reason this
     function returns a FLAG rather than a colour for that case.
     So the decision still comes from the accessor - selected, dimmed, hidden, flaring,
     washed - and only its EXPRESSION is planetary: a selected world keeps its cluster
     colour and lights up from within instead of turning into a lamp.
     The bodies are darkened for the same reason. Faint white text at 0.16 alpha over a
     bright pastel sphere is invisible; over a body at half brightness it reads, and the
     cluster colour still carries the identity through the emissive, the atmosphere and the
     ring. A planet is not a pixel of paint, it is a lit object. */
  function planetTone(n) {
    let css = '#ffffff';
    try { css = String(Graph.nodeColor()(n)); } catch (e) { /* keep white */ }
    const hot = css === '#ffffff';                 // the accessor's word for "selected"
    if (hot) css = groupColor(n);
    const m = /^rgba?\(([^)]+)\)$/.exec(css);
    if (!m) return { css: css, alpha: 1, hot: hot };
    const p = m[1].split(',').map(Number);
    const a = p.length > 3 && isFinite(p[3]) ? p[3] : 1;
    return { css: 'rgb(' + p[0] + ',' + p[1] + ',' + p[2] + ')', alpha: a, hot: hot };
  }

  /* Scale a colour this file produces towards black, keeping its hue. Not an opacity:
     a transparent planet would show the stars through its own crust. */
  function planetDim(css, k) {
    const m = /^rgba?\(([^)]+)\)$/.exec(String(css));
    let r, g, b;
    if (m) { const p = m[1].split(',').map(Number); r = p[0]; g = p[1]; b = p[2]; }
    else {
      const n = parseInt(String(css).slice(1), 16);
      r = (n >> 16) & 255; g = (n >> 8) & 255; b = n & 255;
    }
    return 'rgb(' + Math.round(r * k) + ',' + Math.round(g * k) + ',' +
           Math.round(b * k) + ')';
  }

  function planetRadius(n) {
    let val = 1;
    try { val = Number(Graph.nodeVal()(n)) || 1; } catch (e) { /* unit sphere */ }
    return Math.cbrt(val) * (Graph.nodeRelSize() || 4.4);
  }

  function paintPlanets() {
    if (!planet.on) return;
    planet.paints++;
    planetBuilt.forEach(function (p) {
      const n = p.node;
      p.group.scale.setScalar(planetRadius(n));
      const tone = planetTone(n);
      const key = tone.css + '|' + tone.alpha + '|' + (tone.hot ? 1 : 0);
      // Nothing changed, so nothing is parsed, allocated or uploaded. See the law above.
      if (key === p.tone) {
        if (planetScan.of !== p) p.core.material.emissiveIntensity = p.rest;
        return;
      }
      p.tone = key;
      const dim = tone.alpha;
      p.rest = tone.hot ? PLANET.EMISSIVE_HOT : PLANET.EMISSIVE;
      p.core.material.color.set(planetDim(tone.css, PLANET.BODY));
      p.core.material.emissive.set(tone.css);
      p.core.material.transparent = dim < 1;
      p.core.material.opacity = dim;
      if (planetScan.of !== p) p.core.material.emissiveIntensity = p.rest;
      if (p.shell) { p.shell.material.opacity = dim; p.shell.visible = dim > 0.12; }
      if (p.glow) {
        p.glow.material.color.set(tone.css);
        p.glow.material.opacity = (tone.hot ? PLANET.GLOW_HOT : PLANET.GLOW_ALPHA) * dim;
      }
      p.ring.material.color.set(tone.css);
      p.ring.material.opacity = PLANET.RING_ALPHA * dim;
      /* A HUB IS A HUB TODAY, not at boot. degOf() counts the links currently drawn, so
         switching the galaxy to every link gives more planets rings and switching back
         takes them away - which is honest, because the ring is a claim about what you
         are looking at. */
      p.ring.visible = degOf(n.id) >= PLANET.RING_DEG && dim > 0.12;
    });
  }

  /* ---- the sweep: the machine acknowledging it has opened a world ----
     One rig for the whole galaxy, re-parented to whichever planet was just selected. A
     band in the planet's own colour, tracking the sphere's cross-section as it travels
     pole to pole, so it hugs the surface instead of cutting through it - narrow at the
     poles, widest at the equator, exactly like a scanner passing over a globe. */
  function planetSweep(id) {
    if (!planet.on || !planetScanRig) return false;
    const p = planetBuilt.get(id);
    if (!p) return false;
    if (planetScanRig.parent) planetScanRig.parent.remove(planetScanRig);
    p.group.add(planetScanRig);
    const tone = planetTone(p.node);
    planetScanRig.material.color.set(mixToWhite(groupColor(p.node), 0.45));
    planetScanRig.material.opacity = PLANET.SCAN_ALPHA * (tone.alpha < 1 ? tone.alpha : 1);
    planetScanRig.visible = true;
    planetScan.on = true; planetScan.at = performance.now();
    planetScan.id = id; planetScan.of = p;
    planet.scans++;
    return true;
  }

  function planetSweepEnd() {
    planetScan.on = false;
    if (planetScan.of) planetScan.of.core.material.emissiveIntensity = planetScan.of.rest;
    planetScan.of = null; planetScan.id = null;
    if (planetScanRig) {
      planetScanRig.visible = false;
      if (planetScanRig.parent) planetScanRig.parent.remove(planetScanRig);
    }
  }

  /* ---- the only per-frame work in this section ---- */
  function planetFrame(now) {
    if (!planet.on) return;
    /* A HIDDEN TAB TURNS NOTHING. rotation.y is a fixed step per frame rather than per
       millisecond, so a backgrounded tab would not fall behind - but it would still be
       asking the GPU to redraw thirty worlds for nobody, and the spec is explicit that
       the spin stops. The scan is left mid-sweep rather than finished early: it resumes
       when the tab does, which is the correct behaviour for an acknowledgement nobody
       was there to see. */
    if (document.visibilityState !== 'visible') { planet.skipped++; return; }
    planet.spins++;
    planetBuilt.forEach(function (p) { p.spin.rotation.y += PLANET.SPIN; });
    if (!planetScan.on) return;
    const k = (now - planetScan.at) / PLANET.SCAN_MS;
    if (k >= 1 || !planetScan.of) { planetSweepEnd(); return; }
    const y = (1 - k * 2) * PLANET.SCAN_LIFT;                    // north pole to south
    const r = Math.sqrt(Math.max(0.0001, 1 - Math.min(1, y * y))) * PLANET.SCAN_LIFT;
    planetScanRig.position.y = y;
    planetScanRig.scale.set(r, r, r);
    // In and out on a sine, so the band arrives and leaves rather than blinking.
    const fade = Math.sin(Math.PI * k);
    planetScanRig.material.opacity = PLANET.SCAN_ALPHA * fade;
    planetScan.of.core.material.emissiveIntensity = planetScan.of.rest + 0.5 * fade;
  }

  /* ==================== THE FLOWING LINKS: TWO DOTS PER RELATION ====================
     ONE Points SYSTEM FOR THE WHOLE SKY, and that is the entire performance argument. Two
     dots on each of 236 links is 472 moving things; as 472 sprites, or as the library's own
     directional particles, that is 472 objects for the renderer to cull, sort and draw
     every frame, and the deck's 55 fps floor does not survive it. As one BufferGeometry it
     is a single draw call and three floats written per dot per frame - the GPU never learns
     that anything moved.

     REAL POSITIONS, NOT AN ANIMATION. The dots are lerped between the two worlds' CURRENT
     coordinates on every frame, so while the layout is still settling the dots travel along
     links that are themselves moving, which is what makes the sky look alive rather than
     decorated. A dot's position along its link is advanced by distance rather than by a
     fraction: at a fixed fraction per second a short link's dots would crawl and a long
     link's would race, and the eye reads that as two different speeds of relation.

     SIXTY PER CENT OF THE SOURCE COLOUR. The dot says where the relation came FROM, and it
     says it quietly: at full strength 472 bright points compete with thirty worlds, and the
     worlds are the subject. The tint is re-decided in flowPaint() on every refresh, so a
     highlight, a dimming and a hidden folder reach the dots and the lines together. */
  /* ONE DOT, NOT TWO. With the lines gone the dot is no longer an ornament travelling along
     a visible wire - it IS the wire, and it is the only evidence that two notes are related
     at all. Two dots half a period apart read as traffic on a road; one dot reads as a
     single travelling charge, which is the thing a synapse actually is. It also halves the
     buffer, which is what buys the extra brightness below.

     THE ALPHA IS IN THE COLOUR, and that is worth explaining because it looks like a
     mistake. A PointsMaterial has ONE opacity for the entire cloud, and the whole point of
     this section is that a dot you are touching is brighter than a dot you are not - so a
     per-dot alpha is unavoidable and the material cannot hold it. Under additive blending a
     dot's contribution is colour x opacity, so folding the alpha into the colour buffer and
     leaving the material at 1 is arithmetically identical to a per-dot opacity, never clips
     (0.6 x 0.8 = 0.48 is the largest multiplier here), and puts the whole decision in one
     readable place: flowPaint(). ALPHA and HOT_ALPHA below are those per-dot alphas, and
     they are the spec's own numbers. */
  const FLOW = {
    PER_LINK: 1,          // one travelling charge per relation
    SIZE: 1.2,
    TINT: 0.6,            // of the source cluster's colour
    ALPHA: 0.35,          // at rest
    HOT_ALPHA: 0.8,       // a relation you are touching
    UNITS_PER_S: 58,      // travel speed in world units, hence the per-link period
    HOT_SPEED: 1.3,       // "slightly faster", and no more than slightly
    /* AND THE REST GO QUIET. Not to zero: a sky that empties the instant the pointer
       crosses a world is a sky that flinches, and the surrounding structure is part of what
       makes the lit relations legible. 0.15 of the resting alpha is about a twentieth of
       full - present as a texture, gone as information. */
    DIM: 0.15
  };
  const flow = { on: false, why: '', links: 0, dots: 0, frames: 0, paints: 0 };
  let flowPoints = null, flowGeo = null, flowMat = null;
  let flowPos = null, flowCol = null, flowT = null, flowList = [];

  /* Called after every graphData() rebuild - a density toggle, a new note - because the
     dots ARE the links and a link that no longer exists must not still have traffic on it.
     The paint at the end is unconditional: the rebuild may have been a no-op while the
     highlight it happened under was not. */
  function flowSync(THREE) {
    flowRebuild(THREE);
    flowPaint();
  }

  function flowRebuild(THREE) {
    if (!flow.on && !THREE) return;
    const links = activeLinks;
    const dots = links.length * FLOW.PER_LINK;
    if (flowGeo && flow.dots === dots && flowList === links) return;
    flowList = links;
    flow.links = links.length;
    flow.dots = dots;
    const T = THREE || window.__planetTHREE;
    if (!T) return;
    /* A NEW SIZE MEANS NEW BUFFERS, and the old ones are disposed rather than dropped: a
       density toggle pressed twenty times would otherwise leave twenty abandoned
       geometries on the GPU. The material outlives them - it never changes. */
    flowPos = new Float32Array(Math.max(1, dots * 3));
    flowCol = new Float32Array(Math.max(1, dots * 3));
    flowT = new Float32Array(Math.max(1, dots));
    for (let i = 0; i < dots; i++) flowT[i] = (i % FLOW.PER_LINK) / FLOW.PER_LINK;
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(flowPos, 3));
    geo.setAttribute('color', new T.BufferAttribute(flowCol, 3));
    if (!flowMat) {
      flowMat = new T.PointsMaterial({
        size: FLOW.SIZE, sizeAttenuation: true, vertexColors: true,
        /* ONE, on purpose: every dot's alpha lives in the colour buffer, because they are
           not all the same. See the note on FLOW above - a material opacity here would be a
           second, invisible multiplier on numbers the spec states exactly. */
        transparent: true, opacity: 1,
        // Additive, so a dot on a dark link adds light rather than painting a grey pip, and
        // so a dot whose colour has been scaled to black is simply not there.
        blending: T.AdditiveBlending, depthWrite: false,
        /* AND ROUND. A Points system with no map draws SQUARES - invisible at a pixel and a
           second later, flying past one world at close range, unmistakably a cheap little
           box. One 32px radial gradient, shared by every dot, makes it a spark instead. */
        map: flowSprite(T)
      });
    }
    if (!flowPoints) {
      flowPoints = new T.Points(geo, flowMat);
      flowPoints.frustumCulled = false;      // the cloud spans the whole galaxy; culling it as one box is a lie
      flowPoints.raycast = function () {};   // a dot is not a click target
      Graph.scene().add(flowPoints);
    } else {
      const old = flowPoints.geometry;
      flowPoints.geometry = geo;
      try { old.dispose(); } catch (e) { /* it was never on the GPU */ }
    }
    flowGeo = geo;
  }

  /* The colour of every dot, decided from the same facts the link colour is decided from
     and by the same rules - which is why it is called from refresh() and nowhere else. */
  function flowPaint() {
    if (!flow.on || !flowCol) return;
    flow.paints++;
    const links = flowList;
    for (let i = 0; i < links.length; i++) {
      const l = links[i];
      const s = byId.get(idOf(l.source)), t = byId.get(idOf(l.target));
      /* THE MIND SHOWS WHAT YOU ARE TOUCHING. Four cases, in order of precedence: a link
         into a muted folder is not there at all; a link you are hovering or have selected
