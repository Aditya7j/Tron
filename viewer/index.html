    /* Changing brains is not an answer about the notes at all - it cites nothing,
       so it moves nothing. Refused swaps included. */
    if (kind === 'model') return 'hold';
    /* And a callout from the focus timer cites nothing either. It has an opinion
       about where you ARE, which is not a claim about any note - so the graph does
       not move to illustrate it. */
    if (kind === 'focus') return 'hold';
    /* A proposal, a refusal, a lapse or a script's own output. None of them is a claim
       about a note, so the galaxy does not move to illustrate one - and a camera flight
       under a pair of buttons would pull the eye away from the thing being approved. */
    if (kind === 'tool') return 'hold';
    /* A web answer came from outside the galaxy entirely. Flying to a note would be
       the most dishonest thing this page could do: it would point at a star and say
       "there", about a fact that arrived over the wire thirty seconds ago. So the
       camera holds, nothing lights, and the cyan pulse says where it came from
       instead - see respond(). */
    if (kind === 'web') return 'hold';
    if (!used.length) return 'hold';          // nothing was cited, nothing to prove
    if (isError) return 'cluster';            // no answer yet: show matches, do not fly
    return used.length >= CLUSTER_MIN ? 'cluster' : 'fly';
  }

  function renderAnswer(question, text, isError, ids, sources) {
    /* Every answer starts by clearing the frame thumbnail. A picture left sitting
       beside the next answer would read as the evidence for it, which it is not. */
    hideProof();
    /* And the Yes/No pair, for the same reason: a pair of buttons left sitting beside the
       next answer would read as a question about THAT, which it is not. The UI only -
       whether anything is still pending is the server's to say, not this line's. */
    clearAskUI();
    $('a-q').textContent = question ? '“' + question + '”' : '';
    $('a-text').textContent = text;
    $('answer').classList.toggle('err', !!isError);
    const src = $('a-src'), box = $('a-chips');
    box.innerHTML = '';
    const used = (ids || []).map(function (i) { return byId.get(i); }).filter(Boolean);
    /* WHERE IT CAME FROM, in the card's own footer, and the two cases are mutually
       exclusive by construction: a web answer arrives with no ids and a note answer
       arrives with no sources, so the label can never read "Drawn from" above a list
       of web links. The label changes too - "Drawn from" is a claim about the
       collection and would be false here. */
    const web = (sources || []).filter(function (s) { return safeUrl(s && s.url); });
    src.querySelector('.lbl').textContent = web.length ? 'According to' : 'Drawn from';
    src.style.display = (used.length || web.length) ? '' : 'none';
    $('answer').classList.toggle('web', !!web.length);
    if (web.length) web.forEach(function (s) { box.appendChild(sourceLink(s, true)); });
    else used.forEach(function (n) { box.appendChild(chip(n)); });
    $('answer').classList.add('show');
    return used;
  }

  /* ================================================================ hands ==
     THE MOMENT OF TRUST, and it is the only thing on this page that can start
     something outside the browser.

     What this code is NOT allowed to do is the interesting half:

       it never composes the sentence. The proposal line arrives from the server,
         built from the registry template, because a page that paraphrased an action
         could understate it just as easily as a model could.
       it never composes the parameters either. What is rendered below the sentence is
         the server's own validated slot, and it is what will actually run - so reading
         it is worth something. /execute carries consent and nothing else: no value
         shown here is sent back, so nothing can be edited between the asking and
         the doing.
       it never opens the microphone. A proposal in flight does not make the ear
         listen; the Ear Law sits above the Hands, exactly as it sits above the eyes.

     The spoken door is the words themselves - "yes", "go ahead", "no", "never mind" -
     and they are judged by the SERVER, from ask() below, so a stale tab cannot decide
     what a yes meant. */
  let proposal = null;              // the pending proposal, as the server described it
  let proposalTimer = null, proposalTicker = null;

  function clearAskUI() {
    $('a-ask').classList.remove('show');
    $('answer').classList.remove('tool');
    $('ask-rows').innerHTML = '';
    $('ask-clock').textContent = '';
  }

  function hideProposal() {
    clearTimeout(proposalTimer); proposalTimer = null;
    clearInterval(proposalTicker); proposalTicker = null;
    proposal = null;
    clearAskUI();
  }

  /* Every validated parameter, on its own row, in the schema's order - so a field the
     server dropped is visibly absent rather than quietly missing. textContent
     throughout: a subject line is text, never markup. */
  function showProposal(pending) {
    clearTimeout(proposalTimer); clearInterval(proposalTicker);
    proposal = pending;
    const rows = $('ask-rows');
    rows.innerHTML = '';
    (pending.fields || []).forEach(function (f) {
      const name = document.createElement('b');
      name.textContent = f.name;
      const val = document.createElement('span');
      const has = Object.prototype.hasOwnProperty.call(pending.params || {}, f.name);
      if (has) val.textContent = String(pending.params[f.name]);
      else { val.innerHTML = ''; const i = document.createElement('i');
             i.textContent = '(not given)'; val.appendChild(i); }
      rows.appendChild(name); rows.appendChild(val);
    });
    $('ask-lbl').textContent = (pending.name || 'Awaiting your word') + ' · your word?';
    $('ask-yes').disabled = false;
    $('ask-no').disabled = false;
    $('answer').classList.add('tool');
    $('a-ask').classList.add('show');

    /* The clock is the TTL, counted down where it can be seen, and the sweep at the end
       of it is a real request: the server is the one that lets the proposal go, and it
       says so once. A closed tab changes nothing - the slot still expires. */
    let left = Math.max(1, pending.expiresInS || pending.ttlS || 120);
    const paint = function () {
      $('ask-clock').textContent = left > 0 ? left + 's to answer' : 'lapsed';
    };
    paint();
    proposalTicker = setInterval(function () { left--; paint(); if (left <= 0) clearInterval(proposalTicker); }, 1000);
    proposalTimer = setTimeout(function () { sweepProposal(); }, (left * 1000) + 600);
  }

  async function toolPost(path, body) {
    const res = await fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return data;
  }

  /* One way out for every outcome - done, refused, failed, lapsed - so the card and the
     voice can never disagree about what happened. The script's stdout IS the answer. */
  function settleProposal(data, question) {
    hideProposal();
    const line = (data && (data.answer || data.error)) ||
      'The server said nothing about that, sir, so I cannot tell you whether it ran.';
    renderAnswer(question, line, !!(data && (data.error || data.ok === false)), null);
    if (!speak(spokenForm(line))) idleStatus();
    if (data && data.pending) showProposal(data.pending);   // busy: it is still pending
  }

  async function confirmProposal(door) {
    if (!proposal) return;
    const asked = proposal, said = door === 'button' ? 'Yes' : 'yes';
    $('ask-yes').disabled = true; $('ask-no').disabled = true;
    $('ask-clock').textContent = 'running…';
    clearTimeout(proposalTimer); clearInterval(proposalTicker);
    setStatus('thinking', 'running ' + asked.tool);
    const data = await toolPost('/execute', { id: asked.id, door: door || 'button' });
    settleProposal(data, said);
  }

  async function refuseProposal(door) {
    if (!proposal) return;
    const asked = proposal;
    const data = await toolPost('/tools',
      { cmd: 'cancel', id: asked.id, door: door || 'button' });
    settleProposal(data, door === 'button' ? 'No' : 'no');
  }

  /* The countdown reached zero. The server decides whether it really lapsed - two tabs
     asking at once produce exactly one lapse - and speaks the line once. */
  async function sweepProposal() {
    if (!proposal) return;
    const data = await toolPost('/tools', { cmd: 'lapse' });
    if (data && data.lapsed) return settleProposal(data, '');
    hideProposal();
    if (data && data.pending) showProposal(data.pending);
  }

  /* A CHANGED SUBJECT IS A WITHDRAWAL, from the doors that are not /chat: the share, the
     eyes, the watch, a capture, the timer. /chat withdraws server-side and speaks the
     line in front of the answer; here the organ is about to speak, so the line goes to
     the status strip instead of over the top of it. */
  async function withdrawProposal() {
    if (!proposal) return;
    hideProposal();
    const data = await toolPost('/tools', { cmd: 'withdraw' });
    if (data && data.answer) setStatus('', data.answer);
  }

  $('ask-yes').onclick = function () { confirmProposal('button'); };
  $('ask-no').onclick = function () { refuseProposal('button'); };

  let lastPlan = 'hold';
  function applyCamera(plan, used) {
    lastPlan = plan;
    if (plan === 'hold') return;              // graph untouched: no light, no flight

    if (plan === 'fly') {
      // One clear source: light it AND its direct neighbours, fly to it, open it.
      const top = used[0];
      setHighlight(top.id, true);              // also lights every direct neighbour
      used.forEach(function (n) { hiNodes.add(n.id); });
      refresh();
      openPanel(top);
      focusNode(top, false);
      return;
    }

    // cluster: light exactly the notes that were used, and the links between them.
    hiNodes.clear(); hiLinks.clear();
    used.forEach(function (n) { hiNodes.add(n.id); });
    activeLinks.forEach(function (l) {
      if (hiNodes.has(idOf(l.source)) && hiNodes.has(idOf(l.target))) hiLinks.add(l);
    });
    selected = used[0].id;
    refresh();
    openPanel(used[0]);                        // the panel opens; the camera does not move
  }

  /* ================================================================ brain ==
     "switch to Astra", "try on Claude Fable 5.1", "go back to your normal brain".

     Nothing here decides WHICH model is real - the server owns the allowlist and
     the refusals, and this page only ever paints what the server reports back. A
     chip painted from what we asked for would show the wrong brain for exactly the
     case the whole feature exists to prevent. */
  const RESTORE_RE = /\b(?:normal|usual|default|original|config(?:ured)?|own|proper|old)\s+(?:brain|model|self|mind|brains)\b|\bback\s+to\s+(?:normal|yourself|your\s+(?:normal|usual|own|old)\b)/i;
  const SWAP_RE = /^\s*["'“‘(\[]*(?:please\s+)?(?:switch|swap|change|flip|turn|put|try|use|load|run|become|be|revert|go\s+back|come\s+back|return|restore)\b(?:\s+[\w.]+){0,4}?\s+(?:sonnet|astra|brains|fable|haiku|opus|brain|mind|self|gpt)\b/i;
  function isSwap(text) {
    return SWAP_RE.test(String(text)) || RESTORE_RE.test(String(text));
  }

  let brain = null;                 // last state the SERVER reported, or null
  function paintBrain(state) {
    if (!state || !state.label) return;
    brain = state;
    const chip = $('brainchip');
    $('brain-label').textContent = state.label;
    chip.classList.toggle('swapped', !!state.swapped);
    chip.classList.toggle('nokey', state.keyConfigured === false);
    chip.title = state.model +
      (state.provider ? '  ·  via ' + state.provider : '') +
      (state.swapped ? '  ·  swapped at runtime; a restart returns to ' +
        (state.configLabel || state.configModel) : '  ·  from config.json') +
      (state.keyConfigured === false ? '  ·  NO KEY: it cannot answer yet' : '');
  }

  async function refreshBrain() {
    try {
      const res = await fetch('/health');
      const data = await res.json();
      if (data && data.brain) paintBrain(data.brain);
    } catch (e) { /* the chip keeps whatever it last knew to be true */ }
  }

  /* ONE PATH OUT OF THIS PAGE. The ask bar and the chip's menu both end up here,
     with a different body and the same everything else - the same status, the same
     rendering, the same speaking, and above all the same sentence, because the
     sentence is the server's. A button that composed its own line would be a second
     voice, and two voices is what this whole arrangement exists to prevent. */
  async function swapBrain(text, body) {
    if (busy || !String(text).trim()) return;
    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    setStatus('thinking', 'changing brains', text);
    renderAnswer(text, 'Changing brains…', false, null);

    function done(message, isError, state) {
      /* The chip moves only on the server's word. A refusal reports the state it
         did NOT change, so painting it is still correct - and still honest. */
      if (state) paintBrain(state);
      renderAnswer(text, message, isError, null);
      if (!speak(spokenForm(message))) idleStatus();
      // A brain swap cites no note, so the camera holds. Same rule as a screen
      // answer: flying somewhere would claim a source this answer does not have.
      applyCamera(decideCamera('model', [], isError), []);
    }

    try {
      const res = await fetch('/model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || { say: text, door: 'voice' })
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      if (!data) {
        done('I could not change brains: the server replied with something that was ' +
             'not JSON (HTTP ' + res.status + ').', true, null);
      } else {
        // ok:false is a refusal, already phrased in character by the server. It is
        // shown as an error precisely because it must not read like a success.
        done(data.answer || data.error || 'Something went wrong changing brains.',
             !data.ok, data.label ? data : null);
      }
    } catch (e) {
      done('Could not reach the brain to change it (' + e.message + ').', true, null);
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
    }
  }

  /* THE BUTTON DOOR. The chip is the button: it already says which brain is in play,
     so making it the way to change one saves inventing a second control that says the
     same thing. What it offers comes from GET /brains - the server's own allowlist -
     so the menu cannot offer a model the voice would be refused. */
  let brainList = null;             // [{say,id,label,pretty,current}], or null

  async function loadBrains() {
    try {
      const res = await fetch('/brains');
      const data = await res.json();
      if (data && Array.isArray(data.models)) brainList = data.models;
      if (data && data.brain) paintBrain(data.brain);
    } catch (e) { brainList = null; }
    return brainList;
  }

  function brainMenuOpen() { return $('brainmenu').classList.contains('open'); }

  function closeBrainMenu() { $('brainmenu').classList.remove('open'); }

  function paintBrainMenu() {
    const menu = $('brainmenu');
    menu.textContent = '';
    if (!brainList || !brainList.length) {
      const dead = document.createElement('button');
      dead.type = 'button';
      dead.className = 'home';
      dead.textContent = 'the server has not said what it has';
      menu.appendChild(dead);
      return;
    }
    const here = brain && brain.model;
    brainList.forEach(function (m) {
      const row = document.createElement('button');
      row.type = 'button';
      row.setAttribute('role', 'menuitem');
      row.dataset.id = m.id;
      row.textContent = m.pretty || m.label;
      if (m.id === here) row.classList.add('on');
      /* The id, not the spoken name: the button knows exactly which model it means,
         and the server checks it against the same allowlist either way. */
      row.onclick = function () {
        closeBrainMenu();
        swapBrain('switch to ' + (m.pretty || m.label),
                  { model: m.id, door: 'button' });
      };
      menu.appendChild(row);
    });
    const rule = document.createElement('div');
    rule.className = 'hr';
    menu.appendChild(rule);
    const home = document.createElement('button');
    home.type = 'button';
    home.className = 'home';
    home.setAttribute('role', 'menuitem');
    home.textContent = 'back to ' +
      ((brain && (brain.configLabel || brain.configModel)) || 'the configured brain');
    home.onclick = function () {
      closeBrainMenu();
      swapBrain('go back to your normal brain',
                { say: 'go back to your normal brain', door: 'button' });
    };
    menu.appendChild(home);
  }

  async function toggleBrainMenu() {
    if (brainMenuOpen()) return closeBrainMenu();
    if (!brainList) await loadBrains();
    paintBrainMenu();
    $('brainmenu').classList.add('open');
  }

  $('brainchip').onclick = toggleBrainMenu;
  $('brainchip').onkeydown = function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleBrainMenu(); }
  };
  // Anywhere else, and Escape, closes it. A menu that stays open over a galaxy you
  // are trying to drag is a menu you will resent.
  document.addEventListener('pointerdown', function (e) {
    if (!brainMenuOpen()) return;
    if ($('brainmenu').contains(e.target) || $('brainchip').contains(e.target)) return;
    closeBrainMenu();
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && brainMenuOpen()) closeBrainMenu();
  });

  /* ================================================================ focus ==
     The accountability timer. Read one thing before changing anything here: this
     page owns NO part of the session. The countdown, the drift, the callouts and
     the report all live on the server's one-second tick, and everything below is
     a display and a set of buttons. That is what makes a reload rejoin a session
     in progress instead of quietly starting a fresh one, and it is why the numbers
     survive closing the tab entirely.

     The state that arrives is a whitelist of booleans and counters - there is no
     app name and no site in it, by construction, and focus.py has a test that
     proves it. So this file cannot display where you went even if it wanted to,
     which is why the card shows a colour and a count rather than a name.

     One exception, and it is deliberate: a callout may NAME the site or application
     you drifted into - "Sir, Instagram can wait" - so the name arrives here inside
     the sentence, is spoken by speak(), and is gone from the next /focus response
     entirely. The server scrubs the line one tick after sending it. Nothing on this
     page may hold on to it: no variable, no dataset, no DOM node of its own. Speak
     it and let it go, which is all this page does with any say-line. */

  const FOCUS_DEFAULT_MIN = 30;    // what the button starts; the voice can say any
  const FOCUS_EXTEND_MIN = 5;      // what the +5 button adds
  const FOCUS_PAINT_MS = 250;      // local repaint between server pushes
  const FOCUS_HOME_BEAT_MS = 1500; // "this tab has focus" while it does
  const FOCUS_POLL_MS = 2500;      // fallback only, used when the stream is down
  const FOCUS_ANSWER_MS = 20000;   // the answer window: one reply, no wake word
  const FOCUS_ANSWER_WAIT_MS = 900;// let the question finish being spoken first
  const FOCUS_LOCK_FLASH_MS = 1000;// how long the lock pill reads LOCKED after a press

  let fx = null;                   // the last state the SERVER sent, or null
  let fxAt = 0;                    // when it arrived, so the clock can tick between
  let fxSpoken = 0;                // highest say-seq already out of the speakers
  let fxStream = null, fxPoll = null, fxAdopted = false;
  /* True only while ?focusprobe=1 is running its battery. The probe feeds the card
     synthetic states, so for those few hundred milliseconds this page must not talk
     to the server at all - a push landing mid-case would repaint the card under the
     assertion, and a beat going out would tell the server this tab is at home base
     when nobody is looking at it. See fxProbeRun(). */
  let probeRunning = false;
  let fxAnswerUntil = 0;           // while > now, the next thought heard is the intent
  let fxAnswerTimer = null;
  /* THE RETIREMENT. An ended session's card is a corpse occupying prime real estate:
     "SESSION OVER · 0:00", top-right, over your note title, until something else
     happens to move it. So the report gets eight seconds - long enough to read four
     numbers off it, short enough that the desk is clear before you have finished
     thinking about the next thing - and then the card leaves: the desktop window
     closes, the in-page card fades.
     Eight and not thirty because of how this card is actually used. It is glanced at,
     not studied; the numbers it carries are on the answer card as well, in words, and
     that one stays. A report you wanted to keep looking at is a report you can scroll
     back to. A card that holds until the next session starts sounds tidier and is
     worse - it means the ONE state this card spends most of its life in is "describing
     something that finished a while ago". */
  const CARD_RETIRE_S = 8;
  let fxRetireTimer = null;
  let fxRetired = false;           // this report has had its eight seconds
  /* The tail of focus.py's "arming" line. Matched against what this tab just spoke,
     so the microphone opens for a question this tab genuinely asked. */
  const FOCUS_ASKED_RE = /what are we focusing on\s*\?/i;

  function fxLive() {
    return !!fx && (fx.state === 'arming' || fx.state === 'running' ||
                    fx.state === 'paused');
  }

  /* SHOWING is not the same as LIVE, and the difference is the report. A finished
     session's card holds its last line for CARD_RETIRE_S seconds before it retires, and
     for those eight seconds the card is on screen while no session is running - so the
     desktop window must not close under it and the layout lane must still leave it room.
     Everything that asks "is there a card" asks this; only the clock asks fxLive(). */
  function fxShowing() {
    if (fxLive()) return true;
    return !!(fx && fx.state === 'ended' && fx.report && !fxRetired);
  }

  function fxSecs(n) {
    const s = Math.max(0, Math.round(n));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  /* Every focus line reaches the voice through here and through nowhere else.
     Lines are spoken in seq order and each seq exactly once, which is the whole
     defence against a reload or a second tab shouting the same callout twice. */
  function fxAbsorb(lines) {
    const fresh = (lines || []).filter(function (l) {
      return l && l.seq && l.seq > fxSpoken;
    });
    if (!fresh.length) return '';
    fxSpoken = fresh[fresh.length - 1].seq;
    if (!fxAdopted) return '';     /* see fxApply: a rejoin adopts, it does not replay */

    /* More than one line can land in a single push - "twenty five minutes, go to
       the thing" and "locked on" arrive together when you were never at home base.
       They are spoken as ONE utterance, because speak() cancels whatever is already
       talking: firing them separately would leave only the last one audible, and the
       one it would silence is the instruction you were waiting to hear confirmed. */
    let text = fresh.map(function (l) { return l.text; }).join(' ');
    while (fresh.length > 1 && text.length > SPOKEN_MAX_CHARS) {
      fresh.shift();               // the oldest goes; the newest must always be heard
      text = fresh.map(function (l) { return l.text; }).join(' ');
    }
    renderAnswer('', text, false, null);
    /* No ids, so decideCamera holds the graph still: a callout cites no note and
       must not drag the camera anywhere to make its point. */
    applyCamera(decideCamera('focus', [], false), []);
    /* The return value is what was actually SPOKEN, and it is only used to decide
       whether this tab heard the question it is about to open a microphone for. A
       tab that is muted, or whose audio is still locked, heard nothing. */
    if (!speak(spokenForm(text))) { idleStatus(); return ''; }
    return text;
  }

  function fxApply(state) {
    if (!state || typeof state !== 'object') return;
    fx = state;
    fxAt = performance.now();
    /* A sequence that went BACKWARDS means the server process restarted under us
       and started counting again. Re-base on it rather than treating the new lines
       as already spoken, which would run the next session in total silence. */
    const top = (state.say || []).reduce(function (m, l) {
      return Math.max(m, (l && l.seq) || 0);
    }, 0);
    if (top < fxSpoken) { fxSpoken = top; fxAdopted = false; }
    /* The first state of the tab's life is ADOPTED, not replayed: a tab that opens
       into a session already running takes the sequence number as read and speaks
       from the next line on. Otherwise a reload mid-session would deliver the last
       five minutes of being told off, all at once, in one breath. */
    const said = fxAbsorb(state.say);
    fxAdopted = true;
    /* The microphone opens only in the tab that actually ASKED, out loud, just now -
       hence the test against what was spoken rather than against the state alone. A
       second tab, or a tab rejoining a session whose question is still technically
       open, would otherwise start listening at nobody. The server's awaitingIntent is
       the other half: once answered anywhere, no tab asks again. */
    if (state.awaitingIntent && FOCUS_ASKED_RE.test(said)) fxAnswerOpen();
    else if (!state.awaitingIntent) fxAnswerClose();
    fxPaint();
  }

  function fxPaint() {
    const card = $('focuscard'), btn = $('focusbtn');
    if (!fx || !fxLive()) {
      /* THE END, and the report that outlives it by eight seconds. The window no longer
         closes itself here: deskTend() owns that decision now, because the countdown is
         no longer the only thing in it - a session ending while the screen watch is
         still running must close the COUNTDOWN row and leave the window standing. What
         is still decided here is the card's own contents. */
      btn.className = '';
      if (fx && fx.state === 'ended' && fx.report && !fxRetired) {
        card.className = '';
        card.classList.add('live', 'ended');
        $('focus-state').textContent = 'session over';
        $('focus-mode').textContent = '';
        $('focus-clock').textContent = fxSecs(0);
        $('focus-fill').style.width = '100%';
        $('focus-intent').textContent = fx.intent || '';
        $('focus-intent').style.display = fx.intent ? '' : 'none';
        $('focus-stats').innerHTML =
          'on target <b>' + fx.cleanPct + '%</b> &middot; drifts <b>' + fx.drifts +
          '</b><br>streak <b>' + fx.streak + '</b> &middot; best <b>' +
          fx.bestStreak + '</b>';
        /* Armed once per report. An ABORT has no report and is not given eight seconds
           of anything: you stopped it, you know you stopped it, and the card goes now. */
        if (fxRetireTimer === null) {
          fxRetireTimer = setTimeout(fxRetireNow, CARD_RETIRE_S * 1000);
        }
      } else if (!fxRetired || !fx || fx.state !== 'ended') {
        card.className = '';
      }
      deskTend();
      layout();
      return;
    }
    /* A new session un-retires the card: the eight seconds belonged to the last report. */
    if (fxRetireTimer !== null) { clearTimeout(fxRetireTimer); fxRetireTimer = null; }
    fxRetired = false;
    card.classList.remove('retired');

    // The countdown is interpolated between pushes so it looks like a clock, but
    // the SERVER's remaining figure is the one that ends the session. This never
    // decides anything - it only stops the digits from stuttering.
    const drift = (performance.now() - fxAt) / 1000;
    const left = fx.state === 'paused' ? fx.remainingS
                                       : Math.max(0, fx.remainingS - drift);

    const tone = fx.state === 'paused' ? 'paused'
               : fx.excused ? 'excused'
               /* Deferred outranks "cannot see": while nothing is locked, an
                  unreadable window is the reason we are still waiting, not a fault. */
               : fx.deferred ? 'deferred'
               : !fx.readable ? 'blind'
               : fx.drifting ? 'drift'
               : fx.inGrace ? 'grace' : '';
    card.className = 'live' + (tone ? ' ' + tone : '');
    btn.className = 'on' + (tone === 'drift' ? ' drift' : '');

    $('focus-state').textContent =
      fx.deferred ? 'not locked on yet' :
      fx.state === 'arming' ? 'waiting for your work' :
      fx.state === 'paused' ? 'paused' :
      fx.excused ? 'excused' :
      /* The eyes' own verdict outranks "cannot see", because a head-down drift is
         something the server DID see - just not on the glass. */
      fx.postureDrift ? 'head down' :
      !fx.readable ? 'cannot see' :
      fx.drifting ? 'off target' :
      fx.inGrace ? 'noticing' :
      fx.atHome ? 'home base' : 'on target';

    /* What it is actually watching, said plainly on the card. Without a browser
       started on --remote-debugging-port=9222 there is no readable tab, so this
       reads "app only" - and a session that watches half of what you asked for
       should say so where you can see it, not only once out loud at the start. */
    $('focus-mode').textContent =
      fx.deferred ? (fx.awaitingIntent ? 'go to your work · listening' : 'go to your work')
                  : (fx.tabWatched ? 'app + site' : 'app only') +
                    /* The eyes, said on the card as well as on their own chip: a
                       session that is also counting your posture should say so where
                       the count is, and the relief valve should be visibly counting
                       down rather than felt as an unexplained silence. */
                    (fx.eyesOn ? ' + eyes' : '') +
                    (fx.snoozed ? ' · hushed ' + fx.snoozeLeftS + 's'
                     : fx.hushed ? ' · eyes hushed ' + fx.hushLeftS + 's' : '');

    /* Your own words, set with textContent and never innerHTML. This is the one
       string on the card that did not come from a template in focus.py, and a
       dictated sentence is not markup. */
    $('focus-intent').textContent = fx.intent || '';
    $('focus-intent').style.display = fx.intent ? '' : 'none';

    $('focus-clock').textContent = fxSecs(left);
    $('focus-fill').style.width =
      Math.max(0, Math.min(100, 100 * (1 - left / Math.max(1, fx.plannedS)))) + '%';
    $('focus-stats').innerHTML =
      'on target <b>' + fxSecs(fx.onTargetS) + '</b> of <b>' +
      fxSecs(fx.plannedS) + '</b><br>drifts <b>' + fx.drifts + '</b>' +
      (fx.tier > 1 ? ' &middot; tier <b>' + fx.tier + '</b>' : '') +
      ' &middot; clean <b>' + fx.cleanPct + '%</b>' +
      (fx.excusedS ? '<br>excused <b>' + fxSecs(fx.excusedS) + '</b>' : '') +
      (fx.unknownS ? ' &middot; unseen <b>' + fxSecs(fx.unknownS) + '</b>' : '');
    $('focus-pause').textContent = fx.state === 'paused' ? 'resume' : 'pause';
    /* A session started by VOICE never had a gesture to open a window with, so the card
       waits in the page exactly as it did before today and the next click anywhere
       upgrades it. Deliberately not re-armed after you close the window yourself:
       shutting it is a decision, and a card that climbs back out of the tab every time
       you click is not a card, it is a pest. Both halves live in deskTend() now. */
    deskTend();
    layout();
  }

  /* THE RETIREMENT, eight seconds after the report was painted. One function for both
     homes, because there is one card: out on the desktop the row simply goes and the
     window closes behind it if the countdown was the last organ in there; in the page it
     fades, and the class is cleared at the far end of the fade so the lane closes up. */
  function fxRetireNow() {
    fxRetireTimer = null;
    fxRetired = true;
    const card = $('focuscard');
    if (deskDoc) {
      if (card) card.className = '';
      deskTend();
      layout();
      return;
    }
    if (!card) return;
    card.classList.add('retired');
    setTimeout(function () {
      if (!fxRetired) return;          // a new session arrived inside the fade
      card.className = '';
      layout();
    }, 460);
  }

  /* Kept as a name because four places call it, and it now means what it always meant:
     ask the governor. The legend used to duck the card by measuring it here, which was
     right and was also one surface positioning another - exactly the arrangement the
     layout governor replaced. */
  function fxNudgeLegend() { return layout(); }

  /* ================== THE DESKTOP CARD: ONE WINDOW, EVERY ORGAN ==================
     The countdown lived in the viewer tab, which is the one place you are guaranteed
     NOT to be looking while it matters: alt-tab to the work and the card goes with the
     page. Document Picture-in-Picture is the only way a browser gets a window that
     floats above every other application on Windows without native code, so that is
     the route, and there are four things about it worth knowing before reading on.

     ONE CARD, NOT TWO. The elements are MOVED - appendChild across documents, which
     adopts rather than clones - so the live SSE paint, the three clock buttons and the
     lock pill are the same objects doing the same work in a different window. Nothing
     is mirrored, nothing is rebuilt, and there is therefore no way for the two homes to
     disagree, because there is only ever one of each. The one thing this costs is
     getElementById, and $() pays it at the top of this file.

     ONE CARD FOR ALL OF THEM, which is what changed. The browser allows a single
     Document PiP window per tab, and the countdown, the watching face and the eyes all
     wanted it. They used to queue for it and the loser said so out loud - an honest
     arrangement, and a silly one, because what you actually want on the desktop is ONE
     card with every live organ in it. So: a shell, and DESK_ORGANS moves into it, in
     that order. The face row, the countdown, the watch chip, the eyes line. One window,
     one corner, one close button.

     RENDER ONLY WHAT IS LIVE, and that is not this block's job either - it is the
     organs' own liveness classes doing it, in whichever document they are in. Watch off
     and #facecard loses .show; session off and #focuscard loses .live; eyes off and
     #eyeing loses it too. The shell is a flex column of things that may be display:none,
     so an organ leaving is a row closing, not a layout to recompute. And when the LAST
     one goes, deskTend() closes the window: an empty card floating over your work is
     worse than no card.

     A GESTURE IS THE GATE. requestWindow() only resolves inside a transient user
     activation, which the FOCUS button click is and a spoken "thirty minutes on this"
     is not. So the press opens the window itself, and a session started by voice
     leaves the card where it has always been until the next click upgrades it.

     THE CARD TRAP, which is why the lock pill in there reads the browser's front WINDOW
     through the DevTools join and never "the frontmost process": pressing a button in
     this card makes this card frontmost, so a pill that asked the OS what was in front
     would lock the session to the card itself. That is decided server-side in focus.py;
     it is written here because this is the window that makes it matter. */
  const DESK_W = 320, DESK_H = 210;
  /* The window grows by whole rows as organs arrive, because a fixed 210px holding a
     face, a countdown, a chip and an eyes line is four things squeezed into the space
     one was written for. Session-only is exactly DESK_H, which is what the desk proof
     measures and what the card was drawn at. */
  const DESK_ROW_FACE = 78;        // the face row, padding included
  const DESK_ROW_CHIP = 34;        // the watch chip, or the eyes line
  /* THE PROMISE, and the reason it has to exist: the window is asked for while the click
     is still warm, which is BEFORE the session it is for has been round-tripped. Sizing
     it by what is live at that instant asks for a 100px window and then cannot correct
     it, because resizeTo needs an activation of its own and the request has just eaten
     the one the press supplied. So a presser says what it is about to start, and the
     height is the height of the card that is arriving. It lapses after the same grace
     window the card itself waits through - a promise nothing kept is not a row. */
  let deskComing = '', deskComingAt = 0;
  function deskPromise(what) { deskComing = what; deskComingAt = performance.now(); }
  function deskPromised(what) {
    return deskComing === what && performance.now() - deskComingAt < DESK_GRACE_MS;
  }
  function deskH() {
    let h = (fxShowing() || deskPromised('session')) ? DESK_H : 88;
    if (watchOn || deskPromised('watch')) h += DESK_ROW_FACE + DESK_ROW_CHIP;
    if (eyesLive()) h += DESK_ROW_CHIP;
    return Math.min(h, 520);
  }
  /* BOTTOM-RIGHT, not the top. Top-right is where Windows puts its own notifications,
     where the watching face sits, and - on a wide screen - roughly where the end of
     every line of text you are reading is. The clock wants to be somewhere your eye
     can find without being somewhere it keeps landing. */
  const DESK_EDGE = 26;            // gap from the screen's working edges
  const DESK_CHROME = 38;          // the title bar, when the window will not report its own
  const DESK_GRACE_MS = 2500;      // how long a just-opened window waits for a session
  /* Said once per page, and only when the browser has actually refused - never as a
     precaution, and never instead of trying. */
  /* ONE HONEST LINE, not one per organ. The browser refusing a window is a fact about
     the browser, and hearing it three times because three organs each asked separately
     was the old arrangement's other tax. Every organ now falls back to its in-page home
     and this is said once per page, by whichever one asked first. */
  const DESK_REFUSED_LINE = 'I will not let the card off the page in this browser, ' +
    'sir, so it stays in the corner of the tab.';

  const canDesk = !!(window.documentPictureInPicture &&
                     window.documentPictureInPicture.requestWindow);

  /* WHAT GOES IN THE CARD, in the order it is read: the face first, because it is the
     only picture; then the countdown, which is the reason the window exists; then the
     watch chip and the eyes line, which are one line each. Every one of them is an
     element that already exists in the page with its own liveness class, so this list is
     the whole of the merge. */
  const DESK_ORGANS = ['facecard', 'focuscard', 'watching', 'eyeing'];

  let deskWin = null;              // the PiP window, while there is one
  let deskHomes = [];              // the exact slot in this page each organ came from
  let deskWanted = false;          // live session, no window: the next click pops it
  let deskShut = false;            // you closed it; do not climb back out
  let deskSaid = false;            // the refusal, said once and not again
  let deskOpening = false;         // a request is in flight; do not start a second
  let deskAt = 0;                  // when the window opened (see the grace window)
  /* Why the last request was refused, in the browser's own words. Kept because "it
     didn't pop out" is otherwise unanswerable: a refusal for want of a gesture and a
     refusal by policy look identical from the outside and want opposite responses. */
  let deskTrouble = '';
  let deskSawLive = false;         // it has painted a live session out there at least once
  let deskUnfit = false;           // the browser granted a size of its own; see deskFit
  let deskFits = 0;                // how many times the size had to be corrected by hand

  /* Every stylesheet this page has, as text, because the card's entire appearance is
     inherited: the --line and --muted variables on :root, the tone classes, the pill
     rules. A card appended to a fresh document without them arrives naked - unstyled
     text on white - which is the classic Document PiP mistake. */
  function deskStyles() {
    const out = [];
    Array.from(document.styleSheets).forEach(function (sheet) {
      try {
        out.push(Array.from(sheet.cssRules).map(function (r) {
          return r.cssText;
        }).join('\n'));
      } catch (e) {
        /* A cross-origin sheet will not hand over its rules, and can still be linked.
           This page has none; the branch is here so that adding one is not a silent
           regression in a window nobody thought about. */
        if (sheet.href) out.push('@import url("' + sheet.href + '");');
      }
    });
    return out;
  }

  /* THE SHELL, and the rules the organs cannot keep once they are in it.
     Each organ is position:fixed in the corner of a large page; in a window that IS the
     card, that leaves four of them stacked on one another 16px from the top edge. So the
     shell is a flex column and every organ becomes a static row in it, in DESK_ORGANS
     order, keeping its own liveness rule so an organ that is not live is a row that is
     not there.
     The countdown also carries the page's `nofit`/`pill` classes, which the layout
     governor sets from the CANVAS width and which mean nothing out here - a 320px window
     is, as far as CSS is concerned, a very small viewport, and without these overrides
     the card would arrive, be perfectly alive, and be invisible.
     What is deliberately NOT overridden: every tone. .drift keeps its red gradient and
     its glow, so drifting tints the whole desktop window over whatever application you
     drifted into, which is the entire point of taking the card out of the tab. */
  const DESK_CSS =
    'html,body{margin:0;height:100%;overflow:hidden;background:#05080f;' +
    'color:#e8eefc;-webkit-user-select:none;user-select:none;' +
    'font:13.5px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}' +
    '#deskshell{display:flex;flex-direction:column;height:100%;box-sizing:border-box}' +
    /* Every organ: static, full width, no lifting off a galaxy that is not here. */
    '#deskshell>*{position:static !important;top:auto !important;right:auto !important;' +
    'left:auto !important;bottom:auto !important;width:auto !important;' +
    'transform:none !important;box-sizing:border-box;border-radius:0;box-shadow:none;' +
    'backdrop-filter:none;flex:0 0 auto}' +
    /* The countdown is the one that stretches, because it is the one with a clock. */
    '#focuscard{display:none !important;height:auto;border-width:0;' +
    'border-top-width:3px;padding:12px 16px 13px}' +
    '#focuscard.live{display:flex !important;flex-direction:column;flex:1 1 auto;' +
    'min-height:0}' +
    '#focus-clock{font-size:40px;margin:5px 0 0}' +
    '#focuscard .fbar{margin:9px 0 8px}' +
    '#focus-stats{font-size:10px;line-height:1.55;overflow:hidden}' +
    /* Your dictated intent can be a paragraph, and this window is 210px tall. Clamped
       rather than allowed to push the buttons off the bottom edge: a LOCK THIS TAB
       pill you cannot reach is worse than an intent you can only half read. */
    '#focus-intent{max-height:2.9em;overflow:hidden;font-size:10.5px;margin:0 0 6px}' +
    '#focuscard .frow.flock{margin-top:auto}' +
    '#focuscard .frow button{padding:7px 0}' +
    /* The face row. Its pin button is the one control that makes no sense in here: it
       exists to ASK for this window, and you are looking at it. */
    '#facecard{display:none !important;border-width:0;border-bottom-width:1px;' +
    'padding:10px 14px}' +
    '#facecard.show{display:block !important}' +
    '#facecard .pin{display:none !important}' +
    /* The two chip rows, which are pills in the page and lines in here. */
    '#watching,#eyeing{border-radius:0;border-width:0;border-top-width:1px;' +
    'padding:7px 14px;font-size:10px;justify-content:flex-start;gap:8px}' +
    '#watch-stop,#eye-stop{margin-left:auto}';

  /* THE MOVE, and the reverse of it, kept apart from the window so that both can be
     proved without one: the probe battery moves the card into an iframe's document and
     back, which is the same operation against the same code with no browser dialog and
     no network. See case `desk-move`.
     Inline rectangle props are STRIPPED on the way out rather than fought with more
     !important: the governor sets top/right/left/width as inline styles on three of
     these four elements, and an inline style beats any rule in DESK_CSS. It is the
     governor's own job to put them back when the organ comes home, which it does,
     because deskRestore() ends by calling it.
     The same goes for the governor's two CLASSES. `pill` and `nofit` are answers to the
     question "how much room does this page have left", and `nofit` carries a
     display:none of its own - so a card popped out of a narrow window would arrive in
     the desktop card correct, live, and invisible. They are page state; they do not
     travel. */
  const DESK_RECT_PROPS = ['top', 'right', 'bottom', 'left', 'width', 'transform'];
  const DESK_PAGE_CLASSES = ['pill', 'nofit'];
  function deskStrip(el) {
    DESK_RECT_PROPS.forEach(function (p) { el.style.removeProperty(p); });
    DESK_PAGE_CLASSES.forEach(function (c) { el.classList.remove(c); });
  }

  function deskAdopt(doc) {
    if (!doc || !doc.body) return false;
    deskStyles().concat([DESK_CSS]).forEach(function (css) {
      const style = doc.createElement('style');
      style.textContent = css;
      doc.head.appendChild(style);
    });
    /* A title, because the OS window manager shows it and - more to the point - the
       server reads the foreground window's title to work out which tab is in front.
       "Knowledge Galaxy" here would join this window to the viewer tab; a name of its
       own joins it to nothing, which is the honest answer for a card. */
    doc.title = 'Jarvis · focus';
    const shell = doc.createElement('div');
    shell.id = 'deskshell';
    doc.body.appendChild(shell);
    deskHomes = [];
    let moved = 0;
    DESK_ORGANS.forEach(function (id) {
      const el = document.getElementById(id);
      if (!el) return;
      deskHomes.push({ el: el, parent: el.parentNode, next: el.nextSibling });
      deskStrip(el);
      shell.appendChild(el);              // adopts: listeners and handlers come along
      moved++;
    });
    deskDoc = doc;
    layout();                             // the page's lane closes up behind them
    return moved > 0;
  }

  function deskRestore() {
    const homes = deskHomes;
    deskHomes = [];
    deskDoc = null;
    /* Backwards, so that each element's saved nextSibling is already back in place by
       the time the one before it is inserted. Every saved sibling here is a comment or a
       text node that never moves, so the page ends up byte-identical to how it started -
       which is what the desk proof means by "back in its own slot". */
    for (let i = homes.length - 1; i >= 0; i--) {
      const h = homes[i];
      if (!h.parent) continue;
      deskStrip(h.el);
      h.parent.insertBefore(h.el, h.next);
    }
    layout();
    return homes.length > 0;
  }

  /* `how` is 'press' for the FOCUS button and 'click' for the armed next-click. It
     decides only one thing: whether a refusal is worth saying out loud yet. A press can
     be refused for want of activation the button spent elsewhere, which is ordinary and
     recoverable - so that arms the next click and stays quiet. When the click that was
     armed for exactly this is refused too, the browser means it, and it is said. */
  async function deskOpen(how) {
    if (deskWin || deskOpening || probeRunning || PROBE_ON) return !!deskWin;
    if (!canDesk) { deskTrouble = 'unsupported'; deskRefuse(DESK_REFUSED_LINE); return false; }
    deskOpening = true;
    let win = null;
    try {
      win = await window.documentPictureInPicture.requestWindow({
        width: DESK_W, height: deskH(), disallowReturnToOpener: true,
        preferInitialWindowPlacement: true
      });
    } catch (e) {
      deskOpening = false;
      deskTrouble = (e && (e.name || e.message)) || 'refused';
      if (how === 'press') { deskWanted = true; return false; }
      deskRefuse(DESK_REFUSED_LINE);
      return false;
    }
    deskOpening = false;
    deskTrouble = '';
    deskWin = win;
    deskWanted = false;
    deskShut = false;
    deskSawLive = false;
    deskAt = performance.now();
    deskAdopt(win.document);
    deskFit();                       // usually too late; see deskFit for why it tries anyway
    /* And from inside the card itself, for the same reason as the page's two listeners:
       a press on any of its buttons is an activation the window can be sized with. */
    win.addEventListener('pointerdown', deskFit, true);
    win.addEventListener('click', deskFit, true);
    try {
      const sw = win.screen.availWidth || 1440, sh = win.screen.availHeight || 900;
      /* The window's OWN outer size, not the size that was asked for: a browser is free
         to grant another one (Chrome here grants its own and lets deskFit correct it),
         and placing a window by a size it does not have puts a corner off the screen. */
      const ww = win.outerWidth || DESK_W, wh = win.outerHeight || DESK_H + DESK_CHROME;
      win.moveTo(Math.max(0, sw - ww - DESK_EDGE), Math.max(0, sh - wh - DESK_EDGE));
    } catch (e) { /* the browser's placement, then; the card still floats */ }
    /* Closing the window is not ending the session - the clock is the server's and it
       carries on. The card simply comes home, in silence: you closed a window, you do
       not need to be told what you just did. */
    win.addEventListener('pagehide', function () {
      deskWin = null;
      deskShut = true;
      deskSawLive = false;
      deskRestore();
      fxPaint();
      paintWatch();
      paintEyes();
    });
    fxPaint();
    paintWatch();
    paintEyes();
    return true;
  }

  /* THE SIZE THE BROWSER FELT LIKE. requestWindow is asked for 320x210 and Chrome 153
     on this machine hands back 1024x606 - eighty per cent of the screen - whatever is
     asked for; the width and height are a hint it is entitled to ignore, and a card
     covering most of the desktop is not the feature. resizeTo() fixes it exactly, but
     resizeTo needs a transient activation of its own and requestWindow has just eaten
     the one the click supplied ("resizeTo() requires user activation in document
     picture-in-picture"). So it is tried once on opening for the browsers that allow it,
     and otherwise on the next pointerdown in either window - which, for a card you have
     just popped out and are looking at, is a click or two away. It corrects itself in
     front of you rather than being wrong quietly.
     A size the browser grants within a few pixels of the ask is left alone: this is a
     correction, not a policy, and a browser that sizes the window properly keeps its
     own. `deskUnfit` stays true while the size is still wrong, so it tries again on the
     next pointerdown and stops the moment it is right - one resizeTo per click at worst,
     and nothing at all once the window is the size it was asked to be.
     THE HEIGHT IS NOT A CONSTANT any more: an organ arriving is a row arriving, and
     deskH() is the current answer. So this is also how the window GROWS when the watch
     starts mid-session - on the next click, which the watch's own start supplied. */
  function deskFit() {
    const win = deskWin;
    if (!win) return false;
    const want = deskH();
    const off = Math.abs((win.outerWidth || DESK_W) - DESK_W) > 8 ||
                Math.abs((win.outerHeight || want) - want) > 8;
    if (!off) { deskUnfit = false; return true; }
    try { win.resizeTo(DESK_W, want); } catch (e) { deskUnfit = true; return false; }
    deskUnfit = Math.abs((win.outerWidth || DESK_W) - DESK_W) > 8;
    if (!deskUnfit) deskFits++;
    return !deskUnfit;
  }

  function deskClose() {
    const win = deskWin;
    deskWin = null;                  // before close(), so pagehide finds nothing to do
    deskComing = '';                 // whatever was promised, this window is not it
    deskShut = false;
    deskSawLive = false;
    deskRestore();
    if (win) { try { win.close(); } catch (e) { /* already gone */ } }
  }

  /* ================== THE ONE DECISION: IS THERE A CARD, AND WHERE ==================
     Four organs, two homes and one window between them, and every one of the old
     arrangements' bugs came from that question being answered in six places. It is
     answered here and nowhere else, and it is called at the end of every organ's paint.

     ARMABLE is not the same as ALIVE, deliberately. A session or a screen watch will
     pop the window out; the eyes on their own will not. Opening a desktop window
     because a camera came on for a posture check is a window you did not ask for - but
     once the card IS out, the eyes line lives in it like everything else, and it will
     keep the window open while it is the last organ standing. That asymmetry is the
     honest reading of "render only what is live": arming is about intent, closing is
     about contents. */
  function deskArmable() { return fxLive() || watchOn; }
  function deskOrgansLive() { return fxShowing() || watchOn || eyesLive(); }

  function deskTend() {
    if (probeRunning || PROBE_ON) return;
    if (deskWin) {
      /* THE LAST ORGAN OUT CLOSES THE DOOR. The grace window is the other case: the
         window is opened inside the very click that starts a session, so for a few
         hundred milliseconds there is legitimately nothing live yet and closing on
         sight would close it before it began. deskSawLive is what keeps those apart -
         without it the window flickered, because the first paint after it appears still
         holds the PREVIOUS session, very often `ended`. */
      if (deskOrgansLive()) { deskSawLive = true; return; }
      if (deskSawLive || performance.now() - deskAt > DESK_GRACE_MS) deskClose();
      return;
    }
    /* Nothing live: forget that you closed it, so the next session may pop out again. */
    if (!deskOrgansLive()) deskShut = false;
    deskWanted = canDesk && !deskShut && deskArmable();
  }

  function deskRefuse(line) {
    deskWanted = false;
    if (deskSaid) return;            // once. A refusal repeated is nagging.
    deskSaid = true;
    renderAnswer('', line, false, null);
    if (!speak(spokenForm(line))) idleStatus();
  }

  /* The held gesture, the same idea as unlockAudio(): a session that began with a spoken
     sentence gets its window from the next thing you click, wherever you click it. */
  document.addEventListener('pointerdown', function () {
    if (deskWanted && deskArmable() && !deskWin) deskOpen('click');
    else if (deskWin) deskFit();
  }, true);
  /* The other half of one press: the click that follows the pointerdown above carries a
     fresh activation, which is what the size correction needs. Harmless when there is
     nothing to correct - deskFit() looks at the window before it touches it, and that is
     also how a window that has just grown a row gets its extra height. */
  document.addEventListener('click', function () {
    if (deskWin) deskFit();
  }, true);

  async function fxSend(body) {
    try {
      const res = await fetch('/focus', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data && data.focus) fxApply(data.focus);
      /* On success the spoken confirmation is already in the say queue, so it is
         NOT spoken from here as well. Only a rejected instruction is, since that
         never became a session line. */
      /* The server says which of the two it was, and viaSession is the field that
         says it: true means the reply is in the say queue and fxApply above has
         already spoken it in every open tab, so this must not. False means the
         sentence exists nowhere else - a refusal, or the relief valve with no session
         to hold it - and this tab is the only one that can say it. */
      if (data && data.answer && !data.viaSession) {
        renderAnswer('', data.answer, !data.ok, null);
        if (!speak(spokenForm(data.answer))) idleStatus();
      }
      return data;
    } catch (e) {
      const line = 'I could not reach the timer (' + e.message + ').';
      renderAnswer('', line, true, null);
      if (!speak(spokenForm(line))) idleStatus();
      return null;
    }
  }

  /* ---- the answer window: one reply, no wake word ----
     The deferred start line ends with a question - "And what are we focusing on?" -
     and a question the assistant asks itself should not need a wake word to answer.
     So the microphone opens for exactly one thought, and the next thing you say goes
     to the session as its intent instead of to the notes brain.

     Two deliberate limits. It is ONE answer: the window closes on the first thought
     heard, so the sentence after it is an ordinary question again. And it expires on
     its own after FOCUS_ANSWER_MS, because a window that stays open because nobody
     answered a question is not a feature.

     AND THE EAR LAW, which arrived later and took something away from this function:
     no organ may turn the microphone on. This one used to. It now ARMS the window and
     stops there - if your ears are already open your answer lands as the intent, and if
     they are not, the assistant says so in as many words instead of reaching for the
     mic on your behalf. The window stays armed either way, so tapping the ear button
     five seconds later still puts your answer where it was going. */
  function fxAnswerOpen() {
    if (!Recogniser) return;                 // no recognition here; typing still works
    if (fxAnswerUntil > performance.now()) return;         // already open
    /* Wait for the question to be spoken before listening for its answer, or the
       recogniser hears the assistant and answers on your behalf. */
    clearTimeout(fxAnswerTimer);
    fxAnswerTimer = setTimeout(function () {
      if (!fxLive()) return;
      fxAnswerUntil = performance.now() + FOCUS_ANSWER_MS;
      if (listening) { setStatus('listening', 'what are we focusing on?'); return; }
      setStatus('', 'what are we focusing on? · tap the ear button, or type it');
      if (!speak(spokenForm(EARS_OFF_LINE))) idleStatus();
    }, FOCUS_ANSWER_WAIT_MS);
  }

  function fxAnswerArmed() {
    return fxAnswerUntil > performance.now();
  }

  function fxAnswerClose() {
    fxAnswerUntil = 0;
    clearTimeout(fxAnswerTimer);
    fxAnswerTimer = null;
  }

  /* Called by flushThought() instead of ask() while the window is armed. */
  function fxAnswer(text) {
    fxAnswerClose();
    /* Shown as your own words on the card, never read back to you: the server's whole
       reply to this is "Noted, sir." */
    fxSend({ cmd: 'intent', text: text });
  }

  /* ---- the channel: a stream, because a hidden tab's timers are throttled ----
     Chrome throttles setInterval in a background tab down to roughly once a
     minute. A background tab is EXACTLY where you are when a callout matters, so
     polling alone could not meet "hear it within three seconds". An open stream
     is not throttled: the server pushes the moment its tick changes something. */
  function fxStopPolling() {
    if (fxPoll) { clearInterval(fxPoll); fxPoll = null; }
  }

  function fxStartPolling() {
    if (fxPoll) return;
    fxPoll = setInterval(fxFetch, FOCUS_POLL_MS);
  }

  /* home: true says "this tab has the keyboard right now", false says "it just lost
     it, forget that I said so", and undefined says nothing about focus at all. */
  async function fxFetch(home) {
    const q = home === undefined ? '' : (home ? '?home=1' : '?home=0');
    try {
      const res = await fetch('/focus' + q);
      const data = await res.json();
      if (data && data.focus) fxApply(data.focus);
    } catch (e) { /* the card keeps whatever it last knew to be true */ }
  }

  function fxConnect() {
    if (!('EventSource' in window)) return fxStartPolling();
    try {
      fxStream = new EventSource('/focus/stream');
      fxStream.addEventListener('focus', function (e) {
        try { fxApply(JSON.parse(e.data)); } catch (err) { /* ignore a bad frame */ }
      });
      fxStream.onopen = function () { fxStopPolling(); };
      /* EventSource reconnects by itself; polling covers the gap and is harmless
         if the stream returns, because applying a state twice changes nothing. */
      fxStream.onerror = function () { fxStartPolling(); };
    } catch (e) { fxStartPolling(); }
  }

  /* HOME BASE. A boolean about THIS page and nothing else - never a claim about
     any other tab - and it expires in seconds on the server, so a tab that goes
     away cannot leave a permanent excuse behind. Coming back here to talk is the
     one excursion that is never a drift. */
  /* Home base has two windows now, for the same reason the card does. Pressing pause on
     the desktop card puts the keyboard in a window that is not this tab - but it is
     still this page's own document, and still you talking to me rather than you wandering
     into something else. Reading the tab alone would call it an excursion. */
  function fxHomeFocus() {
    if (document.hasFocus()) return true;
    try { return !!(deskWin && deskWin.document.hasFocus()); }
    catch (e) { return false; }        // a window mid-close answers nothing
  }

  setInterval(function () {
    if (probeRunning) return;          // a synthetic session is not a man at his desk
    if (fxLive() && fxHomeFocus()) fxFetch(true);
  }, FOCUS_HOME_BEAT_MS);

  /* Leaving is worth saying immediately rather than waiting for the claim to time
     out. Without this, "go to the thing you actually mean to do" would sit there
     for the remainder of the TTL before locking on, and the first three seconds of
     your work would be spent watching me not watch it. */
  addEventListener('blur', function () {
    if (fxLive() && !fxHomeFocus()) fxFetch(false);
  });
  addEventListener('visibilitychange', function () {
    if (fxLive() && document.hidden && !fxHomeFocus()) fxFetch(false);
  });

  // Repaint so the digits move between pushes. Throttled to nothing in a hidden
  // tab, which costs us exactly nothing: the speaking is driven by the stream.
  setInterval(function () { if (fxLive()) fxPaint(); }, FOCUS_PAINT_MS);

  $('focusbtn').onclick = function () {
    unlockAudio();                     // a real gesture: the callouts need a voice
    /* THE GESTURE, spent here and nowhere else. requestWindow() is called before the
       session request rather than after it, and not awaited: a transient activation is
       a few seconds of credit that the browser may consider spent by the time a fetch
       has been round-tripped, and the cheapest way never to find out is to ask for the
       window while the click is still warm. The window opening before there is anything
       to count is the reason fxPaint has a grace window. */
    deskPromise('session');            // a session is coming; ask for its height, not 88
    deskOpen('press');
    deskFit();                         // the click's own activation, if the press left one
    if (fxLive()) return fxSend({ cmd: 'status' });
    fxSend({ cmd: 'start', minutes: FOCUS_DEFAULT_MIN });
  };
  /* ONE PRESS, TWO ACTIVATIONS - and this is the whole reason the window is asked for
     here rather than only in the click above. A mouse press hands out an activation on
     pointerdown and another on the click that follows it; requestWindow eats whichever
     one it is given. Asking on pointerdown therefore leaves the click's activation free
     for the resizeTo that corrects Chrome's oversized window, and the card snaps to its
     proper size within a frame or two of appearing, off one press of the button.
     It matters more than it sounds. The alternative was correcting it on the NEXT
     activation, and the next thing you do after starting a session is click something in
     another application - which sends this page nothing at all, and leaves a card the
     size of a browser window sitting over the work you just started.
     The click handler keeps its own deskOpen for the presses that never send a pointer
     event: Enter and the space bar on a focused button, and every synthetic click. */
  $('focusbtn').addEventListener('pointerdown', function () {
    deskPromise('session');
    deskOpen('press');
  });
  $('focus-pause').onclick = function () {
    fxSend({ cmd: (fx && fx.state === 'paused') ? 'resume' : 'pause' });
  };
  $('focus-extend').onclick = function () {
    fxSend({ cmd: 'extend', minutes: FOCUS_EXTEND_MIN });
  };
  $('focus-end').onclick = function () { fxSend({ cmd: 'finish' }); };

  /* MOVING THE LOCK from the card. Identical to saying "lock on this tab", with one
     flag added: the press itself is what brought this card - and therefore this tab -
     to the front, so the server must not read the foreground and dutifully lock us.
     source:'card' is how it knows to ask the browser which of its tabs is visible
     instead. See _probe_front_window() in focus.py. */
  let fxLockFlash = null;
  $('focus-lock').onclick = function () {
    unlockAudio();                     // a real gesture: the confirmation is spoken
    /* LOCKED for a second, from the PRESS and not from the reply. The press is a fact
       and the button should say so at once; what actually happened - "Locked on, sir."
       or, from this tab, the re-arm - arrives out loud, because only the server knows
       which of those it was. */
    const pill = $('focus-lock');
    pill.textContent = 'locked';
    pill.classList.add('done');
    clearTimeout(fxLockFlash);
    fxLockFlash = setTimeout(function () {
      pill.textContent = 'lock this tab';
      pill.classList.remove('done');
    }, FOCUS_LOCK_FLASH_MS);
    fxSend({ cmd: 'retarget', source: 'card' });
  };

  /* Is this an instruction to the timer rather than a question about the notes?
     Conservative on purpose: the SERVER has the authoritative classifier and the
     same phrases are checked again there, so a phrase this misses still reaches
     the timer through /chat. A phrase it wrongly claims would not. */
  const FOCUS_WORDS = '(?:focus|deep work|session|sprint|pomodoro)';
  const FOCUS_START_RE = new RegExp(
    '(?:\\b(?:start|begin|kick off)\\b[^.]{0,20}\\b' + FOCUS_WORDS + '\\b)' +
    '|(?:\\b' + FOCUS_WORDS + '\\b[^.]{0,24}\\b(?:for|of)\\b[^.]{0,20}' +
      '\\b(?:minutes?|mins?|hours?)\\b)' +
    '|(?:\\b(?:minutes?|mins?|hour|hours|half an hour|quarter of an hour)\\b' +
      '[^.]{0,18}\\b(?:on|of)\\s+(?:this|that|it|work|focus)\\b)' +
    '|(?:\\blet\'?s\\s+do\\b[^.]{0,26}\\b(?:on this|on that|of ' + FOCUS_WORDS + ')\\b)',
    'i');
  const FOCUS_CMD_RE = new RegExp(
    '\\b(?:call me out|nag me|tell me off|check on me)\\b|\\bevery\\b[^.]{0,14}\\bseconds?\\b' +
    '|\\bgive me\\b[^.]{0,14}\\bseconds?\\b|\\b(?:snooze|hush|shush|be quiet)\\b' +
    '|\\b(?:it\'?s|its|this is|that\'?s)\\s+(?:ok|okay|fine|alright|all right|deliberate)\\b' +
    '|\\b(?:i\'?m|i am)\\s+(?:doing\\s+)?(?:research|reading|looking (?:it|this) up)\\b' +
    '|\\b(?:extend|another|add)\\b[^.]{0,20}\\b(?:minutes?|mins?)\\b|\\b(?:minutes?|mins?)\\s+more\\b' +
    '|\\bpause\\b|\\bstop the clock\\b|\\b(?:resume|unpause|carry on)\\b' +
    '|\\b(?:abort|scrap|kill|cancel)\\b[^.]{0,20}\\b(?:' + FOCUS_WORDS + '|timer|clock|it)\\b' +
    '|\\b(?:end|finish|stop|wrap up)\\b[^.]{0,20}\\b(?:' + FOCUS_WORDS + '|timer|clock)\\b' +
    '|\\b(?:i\'?m|we\'?re)\\s+done\\b|\\bthat\'?s (?:it|enough)\\b' +
    '|\\bhow (?:long|much longer|much time|am i doing|is it going)\\b' +
    '|\\btime (?:left|remaining)\\b' +
    /* THE REGISTER. Mirrored from focus.py's _DRILL_RE and _GENTLE_RE, and here for
       the same reason as the rest: a phrase this page does not recognise as a focus
       instruction goes to the notes brain, which has nothing to say about it. */
    '|\\b(?:drill[ -]?sergeant|no mercy|tough love)\\b' +
    '|\\bbe (?:harsh|harsher|brutal|blunt|nice|nicer|gentle|gentler|kind|kinder|civil|polite)\\b' +
    '|\\bdon\'?t be (?:nice|polite|gentle|kind)\\b' +
    '|\\b(?:call me out|tell me off)\\s+(?:harder|properly|like you mean it)\\b' +
    '|\\b(?:ease up|go easy|stand down)\\b',
    'i');

  /* MOVING THE LOCK, mirrored from focus.py's _RETARGET_RE. It matters that it is
     here and not only there: ask() checks focus phrases BEFORE the screen share, and
     the share's own matcher claims "this tab" - so without these lines, "lock on this
     tab" mid-session would be answered with a photograph of the tab instead of by
     watching it. Wide on purpose, because this is the sentence you reach for when the
     lock is already wrong. */
  const FX_SURFACE = '(?:tab|window|page|app|application|site|screen|thing|one)';
  const FX_THIS = '(?:this|that)';
  const FX_THIS_SURFACE = '(?:this|that|the current|the)\\s+' + FX_SURFACE;
  const FOCUS_RETARGET_RE = new RegExp(
    '\\block(?:\\s+(?:on|onto|in|into|me\\s+(?:on|onto|in|into|to)))?\\s+' +
      '(?:' + FX_THIS_SURFACE + '|here)\\b' +
    '|\\bkeep\\s+(?:me|us)\\s+(?:in|on|with)\\s+' +
      '(?:' + FX_THIS + '(?:\\s+' + FX_SURFACE + ')?|here)\\b' +
    '|\\bkeep\\s+(?:me|us)\\s+(?:right\\s+)?here\\b' +
    '|\\b(?:stay|hold)\\s+(?:on|in|with)\\s+' +
      '(?:' + FX_THIS + '(?:\\s+' + FX_SURFACE + ')?|here)\\b' +
    '|\\bstay\\s+(?:right\\s+)?here\\b' +
    '|\\bthis\\s+is\\s+(?:the|my)\\s+(?:\\w+\\s+){0,2}' + FX_SURFACE + '\\b' +
    '|\\bwatch\\s+(?:' + FX_THIS_SURFACE + '|here)\\b',
    'i');

  /* THE RELIEF VALVE, mirrored from focus.py's _RELIEF_RE. "No Jarvis, I need to do
     something important." Tested with no session required - the only phrase here that
     is, apart from starting one - because the EYES nudge whether or not a clock is
     running, and a valve you have to start a timer to reach is not a valve. */
  const FOCUS_RELIEF_RE = new RegExp(
    '\\b(?:need|have)\\s+to\\s+do\\s+something\\b' +
    '|\\b(?:something|anything)\\s+(?:important|urgent)\\b' +
    '|\\bgive\\s+me\\s+a\\s+(?:minute|moment|few\\s+minutes)\\b' +
    '|\\bgive\\s+me\\s+(?:a\\s+)?(?:couple|few)\\s+of\\s+minutes\\b' +
    '|\\b(?:leave|let)\\s+me\\s+(?:alone|be)\\b' +
    '|\\b(?:i\'?ll|i\\s+will)\\s+be\\s+(?:right\\s+)?back\\b', 'i');

  function isFocusPhrase(text) {
    const said = String(text || '');
    if (FOCUS_START_RE.test(said)) return true;
    if (FOCUS_RELIEF_RE.test(said)) return true;
    // Everything else only counts while a session is live, which is what keeps a
    // perfectly ordinary question about the notes from being read as a snooze.
    return fxLive() && (FOCUS_RETARGET_RE.test(said) || FOCUS_CMD_RE.test(said));
  }

  /* ============================================================== capture ==
     "remember that ..." grows the galaxy live. The server writes the file and
     re-indexes; everything here is the birth itself - splice the node in at its
     most related neighbour, flare it, then fly. No reload, and the note is a real
     citizen the moment this returns: it can be cited by the very next answer. */
  const CAPTURE_RE = /^\s*[\"'“‘(\[]*remember\s+that\b/i;
  let lastBirth = null;      // where the newest star was placed, and beside what

  function pulseNode(id) {
    pulseId = id;
    const t0 = performance.now();
    (function frame(now) {
      const p = (now - t0) / PULSE_MS;
      if (p >= 1) { pulseId = null; pulseAmt = 0; refresh(); return; }
      // Snap bright, then ease out - a flare, not a throb.
      pulseAmt = Math.pow(1 - p, 2.2) * Math.abs(Math.cos(p * Math.PI * 2.2));
      refresh();
      requestAnimationFrame(frame);
    })(t0);
  }

  /* The other pulse, and the only one that belongs to no node. Two slow swells of
     cyan across the whole sky, then gone - long enough to be seen without becoming
     scenery. Idempotent: asking twice while one is running restarts it rather than
     stacking two animations that fight over webAmt. */
  let webPulseSeq = 0;
  function pulseWeb() {
    const mine = ++webPulseSeq;
    const t0 = performance.now();
    (function frame(now) {
      if (mine !== webPulseSeq) return;        // a newer pulse took over; stand down
      const p = (now - t0) / WEB_PULSE_MS;
      if (p >= 1) { webAmt = 0; refresh(); return; }
      // Two swells, fading. sin() rather than the flare curve above, because this is
      // a breath rather than a spark.
      webAmt = Math.pow(1 - p, 1.5) * Math.abs(Math.sin(p * Math.PI * 2));
      refresh();
      requestAnimationFrame(frame);
    })(t0);
  }

  /* Splice the server's authoritative graph into the live one. Returns the new
     node object, already positioned. */
  function insertCapture(data) {
    const spec = data.node;

    // A capture can invent a whole new folder, which needs a colour and a legend
    // row of its own or it shows up as an unnamed grey dot.
    if (groups.indexOf(spec.group) === -1) {
      groups.push(spec.group);
      groups.sort();
      // The first colour nobody is using. Assigning by index after the sort would
      // hand "captures" the same blue as "customers", since it sorts ahead of it.
      const taken = groups.map(function (g) { return colorOf[g]; });
      colorOf[spec.group] = PALETTE.filter(function (c) {
        return taken.indexOf(c) === -1;
      })[0] || '#ffffff';
    }

    /* Born at its most related note. The anchor comes from the server, which
       picked it from the links build.py just drew - so the position means
       something. With no anchor at all (a thought unlike anything in the
       collection) it starts at the centre rather than somewhere misleading. */
    const anchor = (data.anchor === null || data.anchor === undefined)
      ? null : byId.get(data.anchor);
    const at = (anchor && anchor.x !== undefined) ? anchor : { x: 0, y: 0, z: 0 };
    const jitter = function () { return (Math.random() - 0.5) * 26; };
    const node = Object.assign({}, spec, {
      x: at.x + jitter(), y: at.y + jitter(), z: at.z + jitter(),
      vx: 0, vy: 0, vz: 0
    });

    nodes.push(node);
    byId.set(node.id, node);
    /* Recorded because it is only true for one frame: the moment graphData()
       re-heats the layout, repulsion pushes the new star off the note it was born
       on, so "was it born in the right place" is not answerable after the fact. */
    lastBirth = {
      id: node.id, anchor: anchor ? anchor.id : null,
      at: { x: node.x, y: node.y, z: node.z },
      anchorAt: { x: at.x, y: at.y, z: at.z }
    };

    /* Replace the link set wholesale rather than appending the new edges. A new
       note can resolve a [[wikilink]] that was dangling, which changes edges
       between notes that were already on screen; the server sends the whole
       authoritative set so we never have to reason about that. Both arrays are
       const and referenced elsewhere (activeLinks aliases one of them), so they
       are emptied and refilled in place. */
    if (data.links) {
      allLinks.length = 0;
      data.links.forEach(function (l) {
        // Drop any edge whose endpoints this page does not know about. It should
        // never happen, but a dangling id would throw inside the layout code, and
        // failing to draw one line is better than losing the note we just wrote.
        if (byId.has(l.source) && byId.has(l.target)) {
          allLinks.push(Object.assign({}, l));
        }
      });
      const strong = strongSubset(allLinks, STRONG_PER_NODE);
      strongLinks.length = 0;
      strong.forEach(function (l) { strongLinks.push(l); });
    }

    hiLinks.clear();                  // the old link objects no longer exist
    rebuildNeighbours();
    Graph.graphData({ nodes: nodes, links: activeLinks });
    paintLegend();
    paintStats();
    return node;
  }

  async function capture(text) {
    if (busy || !text.trim()) return;
    busy = true;
    $('send').disabled = true;
    $('dot').classList.add('busy');
    setStatus('thinking', 'writing that down', text);
    renderAnswer(text, 'Writing that down…', false, null);

    /* A capture that fails must SAY so. Every path out of here speaks a line -
       the silent one is the failure mode this whole feature has to avoid. */
    function fail(message) {
      renderAnswer(text, message, true, null);
      if (!speak(spokenForm(message))) idleStatus();
    }

    try {
      const res = await fetch('/remember', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, session: SESSION })
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }

      if (!data) {
        fail('I could not write that down: the server replied with something that ' +
             'was not JSON (HTTP ' + res.status + ').');
      } else if (!data.ok || !data.node) {
        // The server already phrased this in character, including the case where
        // the file exists but did not make it into the index.
        fail(data.answer || data.error || 'I could not write that down, sir.');
      } else {
        const node = insertCapture(data);
        renderAnswer(text, data.answer, false, [node.id]);
        if (!speak(spokenForm(data.answer))) idleStatus();
        pulseNode(node.id);
        lastPlan = 'born';
        // A short beat so the star is visibly born where it belongs before the
        // camera starts moving; the flare outlasts the flight either way.
        setTimeout(function () { focusNode(node, true); }, 420);
      }
    } catch (e) {
      fail('I could not write that down: the brain is not answering. Start it with ' +
           '"python server.py" and try again - nothing has been remembered.');
    } finally {
      busy = false;
      $('send').disabled = false;
      $('dot').classList.remove('busy');
    }
  }

  /* ================================================================== sight ==
     "What do you think of this?" - a held screen share, and ONE frame of it taken
     at the instant a question is asked.

     Three things this must never do, and what prevents each:

       - answer from the frame it had earlier. grabFrame() is the only thing that
         produces a frame, it is called from see() immediately before the request,
         and no frame is kept between questions. The one image that outlives a
         question is the thumbnail shown as proof, which is never sent anywhere.
       - answer at all once the share is over. sharing() reads the track's own
